<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --deep: #0A2436;
  --mid: #123A50;
  --panel: #16465F;
  --line: #3C6577;
  --foam: #EDF3EF;
  --foam-dim: #B9C9C6;
  --brass: #C79A45;
  --brass-dim: #8A6F35;
  --coral: #D46A54;
  --radius: 10px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 700px at 15% -10%, #14425A 0%, transparent 60%),
    radial-gradient(1000px 800px at 110% 10%, #0D3247 0%, transparent 55%),
    var(--deep);
  color:var(--foam);
  font-family:'Noto Sans TC', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:640px;
  margin:0 auto;
  padding:20px 18px 60px;
}

/* treaty switcher */
.switcher{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  background:rgba(0,0,0,.2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:5px;
  margin-bottom:20px;
}
.switch-btn{
  flex:1 1 calc(50% - 8px);
  min-width:120px;
  border:none;
  background:transparent;
  color:var(--foam-dim);
  font-family:'Noto Sans TC', sans-serif;
  font-weight:700;
  font-size:13px;
  padding:11px 6px;
  border-radius:8px;
  cursor:pointer;
  transition:all .18s ease;
  white-space:nowrap;
}
.switch-btn.active{
  background:var(--brass);
  color:#1B1305;
}

/* header */
.hdr{
  text-align:center;
  margin-bottom:22px;
  position:relative;
}
.hdr .eyebrow{
  font-family:'Space Mono', monospace;
  letter-spacing:.28em;
  font-size:11px;
  color:var(--brass);
  text-transform:uppercase;
  margin-bottom:8px;
}
.hdr h1{
  font-family:'Noto Serif TC', serif;
  font-weight:900;
  font-size:clamp(26px,7vw,34px);
  margin:0 0 6px;
  letter-spacing:.02em;
}
.hdr p{
  color:var(--foam-dim);
  font-size:13.5px;
  margin:0;
  line-height:1.6;
}

/* wave divider */
.wave{
  width:100%;
  height:14px;
  margin:20px 0;
  opacity:.55;
}

/* depth dial - signature element */
.dial-card{
  background:linear-gradient(180deg, var(--panel), var(--mid));
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px 20px 20px;
  box-shadow:0 20px 40px -20px rgba(0,0,0,.55);
  position:relative;
  overflow:hidden;
}
.dial-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 22px);
  pointer-events:none;
}
.dial-label{
  font-family:'Space Mono', monospace;
  font-size:10.5px;
  letter-spacing:.2em;
  color:var(--foam-dim);
  text-transform:uppercase;
  margin-bottom:10px;
}
.dial-row{
  display:flex;
  gap:10px;
  align-items:stretch;
}
.dial-input-box{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  background:rgba(0,0,0,.22);
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:0 14px;
}
.dial-input-box.err{ border-color:var(--coral); }
.dial-input-box span.hash{
  font-family:'Space Mono', monospace;
  color:var(--brass);
  font-size:22px;
  margin-right:6px;
}
#numInput{
  background:transparent;
  border:none;
  outline:none;
  color:var(--foam);
  font-family:'Space Mono', monospace;
  font-size:26px;
  width:100%;
  padding:14px 0;
  letter-spacing:.05em;
}
#numInput::placeholder{ color:#4F7284; }
.go-btn{
  font-family:'Noto Sans TC', sans-serif;
  font-weight:700;
  font-size:15px;
  background:var(--brass);
  color:#1B1305;
  border:none;
  border-radius:10px;
  padding:0 22px;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.go-btn:hover{ background:#D6AC5B; transform:translateY(-1px); }
.go-btn:active{ transform:translateY(0); }

.hint-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  font-size:12px;
  color:var(--foam-dim);
}
.range-note{ font-family:'Space Mono', monospace; letter-spacing:.03em;}

/* result card */
.result{
  margin-top:20px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px 22px;
  animation:rise .35s ease;
  display:none;
}
.result.show{ display:block; }
@keyframes rise{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}
.crumb{
  font-size:11.5px;
  color:var(--brass);
  letter-spacing:.03em;
  margin-bottom:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
}
.crumb .sep{ color:var(--line); }
.art-title-row{
  display:flex;
  align-items:baseline;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.art-num{
  font-family:'Noto Serif TC', serif;
  font-weight:900;
  font-size:30px;
  color:var(--foam);
  white-space:nowrap;
}
.art-title{
  font-family:'Noto Serif TC', serif;
  font-weight:700;
  font-size:19px;
  color:var(--foam);
  line-height:1.4;
}
.art-content{
  white-space:pre-wrap;
  font-size:15px;
  line-height:2;
  color:#DCE7E3;
  border-top:1px dashed var(--line);
  padding-top:16px;
}
.nav-row{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
  gap:10px;
}
.nav-btn{
  flex:1;
  background:rgba(0,0,0,.2);
  border:1px solid var(--line);
  color:var(--foam);
  border-radius:10px;
  padding:12px 10px;
  font-family:'Noto Sans TC', sans-serif;
  font-size:13.5px;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease;
  text-align:center;
}
.nav-btn:hover{ background:rgba(199,154,69,.14); border-color:var(--brass-dim); }
.nav-btn .lbl{ display:block; font-size:10.5px; color:var(--foam-dim); margin-bottom:3px; letter-spacing:.08em;}

/* browse section */
.browse{
  margin-top:34px;
}
.browse-hdr{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}
.browse-hdr .line{ flex:1; height:1px; background:var(--line); }
.browse-hdr h2{
  font-family:'Noto Serif TC', serif;
  font-size:15px;
  font-weight:700;
  color:var(--brass);
  letter-spacing:.06em;
  margin:0;
  white-space:nowrap;
}

.parts-list{ display:flex; flex-direction:column; gap:8px; }
.part-item{
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.02);
}
.part-btn{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  background:none;
  border:none;
  color:var(--foam);
  font-family:'Noto Sans TC', sans-serif;
  font-size:14px;
  padding:13px 15px;
  cursor:pointer;
  text-align:left;
}
.part-btn .rng{
  font-family:'Space Mono', monospace;
  font-size:11px;
  color:var(--foam-dim);
  white-space:nowrap;
}
.part-btn .chev{
  transition:transform .2s ease;
  color:var(--brass);
  font-size:11px;
}
.part-item.open .chev{ transform:rotate(90deg); }
.art-grid{
  display:none;
  padding:4px 12px 14px;
  flex-wrap:wrap;
  gap:6px;
}
.part-item.open .art-grid{ display:flex; }
.chip{
  font-family:'Space Mono', monospace;
  font-size:12px;
  background:rgba(0,0,0,.22);
  border:1px solid var(--line);
  color:var(--foam-dim);
  border-radius:6px;
  padding:6px 9px;
  cursor:pointer;
  transition:all .15s ease;
}
.chip:hover{ border-color:var(--brass); color:var(--brass); }

.footer-note{
  text-align:center;
  margin-top:34px;
  font-size:11.5px;
  color:#5B7C8A;
  line-height:1.7;
}
.footer-note a{ color:var(--brass-dim); }

@media (max-width:380px){
  .art-num{ font-size:24px; }
  .art-title{ font-size:16px; }
}
</style>
</head>

<script>
const TREATIES = {
  unclos: { key:"unclos", short:"海洋法公約", full:"聯合國海洋法公約", eyebrow:"UNCLOS · 1982", total: 320, minNum:1, maxNum:320, parts: 17, unitLabel:"部份", articles: [{"num":1,"title":"用語和範圍","part":"第一部份  用語","section":"","content":"一、為本公約的目的：\n(1)「區域」是指國家管轄範圍以外的海床和洋底及其底土。\n(2)「管理局」是指國際海底管理局。\n(3)「『區域』內活動」是指勘探和開發「 區域」的資源的一切活動。\n(4)「海洋環境的污染」是指：人類直接或間接把物質或能量引入海洋環境，其中包括河口灣，以致造成或可能造成損害生物資源和海洋生物、危害人類健康、妨礙包括捕魚和海洋的其他正當用途在內的各種海洋活動、損壞海水使用質量和減損環境優美等有害影響。\n(5)(a) 「傾倒」是指：\n(一)從船隻、飛機、平臺或其他人造海上結構故意處置廢物或其他物質的行為；\n(二)故意處置船隻、飛機、平臺或其他人造海上結構的行為。\n(b) 「傾倒」不包括：\n(一)船隻、飛機、平臺或其他人造海上結構及其裝備的正常操作所附帶發生或產生的廢物或其他物質的處置，但為了處置這種物質而操作的船隻、飛機、平臺或其他人造海上結構所運載或向其輸送的廢物或其他物質，或在這種船隻、飛機、平臺或結構上處理這種廢物或其他物質所產生的廢物或其他物質均除外；\n(二)並非為了單純處置物質而放置物質，但以這種放置不違反本公約的目的為限。\n二、(1) 「締約國」是指同意受本公約拘束而本公約對其生效的國家。\n(2) 本公約比照適用於第三百零五條第一款(b)、(c)、(d)、(e)和( f)所指的實體，這些實體按照與各自有關的條件成為本公約的締約國，在這種情況下，「締約國」也指這些實體。"},{"num":2,"title":"領海及其上空、海床和底土的法律地位","part":"第二部份  領海和毗連區","section":"第一節  一般規定","content":"一、沿海國的主權及於其陸地領土及其內水以外鄰接的一帶海域，在群島國的情形下則及於群島水域以外鄰接的一帶海域，稱為領海。\n二、此項主權及於領海的上空及其海床和底土。\n三、對於領海的主權的行使受本公約和其他國際法規則的限制。"},{"num":3,"title":"領海的寬度","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"每一個國家有權確定其領海的寬度，直至從按照本公約確定的基線量起不超過十二海里的界限為止。"},{"num":4,"title":"領海的外部界限","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"領海的外部界限是一條其每一點同基線最近點的距離等於領海寬度的線。"},{"num":5,"title":"正常基線","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"除本公約另有規定外，測算領海寬度的正常基線是沿海國官方承認的大比例尺海圖所標明的沿岸低潮線。"},{"num":6,"title":"礁石","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"在位於環礁上的島嶼或有岸礁環列的島嶼的情形下，測算領海寬度的基線是沿海國官方承認的海圖上以適當標記顯示的礁石的向海低潮線。"},{"num":7,"title":"直線基線","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"一、在海岸線極為曲折的地方，或者如果緊接海岸有一系列島嶼，測算領海寬度的基線的劃定可採用連接各適當點的直線基線法。\n二、在因有三角洲和其他自然條件以致海岸線非常不穩定之處，可沿低潮線向海最遠處選擇各適當點，而且儘管以後低潮線發生後退現象，該直線基線在沿海國按照本公約加以改變以前仍然有效。\n三、直線基線的劃定不應在任何明顯的程度上偏離海岸的一般方向，而且基線內的海域必須充分接近陸地領土，使其受內水制度的支配。\n四、除在低潮高地上築有永久高於海平面的燈塔或類似設施，或以這種高地作為劃定基線的起訖點已獲得國際一般承認者外，直線基線的劃定不應以低潮高地為起訖點。\n五、在依據第一款可以採用直線基線法之處，確定特定基線時，對於有關地區所特有的並經長期慣例清楚地證明其為實在而重要的經濟利益，可予以考慮。\n六、一國不得採用直線基線制度，致使另一國的領海同公海或專屬經濟區隔斷。"},{"num":8,"title":"內水","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"一、除第四部分另有規定外，領海基線向陸一面的水域構成國家內水的一部分。\n二、如果按照第七條所規定的方法確定直線基線的效果使原來並未認為是內水的區域被包圍在內成為內水，則在此種水域內應有本公約所規定的無害通過權。"},{"num":9,"title":"河口","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"如果河流直接流入海洋，基線應是一條在兩岸低潮線上兩點之間橫越河口的直線。"},{"num":10,"title":"海灣","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"一、本條僅涉及海岸屬於一國的海灣。\n二、為本公約的目的，海灣是明顯的水曲，其凹入程度和曲口寬度的比例，使其有被陸地環抱的水域，而不僅為海岸的彎曲。但水曲除其面積等於或大於橫越曲口所劃的直線作為直徑的半圓形的面積外，不應視為海灣。\n三、為測算的目的，水曲的面積是位於水曲陸岸周圍的低潮標和一條連接水曲天然入口兩端低潮標的線之間的面積。如果因有島嶼而水曲有一個以上的曲口，該半圓形應劃在與橫越各曲口的各線總長度相等的一條線上。水曲內的島嶼應視為水曲水域的一部分而包括在內。\n四、如果海灣天然入口兩端的低潮標之間的距離不超過二十四海里，則可在這兩個低潮標之間劃出一條封口線，該線所包圍的水域應視為內水。\n五、如果海灣天然入口兩端的低潮標之間的距離超過二十四海里，二十四海里的直線基線應劃在海灣內，以劃入該長度的線所可能劃入的最大水域。\n六、上述規定不適用於所謂「歷史性」海灣，也不適用於採用第七條所規定的直線基線法的任何情形。"},{"num":11,"title":"港口","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"為了劃定領海的目的，構成海港體系組成部分的最外部永久海港工程視為海岸的一部分。近岸設施和人工島嶼不應視為永久海港工程。"},{"num":12,"title":"泊船處","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"通常用於船舶裝卸和下錨的泊船處，即使全部或一部位於領海的外部界限以外，都包括在領海範圍之內。"},{"num":13,"title":"低潮高地","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"一、低潮高地是在低潮時四面環水並高於水面但在高潮時沒入水中的自然形成的陸地。如果低潮高地全部或一部與大陸或島嶼的距離不超過領海的寬度，該高地的低潮線可作為測算領海寬度的基線。\n二、如果低潮高地全部與大陸或島嶼的距離超過領海的寬度，則該高地沒有其自己的領海。"},{"num":14,"title":"確定基線的混合辦法","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"沿海國為適應不同情況，可交替使用以上各條規定的任何方法以確定基線。"},{"num":15,"title":"海岸相向或相鄰國家間領海界限的劃定","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"如果兩國海岸彼此相向或相鄰，兩國中任何一國在彼此沒有相反協議的情形下，均無權將其領海伸延至一條其每一點都同測算兩國中每一國領海寬度的基線上最近各點距離相等的中間線以外。但如因歷史性所有權或其他特殊情況而有必要按照與上述規定不同的方法劃定兩國領海的界限，則不適用上述規定。"},{"num":16,"title":"海圖和地理座標表","part":"第二部份  領海和毗連區","section":"第二節  領海的界限","content":"一、按照第七、第九和第十條確定的測算領海寬度的基線，或根據基線劃定的界限，和按照第十二和第十五條劃定的分界線，應在足以確定這些線的位置的一種或幾種比例尺的海圖上標出。或者，可以用列出各點的地理座標並註明大地基準點的表來代替。\n二、沿海國應將這種海圖或地理座標表妥為公佈，並應將各該海圖和座標表的一份副本交存於聯合國秘書長。\nＡ分節  適用於所有船舶的規則"},{"num":17,"title":"無害通過權","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"在本公約的限制下，所有國家，不論為沿海國或內陸國，其船舶均享有無害通過領海的權利。"},{"num":18,"title":"通過的意義","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"一、通過是指為了下列目的，通過領海的航行：\n(a)穿過領海但不進入內水或停靠內水以外的泊船處或港口設施；或\n(b)駛往或駛出內水或停靠這種泊船處或港口設施。\n二、通過應繼續不停和迅速進行。通過包括停船和下錨在內，但以通常航行所附帶發生的或由於不可抗力或遇難所必要的或為救助遇險或遭難的人員、船舶或飛機的目的為限。"},{"num":19,"title":"無害通過的意義","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"一、通過只要不損害沿海國的和平、良好秩序或安全，就是無害的，這種通過的進行應符合本公約和其他國際法規則。\n二、如果外國船舶在領海內進行下列任何一種活動，其通過即應視為損害沿海的和平、良好秩序或安全：\n(a)對沿海國的主權、領土完整或政治獨立進行任何武力威脅或使用武力，或以任何其他違反「聯合國憲章」所體現的國際法原則的方式進行武力威脅或使用武力；\n(b)以任何種類的武器進行任何操練或演習；\n(c)任何目的在於搜集情報使沿海國的防務或安全受損害的行為；\n(d)任何目的在於影響沿海國防務或安全的宣傳行為；\n(e)在船上起落或接載任何飛機；\n(f)在船上發射、降落或接載任何軍事裝置；\n(g)違反沿海國海關、財政、移民或衛生的法律和規章，上下任何商品、貨幣或人員；\n(h)違反本公約規定的任何故意和嚴重的污染行為；\n(i)任何捕魚活動；\n(j)進行研究或測量活動；\n(k)任何目的在於干擾沿海國任何通訊系統或任何其他設施或設備的行為；\n(l)與通過沒有直接關係的任何其他活動。"},{"num":20,"title":"潛水艇和其他潛水器","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"在領海內，潛水艇和其他潛水器，須在海面上航行並展示其旗幟。"},{"num":21,"title":"沿海國關於無害通過的法律和規章","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"一、沿海國可依本公約規定和其他國際法規則，對下列各項或任何一項制定關於無害通過領海的法律和規章：\n(a)航行安全及海上交通管理；\n(b)保護助航設備和設施以及其他設施或設備；\n(c)保護電纜和管道；\n(d)養護海洋生物資源；\n(e)防止違犯沿海國的漁業法律和規章；\n(f)保全沿海國的環境，並防止、減少和控制該環境受污染；\n(g)海洋科學研究和水文測量；\n(h)防止違犯沿海國的海關、財政、移民或衛生的法律和規章。\n二、這種法律和規章除使一般接受的國際規則或標準有效外，不應適用於外國船舶的設計、構造、人員配備或裝備。\n三、沿海國應將所有這種法律和規章妥為公佈。\n四、行使無害通過領海權利的外國船舶應遵守所有這種法律和規章以及關於防止海上碰撞的一切一般接受的國際規章。"},{"num":22,"title":"領海內的海道和分道通航制","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"一、沿海國考慮到航行安全認為必要時，可要求行使無害通過其領海權利的外國船舶使用其為管制船舶通過而指定或規定的海道和分道通航制。\n二、特別是沿海國可要求油輪、核動力船舶和載運核物質或材料或其他本質上危險或有毒物質或材料的船舶只在上述海道通過。\n三、沿海國根據本條指定海道和規定分道通航制時，應考慮到：\n(a)主管國際組織的建議；\n(b)習慣上用於國際航行的水道；\n(c)特定船舶和水道的特殊性質；和\n(d)船舶來往的頻繁程度。\n四、沿海國應在海圖上清楚地標出這種海道和分道通航制，並應將該海圖妥為公佈。"},{"num":23,"title":"","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"外國核動力船舶和載運核物質或其他本質上危險或有毒物質的船舶，在行使無害通過領海的權利時，應持有國際協定為這種船舶所規定的證書並遵守國際協定所規定的特別預防措施。"},{"num":24,"title":"沿海國的義務","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"一、除按照本公約規定外，沿海國不應妨礙外國船舶無害通過領海。尤其在適用本公約或依本公約制定的任何法律或規章時，沿海國不應：\n(a)對外國船舶強加要求，其實際後果等於否定或損害無害通過的權利；或\n(b)對任何國家的船舶、或對載運貨物來往任何國家的船舶或對替任何國家載運貨物的船舶，有形式上或事實上的歧視。\n二、沿海國應將其所知的在其領海內對航行有危險的任何情況妥為公布。"},{"num":25,"title":"沿海國的保護權","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"一、沿海國可在其領海內採取必要的步驟以防止非無害的通過。\n二、在船舶駛往內水或停靠內水外的港口設備的情形下，沿海國也有權採取必要的步驟，以防止對准許這種船舶駛往內水或停靠港口的條件的任何破壞。\n三、如為保護國家安全包括武器演習在內而有必要，沿海國可在對外國船舶之間在形式上或事實上不加歧視的條件下，在其領海的特定區域內暫時停止外國船舶的無害通過。這種停止僅應在正式公佈後發生效力。"},{"num":26,"title":"可向外國船舶徵收的費用","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"一、對外國船舶不得僅以其通過領海為理由而徵收任何費用。\n二、對通過領海的外國船舶，僅可作為對該船舶提供特定服務的報酬而徵收費用。徵收上述費用不應有任何歧視。\nＢ分節  適用於商船和用於商業目的的政府船舶的規則"},{"num":27,"title":"外國船舶上的刑事管轄權","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"一、沿海國不應在通過領海的外國船舶上行使刑事管轄權，以逮捕與在該船舶通過期間船上所犯任何罪行有關的任何人或進行與該罪行有關的任何調查，但下列情形除外：\n(a)罪行的後果及於沿海國；\n(b)罪行屬於擾亂當地安寧或領海的良好秩序的性質；\n(c)經船長或船旗國外交代表或領事官員請求地方當局予以協助；或\n(d)這些措施是取締違法販運麻醉藥品或精神調理物質所必要的。\n二、上述規定不影響沿海國為在駛離內水後通過領海的外國船舶上進行逮捕或調查的目的而採取其法律所授權的任何步驟的權利。\n三、在第一和第二兩款規定的情形下，如經船長請求，沿海國在採取任何步驟前應通知船旗國的外交代表或領事官員，並應便利外交代表或領事官員和船上乘務人員之間的接觸。遇有緊急情況，發出此項通知可與採取措施同時進行。\n四、地方當局在考慮是否逮捕或如何逮捕時，應適當顧及航行的利益。\n五、除第十二部份有所規定外或有違犯按照第五部份制定的法律和規章的情形，如果來自外國港口的外國船舶僅通過領海而不駛入內水，沿海國不得在通過領海的該船舶上採取任何步驟，以逮捕與該船舶駛進領海前所犯任何罪行有關的任何人或進行與該罪行有關的調查。"},{"num":28,"title":"對外國船舶的民事管轄權","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"一、沿海國不應為對通過領海的外國船舶上某人行使民事管轄權的目的而停止其航行或改變其航向。\n二、沿海國不得為任何民事訴訟的目的而對船舶從事執行或加以逮捕，但涉及該船舶本身在通過沿海國水域的航行中或為該航行的目的而承擔的義務或因而負擔的責任，則不在此限。\n三、第二款不妨害沿海國按照其法律為任何民事訴訟的目的而對在領海內停泊或駛離內水後通過領海的外國船舶從事執行或加以逮捕的權利。\nＣ分節  適用於軍艦和其他用於非商業目的的政府船舶的        規則"},{"num":29,"title":"軍艦的定義","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"本公約的目的，「軍艦」是指屬於一國武裝部隊，具備辨別軍艦國籍的外部標誌、由該國政府正式委任並名列相應的現役名冊或類似名冊的軍官指揮和配備有服從正規武裝部隊紀律的船員的船舶。"},{"num":30,"title":"軍艦對沿海國法律和規章的不遵守","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"如果任何軍艦不遵守沿海國關於通過領海的法律和規章，而且不顧沿海國向其提出遵守法律和規章的任何要求，沿海國可要求該軍艦立即離開領海。"},{"num":31,"title":"船旗國對軍艦或其他用於非商業目的的政府船舶所造成的損害的責任","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"對於軍艦或其他用於非商業目的的政府船舶不遵守沿海國有關通過領海的法律和規章或不遵守本公約的規定或其他國際法規則，而使沿海國遭受的任何損失或損害，船旗國應負國際責任。"},{"num":32,"title":"軍艦和其他用於非商業目的的政府船舶的豁免權","part":"第二部份  領海和毗連區","section":"第三節  領海的無害通過","content":"Ａ分節和第三十及第三十一條所規定的情形除外，本公約規定不影響軍艦和其他用於非商業目的的政府船舶的豁免權。"},{"num":33,"title":"毗連區","part":"第二部份  領海和毗連區","section":"第四節  毗連區","content":"一、沿海國可在毗連其領海稱為毗連區的區域內，行使為下列事項所必要的管制：\n(a)防止在其領土或領海內違犯其海關、財政、移民或衛生的法律和規章；\n(b)懲治在其領土或領海內違犯上述法律和規章的行為。\n二、毗連區從測算領海寬度的基線量起，不得超過二十四海浬。"},{"num":34,"title":"構成用於國際航行海峽的水域的法律地位","part":"第三部分  用於國際航行的海峽","section":"第一節  一般規定","content":"一、本部份所規定的用於國際航行的海峽的通過制度，不應在其他方面影響構成這種海峽的水域的法律地位，或影響海峽沿岸國對這種水域及其上空、海床和底土行使其主權或管轄權。\n二、海峽沿岸國的主權或管轄權的行使受本部份和其他國際法規則的限制。"},{"num":35,"title":"本部份的範圍","part":"第三部分  用於國際航行的海峽","section":"第一節  一般規定","content":"本部份的任何規定不影響：\n(a) 海峽內任何內水區域，但按照第七條所規定的方法確定直線基線的效果使原來並未認為是內水的區域被包圍在內成為內水的情況除外；\n(b) 海峽沿岸國領海以外的水域作為專屬經濟區或公海的法律地位；或\n(c) 某些海峽的法律制度，這種海峽的通過已全部或部份地規定在長期存在、現行有效的專門關於這種海峽的國際公約中。"},{"num":36,"title":"穿過用於國際航行的海峽的公海航道或穿過專屬經濟區的航道","part":"第三部分  用於國際航行的海峽","section":"第一節  一般規定","content":"如果穿過某一用於國際航行的海峽有在航行和水文特徵方面同樣方便的一條穿過公海或穿過專屬經濟區的航道，本部份不適用於該海峽，在這種航道中，適用本公約其他有關部份其中包括關於航行和飛越自由的規定。"},{"num":37,"title":"本節的範圍","part":"第三部分  用於國際航行的海峽","section":"第二節  過境通行","content":"本節適用於在公海或專屬經濟區的一個部份和公海或專屬經濟區的另一部份之間的用於國際航行的海峽。"},{"num":38,"title":"過境通行權","part":"第三部分  用於國際航行的海峽","section":"第二節  過境通行","content":"一、在第三十七條所指的海峽中，所有船舶和飛機均享有過境通行的權利，過境通行不應受阻礙；但如果海峽是由海峽沿岸國的一個島嶼和該國大陸形成，而且該島向海一面有在航行和水文特徵方面同樣方便的一條穿過公海，或穿過專屬經濟區的航道，過境通行就不應適用。\n二、過境通行是指按照本部份規定，專為在公海或專屬經濟區的一個部份和公海或專屬經濟區的另一部份之間的海峽繼續不停和迅速過境的目的而行使航行和飛越自由。但是，對繼續不停和迅速過境的要求，並不排除在一個海峽沿岸國入境條件的限制下，為駛入、駛離該國或自該國返回的目的而通過海峽。\n三、任何非行使海峽過境通行權的活動，仍受本公約其他適用的規定的限制。"},{"num":39,"title":"船舶和飛機在過境通行時的義務","part":"第三部分  用於國際航行的海峽","section":"第二節  過境通行","content":"一、船舶和飛機在行使過境通行權時應：\n(a)毫不遲延地通過或飛越海峽；\n(b)不對海峽沿岸國的主權、領土完整或政治獨立進行任何武力威脅或使用武力，或以任何其他違反「聯合國憲章」所體現的國際法原則的方式進行武力威脅或使用武力；\n(c)除因不可抗力或遇難而有必要外，不從事其繼續不停和迅速過境的通常方式所附帶發生的活動以外的任何活動；\n(d)遵守本部份的其他有關規定。\n二、過境通行的船舶應：\n(a)遵守一般接受的關於海上安全的國際規章、程序和慣例，包括「國際海上避碰規則」；\n(b)遵守一般接受的關於防止、減少和控制來自船舶的污染的國際規章、程序和慣例。\n三、過境通行的飛機應：\n(a)遵守國際民用航空組織制定的適用於民用飛機的「航空規則」；國有飛機通常應遵守這種安全措施，並在操作時隨時適當顧及航行安全；\n(b)隨時監聽國際上指定的空中交通管制主管機構所分配的無線電頻率或有關的國際呼救無線電頻率。"},{"num":40,"title":"研究和測量活動","part":"第三部分  用於國際航行的海峽","section":"第二節  過境通行","content":"外國船舶，包括海洋科學研究和水文測量的船舶在內，在過境通行時，非經海峽沿岸國事前准許，不得進行任何研究或測量活動。"},{"num":41,"title":"用於國際航行的海峽內的海道和分道通航制","part":"第三部分  用於國際航行的海峽","section":"第二節  過境通行","content":"一、依照本部份，海峽沿岸國可於必要時為海峽航行指定海道和規定分道通航制，以促進船舶的安全通過。\n二、這種國家可於情況需要時，經妥為公佈後，以其他海道或分道通航制替換任何其原先指定或規定的海道或分道通航制。\n三、這種海道和分道通航制應符合一般接受的國際規章。\n四、海峽沿岸國在指定或替換海道或在規定或替換分道通航制以前，應將提議提交主管國際組織，以期得到採納。該組織僅可採納同海峽沿岸國議定的海道和分道通航制，在此以後，海峽沿岸國可對這些海道和分道通航制予以指定、規定或替換。\n五、對於某一海峽，如所提議的海道或分道通航制穿過該海峽兩個或兩個以上沿岸國的水域，有關各國應同主管國際組織協商，合作擬訂提議。\n六、海峽沿岸國應在海圖上清楚地標出其所指定或規定的一切海道和分道通航制，並應將該海圖妥為公佈。\n七、過境通行的船舶應尊重按照本條制定的適用的海道和分道通航制。"},{"num":42,"title":"海峽沿岸國關於過境通行的法律和規章","part":"第三部分  用於國際航行的海峽","section":"第二節  過境通行","content":"一、在本節規定的限制下，海峽沿岸國可對下列各項或任何一項制定關於通過海峽的過境通行的法律和規章：\n(a)第四十一條所規定的航行安全和海上交通管理；\n(b)使有關在海峽內排放油類、油污廢物和其他有毒物質的適用的國際規章有效，以防止、減少和控制污染；\n(c)對於漁船，防止捕魚，包括漁具的裝載；\n(d)違反海峽沿岸國海關、財政、移民或衛生的法律和規章，上下任何商品、貨幣或人員。\n二、這種法律和規章不應在形式上或事實上在外國船舶間有所歧視，或在其適用上有否定，妨礙或損害本節規定的過境通行權的實際後果。\n三、海峽沿岸國應將所有這種法律和規章妥為公佈。\n四、行使過境通行權的外國船舶應遵守這種法律和規章。\n五、享有主權豁免的船舶的船旗國或飛機的登記國，在該船舶或飛機不遵守這種法律和規章或本部份的其他規定時，應對海峽沿岸國遭受的任何損失和損害負國際責任。"},{"num":43,"title":"助航和安全設備及其他改進辦法以及污染的防止、減少和控制","part":"第三部分  用於國際航行的海峽","section":"第二節  過境通行","content":"海峽使用國和海峽沿岸國應對下列各項通過協議進行合作：\n(a)在海峽內建立並維持必要的助航和安全設備或幫助國際航行的其他改進辦法；和\n(b)防止、減少和控制來自船舶的污染。"},{"num":44,"title":"海峽沿岸國的義務","part":"第三部分  用於國際航行的海峽","section":"第二節  過境通行","content":"海峽沿岸國不應妨礙過境通行，並應將其所知的海峽內或海峽上空對航行或飛越有危險的任何情況妥為公佈。過境通行不應予以停止。"},{"num":45,"title":"無害通過","part":"第三部分  用於國際航行的海峽","section":"第三節  無害通過","content":"一、按照第二部份第三節，無害通過制度應適用於下列用於國際航行的海峽：\n(a)按照第三十八條第一款不適用過境通行制度的海峽；或\n(b)在公海或專屬經濟區的一個部份和外國領海之間的海峽。\n二、在這種海峽中的無害通過不應予以停止。"},{"num":46,"title":"用語","part":"第四部份  群島國","section":"第三節  無害通過","content":"為本公約的目的：\n(a) 「群島國」是指全部由一個或多個群島構成的國家，並可包括其他島嶼；\n(b) 「群島」是指一群島嶼，包括若干島嶼的若干部份、相連的水域和其他自然地形，彼此密切相關，以致這種島嶼、水域和其他自然地形在本質上構成一個地理、經濟和政治的實體，或在歷史上已被視為這種實體。"},{"num":47,"title":"群島基線","part":"第四部份  群島國","section":"第三節  無害通過","content":"一、群島國可劃定連接群島最外線各島和各乾礁的最外緣各點的直線群島基線，但這種基線應包括主要的島嶼和一個區域，在該區域內，水域面積和包括環礁在內的陸地面積的比例應在一比一到九比一之間。\n二、這種基線的長度不應超過一百海里。但圍繞任何群島的基線總數中至多百分之三可超過該長度，最長以一百二十五海里為限。\n三、這種基線的劃定不應在任何明顯的程度上偏離群島的一般輪廓。\n四、除在低潮高地上築有永久高於海平面的燈塔或類似設施，或者低潮高地全部或一部與最近的島嶼的距離不超過領海的寬度外，這種基線的劃定不應以低潮高地為起訖點。\n五、群島國不應採用一種基線制度，致使另一國的領海同公海或專屬經濟區隔斷。\n六、如果群島國的群島水域的一部份位於一個直接相鄰國家的兩個部分之間，該鄰國傳統上在該水域內行使的現有權利和一切其他合法利益以及兩國間協定所規定的一切權利，均應繼續，並予以尊重。\n七、為計算第一款規定的水域與陸地的比例的目的，陸地面積可包括位於島嶼和環礁的岸礁以內的水域，其中包括位於陡側海臺周圍的一系列灰岩島和干礁所包圍或幾乎包圍的海臺的那一部分。\n八、按照本條劃定的基線，應在足以確定這些線的位置的一種或幾種比例尺的海圖上標出。或者，可以用列出各點的地理座標並註明大地基準點的表來代替。\n九、群島國應將這種海圖或地理座標表妥為公佈，並應將各該海圖或座標表的一份副本交存於聯合國秘書長。"},{"num":48,"title":"領海、毗連區、專屬經濟區和大陸架寬度的測算","part":"第四部份  群島國","section":"第三節  無害通過","content":"領海，毗連區、專屬經濟區和大陸架的寬度，應從按照第四十七條劃定的群島基線量起。"},{"num":49,"title":"群島水域、群島水域的上空、海床和底土的法律地位","part":"第四部份  群島國","section":"第三節  無害通過","content":"一、群島國的主權及於按照第四十七條劃定的群島基線所包圍的水域，稱為群島水域，不論其深度或距離海岸的遠近如何。\n二、此項主權及於群島水域的上空，海床和底土，以及其中所包含的資源。\n三、此項主權的行使受本部份規定的限制。\n四、本部份所規定的群島海道通過制度，不應在其他方面影響包括海道在內的群島水域的地位，或影響群島國對這種水域及其上空、海床和底土以及其中所含資源行使其主權。"},{"num":50,"title":"內水界限的劃定","part":"第四部份  群島國","section":"第三節  無害通過","content":"群島國可接照第九、第十和第十一條，在其群島水域內用封閉線劃定內水的界限。"},{"num":51,"title":"現有協定、傳統捕魚權利和現有海底電纜","part":"第四部份  群島國","section":"第三節  無害通過","content":"一、在不妨害第四十九條的情形下，群島國應尊重與其他國家間的現有協定，並應承認直接相鄰國家在群島水域範圍內的某些區域內的傳統捕魚權利和其他合法活動。行使這種權利和進行這種活動的條款和條件，包括這種權利和活動的性質、範圍和適用的區域，經任何有關國家要求，應由有關國家之間的雙邊協定予以規定。這種權利不應轉讓給第三國或其國民，或與第三國或其國民分享。\n二、群島國應尊重其他國家所鋪設的通過其水域而不靠岸的現有海底電纜。群島國於接到關於這種電纜的位置和修理或更換這種電纜的意圖的適當通知後，應准許對其進行維修和更換。"},{"num":52,"title":"無害通過權","part":"第四部份  群島國","section":"第三節  無害通過","content":"一、在第五十三條的限制下並在不妨害第五十條的情形下，按照第二部份第三節的規定，所有國家的船舶均享有通過群島水域的無害通過權。\n二、如為保護國家安全所必要，群島國可在對外國船舶之間在形式上或事實上不加歧視的條件下，暫時停止外國船舶在其群島水域特定區域內的無害通過。這種停止僅應在正式公佈後發生效力。"},{"num":53,"title":"群島海道通過權","part":"第四部份  群島國","section":"第三節  無害通過","content":"一、群島國可指定適當的海道和其上的空中航道，以便外國船舶和飛機繼續不停和迅速通過或飛越其群島水域和鄰接的領海。\n二、所有船舶和飛機均享有在這種海道和空中航道內的群島海道通過權。\n三、群島海道通過是指按照本公約規定，專為在公海或專屬經濟區的一部份和公海或專屬經濟區的另一部份之間繼續不停、迅速和無障礙地過境的目的，行使正常方式的航行和飛越的權利。\n四、這種海道和空中航道應穿過群島水域和鄰接的領海，並應包括用作通過群島水域或其上空的國際航行或飛越的航道的所有正常通道，並且在這種航道內，就船舶而言，包括所有正常航行水道，但無須在相同的進出點之間另設同樣方便的其他航道。\n五、這種海道和空中航道應以通道進出點之間的一系列連續不斷的中心線劃定，通過群島海道和空中航道的船舶和飛機在通過時不應偏離這種中心線二十五海里以外，但這種船舶和飛機在航行時與海岸的距離不應小於海道邊緣各島最近各點之間的距離的百分之十。\n六、群島國根據本條指定海道時，為了使船舶安全通過這種海道內的狹窄水道，也可規定分道通航制。\n七、群島國可於情況需要時，經妥為公佈後，以其他的海道或分道通航制替換任何其原先指定或規定的海道或分道通航制。\n八、這種海道或分道通航制應符合一般接受的國際規章。\n九、群島國在指定或替換海道或在規定或替換分道通航制時，應向主管國際組織提出建議，以期得到採納。該組織僅可採納同群島國議定的海道和分道通航制；在此以後，群島國可對這些海道和分道通航制予以指定、規定或替換。\n十、群島國應在海圖上清楚地標出其指定或規定的海道中心線和分道通航制，並應將該海圖妥為公佈。\n十一、通過群島海道的船舶應尊重按照本條制定的適用的海道和分道通航制。\n十二、如果群島國沒有指定海道或空中航道，可通過正常用於國際航行的航道，行使群島海道通過權。"},{"num":54,"title":"","part":"第四部份  群島國","section":"第三節  無害通過","content":"船舶和飛機在通過時的義務，研究和測量活動，群海國的義務以及群島國關於群島海道通過的法律和規章。第三十九、第四十、第四十二和第四十四各條比照適用於群島海道通過。"},{"num":55,"title":"專屬經濟區的特定法律制度","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"專屬經濟區是領海以外並鄰接領海的一個區域，受本部份規定的特定法律制度的限制，在這個制度下，沿海國的權利和管轄權以及其他國家的權利和自由均受本公約有關規定的支配。"},{"num":56,"title":"沿海國在專屬經濟區內的權利、管轄權和義務","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、沿海國在專屬經濟區內有：\n(a)以勘探和開發、養護和管理海床上覆水域和海床及其底土的自然資料（不論為生物或非生物資源）為目的的主權權利，以及關於在該區內從事經濟性開發和勘探，如利用海水、海流和風力生產能等其他活動的主權權利；\n(b)本公約有關條款規定的對下列事項的管轄權：\n(1)人工島嶼、設施和結構的建造和使用；\n(2)海洋科學研究；\n(3)海洋環境的保護和保全；\n(c)本公約規定的其他權利和義務。\n二、沿海國在專屬經濟區內根據本公約行使其權利和履行其義務時，應適當顧及其他國家的權利和義務，並應以符合本公約規定的方式行事。\n三、本條所載的關於海床和底土的權利，應按照第六部份的規定行使。"},{"num":57,"title":"專屬經濟區的寬度","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"專屬經濟區從測算領海寬度的基線量起，不應超過二百海里。"},{"num":58,"title":"其他國家在專屬經濟區內的權利和義務","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、在專屬經濟區內，所有國家，不論為沿海國或內陸國，在本公約有關規定的限制下，享有第八十七條所指的航行和飛越的自由，鋪設海底電纜和管道的自由，以及與這些自由有關的海洋其他國際合法用途，諸如同船舶和飛機的操作及海底電纜和管道的使用有關的並符合本公約其他規定的那些用途。\n二、第八十八至第一百一十五條以及其他國際法有關規則，只要與本部份不相牴觸均適用於專屬經濟區。\n三、各國在專屬經濟區內根據本公約行使其權利和履行其義務時，應適當顧及沿海國的權利和義務，並應遵守沿海國按照本公約的規定和其他國際法規則所制定的與本部份不相牴觸的法律和規章。"},{"num":59,"title":"解決關於專屬經濟區內權利和管轄權的歸屬的衝突的基礎","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"在本公約未將在專屬經濟區內的權利或管轄權歸屬於沿海國或其他國家而沿海國和任何其他一國或數國之間的利益發生衝突的情形下，這種衝突應在公平的基礎上參照一切有關情況，考慮到所涉利益分別對有關各方和整個國際社會的重要性，加以解決。"},{"num":60,"title":"專屬經濟區內的人工島嶼、設施和結構","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、沿海國在專屬經濟區內應有專屬權利建造並授權和管理建造、操作和使用：\n(a)人工島嶼；\n(b)為第五十六條所規定的目的和其他經濟目的的設施和結構；\n(c)可能干擾沿海國在區內行使權利的設施和結構。\n二、沿海國對這種人工島嶼、設施和結構應有專屬管轄權，包括有關海關、財政、衛生、安全和移民的法律和規章方面的管轄權。\n三、這種人工島嶼、設施或結構的建造，必須妥為通知，並對其存在必須維持永久性的警告方法。已被放棄或不再使用的任何設施或結構，應予以撤除，以確保航行安全，同時考慮到主管國際組織在這方面制訂的任何為一般所接受的國際標準，這種撤除也應適當地考慮到捕魚、海洋環境的保護和其他國家的權利和義務。尚未全部撤除的任何設施或結構的深度、位置和大小應妥為公佈。\n四、沿海國可於必要時在這種人工島嶼、設施和結構的周圍設置合理的安全地帶，並可在該地帶中採取適當措施以確保航行以及人工島嶼、設施和結構的安全。\n五、安全地帶的寬度應由沿海國參照可適用的國際標準加以確定。這種地帶的設置應確保其與人工島嶼、設施或結構的性質和功能有合理的關聯；這種地帶從人工島嶼、設施或結構的外緣各點量起，不應超過這些人工島嶼、設施或結構周圍五百公尺的距離，但為一般接受的國際標準所許可或主管國際組織所建議者除外。安全地帶的範圍應妥為通知。\n六、一切船舶都必須尊重這些安全地帶，並應遵守關於在人工島嶼、設施、結構和安全地帶附近航行的一般接受的國際標準。\n七、人工島嶼、設施和結構及其周圍的安全地帶，不得設在對使用國際航行必經的公認海道可能有干擾的地方。\n八、人工島嶼、設施和結構不具有島嶼地位。它們沒有自己的領海，其存在也不影響領海、專屬經濟區或大陸架界限的劃定。"},{"num":61,"title":"生物資源的養護","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、沿海國應決定其專屬經濟區內生物資源的可捕量。\n二、沿海國參照其可得到的最可靠的科學證據，應通過正當的養護和管理措施，確保專屬經濟區內生物資源的維持不受過度開發的危害。在適當情形下，沿海國和各主管國際組織，不論是分區域、區域或全球性的，應為此目的進行合作。\n三、這種措施的目的也應在包括沿海漁民社區的經濟需要和發展中國家的特殊要求在內的各種有關的環境和經濟因素的限制下，使捕撈魚種的數量維持在或恢復到能夠生產最高持續產量的水平，並考慮到捕撈方式、種群的相互依存以及任何一般建議的國際最低標準，不論是分區域、區域或全球性的。\n四、沿海國在採取這種措施時，應考慮到與所捕撈魚種有關聯或依賴該魚種而生存的魚種所受的影響，以便使這些有關聯或依賴的魚種的數量維持在或恢復到其繁殖不會受嚴重威脅的水平以上。\n五、在適當情形下，應通過各主管國際組織，不論是分區域、區域或全球性的，並在所有有關國家，包括其國民獲准在專屬經濟區捕魚的國家參加下，經常提供和交換可獲得的科學情報、漁獲量和漁撈努力量統計，以及其他有關養護魚的種群的資料。"},{"num":62,"title":"生物資源的利用","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、沿海國應在不妨害第六十一條的情形下促進專屬經濟區內生物資源最適度利用的目的。\n二、沿海國應決定其捕撈專屬經濟區內生物資源的能力。沿海國在沒有能力捕撈全部可捕量的情形下，應通過協定或其他安排，並根據第四款所指的條款、條件、法律和規章，准許其他國家捕撈可捕量的剩餘部分，特別顧及第六十九和第七十條的規定，尤其是關於其中所提到的發展中國家的部份。\n三、沿海國在根據本條准許其他國家進入其專屬經濟區時，應考慮到所有有關因素，除其他外，包括：該區域的生物資源對有關沿海國的經濟和其他國家利益的重要性，第六十九和第七十條的規定，該分區域或區域內的發展中國家捕撈一部份剩餘量的要求，以及盡量減輕其國民慣常在專屬經濟區捕魚或曾對研究和測定種群做過大量工作的國家經濟失調現象的需要。\n四、在專屬經濟區內捕魚的其他國家的國民應遵守沿海國的法律和規章中所制訂的養護措施和其他條款和條件。這種規章應符合本公約，除其他外，並可涉及下列各項：\n(a)發給漁民、漁船和捕撈裝備以執照，包括交納規費和其他形式的報酬，而就發展中的沿海國而言，這種報酬可包括有關漁業的資金、裝備和技術方面的適當補償；\n(b)決定可捕魚種，和確定漁獲量的限額，不論是關於特定種群或多種種群或一定期間的單船漁獲量，或關於特定期間內任何國家國民的漁獲量；\n(c)規定漁汎和漁區，可使用漁具的種類、大小和數量以及漁船的種類、大小和數目；\n(d)確定可捕魚類和其他魚種的年齡和大小；\n(e)規定漁船應交的情報，包括漁獲量和漁撈努力量統計和船隻位置的報告；\n(f)要求在沿海國授權和控制下進行特定漁業研究計劃，並管理這種研究的進行，其中包括漁獲物抽樣、樣品處理和相關科學資料的報告；\n(g)由沿海國在這種船隻上配置觀察員或受訓人員；\n(h)這種船隻在沿海國港口卸下漁獲量的全部或任何部份；\n(i)有關聯合企業或其他合作安排的條款和條件；\n(j)對人員訓練和漁業技術轉讓的要求，包括提高沿海國從事漁業研究的能力；\n(k)執行程序。\n五、沿海國應將養護和管理的法律和規章妥為通知。"},{"num":63,"title":"","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"出現在兩個或兩個以上沿海國專屬經濟區的種群或出現在專屬經濟區內\n而又出現在專屬經濟區外的鄰接區域內的種群\n一、如果同一種群或有關聯的魚種的幾個種群出現在兩個或兩個以上沿海國的專屬經濟區內，這些國家應直接或通過適當的分區域或區域組織，設法就必要措施達成協議，以便在不妨害本部份其他規定的情形下，協調並確保這些種群的養護和發展。\n二、如果同一種群或有關聯的魚種的幾個種群出現在專屬經濟區內而又出現在專屬經濟區外的鄰接區域內，沿海國和在鄰接區域內捕撈這種種群的國家，應直接或通過適當的分區域或區域組織，設法就必要措施達成協議，以養護在鄰接區域內的這些種群。"},{"num":64,"title":"高度迴游魚種","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、沿海國和其國民在區域內捕撈附件一所列的高度迴游魚種的其他國家應直接或通過適當國際組織進行合作，以期確保在專屬經濟區以內和以外的整個區域內的這種魚種的養護和促進最適度利用這種魚種的目標。在沒有適當的國際組織存在的區域內，沿海國和其國民在區域內捕撈這些魚種的其他國家，應合作設立這種組織並參加其工作。\n二、第一款的規定作為本部份其他規定的補充而適用。"},{"num":65,"title":"海洋哺乳動物","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"本部份的任何規定並不限制沿海國的權利或國際組織的職權，對捕捉海洋哺乳動物執行較本部份規定更為嚴格的禁止、限制或管制。各國應進行合作，以期養護海洋哺乳動物，在有關鯨目動物方面，尤應通過適當的國際組織，致力於這種動物的養護、管理和研究。"},{"num":66,"title":"溯河產卵種群","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、有溯河產卵種群源自其河流的國家對於這種種群應有主要利益和責任。\n二、溯河產卵種群的魚源國，應制訂關於在其專屬經濟區外部界限向陸一面的一切水域中的捕撈和關於第三款(b) 項中所規定的捕撈的適當管理措施，以確保這種種群的養護。魚源國可與第三和第四款所指的捕撈這些種群的其他國家協商後，確定源自其河流的種群的總可捕量。\n三、\n(a) 捕撈溯河產卵種群的漁業活動，應只在專屬經濟區外部界限向陸一面的水域中進行，但這項規定引起魚源國以外的國家經濟失調的情形除外。關於在專屬經濟區外部界限以外進行的這種捕撈，有關國家應保持協商，以期就這種捕撈的條款和條件達成協議，並適當顧及魚源國對這些種群加以養護的要求和需要；\n(b) 魚源國考慮到捕撈這些種群的其他國家的正常漁獲量和作業方式，以及進行這種捕撈活動的所有地區，應進行合作以盡量減輕這種國家的經濟失調；\n(c) (b) 項所指的國家，經與魚源國協議後參加使溯河產卵種群再生的措施者，特別是分擔作此用途的開支者，在捕撈源自魚源國河流的種群方面，應得到魚源國的特別考慮；\n(d) 魚源國和其他有關國家應達成協議，以執行有關專屬經濟區以外的溯河產卵種群的法律和規章。\n四、在溯河產卵種群回游進入或通過魚源國以外國家的專屬經濟區外部界限向陸一面的水域的情形下，該國應在養護和管理這種種群方面同魚源國進行合作。\n五、溯河產卵種群的魚源國和捕撈這些種群的其他國家，為了執行本條的各項規定，應作出安排在適當情形下通過區埴性組織作出安排。"},{"num":67,"title":"降河產卵魚種","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、降河產卵魚種在其水域內度過大部分生命周期的沿海國，應有責任管理這些魚種，並應確保回游魚類的出入。\n二、捕撈降河產卵魚種，應只在專屬經濟區外部界限向陸一面的水域進行。在專屬經濟區內進行捕撈時，應受本條及本公約關於在專屬經濟區內捕魚的其它規定的規制。\n三、在降河產卵魚種不論幼魚或成魚回游通過另外一國的專屬經濟區的情形下，這種魚的管理，包括捕撈，應由第一款所述的國家和有關的另外一國協議規定。這種協議應確保這些魚種的合理管理，並考慮到第一款所述國家在維持這些魚種方面所負的責任。"},{"num":68,"title":"定居種","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"本部份的規定不適用於第七十七條第四款所規定的定居種。"},{"num":69,"title":"內陸國的權利","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、內陸國應有在公平的基礎上，參與開發同一分區域或區域的沿海國專屬經濟區的生物資源的適當剩餘部分，同時考慮到所有有關國家的相關經濟和地理情況，並遵守本條及第六十一和第六十二條的規定。\n二、這種參與的條款和方式應由有關國家通過雙邊、分區域或區域協定加以制訂，除其他外，考慮到下列各項：\n(a)避免對沿海國的漁民社區或漁業造成不利影響的需要；\n(b)內陸國按照本條規定，在現有的雙邊、分區域、或區域協定下參與或有權參與開發其他沿海國專屬經濟區的生物資源的程度；\n(c)其他內陸國和地理不利國參與開發沿海國專屬經濟區的生物資源的程度，以及避免因此使任何一個沿海國、或其一部份地區承受特別負擔的需要；\n(d)有關各國人民的營養需要。\n三、當一個沿海國的捕撈能力接近能夠捕撈其專屬經濟區內生物資源的可捕量的全部時，該沿海國與其他有關國家應在雙邊、分區域或區域的基礎上，合作制訂公平安排，在適當情形下並按照有關各方都滿意的條款，容許同一分區域或區域的發展中內陸國參與開發該分區域或區域的沿海國專屬經濟區內的生物資源。在實施本規定時，還應考慮到第二款所提到的因素。\n四、根據本條規定，發達的內陸國應僅有權參與開發同一分區域或區域內發達沿海國專屬經濟區的生物資源，同時顧及沿海國在准許其他國家捕撈其專屬經濟區內生物資源時，在多大程度上已考慮到需要盡量減輕其國民慣常在該經濟區捕魚的國家的經濟失調及漁民社區所受的不利影響。\n五、上述各項規定不妨害在分區域或區域內議定的安排，沿海國在這種安排中可能給予同一分區域或區域的內陸國開發其專屬經濟區內生物資源的同等或優惠權利。"},{"num":70,"title":"地理不利國的權利","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、地理不利國應有權在公平的基礎上參與開發同一分區域或區域的沿海國專屬經濟區的生物資源的適當剩餘部份，同時考慮到所有有關國家的相關經濟和地理情況，並遵守本條及第六十一和第六十二條的規定。\n二、為本部份的目的，「地理不利國」是指其地理條件使其依賴於開發同一分區域或區域的其他國家專屬經濟區內的生物資源，以供應足夠的魚類來滿足其人民或部份人民的營養需要的沿海國，包括閉海或半閉海沿岸國在內，以及不能主張有自己的專屬經濟區的沿海國。\n三、這種參與的條款和方式應由有關國家通過雙邊、分區域或區域協定加以制訂，除其他外，考慮到下列各項：\n(a)避免對沿海國的漁民社區或漁業造成不利影響的需要；\n(b)地理不利國按照本條規定，在現有的雙邊、分區域或區域協定下參與或有權參與開發其他沿海國專屬經濟區的生物資源的程度；\n(c)其他地理不利國和內陸國參與開發沿海國專屬經濟區的生物資源的程度，以及避免因此使任何一個沿海國，或其一部分地區承受特別負擔的需要；\n(d)有關各國人民的營養需要。\n四、當一個沿海國的捕撈能力接近能夠捕撈其專屬經濟區內生物資源的可捕量的全部時，該沿海國與其他有關國家應在雙邊、分區域或區域的基礎上，合作制訂公平安排，在適當情形下並按照有關各方都滿意的條款，容許同一分區域或區域的地理不利發展中國家參與開發該分區域或區域的沿海國專屬經濟區內的生物資源，在實施本規定時，還應考慮到第三款所提到的因素。\n五、根據本條規定，地理不利發達國家應只有權參與開發同一分區域或區域發達沿海國的專屬經濟區的生物資源，同時顧及沿海國在准許其他國家捕撈其專屬經濟區內生物資源時，在多大程度上已考慮到需要盡量減輕其國民慣常在該經濟區捕魚的國家的經濟失調及漁民社區所受的不利影響。\n六、上述各項規定不妨害在分區域或區域內議定的安排，沿海國在這種安排中可能給予同一分區域或區域內地理不利國開發其專屬經濟區內生物資源的同等或優惠權利。"},{"num":71,"title":"第六十九和第七十條的不適用","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"第六十九和第七十條的規定不適用於經濟上極為依賴於開發其專屬經濟區內生物資源的沿海國的情形。"},{"num":72,"title":"權利轉讓的限制","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、除有關國家另有協議外，第六十九和第七十條所規定的開發生物資源的權利，不應以租借或發給執照、或成立聯合企業，或以具有這種轉讓效果的任何其他方式，直接或間接轉讓給第三國或其國民。\n二、上述規定不排除有關國家為了便利行使第六十九和第七十條所規定的權利，從第三國或國際組織取得技術或財政援助，但以不發生第一款所指的效果為限。"},{"num":73,"title":"沿海國法律和規章的執行","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、沿海國行使其勘探、開發、養護和管理在專屬經濟區內的生物資源的主權權利時，可採取為確保其依照本公約制定的法律和規章得到遵守所必要的措施，包括登臨、檢查、逮捕和進行司法程序：\n二、被逮捕的船隻及其船員，在提出適當的保書或其他擔保後，應迅速獲得釋放。\n三、沿海國對於在專屬經濟區內違犯漁業法律和規章的處罰，如有關國家無相反的協議，不得包括監禁，或任何其他方式的體罰。\n四、在逮捕或扣留外國船隻的情形下，沿海貫應通過適當途徑將其所採取的行動及隨後所施加的任何處罰迅速通知船旗國。"},{"num":74,"title":"海岸相向或相鄰國家間專屬經濟區界限的劃定","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、海岸相向或相鄰國家間專屬經濟區的界限，應在國際法院規約第三十八條所指國際法的基礎上以協議劃定，以便得到公平解決。\n二、有關國家如在合理期間內未能達成任何協議，應訴諸第十五部份所規定的程序。\n三、在達成第一款規定的協議以前，有關各國應基於諒解和合作的精神，盡一切努力作出實際性的臨時安排，並在此過渡期間內，不危害或阻礙最後協議的達成，這種安排應不妨害最後界限的劃定。\n四、如果有關國家間存在現行有效的協定，關於劃定專屬經濟區界限的問題，應按照該協定的規定加以決定。"},{"num":75,"title":"海圖和地理座標表","part":"第五部份  專屬經濟區","section":"第三節  無害通過","content":"一、在本部分的限制下，專屬經濟區的外部界線和按照第七十四條劃定的分界線，應在足以確定這些線的位置的一種或幾種比例尺的海圖上標出。在適當情形下，可以用列出各點的地理座標並註明大地基準點的表來代替這種外部界線或分界線。\n二、沿海國應將這種海圖或地理座標表妥為公佈，並應將各該海圖或座標表的一份副本交存於聯合國秘書長。"},{"num":76,"title":"大陸架的定義","part":"第六部份  大陸架","section":"第三節  無害通過","content":"一、沿海國的大陸架包括其領海以外依其陸地領土的全部自然延伸，擴展到大陸邊外緣的海底區域的海床和底土，如果從測算領海寬度的基線量起到大陸邊的外緣的距離不到二百海浬，則擴展到二百海浬的距離。\n二、沿海國的大陸架不應擴展到第四至第六款所規定的界限以外。\n三、大陸邊包括沿海國陸塊沒入水中的延伸部分，由陸架、陸坡和陸基的海床和底土構成，它不包括深洋洋底及其洋脊，也不包括其底土。\n四、\n(a) 為本公約的目的，在大陸邊從測算領海寬度的基線量起超過二百海浬的任何情形下，沿海國應以下列兩種方式之一，劃定大陸邊的外緣：\n(1)按照第七款，以最外各定點為準劃定界線，每一定點上沉積岩厚度至少為從該點至大陸坡腳最短距離的百分之一或；\n(2)按照第七款，以離大陸坡腳的距離不超過六十海浬的各定點為準劃定界線。\n(b) 在沒有相反證明的情形下，大陸坡腳應定為大陸坡坡底坡度變動最大之點。\n五、組成按照第四款(a) 項(1) 和(2) 目劃定的大陸架在海床上的外部界線的各定點，不應超過從測算領海寬度的基線量起三百五十海浬，或不應超過連接二千五百公尺深度各點的二千五百公尺等深線一百海浬。\n六、雖有第五款的規定，在海底洋脊上的大陸架外部界限不應超過從測算領海寬度的基線量超三百五十海浬。本款規定不適用於作為大陸邊自然構成部分的海臺、海隆、海峰、暗灘和坡尖等海底高地。\n七、沿海國的大陸架如從測算領海寬度的基線量起超過二百海浬，應連接以經緯度座標標出的各定點劃出長度各不超過六十海浬的若干直線，劃定其大陸架的外部界限。\n八、從測算領海寬度的基線量起二百海浬以外大陸架界限的情報應由沿海國提交根據附件二在公平地區代表制基礎上成立的大陸架界限委員會。委員會應就有關劃定大陸架外部界限的事項向沿海國提出建議，沿海國在這些建議的基礎上劃定的大陸架界限應有確定性和拘束力。\n九、沿海國應將永久標明其大陸架外部界限的海圖和有關情報。包括大地基準點，交存於聯合國秘書長。秘書長應將這些情報妥為公佈。\n十、本條的規定不妨害海岸相向或相鄰國家間大陸架界限劃定的問題。"},{"num":77,"title":"沿海國對大陸架的權利","part":"第六部份  大陸架","section":"第三節  無害通過","content":"一、沿海國為勘探大陸架和開發其自然資源的目的，對大陸架行使主權權利。\n二、第一款所指的權利是專屬性的，即：如果沿海國不勘探大陸架或開發其自然資源，任何人未經沿海國明示同意，均不得從事這種活動。\n三、沿海國對大陸架的權利並不取決於有效或象徵的占領或任何明文公告。\n四、本部份所指的自然資源包括海床和底土的礦物和其他非生物資源，以及屬於定居種的生物，即在可捕撈階段在海床上或海床下不能移動或其軀體須與海床或底土保持接觸才能移動的生物。"},{"num":78,"title":"上覆水域和上空的法律地位以及其他國家權利和自由","part":"第六部份  大陸架","section":"第三節  無害通過","content":"一、沿海國對大陸架的權利不影響上覆水域或水域上空的法律地位。\n二、沿海國對大陸架權利的行使，絕不得對航行和本公約規定的其他國家的其他權利和自由有所侵害，或造成不當的干擾。"},{"num":79,"title":"大陸架上的海底電纜和管道","part":"第六部份  大陸架","section":"第三節  無害通過","content":"一、所有國家按照本條的規定都有在大陸架上鋪設海底電纜和管道的權利。\n二、沿海國除為了勘探大陸架，開發其自然資源和防止、減少和控制管道造成的污染有權採取合理措施外，對於鋪設或維持這種海底電纜或管道不得加以阻礙。\n三、在大陸架上鋪設這種管道，其路線的劃定須經沿海國同意。\n四、本部份的任何規定不影響沿海國對進入其領土或領海的電纜或管道訂立條件的權利，也不影響沿海國對因勘探其大陸架或開發其資源或經營在其管轄下的人工島嶼、設施和結構而建造或使用的電纜和管道的管轄權。\n五、鋪設海底電纜和管道時，各國應適當顧及已經鋪設的電纜和管道。特別是，修理現有電纜或管道的可能性不應受妨害。"},{"num":80,"title":"大陸架上的人工島嶼、設施和結構","part":"第六部份  大陸架","section":"第三節  無害通過","content":"第六十條比照適用於大陸架上的人工島嶼、設施和結構。"},{"num":81,"title":"大陸架上的鑽探","part":"第六部份  大陸架","section":"第三節  無害通過","content":"沿海國授權和管理為一切目的在大陸架上進行鑽探的專屬權利。"},{"num":82,"title":"對二百海浬以外的大陸架上的開發應繳的費用和實物","part":"第六部份  大陸架","section":"第三節  無害通過","content":"一、沿海國對從測算領海寬度的基線量起二百海浬以外的大陸架上的非生物資源的開發，應繳付費用或實物。\n二、在某一礦址進行第一個五年生產以後，對該礦址的全部生產應每年繳付費用和實物。第六年繳付費用或實物的比率應為礦址產值或產量的百分之一。此後該比率每年增加百分之一，至第十二年為止，其後比率應保持為百分之七。產品不包括供開發用途的資源。\n三、某一發展中國家如果是其大陸架上所生產的某種礦物資源的純輸入者，對該種礦物資源免繳這種費用或實物。\n四、費用或實物應通過管理局繳納。管理局應根據公平分享的標準將其分配給本公約各締約國，同時考慮到發展中國家的利益和需要，特別是其中最不發達的國家和內陸國的利益和需要。"},{"num":83,"title":"海岸相向或相鄰國家間大陸架界限的劃定","part":"第六部份  大陸架","section":"第三節  無害通過","content":"一、海岸相向或相鄰國家間大陸架的界限，應在國際法院規約第三十八條所指國際法的基礎上以協議劃定，以便得到公平解決。\n二、有關國家如在合理期間內未能達成任何協議，應訴諸第十五部份所規定的程序。\n三、在達成第一款規定的協議以前，有關各國應基於諒解和合作的精神，盡一切努力作出實際性的臨時安排，並在此過渡期間內，不危害或阻礙最後協議的達成。這種安排應不妨害最後界限的劃定。\n四、如果有關國家間存在現行有效的協定，關於劃定大陸架界限的問題，應按照該協定的規定加以決定。"},{"num":84,"title":"海圖和地理座標表","part":"第六部份  大陸架","section":"第三節  無害通過","content":"一、在本部份的限制下，大陸架外部界線和按照第八十三條劃定的分界線，應在足以確定這些線的位置的一種或幾種比例尺的海圖上標出。在適當情形下，可以用列出各點的地理座標並註明大地基準點的表來代替這種外部界線或分界線。\n二、沿海國應將這種海圖或地理座標表妥為公佈，並應將各該海圖或座標表的一份副本交存於聯合國秘書長，如為標明大陸架外部界線的海圖或座標，也交存於管理局秘書長。"},{"num":85,"title":"開鑿隧道","part":"第六部份  大陸架","section":"第三節  無害通過","content":"本部份不妨害沿海國開鑿隊道以開發底土的權利，不論底土上水域的深度如何。"},{"num":86,"title":"本部份規定的適用","part":"第七部份  公海","section":"第一節  一般規定","content":"本部份的規定適用於不包括在國家的專屬經濟區、領海或內水或群島國的群島水域內的全部海域。本條規定並不使各國按照第五十八條規定在專屬經濟區內所享有的自由受到任何減損。"},{"num":87,"title":"公海自由","part":"第七部份  公海","section":"第一節  一般規定","content":"一、公海對所有國家開放，不論其為沿海國或內陸國。公海自由是在本公約和其他國際法規則所規定的條件下行使的。公海自由對沿海國和內陸國而言，除其他外，包括：\n(a)航行自由；\n(b)飛越自由；\n(c)鋪造海底電纜和管道的自由，但受第六部份的限制；\n(d)建造國際法所容許的人工島嶼和其他設施的自由，但受第六部份的限制；\n(e)捕魚自由，但受第二節規定條件的限制；\n(f)科學研究的自由，但受第六和第十三部份的限制。\n二、這些自由應由所有國家行使，但須適當顧及其他國家行使公海自由的利益，並適當顧及本公約所規定的同「區域」內活動有關的權利。"},{"num":88,"title":"公海只用於和平目的","part":"第七部份  公海","section":"第一節  一般規定","content":"公海應只用於和平目的。"},{"num":89,"title":"對公海主權主張的無效","part":"第七部份  公海","section":"第一節  一般規定","content":"任何國家不得有效地聲稱將公海的任何部分置於其主權之下。"},{"num":90,"title":"公海航行自由","part":"第七部份  公海","section":"第一節  一般規定","content":"每個國家，不論是沿海國或內陸國，均有權在公海上行駛懸掛其旗幟的船舶。"},{"num":91,"title":"船舶的國籍","part":"第七部份  公海","section":"第一節  一般規定","content":"一、每個國家應確定對船舶給予國籍、船舶在其領土內登記及船舶懸掛該國旗幟的權利的條件。船舶具有其有權懸掛的旗幟所屬國家的國籍。國家和船舶之間必須有真正聯繫。\n二、每個國家應向其給予懸掛該國旗幟權利的船舶頒發給予該權利的文件。"},{"num":92,"title":"船舶的地位","part":"第七部份  公海","section":"第一節  一般規定","content":"一、船舶航行應僅懸掛一國的旗幟，而且除國際條約或本公約明文規定的例外情形外，在公海上應受該國的專屬管轄。除所有權確實轉移或變更登記的情形外，船舶在航程中或在停泊港內不得更換其旗幟。\n二、懸掛兩國或兩國以上旗幟航行並視方便而換用旗幟的船舶，對任何其他國家不得主張其中的任一國籍，並可視同無國籍的船舶。"},{"num":93,"title":"懸掛聯合國、其專門機構和國半際原子能機構旗幟的船舶","part":"第七部份  公海","section":"第一節  一般規定","content":"以上各條不影響用於為聯合國、其專門機構或國際原子能機構正式服務並懸掛聯合國旗幟的船舶的問題。"},{"num":94,"title":"船旗國的義務","part":"第七部份  公海","section":"第一節  一般規定","content":"一、每個國家應對懸掛該國旗幟的船舶有效地行使行政、技術及社會事項上的管轄和控制。\n二、每個國家特別應：\n(a)保持一本船舶登記冊，載列懸掛該國旗幟的船舶的名稱和詳細情況，但因體積過小而不在一般接受的國際規章定正範圍內的船舶除外；\n(b)根據其國內法，就有關每艘懸掛該國旗幟的船舶的行政、技術和社會事項，對該船及其船長、高級船員和船員行使管轄權。\n三、每個國家對懸掛該國旗幟的船舶，除其他外，應就下列各項採取為保證海上安全所必要的措施：\n(a)船舶的構造、裝備和適航條件；\n(b)船舶的人員配備、船員的勞動條件和訓練，同時考慮到適用的國際文件；\n(c)信號的使用、通信的維持和碰撞的防止。\n四、這種措施應包括為確保下列事項所必要的措施：\n(a)每艘船舶，在登記前及其後適當的間隔期間，受合格的船舶檢驗人的檢查，並在船上備有船舶安全航行所需要的海圖、航海出版物以及航行裝備和儀器；\n(b)每艘船舶都由具備適當資格，特別是具備航海術、航行、通信和海洋工程方面資格得船長和高級船員負責，而且船員的資格和人類與船舶種類、大小、機械和裝備都是相稱的；\n(c)船長、高級船員和在適當範圍內的船員，充分熟悉並須遵守關於海上生命安全，防止碰撞，防止、減少和控制海洋污染和維持無線電通信所適用的國際規章。\n五、每一國家採取第三和第四款要求的措施時，須遵守一般接受的國際規章、程序和慣例，並採取為保證這些規章、程序和慣例得到遵行所必要的任何步驟。\n六、一個國家如有明確理由相信對某一船舶未行使適當的管轄和管制，可將這項事實通知船旗國。船旗國接到通知後，應對這一事項進行調查，並於適當時採取任何必要行動，以補救這種情況。\n七、每一國家對於涉及懸掛該國旗幟的船舶在公海上因海難或航行事故對另一國國民造成死亡或嚴重傷害，或對另一國的船舶或設施、或海洋環境造成嚴重損害的每一事件，都應由適當的合格人士一人或數人或在有這種人士在場的情況下進行調查。對於該另一國就任何這種海難或航行事故進行的任何調查，船旗國應與該另一國合作。"},{"num":95,"title":"公海上軍艦的豁免權","part":"第七部份  公海","section":"第一節  一般規定","content":"軍艦在公海上有不受船旗國公以任何其他國家管轄的完全豁免權。"},{"num":96,"title":"專用於政府非商業性服務的船舶的豁免權","part":"第七部份  公海","section":"第一節  一般規定","content":"由一國所有或經營並專用於政府非商業性服務的船舶，在公海上應有不受船旗國以外任何其他國家管轄的完全豁免權。"},{"num":97,"title":"關於碰撞事項或任何其他航行事故的刑事管轄權","part":"第七部份  公海","section":"第一節  一般規定","content":"一、遇有船舶在公海上碰撞或任何其他航行事故涉及船長或任何其他為船舶服務的人員的刑事或紀律責任時，對此種人員的任何刑事訴訟或紀律程序，僅可向船旗國或此種人員所屬國的司法或行政當局提出。\n二、在紀律事項上，只有發給船長證書或駕駛資格證書或執照的國家，才有權在經過適當的法律程序後宣告撤銷該證書，即使證書持有人不是發給證書的國家的國民也不例外。\n三、船旗國當局以外的任何當局，即使作為一種調查措施，也不應命令逮捕或扣留船舶。"},{"num":98,"title":"救助的義務","part":"第七部份  公海","section":"第一節  一般規定","content":"一、每個國家應責成懸掛該國旗幟航行的船舶的船長，在不嚴重危及其船舶、船員或乘客的情況下：\n(a)救助在海上遇到的任何有生命危險的人；\n(b)如果得悉有遇難者需要救助的情形，在可以合理地期待其採取救助行動時，盡速前往拯救；\n(c)在碰撞後，對另一船舶，其船員和乘客給予救助，並在可能情況下，將自己船舶的名稱、船籍港和將停泊的最近港口通知另一船舶。\n二、每個沿海國應促進有關海上和上空安全的足敷應用和有效的搜尋和救助服務的建立、經營和維持，並應在情況需要時，為此目的通過相互的區域性安排與鄰國合作。"},{"num":99,"title":"販運奴隸的禁止","part":"第七部份  公海","section":"第一節  一般規定","content":"每個國家應採取有效措施，防止和懲罰准予懸掛該國旗幟的船舶販運奴隸，並防止為此目的而非法使用其旗幟。在任何船舶上避難的任何奴隸，不論該船懸掛何國旗幟均當然獲得自由。"},{"num":100,"title":"合作制止海盜行為的義務","part":"第七部份  公海","section":"第一節  一般規定","content":"所有國家應盡最大可能進行合作，以制止在公海上或在任何國家管轄範圍以外的任何其他地方的海盜行為。"},{"num":101,"title":"海盜行為的定義","part":"第七部份  公海","section":"第一節  一般規定","content":"下列行為中的任何行為構成海盜行為：\n(a) 私人船舶或私人飛機的船員、機組成員或乘客為私人目的，對下列對象所從事的任何非法的暴力或扣留行為，或任何掠奪行為：\n(1)在公海上對另一船舶或飛機，或對另一船舶或飛機上的人或財物；\n(2)在任何國家管轄範圍以外的地方對船舶、飛機，人或財物；\n(b) 明知船舶或飛機成為海盜船舶或飛機的事實，而自願參加其活動的任何行為；\n(c) 教唆或故意便利(a)或(b)項所述行為的任何行為"},{"num":102,"title":"軍艦、政府船舶或政府飛機由於其船員或機組成員發生叛變而從事的海盜行為","part":"第七部份  公海","section":"第一節  一般規定","content":"軍艦、政府船舶或政府飛機由於其船員或機組成員發生叛變並控制該船舶或飛機而從事第一百零一條所規定的海盜行為，視同私人船舶或飛機所從事的行為。"},{"num":103,"title":"海盜船舶或飛機的定義","part":"第七部份  公海","section":"第一節  一般規定","content":"如果處於主要控制地位的人員意圖利用船舶或飛機從事第一百零一條所指的各項行為之一，該船舶或飛機視為海盜船舶或飛機。如果該船舶或飛機曾被用以從事任何這種行為，在該船舶或飛機仍在犯有該行為的人員的控制之下時，上述規定同樣適用。"},{"num":104,"title":"海盜船舶或飛機國籍的保留或喪失","part":"第七部份  公海","section":"第一節  一般規定","content":"船舶或飛機雖已成為海盜船舶或飛機，仍可保有其國籍。國籍的保留或喪失由原來給予國籍的國家的法律予以決定。"},{"num":105,"title":"海盜船舶或飛機的扣押","part":"第七部份  公海","section":"第一節  一般規定","content":"在公海上，或在任何國家管轄範圍以外的任何其他地方，每個國家均可扣押海盜船舶或飛機或為海盜所奪取並在海盜控制下的船舶或飛機，和逮捕船上或機上人員並扣押船上或機上財物。扣押國的法院可判定應處的刑罰，並可決定對船舶、飛機或財產所應採取的行動，但受善意第三者的權利的限制。"},{"num":106,"title":"無足夠理由扣押的賠償責任","part":"第七部份  公海","section":"第一節  一般規定","content":"如果扣押涉有海盜行為嫌疑的船舶或飛機並無足夠的理由，扣押國應向船舶或飛機所屬的國家負擔因扣押而造成的任何損失或損害的賠償責任。"},{"num":107,"title":"由於發生海盜行為而有權進行扣押的船舶和飛機","part":"第七部份  公海","section":"第一節  一般規定","content":"由於發生海盜行為而進行的扣押，只可由軍艦，軍用飛機或其他有清楚標誌可以識別的為政府服務並經授權扣押的船舶或飛機實施。"},{"num":108,"title":"麻醉藥品或精神調理物質的非法販運","part":"第七部份  公海","section":"第一節  一般規定","content":"一、所有國家應進行點作，以制止船舶違反國際公約在海上從事非法販運麻醉藥品和精神調理物質。\n二、任何國家如有合理根據認為一艘懸掛其旗幟的船舶從事非法販運麻醉藥品或精神調理物質，可要求其他國家合作，制止這種販運。"},{"num":109,"title":"從公海從事未經許可的廣播","part":"第七部份  公海","section":"第一節  一般規定","content":"一、所有國家應進行合作，以制止從公海從事未經許可的廣播。\n二、為本公約的目的，「未經許可的廣播」是指船舶或設施違反國際規章在公海上播送旨在使公眾收聽或收看的無線電傳音或電視廣播，但遇難呼號的播送除外。\n三、對於從公海從事未經許可的廣播的任何人，均可向下列國家的法院起訴：\n(a)船旗國；\n(b)設施登記國；\n(c)廣播人所屬國；\n(d)可以收到這種廣播的任何國家或；\n(e)得到許可的無線電通信受到干擾的任何國家。\n四、在公海上按照第三款有管轄權的國家，可依照第一百一十條逮捕從事未經許可的廣播的任何人或船舶，並扣押廣播器材。"},{"num":110,"title":"登臨權","part":"第七部份  公海","section":"第一節  一般規定","content":"一、除條約授權的干涉行為外，軍艦在公海上遇到按照第九十五和第九十六條享有完全豁免權的船舶以外的外國船舶，非有合理根據認為有下列嫌疑，不得登臨該船：\n(a)該船從事海盜行為；\n(b)該船從事奴隸販賣；\n(c)該船從事未經許可的廣播而且軍艦的船旗國依據第一百零九條有管轄權；\n(d)該船沒有國籍或；\n(e)該船雖懸掛外國旗幟或拒不展示其旗幟，而事實上卻與該軍艦屬同一國籍。\n二、在第一款規定的情形下，軍艦可查核該船懸掛其旗幟的權利。為此目的，軍艦可派一艘由一名軍官指揮的小艇到該嫌疑船舶。如果檢驗船舶文件後仍有嫌疑，軍艦可進一步在該船上進行檢查，但檢查須盡量審慎進行。\n三、如果嫌疑經證明為無根據，而且被登臨的船舶並未從事嫌疑的任何行為，對該船舶可能遭受的任何損失或損害應予賠償。\n四、這些規定比照適用於軍用飛機。\n五、這些規定也適用於經正式授權並有清楚標誌可以識別的為政府服務的任何其他船舶或飛機。"},{"num":111,"title":"緊追權","part":"第七部份  公海","section":"第一節  一般規定","content":"一、沿海國主管當局有充分理由認為外國船舶違反該國法律和規章時，可對該外國船舶進行緊追。此項追逐須在外國船舶或其小艇之一在追逐國的內水、群島水域、領海或毗連區內時開始，而且只有追逐未曾中斷，才可在領海或毗連區外繼續進行。當外國船舶在領海或毗連區內接獲停駛命令時，發出命令的船舶並無必要也在領海或毗連區內。如果外國船舶是在第三十三條所規定的毗連區內，追逐只有在設立該區所保護的權利遭到侵犯的情形下才可進行。\n二、對於在專屬經濟區內或大陸架上，包括大陸架上設施周圍的安全地帶內，違反沿海國按照本公約適用於專屬經濟區或大陸架包括這種安全地帶的法律和規章的行為，應比照適用緊追權。\n三、緊追權在被追逐的船舶敕入其本國領海或第三國領海時立即終止。\n四、除非追逐的船舶以可用的實際方法認定被追逐的船舶或其小艇之一或作為一隊進行活動而以被追逐的船舶為母船的其他船艇是在領海範圍內，或者，根據情況，在毗連區或專屬經濟區內或在大陸架上，緊追不得認為已經開始。追逐只有在外國船舶視聽所及的距離內發出視覺或聽覺的停駛信號後，才可開始。\n五、緊追權只可由軍艦、軍用飛機或其他有清楚標誌可以識別的為政府服務並經授權緊追的船舶或飛機行使。\n六、在飛機進行緊追時：\n(a)應比照適用第一至第四款的規定；\n(b)發出停駛命令的飛機，除非其本身能逮捕該船舶，否則須其本身積極追逐船舶直至其所召換的沿海國船舶或另一飛機前來接替追逐為止。飛機僅發現船舶犯法或有犯法嫌疑，如果該飛機本身或接著無間斷地進行追逐的其他飛機或船舶既未命令該船停駛也未進行追逐，則不足以構成在領海以外逮捕的理由。\n七、在一國管轄範圍內被逮捕並被押解到該國港口以便主管當局審問的船舶，不得僅以其在航行中由於情況需要而曾被押解通過專屬經濟區的或公海的一部份理由而要求釋放。\n八、在無正當理由行使緊追權的情況下，在領海以外被命令停駛或被逮捕的船舶，對於可能因此遭受的任何損失或損害應獲賠償。"},{"num":112,"title":"鋪設海底電纜和管道的權利","part":"第七部份  公海","section":"第一節  一般規定","content":"一、所有國家均有權在大陸架以外的公海海底上鋪設海底電纜和管道。\n二、第七十九條第五款適用於這種電纜和管道。"},{"num":113,"title":"海底電纜或管道的破壞或損害","part":"第七部份  公海","section":"第一節  一般規定","content":"每個國家均應制定必要的法律和規章，規定懸掛該國旗幟的船舶或受其管轄的人故意或因重大疏忽而破壞或損害公海海底電纜，致使電報或電話通信停頓或受阻的行為，以及類似的破壞或損害海底管道或高壓電纜的行為，均為應予處罰的罪行。此項規定也應適用於故意或可能造成這種破壞或損害的行為。但對於僅為了保全自己的生命或船舶的正當目的而行事的人，在採取避免破壞或損害的一切必要預防措施後，仍然發生的任何破壞或損害，此項規定不應適用。"},{"num":114,"title":"海底電纜或管道的所有人對另一海底電纜或管道的破壞或損害","part":"第七部份  公海","section":"第一節  一般規定","content":"每個國家應制定必要的法律和規章，規定受其管轄的公海海底電纜或管道的所有人如果在鋪設或修理該項電纜或管道時使另一電纜或管道遭受破壞或損害，應負擔修理的費用"},{"num":115,"title":"因避免損害海底電纜或管道而遭受的損失的賠償","part":"第七部份  公海","section":"第一節  一般規定","content":"每個國家應制定必要的法律和規章，確何船舶所有人在其能證明因避免損害海底電纜或管道而犧牲錨、網或其他漁具時，應由電纜或管道所有人予以賠償，但須船舶所有人事先曾採取一切合理的預防措施。"},{"num":116,"title":"公海上捕魚的權利","part":"第七部份  公海","section":"第二節  公海生物資源的養護和管理","content":"所有國家均有權由其國民在公海上捕魚，但受下列限制：\n(a) 其條約義務；\n(b) 除其他外，第六十三條第二款和第六十四至第六十七條規定的沿海國的權利、義務和利益；和\n(c) 本節各項規定。"},{"num":117,"title":"各國為其國民採取養護公海生物資源措施的義務","part":"第七部份  公海","section":"第二節  公海生物資源的養護和管理","content":"所有國家均有義務為各該國國民採取，或與其他國家合作採取養護公海生物資源的必要措施。"},{"num":118,"title":"各國在養護和管理生物資源方面的合作","part":"第七部份  公海","section":"第二節  公海生物資源的養護和管理","content":"各國應互相合作以養護和管理公海區域內的生物資源。凡其國民開發相同生物資源，或在同一區域內開發不同生物資源的國家，應進行談判，以期採取養護有關生物資源的必要措施。為此目的，這些國家應在適當情形下進行合作，以設立分區域或區域漁業組織。"},{"num":119,"title":"公海生物資源的養護","part":"第七部份  公海","section":"第二節  公海生物資源的養護和管理","content":"一、在對公海生物資源決定可捕量和制訂其他養護措施時，各國應：\n(a)採取措施，其目的在於根據有關國家可  得到的最可靠的科學證據，並在包括發展中國家的特殊要求在內的各種機關環境和經濟因素的限制下，使捕撈的魚種的數量維持在或恢復到能夠生產最高持續產量的水平，並考慮到捕撈方式、種群的相互依存以及任何一般建議的國際最低標準，不論是分區域、區域或全球性的；\n(b)考慮到所捕撈魚種有關聯或依賴該魚種而生存的魚種所受的影響，以便使這種有關聯或依賴的魚種的數量維持在或恢復到其繁殖不會受嚴重脅的水平以上。\n二、在適當情形下，應通過各主管國際組織，不論是分區域、區域或全球性的，並在所有有關國家的參加下，經常提供和交換可獲得的科學情報、漁獲量和漁撈努力量統計，以及其他有關養護魚的種群的資料。\n三、有關國家應確保養護措施及其實施不在形式上或事實上對任何國家的漁民有所歧視。"},{"num":120,"title":"海洋哺乳動物","part":"第七部份  公海","section":"第二節  公海生物資源的養護和管理","content":"第六十五條也適用於養護和管理公海的海洋哺乳動物。"},{"num":121,"title":"島嶼制度","part":"第八部份  島嶼制度","section":"第二節  公海生物資源的養護和管理","content":"一、島嶼是四面環水並在高潮時高於水平面的自然形成的陸地區域。\n二、除第三款另有規定外，島嶼的領海、毗連區、專屬經濟區和大陸架應按照本公約適用於其他陸地領土的規定加以確定。\n三、不能維持人類居住或其本身的經濟生活的岩礁，不應有專屬經濟區或大陸架。"},{"num":122,"title":"定義","part":"第九部份  閉海或半閉海","section":"第二節  公海生物資源的養護和管理","content":"本公約的目的，「閉海或半閉海」是指兩個或兩個以上國家所環繞並由一個狹窄的出口連接到另一個海或洋，或全部或主要由兩個或兩個以上沿海國的領海和專屬經濟區構成的海灣、海盆或海域。"},{"num":123,"title":"閉海或半閉海沿岸國的合作","part":"第九部份  閉海或半閉海","section":"第二節  公海生物資源的養護和管理","content":"閉海或半閉海沿岸國在行使和履行本公約所規定的權利和義務時，應互\n相合作。為此目的，這些國家應盡力直接或通過適當區域組織：\n(a) 協調海洋生物資源的管理、養護、勘探和開發；\n(b) 協調行使和履行其在保護和保全海洋環境方面的權利和義務；\n(c) 協調其科學研究政策，並在適當情形下在該地區進行聯合的科學研究方案；\n(d) 在適當情形下，邀請其他有關國家或國際組織與其合作以推行本條的規定。"},{"num":124,"title":"用語","part":"第十部份  內陸國出入海洋的權利和過境自由","section":"第二節  公海生物資源的養護和管理","content":"一、為本公約的目的：\n(a)「內陸國」是指沒有海岸的國家；\n(b)「過境國」是指位於內陸國與海洋之間以及通過其領土進行過境運輸的國家，不論其是否具有海岸；( c)「過境運輸」是指人員、行李、貨物和運輸工具通過一個或幾個過境國領士的過境，而這種通過不論是否需要轉運、入倉、分卸或改變運輸方式，都不過是以內陸國領土為起點或終點的旅運全程的一部分；\n(d)「運輸工具」是指：\n(1)鐵路車輛、海洋、湖泊和河川船舶以及公路車輛；\n(2)在當地情況需要時，搬運工人和馱獸。\n二、內陸國和過境國可彼此協議，將管道和煤氣管和未列入第一款的運輸工具列為運輸工具。"},{"num":125,"title":"出入海洋的權利和過境自由","part":"第十部份  內陸國出入海洋的權利和過境自由","section":"第二節  公海生物資源的養護和管理","content":"一、為行使本公約所規定的各項權利，包括行使與公海自由和人類共同繼承財產有關的權利的目的，內陸國應有權出入海洋。為此目的，內陸國應享有利用一切運輸工具通過過境國領土的過境自由。\n二、行使過境自由的條件和方式應由內陸國和有關過境國通過雙邊、分區域或區域協定予以議定。\n三、過境國在對其領士行使完全主權時，應有權採取一切必要措施，以確保本部份為內陸國所規定的各項權利和便利絕不侵害其合法利益。"},{"num":126,"title":"最惠國條款的不適用","part":"第十部份  內陸國出入海洋的權利和過境自由","section":"第二節  公海生物資源的養護和管理","content":"本公約的規定，以及關於行使出入海洋權利的並因顧及內陸國的特殊地理位置而規定其權利和便利的特別協定，不適用最惠國條款。"},{"num":127,"title":"關稅、稅捐和其他費用","part":"第十部份  內陸國出入海洋的權利和過境自由","section":"第二節  公海生物資源的養護和管理","content":"一、過境運輸應無須繳納任何關稅、稅捐或其他費用，但為此類運輸提供特定服務而徵收的費用除外。\n二、對於過境運輸工具和其他為內陸國提供並由其使用的便利，不應徵收高於使用過境國運輸工具所繳納的稅捐或費用。"},{"num":128,"title":"自由區和其他海關便利","part":"第十部份  內陸國出入海洋的權利和過境自由","section":"第二節  公海生物資源的養護和管理","content":"為了過境運輸的便利，可由過境國和內陸國協議，在過境國的出口港和入口港內提供自由區或其他海關便利。"},{"num":129,"title":"合作建造和改進運輸工具","part":"第十部份  內陸國出入海洋的權利和過境自由","section":"第二節  公海生物資源的養護和管理","content":"如果過境國內無運輸工具以實現過境自由，或現有運輸工具包括海港設施和裝備在任何方面有所不足，過境國可與有關內陸國進行合作，以建造或改變這些工具。"},{"num":130,"title":"避免或消除過境運輸發生遲延或其他技術性困難的措施","part":"第十部份  內陸國出入海洋的權利和過境自由","section":"第二節  公海生物資源的養護和管理","content":"一、過境國應採取一切適當措施避免過境運輸發生遲延或其他技術性困難。\n二、如果發生這種遲延或困難，有關過境國和內陸國的主管當局應進行合作，迅速予以消除。"},{"num":131,"title":"海港內的同等待遇","part":"第十部份  內陸國出入海洋的權利和過境自由","section":"第二節  公海生物資源的養護和管理","content":"懸掛內陸國旗幟的船舶在海港內應享有其他外國船舶所享有的同等待遇。"},{"num":132,"title":"更大的過境便利的給予","part":"第十部份  內陸國出入海洋的權利和過境自由","section":"第二節  公海生物資源的養護和管理","content":"本公約締約國間所議定的或本公約一個締約國給予的大於本公約所規定的過境便利，絕不因本公約而撤消。本公約也不排除將來給予這種更大的便利。"},{"num":133,"title":"用語","part":"第十一部份  「區域」","section":"第一節  一般規定","content":"為本部份的目的：\n(a) 「資源」是指「區域」內在海床及其下原來位置的一切固體、液體或氣體礦物資源，其中包括多金屬結核；\n(b) 從「區域」回收的資源稱為「礦物」。"},{"num":134,"title":"本部份的範圍","part":"第十一部份  「區域」","section":"第一節  一般規定","content":"一、本部份適用於「區域」。\n二、「區域」內活動應受本部份規定的支配。\n三、關於將標明第一條第一款第(１)項所指範圍界限的海圖與地理座標表交存和予以公布的規定，載於第六部份。\n四、本條的任何規定不影響根據第六部份大陸架外部界限的劃定或關於劃定海岸相向或相鄰國家間界限的協定的效力。"},{"num":135,"title":"上覆水域和上空的法律地位","part":"第十一部份  「區域」","section":"第一節  一般規定","content":"本部份或依其授予或行使的任何權利，不應影響「區域」上覆水域的法律地位，或這種水域上空的法律地位。"},{"num":136,"title":"人類的共同繼承財產","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"「區域」及其資源是人類的共同繼承財產。"},{"num":137,"title":"「區域」及其資源的法律地位","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"一、任何國家不應對「區域」的任何部份或其資源主張或行使主權或主權權利，任何國家或自然人或法人，也不應將「區域」或其資源的任何部分據為己有。任何這種主權和主權權利的主張或行使，或這種據為己有的行為，均應不予承認。\n二、對「區域」內資源的一切權利屬於全人類，由管理局代表全人類行使，這種資源不得讓渡。但從「區域」內回收的礦物，只可按照本部份和管理局的規則、規章和程序予以讓渡。\n三、任何國家或自然人或法人，除按照本部份外，不應對「區域」礦物主張取得或行使權利。否則，對於任何這種權利的主張，取得或行使，應不予承認。"},{"num":138,"title":"國家對於「區域」的一般行為","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"各國對於「區域」的一般行為，應按照本部份的規定、「聯合國憲章」所載原則，以及其他國際法規則，以利維持和平與安全，促進國際合作和相互了解。"},{"num":139,"title":"確保遵守本公約的義務和損害賠償責任","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"一、締約國應有責任確保「區域」內活動，不論是由締約國、國管企業、或具有締約國國籍的自然人或法人所從事者，一律依照本部份進行。國際組織對於該組織所進行的「區域」內活動也應有同樣義務。\n二、在不妨害國際法規則和附件三第二十二條的情形下，締約國或國際組織應對由於其沒有履行本部份規定的義務而造成的損害負有賠償責任；共同進行活動的締約國或國際組織應承擔連帶賠償責任。但如締約國已依據第一百五十三條第四款和附件三第四條第四款採取一切必要和適當措施，以確保其根據第一百五十三條第二款(b) 項擔保的一切實遵守規定，則該締約國對於因這種人沒有遵守本部份規定而造成的損害，應無賠償責任。\n三、為國際組織成員的締約國應採取適當措施確保本條對這種組織的實施。"},{"num":140,"title":"全人類的利益","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"一、「區域」內活動應依本部份的明確規定為全人類的利益而進行，不論各國的地理位置如何，也不論是沿海國或內陸國，並特別考慮到發展中國家和尚未取得完全獨立或聯合國按照其大會第1514(xv)號決議和其他有關大會決議所承認的其他自治地位的人民的利益和需要。\n二、管理局應按照第一百六十條第二款(f)項(1)目作出規定，通過任何適當的機構，在無歧視的基礎上公平分配從「區域」內活動取得的財政及其他經濟利益。"},{"num":141,"title":"專為和平目的利用「區域」","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"「區域」應發放給所有國家，不論是沿海國或內陸國，專為和平目的利用，不加歧視，也不得妨害本部份其他規定。"},{"num":142,"title":"沿海國的權利和合法利益","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"一、「區域」內活動涉及跨越國家管轄權範圍的「區域」內資源礦床時，應適當顧及這種礦床跨越其管轄範圍的任何沿海國的權利和合法利益。\n二、應與有關國家保持協商，包括維持一種事前通知的辦法在內，以免侵犯上述權利和利益。如「區域」內活動可能導致對國家管轄範圍內資源的開發，則需事先徵得有關沿海國的同意。\n三、本部份或依其授予或行使的任何權利，應均不影響沿海國為防止、減輕或消除因任何「區域」內活動引起或造成的污染威脅或其他危險事故使其海岸或有關利益受到的嚴重迫切危險而採取與第十二部份有關規定相符的必要措施的權利。"},{"num":143,"title":"海洋科學研究","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"一、「區域」內的海洋科學研究，應按照第十三部份專為和平目的並為謀全人類的利益進行。\n二、管理局可進行有關「區域」及其資源的海洋科學研究，並可為此目的訂立合同。管理局應促進和鼓勵在「區域」內進行海洋科學研究，並應協調和傳播所得到的這種研究和分析的結果。\n三、各締約國可在「區域」內進行海洋科學研究。各締約國應以下列方式促進「區域」內進行海洋科學研究。各締約國應以下列方式促進「區域」內海洋科學研究方面的國際合作。\n(a)參加國際方案，並鼓勵不同國家的人員和管理局人員合作進行海洋科學研究；\n(b)確保在適當情形下通過管理局或其他國際組織，為了發展中國家和技術較不發達國家的利益發展各種方案，以期：\n(1)加強它們的研究能力；\n(2)在研究的技術和應用方面訓練它們的人員和管理局的人員；\n(3)促進聘用它們的合格人員，從事「區域」內的研究；\n(c)通過管理局，或適當時通過其他國際途徑，切實傳播所得到的研究和分析結果。"},{"num":144,"title":"技術的轉讓","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"一、管理局應按照本公約採取措施，以：\n(a)取得有關「區域」內活動的技術和科學知識；並\n(b)促進和鼓勵向發展中國家轉讓這種技術和科學知識，使所有締約國都從其中得到利益。\n二、為此目的，管理局和各締約國應互相合作，以促進有關「區域」內活動的技術和科學知識的轉讓，使企業部和所有締約國都從其中得到利益。它們應特別倡議並推動：\n(a)將有關「區域」內活動的技術轉讓給企業部和發展中國家的各種方案，除其他外，包括便利企業部和發展中國家根據公平合理的條款和條件取得有關的技術；\n(b)促進企業部技術和發展中國家本國技術的進展的各種措施，特別是使企業部和發展中國家的人員有機會接受海洋科學和技術的訓練和充分參加「區域」內活動。"},{"num":145,"title":"海洋環境的保護","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"應按照本公約對「區域」內活動採取必要措施，以確保切實保護海洋環\n境，不受這種活動可能產生的有害影響。為此目的，管理局應制定適當\n的規則、規章和程序，以便除其他外：\n(a) 防止、減少和控制對包括海岸在內的海洋環境的污染和其他危害，並防止干擾海洋環境的生態平衡，特別注意使其不受諸如鈷探、挖泥、挖鑿、廢物處置等活動，以及建造和操作或維修與這種活動有關的設施、管道和其他裝置所產生的有害影響；\n(b) 保護和養護「區域」的自然資源，並防止下海洋環境中動植物的損害。"},{"num":146,"title":"人命的保護","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"關於「區域」內活動，應採取必要措施，以確保切實保護人命。為此目的，管理局應制定適當的規則、規章和程序，以補充有關條約歐體現的現行國際法。"},{"num":147,"title":"「區域」內活動與海洋環境中的活動的相互適應","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"一、「區域」內活動的進行，應合理地顧及海洋環境中的其他活動。\n二、進行「區域」內活動所使用的設施應受下列條件的限制：\n(a)這種設施應僅按照本部份和在管理局的規則、規章和程序的限制下安裝、安置和拆除。這種設施的安裝、安置和拆除必須妥為通知，並對其存在必須維持永久性的警告方法；\n(b)這種設施不得設在對使用國際航行必經的公認海道可能有干擾的地方，或設在有密集捕撈活動的區域；\n(c)這種設施的周圍應設立安全地帶並加適當的標記，以確保航行和設施的安全。這種安全地帶的形狀和位置不得構成一個地帶阻礙船舶合法出入特定海洋區域或阻礙沿國際海道的航行；\n(d)這種設施應專用於和平目的；\n(e)這種設施不具有島嶼地位。它們沒有自己的領海，其存在也不影響領海、專屬經濟區或大陸架界限的劃定。\n三、在海洋環境中進行的其他活動，應合理地顧及「區域」內活動。"},{"num":148,"title":"發展中國家對「區域」內活動的參加","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"應按照本部分的具體規定促進發展中國家有效參加「區域」內活動，並適當顧及其特殊利益和需要，尤其是其中的內陸國和地理不利國在克服因不利位置，包括距離「區域」遙遠和出入「區域」困難而產生的障礙方面的特殊需要。"},{"num":149,"title":"考古和歷史文物","part":"第十一部份  「區域」","section":"第二節  支配「區域」的原則","content":"在「區域」內發現的一切考古和歷史文物，應為全人類的利益予以保存或處置，但應特別顧及來源國，或文化上的發源國，或歷史和考古上的來源國的優先權利。"},{"num":150,"title":"關於「區域」內活動的政策","part":"第十一部份  「區域」","section":"第三節  「區域」內資源的開發","content":"「區域」內活動應按照本部份的明確規定進行，以求有助於世界經濟的\n健全發展和國際貿易的均衡增長，並促進國際合作，以謀所有國家特別\n是發展中國家的全面發展，並且為了確保：\n(a) 「區域」資源的開發；\n(b) 對「區域」資源進行有秩序、安全和合理的管理，包括有效地進行「區域」內活動，並按照健全的養護原則，避免不必要的浪費；\n(c) 擴大參加這種活動的機會，以符合特別是第一百四十四和第一百四十八條的規定；\n(d) 按照本公約的規定使管理局分享收益，以及對企業部和發展中國家作技術轉讓；\n(e) 按照需要增加從「區域」取得的礦物的供應量，連同從其他來源取得的礦物，以保證這類礦物的消費者獲得供應；\n(f) 促進從「區域」和從其他來源取得的礦物的價格合理而又穩定，對生產者有利，對消費者也公平，並促進供求的長期平衡；\n(g) 增進所有締約國，不論其經濟社會制度或地理位置如何，參加開發「區域」內資源的機會，並防止壟斷「區域」內活動；\n(h) 按照第一百五十一條的規定，保護發展中國家，使它們的經濟或出口收益不致因某一受影響礦物的價格或該礦物的出口量降低，而遭受不良影響，但以這種降低是由於「區域」內活動造成的為限；\n(i) 為全人類的利益開發共同繼承財產；\n(j) 從「區域」取得的礦物作為輸入品以及這種礦物所產商品作為輸入品的進入市場的條件，不應比適用於其他來源輸入品的最優惠待遇更為優惠。"},{"num":151,"title":"生產效果","part":"第十一部份  「區域」","section":"第三節  「區域」內資源的開發","content":"一、\n(a)在不妨害等一百五十條所載目標的情形下，並為實施該條（ｈ）項的目的，管理局應通過現有議事機構，或在適當時，通過包括生產者和消費者在內的有關各方都參加的新安排或協議，採取必要措施，以對生產者有利對消費者也公平的價格，促進「區域」資源所產商品的市場的增長、效率和穩定，所有締約國都應為此目的進行合作。\n(b)管理局應有權參加生產者和消費者在內的有關各方都參加的關於上述商品的任何商品會議。管理局應有權參與上述會議產生的任何安排或協議。管理局參加根據這種安排或協議成立的任何機關，應與「區域」內的生產有關，並符合這種機關的有關規則。\n(c)管理局應履行根據這種安排或協議所產生的義務，以求保證對「區域」內有關礦物的一切生產，均劃一和無歧視地實施。管理局在這樣作的時候，應以符合現有合同條款和已核准的企業部工作計劃的方式行事。\n二、\n(a)在第三款指明的過渡期間內，經營者在向管理局提出申請並經發給生產許可以前，不應依據一項核准的工作計劃進行商業生產。這種生產許可不得在根據工作計劃預定開始商業生產前逾五年時申請或發出，除非管理局考慮到方案進展的性質和時機在其規則和規章中為此規定了另一期間。\n(b)在生產許可的申請中，經營者應具體說明按照核准的工作計劃預期每年回收的鎳的數量。申請中應列有經營者為使其預定的日期如期開始商業生產而合理地算出的在收到許可以後將予支出的費用表。\n(c)為了(a) 和(b) 項的目的，管理局應按照附件三第十七條規定適當的成績要求。\n(d)管理局應照申請的生產量發給生產許可，除非在過渡期間內計劃生產的任何一年中，該生產量和已核准的生產量的總和超過在發給許可的年度依照第四款算出的鎳生產最高限額。\n(e)生產許可和核准的申請一經發給，即成為核准的工作計劃的一部份。\n(f)如果經營者申請生產許可依據（ｄ）項被拒絕則該經營者可隨時向管理局再次提出申請。\n三、過渡期間應自根據核准的工作計劃預定開始最早的商業生產的那一年一月一日以前的五年開始。如果最早進行商業生產的時間延遲到原定的年度以後，過渡期間的開始和原來計算的生產最高限額都應作相應的調整。過渡期間應為二十五年，或至第一百五十五條所指的審查會議結束，或至第一款所指的新安排或協議開始生效之日為止，以最早者為準。如果這種安排或協議因任何理由而終止或失效，在這過渡期間所餘時間內，管理局應重新行使本條規定的權力。\n四、\n(a)過渡期間內任何一年的生產最高限額應為以下的總和：\n(1) 依據(b) 項計算的鎳年消費量趨勢線上最早的商業生產年度以前那一年和過渡期間開始前那一年數值的差額加上。\n(2) 依據(b) 項計算的鎳消費量趨勢線上所申請的生產許可證適用的那一年和最早的商業生產年度以前那一年數值的差額的百分之六十。\n(b)為了(a) 項的目的：\n(1) 計算鎳最高生產限額所用的趨勢線數值，應為發給生產許可的年度中計算的趨勢線上的鎳年消費量數值。趨勢線應從能夠取得數據的最近十五年期間的實際鎳消費量，取其對數值，以時間為自變量，用線性回歸法導出。這一趨勢線應稱為原趨勢線。\n(2) 如果原趨勢線年增長率少百分之三，則用來確定(a) 項所指數量的趨勢線應為穿過原趨勢線上該十五年期間第一年的數值而年增長率為百分之三的趨勢線；但過渡期間內任何一年規定的生產最高限額無論如何不得超出該年原趨勢線數值同過渡期間開始前一年的原趨勢線數值之差。\n五、管理局應在依據第四款計算得來的生產最高限額中，保留給企業部為婺38,000公噸的鎳，以供其從事最初生產。\n六、\n(a)經營者在任何一年內可生產少於其生產許可內所指明的從多金屬結核生產的礦物的年產數量，或最多較此數量高百分之八，但其總產量應不超出許可內所指明的數量。任何一年內在百分之八以上百分之二十公下的超產，或連續兩年超產後的第一年以及隨後各年的超產，應同管理局進行協商；管理局可要求經營者就增加的產量取得一項補充的生產許可。\n(b)管理局對於這種補充生產許可的申請，只有在處理了尚未獲得生產許可的經營者自所已出的一切申請，並已適當考慮到其他可能的申請之後，才應加以審議。管理局應以不超過過渡期間任何一年內生產最高限額所容許的總生產量為指導原則。它不應核准在任何工作計劃下超過46,500公噸的鎳年產量。\n七、依據一項生產許可從回收的多金屬結核所提煉的銅、鈷和錳等其他金屬的產量，不應高於經營者依據本條規定從這些結核生產最高產量的鎳時所能生產的數量。管理局應依據附件三第十七條制定規則、規章和程序以實施本項規定。\n八、根據有關的多邊貿易協定關於不公平經濟措施的權利和義務，應適用於「區域」所產礦物的勘探和開發。在解決因本項規定而產生的爭端時，作為這種多邊貿易協定各方的締約國應可利用這種協定的解決爭端程序。\n九、管理局應有權按照第一百六十一條第八款制定規章，在適當的條件下，使用適當的方法限制「區域」所產而非產自多金屬結核的礦物的產量。\n十、大會應依理事會根據經濟規劃委員的意見提出的建議，建立一種補償制度，或其他經濟調整援助措施，包括同各專門機構和其他國際組織進行合作，以協助其出口收益或經濟因某一受影響礦物的價格或該礦物的出口量降低而遭受嚴重不良影響的發展中國家，但以此種降低是由於「區域」內活動造成的為限。管理局經請求應許可能受到最嚴重影響的國家的問題發動研究，以期盡量減輕它們的困難，並協助它們從事經濟調整。"},{"num":152,"title":"管理局權力和職務的行使","part":"第十一部份  「區域」","section":"第三節  「區域」內資源的開發","content":"一、管理局在行使其權力和職務，包括給予進行「區域」內活動的機會時，應避免歧視。\n二、但本部份具體規定的為發展中國家所作的特別考慮，包括為其中的內陸國和地理不利國所作的特別考慮應予准許。"},{"num":153,"title":"勘探和開發制度","part":"第十一部份  「區域」","section":"第三節  「區域」內資源的開發","content":"一、「區域」內活動應由管理局代表全人類，按照本條以及本部份和有關附件的其他有關規定，和管理局的規則、規章和程序，予以安排、進行和控制。\n二、「區域」內活動應依第三款的規定：\n(a)由企業部進行，和\n(b)由締約國或國營企業、或在締約國擔保下的具有締約國國籍或由這類國家或其國民有效控制的自然人或法人、或符合本部份和附件三規定的條件的上述的各方的任何組合與管理局以協作方式進行。\n三、「區域」內活動應按照一項依據附件三所擬定並經理事會於法律和技術委員會審議後核准的正式書面工作計劃進行。在第二款(b) 項所述實體按照管理局的許可進行「區域」內活動的情形下，這種工作計劃應按照附件三第三條採取合同的形式。這種合同可按照附件三第十一條作出聯合安排。\n四、管理局為確保本部份和與其有關的附件的有關規定，和管理局的規則、規章和程序以及按照第三款核准的工作計劃得到遵守的目的，應對「區域」內活動行使必要的控制。締約國應按照第一三九條採取一切必要措施，協助管理局確保這些規定得到遵守。\n五、管理局應有權隨時採取本部份所規定的任何措施，以確保本部份條款得到遵守和根據本部份或任何合同所指定給它的控制和管理職務的執行。管理局應有權檢查與「區域」內活動有關而在「區域」內使用的一切設施。\n六、第三款所述的合同應規定期限內持續有效的保證。因此，除非按照附件三第第十八條和第十九條的規定，不得修改，暫停或終止合同。"},{"num":154,"title":"定期審查","part":"第十一部份  「區域」","section":"第三節  「區域」內資源的開發","content":"從本公約生效時起大會每五年應對本公約設立的「區域」的國際制度的實際實施情況，進行一次全面和系統的審查。參照上述審查，大會可按照本部份和與其有關的附件的規定和程序採取措施，或建議其他機構採取措施，以導致對制度實施情況的改進。"},{"num":155,"title":"審查會議","part":"第十一部份  「區域」","section":"第三節  「區域」內資源的開發","content":"一、自根據一項核准的工作最早的商業生產開始進行的那一年一月一日起十五年後大會應召開一次會議，審查本部份和有關附件支配勘探和開發「區域」資源制度的各項規定。審查會議應參照這段時期取得的經驗，詳細審查：\n(a)本部份和有關附件支配勘探和開發「區域」資源制度的各項規定，是否已達成其各方面的目標，包括是否已使全人類得到利益；\n(b)在十五年期間，同非保留區域相比，保留區域是否以有效而平衡的方式開發；\n(c)開發和使用「區域」及其資源的方式，是否有助於世界經濟的健全發展和國際貿易均衡增長；\n(d)是否防止了對「區域」內活動的壟斷；\n(e)第一百五十和第一百五十一條所載各項政策是否得到實行和；\n(f)制度是否使「區域」內活動產生的利益得到公平的分享，特別考慮到發展中國家的利益和需要。\n二、審查會議應確保繼續維持人類共同繼承財產的原則，為確保公平開發「區域」資使所有國家尤其是發展中國家都得到利益而制定的國際制度，以及安排、進行和控制「區域」內活動的管理局。會議還應確保繼續維持本部份規定的關於下列各方面的各項原則：排除對「區域」的任何部份主張或行使主權，各國依照本公約參與勘探和開發「區域」資源，防止對「區域」內活動的壟斷，專為和平目的利用「區域」，「區域」內活動的經濟方面，海洋科學研究，技術轉讓，保護海洋環境，保護人命，沿海國的權利，「區域」的上覆水域及其上空的法律地位，以及關於「區域」內活動的海洋環境中其他活動之間的相互適應。\n三、審查會議適用的作出決定的程序應與第三聯合國海洋法所適用的程序相同。會議應作出各種努力就任何修正案以協商一致方式達成協議，且除非已盡最大努力以求達成協商一致，不應就這種事項進行表決。\n四、審查會議開始舉行五年後，如果未能就關於勘探和開發「區域」資源的制度達成協議，則會議可在此後的十二個月以內，以締約國的四分之三多數作出決定，就改變或修改制度制定其認為必要和適當的修正案，提交各締約國批准或加入。此種修正案應於四分之三締約國交存批准書或加入書後十二個月對所有締約國生效。\n五、審查會議依據本條通過的修正案應不影響按照現有合同取得的權利。\nＡ分節  一般規定"},{"num":156,"title":"設立管理局","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、茲設立國際海底管理局，按照本部份執行職務。\n二、所有締約國都是管理局的當然成員。\n三、已簽署最後文件但在第三百零五條第一款(c) 、(d) 、(e) 或 (f)項中未予提及的第三次聯合國海洋法會議中的觀察員，應有權按照管理局的規則、規章和程序以觀察員資格參加管理局。\n四、管理局的所在地應在牙買加。\n五、管理局可設立其認為在執行職務上必要的區域中心或辦事處。"},{"num":157,"title":"管理局的性質和基本原則","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、管理局是締約國按照本部分組織和控制「區域」內活動，特別是管理「區域」資源的組織。\n二、管理局應具有本公約明示授予的權力和職務。管理局應有為行使關於「區域」內活動的權力和職務包含的和必要的並符合本公約的各項附帶權力。\n三、管理局以所有成員主權平等的原則為基礎。\n四、管理局所有成員應誠意履行按照本部份承擔的義務，以確保其全體作為成員享有的權利和利益。"},{"num":158,"title":"管理局的機關","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、茲設立大會、理事會和秘書處作為管理局的主要機關。\n二、茲設立企業部、管理局應通過這個機關執行第一百七十條第一款所指的職務。\n三、經認為必要的附屬機關可按照本部份設立。\n四、管理局各主要機關和企業部應負責行使對其授予的權力和職務。每一機關行使這種權力和職務時，應避免採取可能對授予另一機關的特定權力和職務的行使有所減損或阻礙的任何行動。\nＢ分節  大會"},{"num":159,"title":"組成、程序和表決","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、大會應由管理局的全體成員組成。每一成員應有一名代表出席大會，並可由副代表及顧問隨同出席。\n二、大會應召開年度常會，經大會決定，或由秘書長應理事會的要求或管理局過半數成員的要求，可召開特別會議。\n三、除非大會另有決定，各屆會議應在管理局的所在地舉行。\n四、大會應制定其議事規則。大會應在每屆常會開始時選出其主席和其他必要的高級職員。他們的任期至下屆常會選出新主席及其他高級職員為止。\n五、大會過半數成員構成法定人數。\n六、大會每一成員應有一票表決權。\n七、關於程序問題的決定，包括召開大會特別會議的決定，應由出席並參加表決的成員過半數作出。\n八、關於實質問題的決定，應以出席並參加表決的成員三分之二多數作出。但這種多數應包括參加該會議的過半數成員。對某一問題是否為實質問題發生爭論時，該問題應作為實質問題處理，除非大會以關於實質問題的決定所需的多數另作決定。\n九、將一個實質問題第一次付諸表決時，主席可將就該問題進行表決的問題推遲一段時間，如經大會至少五分之一成員提出要求，則應將表決推遲，但推遲時間不得超過五曆日。此項規則對任一問題只可適用一次，並且不應用來將問題推遲至會議結束以後。\n十、對於大會審議中關於任何事項的提案是否符合本公約的問題，在管理局至少四分之一成員以書面要求主席徵求諮詢意見時，大會應請國際海洋法法庭海底爭端分庭就該提案提出諮詢意見，並應在收到分庭的諮詢意見前，推遲對該提案的表決。如果在提出要求的那期會議最後一個星期以前還沒有收到諮詢意見，大會應決定何時開會對已推遲的提案進行表決。"},{"num":160,"title":"權力和職務","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、大會作為管理局唯一由其所有成員組成的機關，應視為管理局的最高機關，其他各主要機關均應按照本公約的具體規定向大會負責。大會應有權依照本公約各項有關規定，就管理局權限範圍內的任何問題或事項制訂一般性政策。\n二、此外，大會的權力和職務應為：\n(a)按照第一百六十一條的規定，選舉理事會成員；\n(b)從理事會提出的候選人中，選舉秘書長；\n(c)根據理事會的推薦，選舉企業部董事會董事和企業部總幹事；\n(d)設立為按照本部份執行其職務認為有必要的附屬機關。這種機關的組成，應適當考慮到公平地區分配原則和特別利益，以及其成員必須對這種機關所處理的有關技術問題具備資格和才能；\n(e)在管理局未能從其他來源得到足夠收入應付其行政開支以前，按照以聯合國經常預算所用比額表為基礎認定的會費分攤比額表，決定各成員國對管理局的行政預算應繳的會費；\n(f)\n(1) 根據理事會的建議，審議和核准關於公平分享從「區域」內活動取得的財政及其他經濟利益和依據第八十二條所繳的費用和實物的規則、規章和程序，特別考慮到發展中國家和尚未取得完全獨立或其他自治地位的人民的利益和需要。如果大會對理事會的建議不予核准，大會應將這些建議送回理事會，以便參照大會表示的意見重新加以審議；\n(2) 審議和核准理事會依據第一百六十二條第二款(0) 項(2) 目暫時制定的管理局的規則、規章和程序及其修正案。這些規則、規章和程序應涉及「區域」內的探礦、勘探和開發，管理局的財務管理和內部行政以及根據企業部董事會的建議由企業部向管理局轉移資金；\n(g)在符合本公約規定和管理局規則、規章和程序的情形下，決定公平分配從「區域」內活動取得的財政和其他經濟利益 ;\n(h)審議和核准理事會提出的管理局的年度概算；\n(i)審查管理局和企業部的定期報告以及要求理事會或管理局任何其他機關提出的特別報告；\n(j)為促進有關「區域」內活動的國際合作和鼓勵與此有關的國際法的逐漸發展及其編纂的目的，發動研究和提出建議；\n(k)審議關於「區域」內活動的一般性問題，特別是對發展中國家產生的問題，以及關於「區域」內活動對某些國家，特別是內陸國和地理不利國，因其地理位置而造成的那些問題；\n(l)經理事會按照經濟規劃委員會的意見提出建議，依第一百五十一條第十款的規定，建立補償制度或採取其他經濟調整援助措施；\n(m)依據第一百八十五條暫停成員的權利和特權的行使；\n(n)討論管理局權限範圍內的任何問題或事項，並在符合管理局各個機關權力和職務的分配的情形下，決定由管理局那一機關來處理本公約條款未規定由其某一機關處理的任何這種問題或事項。\nＣ分節  理事會"},{"num":161,"title":"組成、程序和表決","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、理事會應由大會按照下列次序選出的三十六個管理局成員組成：\n(a)四個成員來自在有統計資料的最近五年中，對於可從「區域」取得的各類礦物所產的商品，其消費量超過世界總消費量百分之二，或其淨進口量超過世界總進口量百分之二的那些締約國，無論如何應有一個國家屬於東歐（社會主義）區域，和最大的消費國；\n(b)四個成員來自直接地或通過其國民對「區域」內活動的準備和進行作出了最大投資的八個締約國，其中至少應有一個國家屬於東歐（社會主義）區域；\n(c)四個成員來自締約國中因在其管轄區域內的生產而為可從「區域」取得的各類礦物的主要淨出口國，其中至少應有兩個是出口這種礦物對其經濟有重大關係的發展中國家；\n(d)六個成員來自發展中國家締約國，代表特別利益。所代表的特別利益應包括人口眾多的國家、內陸國或地理不利國、可從「區域」取得的各類礦物的主要進口國、這些礦物的潛在的生產國以及最不發達國家的利益；\n(e)十八個成員按照確保理事會的席位作為一個整體予以公平地區分配的原則選出，但每一地理區域至少應有根據本項規定選出的一名成員。為此目的，地理區域應為非洲、亞洲、東歐（社會主義）、拉丁美洲和西歐及其他國家。\n二、按照第一款選舉理事會成員時，大會應確保：\n(a)內陸國和地理不利國有和它們在大會內的代表權成合理比例的代表；\n(b)不具備第一款(a)、(b)、(c) 或(d) 項所列條件的沿海國，特別是發展中國家有和它們在大會內的代表權成合理比例的代表；\n(c)在理事會內應有代表的每一個締約國集團，其代表應由該集團提名的任何成員擔任。\n三、選舉應在大會的常會上舉行。理事會每一成員任期四年。但在第一次選舉時，第一款所指每一集團的一半成員的任期應為兩年。\n四、理事會成員連選可連任；但應妥為顧及理事會成員輸流的相宜性。\n五、理事會應在管理局所在地執行職務，並應視管理局業務需要隨時召開會議，但每年不得少於三次。\n六、理事會過半數成員構成法定人數。\n七、理事會每一成員應有一票表決權。\n八、\n(a)關於程序問題的決定應以出席並參加表決的過半數成員作出。\n(b)關於在下列條款下產生的實質問題的決定，應以出席並參加表決的成員的三分之二多數作出，但這種多數應包括理事會的過半數成員；第一百六十二條第二款(f) 項，(g) 項，(h) 項，(i)項，(n)項，(p) 項和(v) 項；第一百九十一條。\n(c)關於在下列條款下產生的實質問題的決定，應以出席並參加表決的成員的四分之三多數作出，但這種多數應包括理事會的過半數成員：第一百六十二條第一款；第一百六十二條第二款(a) 項；(b) 項；(c) 項；(d) 項；(e) 項；(l) 項；(q) 項；(r) 項；(s) 項；\n(t) 項；在承包者或擔保者不遵守規定的情形下(u) 項；(w) 項，\n但根據本項發布的命令的有效期間不得超過三十天，除非以按照(d\n) 項作出的決定加以確認；(x)項；(y)項；(z) 項；第一百六十三\n條第二款；第一百七十四條第三款；附件四第十一條。\n(d)關於在下列條款下產生的實質問題的決定應以協商一致方式作出：第一百六十二條第二款(m) 項和(o) 項；對第十一部份的修正案的通過。\n(e)為了(d) 項、(f) 項和(g) 項的目的，「協商一致」是指沒有任何正式的反對意見。在一項提案向理事會提出後十四天內，理事會主席應確定對該提案的通過是否會有正式的反對意見。如果主席確定會有這種反對意見，則主席應於作出這種確定後三天內成立並召集一個其成員不超過九人的調解委員會，由他本人擔任主席，以調解分歧並提出能夠以協商一致方式通過的提案。委員會應迅速進行工作，並於十四天內向理事會提出報告。如果委員會無法提出能以協商一致方式通過的提案，它應於其報告中說明反對該提案所根據的理由。\n(f)就以上未予列出的問題，經理事會獲得管理局規則、規章和程序或其他規定授權作出的決定，應依據規則、規章和程序所指明的本款各項予以作出，如果其中未予指明，則依據理事會以協商一致方式於可能時提前確定的一項予以作出。\n(g)遇有某一問題究應屬於(a) 項、(b) 項、(c) 項或(d) 項的問題，應根據情況將該問題作為在需要較大或最大多數或協商一致的那一項內的問題加以處理，除非理事會以上述多數或協商一致另有決定。\n九、理事會應制訂一項程序，使在理事會內未有代表的管理局成員可在該成員提出要求時或在審議與該成員特別有關的事項時，派出代表參加其會議，這種代表應有權參加討論，但無表決權。"},{"num":162,"title":"權力和職務","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、理事會為管理局的執行機關。理事會應有權依本公約和大會所制訂的一般政策，制訂管理局對於其權限範圍以內的任何問題或事項所應遵循的具體政策。\n二、此外，理事會應：\n(a)就管理局職權範圍內所有問題和事項監督和協調本部分規定的實施，並提請大會注意不遵守規定的情事；\n(b)向大會提出選舉秘書長的候選人名單；\n(c)向大會推薦企業部董事會的董事和企業部總幹事的候選人；\n(d)在適當時，並在妥為顧及節約和效率的情形下，設立其認為按照本部份執行其職務所必要的附屬機關。附屬機關的組成，應注重其成員必須對這種機關所處理的有關技術問題具備資格和才能，但應妥為顧及公平地區分配原則和特別利益；\n(e)制定理事會議事規則，包括推選其主席的方法；\n(f)代表管理局在其職權範圍內同聯合國或其他國際組織締結協定，但須經大會核准；\n(g)審查企業部的報告，並將其轉交大會，同時提交其建議；\n(h)向大會提出年度報告和大會要求的特別報告；\n(i)按照第一百七十條向企業部發出指示；\n(j)按照附件三第六條核准工作計劃。理事會應於法律和技術委員會提出每一工作計劃後六十天內在理事會的會議上按照下列程序對該工作計劃採取行動：\n(1) 如果委員會建議核准一項工作計劃，在十四天內理事會如無任何成員向主席書面提出具體反對意見，指稱不符合附件三第六條的規定，則該工作計劃應視為已獲理事會核准。如有反對意見，即應適用第一百六十一條第八款(c) 項所載的調解程序。如果在調解程序結束時，反對意見依然堅持，則除非理事會中將提出申請或擔保申請者的任何一國或數國排除在外的成員以協商一致方式對工作計劃不予核准，則該工作計劃應視為已獲理事會核准；\n(2) 如果委員會對一項工作計劃建議不予核准，或未提出建議，理事會可以出席和參加表決的成員的四分之三的多數決定核准該工作計劃，但這一多數須包括參加該次會議的過半數成員；\n(k)核准企業部按照附件四第十二條提出的工作計劃，核準時此照適用\n(j) 項內所列的程序；\n(l)按照第一百五十三條第四款和管理局的規則、規章和程序，對「區域」內活動行使控制；\n(m)根據經濟規劃委員會的建議，按照第一百五十條(h) 項，制定必要和適當的措施，以保護發展中國家使其不致受到該項中指明的不良經濟影響；\n(n)根據經濟規劃委員會的意見，向大會建議第一百五十一條第十款所規定的補償制度或其他經濟調整援助措施；\n(o)\n(1) 向大會建議關於公平分享從「區域」內活動取得的財政及其他經濟利益以及依據第八十二條所繳費用和實物的規則、規章和程序，特別顧及發展中國家和尚未取得完全獨立或其他自治地位的人民的利益和需要；\n(2) 在經大會核准前，暫時制定並適用管理局的規則、規章和程序及其任何修正案，考慮到法律和技術委員會或其他有關附屬機構的建議。這種規則、規章和程序應涉及「區域」內的探礦、勘探和開發以及管理局的財務管理和內部行政。對於制定有關多金屬結核的勘探和開發的規則、規章和程序，應給予優先。有關多金屬結核以外任何資源的勘探和開發的規則、規章和程序，應於管理局任何成員向其要求制訂之日起三年內予以制定。所有規則、規章和程序應於大會核准以前或理事會參照大會表示的任何意見予以修改以前，在暫時性的基礎上生效；\n(p)審核在依據本部份進行的業務方面由管理局付出或向其繳付的一切款項的收集工作；\n(q)在附件三第七條有此要求的情形下，從生產許可的申請者中作選擇；\n(r)將管理局的年度概算提交大會核准；\n(s)就管理局職權範圍內的任何問題或事項的政策，向大會提出建議；\n(t)依據第一百八十五條，就暫停成員權利和特權的行使向大會提出建議；\n(u)在發生不遵守規定的情形下，代表管理局向海底爭端分庭提起司法程序；\n(v)經海底爭端分庭在根據(u) 項提起的司法程序作出裁判後，將此通知大會，並就其認為應採取的適當措施提出建議；\n(w)遇有緊急情況，發布命令，其中可包括停止或調整作業的命令，以防止「區域」內活動對海洋環境造成嚴重損害；\n(x)在有重要證據證明海洋環境有受嚴重損害之虞的情形下，不准由承包者或企業部開發某些區域；\n(y)設立一個附屬機關來制訂有關下列兩項財政方面的規則、規章和程序草案：\n(1) 按照第一百七十一至第一百七十五條的財務管理；\n(2) 按照附件三第十三條和第十七條第一款(c) 項的財政安排；\n(z)設立適當機構來指導和監督視察工作人員，這些視察員負責視察「區域」內活動，以確定本部份的規定、管理局的規則、規章和程序、以及同管理局訂立的任何合同的條款和條件，是否得到遵守。"},{"num":163,"title":"理事會的機關","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、茲設立理事會的機關如下：\n(a)經濟規劃委員會；\n(b)法律和技術委員會。\n二、每一委員會應由理事會根據締約國提名選出的十五名委員組成。但理事會可於必要時在妥為顧及節約和效率的情形下，決定增加任何一個委員會的委員人數。\n三、委員會委員應具備該委員會職務範圍內的適當資格。締約國應提名在有關領域內有資格的具備最高標準的能力和正直的候選人，以便確保委員會有效執行其職務。\n四、在選舉委員會委員時，應妥為顧及席位的公平地區分配和特別利益有其代表的需要。\n五、任何締約國不得提名一人以上為同一委員會的候選人。任何人不應當選在一個以上委員會任職。\n六、委員會委員任期五年，連選可連任一次。\n七、如委員會委員在其任期屆期之前死亡、喪失能力或辭職，理事會應從同一地理區域或同一利益方面選出一名委員任滿所餘任期。\n八、委員會委員不應在同「區域」內的勘探和開發有關的任何活動中有財務上的利益。各委員在對其所任職的委員會所負責任限制下，不應洩露工業秘密、按照附件三第十四條轉讓給管理局的專有性資料，或因其在管理局任職而得悉的任何其他秘密情報，即使在職務終止以後，也是如此。\n九、每一委員會應按照理事會所制定的方針和指示執行其職務。\n十、每一委員會應擬訂為有效執行其職務所必要的規則和規章，並提請理事會核准。\n十一、委員會作出決定的程序應由管理局的規則、規章和程序加以規定。提交理事會的建議，必要時應附送委員會內不同意見的摘要。\n十二、每一委員會通常應在管理局所在地執行職務，並按有效執行其職務的需要，經常召開會議。\n十三、在執行這些職務時，每一委員會可在適當時同另一委員會或聯合國任何主管機關、聯合國各專門機構、或對協商的主題事項具有有關職權的任何國際組織進行協商。"},{"num":164,"title":"經濟規劃委員會","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、經濟規劃委員會委員應具備諸如與採礦、管理礦物資源活動、國際貿易或國際經濟有關的適當資格。理事會應盡力確保委員會的組成反映出一切適當的資格。委員會至少應有兩個成員來自出口從「區域」取得的各類礦物對其經濟有重大關係的發展中國家。\n二、委員會應：\n(a)經理事會請求，提出措施，以實施按照本公約所採取的關於「區域」內活動的決定；\n(b)審查可從「區域」取得的礦物的供應、需求和價格的趨勢與對其造成影響的因素，同時考慮到輸入國和輸出國兩者的利益，特別是其中的發展中國家的利益；\n(c)審查有關締約國提請其注意的可能導致第一百五十條(h) 項內所指不良影響的任何情況，並向理事會提出適當建議；\n(d)按照第一百五十條第十款所規定，向理事會建議對於因「區域」內活動而受到不良影響的發展中國家提供補償或其他經濟調整援助措施的制度以便提交大會。委員會應就大會通過的這一制度或其他措施對具體情況的適用，向理事會提出必要的建議。"},{"num":165,"title":"法律和技術委員會","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、法律和技術委員會委員應具備諸如有關礦物資源的勘探和開發及加工、海洋學、海洋環境的保護，或關於海洋採礦的經濟或法律問題以及其他有關的專門知識方面的適當資格。理事會應盡力確保委員會的組成反映出一切適當的資格。\n二、委員會應：\n(a)經理事會請求，就管理局職務的執行提出建議；\n(b)按照第一百五十三條第三款審查關於「區域」內活動的正式書面工作計劃，並向理事會提交適當的建議。委員會的建議應僅以附件三所載的要求為根據，並應就其建議向理事會提出充分報告；\n(c)經理事會請求，監督「區域」內活動，在適當情形下，同從事這種活動的任何實體或有關國家協商和合作進行，並向理事會提出報告；\n(d)就「區域」內活動對環境的影響準備評價；\n(e)向理事會提出關於保護海洋環境的建議，考慮到在這方面公認的專家的意見；\n(f)擬訂第一百六十二條第二款(o) 項所指的規則、規章和程序，提交理事會，考慮到一切有關的因素，包括「區域」內活動對環境影響的評價；\n(g)經常審查這種規則、規章和程序，並隨時向理事會建議其認為必要或適宜的修正；\n(h)就設立一個以公認的科學方法定期觀察、測算、評價和分析「區域」內活動造成的海洋環境污染危險或影響的監測方案，向理事會提出建議，確保現行規章是足夠的而且得到遵守，並協調理事會核准的監測方案的實施；\n(i)建議理事會特別考慮到第一百八十七條，按照本部份和有關附件，代表管理局向海底爭端分庭提起司法程序；\n(j)經海底爭端分庭在根據(i) 項提起的司法程序作出裁判後，就任何應採取的措施向理事會提出建議；\n(k)向理事會建議發布緊急命令，其中可包括停止或調整作業的命令，以防止「區域」內活動對海洋環境造成嚴重損害。理事會應優先審議這種建議；\n(l)在有充分證據證明海洋環境有受嚴重損害之虞的情形下，向理事會建議不准由承包者或企業部開發某些區域；\n(m)就視察工作人員的指導和監督事宜，向理事會提出建議，這些視察員應視察「區域」內活動，以確定本部份的規定、管理局的規則、規章和程序、以及同管理局訂立的任何合同的條款和條件是否得到遵守；\n(n)在理事會按照附件三第七條在生產許可申請者中作出任何必要選擇後，依據第一百五十一條第二至第七款代表管理局計算生產最高限額並發給生產許可。\n三、經任何有關締約國或任何當事一方請求，委員會委員執行其監督和檢查的職務時，應由該有關締約國或其他當事一方的代表一人陪同。\nＤ分節  秘書處"},{"num":166,"title":"秘書處","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、秘書處應由秘書長一人和管理局所需要的工作人員組成。\n二、秘書長應由大會從理事會提名的候選人中選舉，任期四年，連選可連任。\n三、秘書長應為管理局的行政首長，在大會和理事會以及任何附屬機關的一切會議上，應以這項身份執行職務，並應執行此種機關交付給秘書長的其他行政職務。\n四、秘書長應就管理局的工作向大會提出年度報告。"},{"num":167,"title":"管理局的工作人員","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、管理局的工作人員應由執行管理局的行政職務所必要的合格科學及技術人員和其他人員組成。\n二、工作人員的徵聘和僱用，以及其服務條件的決定，應以必須取得在效率、才能和正直方面達到最高標準的工作人員為首要考慮。在這一考慮限制下，應妥為顧及在最廣泛的地區基礎上徵聘工作人員的重要性。\n三、工作人員應由秘書長任命。工作人員的任命、薪酬和解職所根據的條款和條件，應按照管理局的規則、規章和程序。"},{"num":168,"title":"秘書處的國際性","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、秘書長氣及工作人員在執行職務時，不應尋求或接受任何政府的指示或管理局以外其他來源的指示。他們應避免足以影響其作為只對管理局負責的國際官員的地位的任何行動。每一締約國保證尊重秘書長和工作人員所負責任的純粹國際性，不設法影響他們執行其職責。工作人員如有任何違反職責的行為，應提交管理局的規則、規章和程序所規定的適當行政法庭。\n二、秘書長及工作人員在同「區域」內的勘探和開發有關的任何活動中，不應有任何財務上的利益。在他們對管理局所負責任限制下，他們不應洩露任何工業秘密、按照附件三第十四條轉讓給管理局的專有性資料或在因管理局任職而得悉的任何其他秘密情報，即使在其職務終止以後也是如此。\n三、管理局工作人員如有違反第二款所載義務情事，經受到這種違反行為影響的締約國，或由締約國按照第一百五十三條第二款(b) 項擔保並因這種違反行為而受到影響的自然人或法人的要求，應由管理局將有關工作人員交管理局的規則、規章和程序所指定的法庭處理。受影響的一方應有權參加程序。如經法庭建議，秘書長應將有關工作人員解僱。\n四、管理局的規則、規章和程序應載有為實施本條所必要的規定。"},{"num":169,"title":"同國際組織和非政府組織的協商和合作","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、在管理局職權範圍內的事項上，秘書長經理事會核可，應作出適當的安排，同聯合國經濟及社會理事會承認的國際組織和非政府組織進行協商和合作。\n二、根據第一款與秘書長訂有安排的任何組織可指派代表，按照管理局各機關的議事規則，以觀察員的身份參加這些機關的會議。應制訂程序，以便在適當情形下徵求這種組織的意見。\n三、秘書長可向各締約國分發第一款所指的非政府組織就其具有特別職權並與管理局工作有關的事項提出的畫面報告。\nＥ分節  企業部"},{"num":170,"title":"企業部","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、企業部應為依據第一百五十三條第二款(a) 項直接進行「區域」內活動以及從事運輸、加工和銷售從「區域」回收的礦物的管理局機關。\n二、企業部在管理局國際法律人格的範圍內，應有附件四所載章程規定的法律行為能力。企業部應按照本公約、管理局的規則、規章和程序以及大會制訂的一般政策行事，並應受理事會的指示和控制。\n三、企業部總辦事處應設在管理局所在地。\n四、企業部應按照第一百七十三條第二款和附件四第十一條取得執行職務所需的資金，並應按照第一百四十四條和本公約其他有關條款規定得到技術。\nＦ分節  管理局的財政安排"},{"num":171,"title":"管理局的資金","part":"第十一部份  「區域」","section":"第四節  管理局","content":"管理局的資金應包括：\n(a) 管理局各成員按照第一百六十條第二款(e) 項繳付的分攤會費；\n(b) 管理局按照附件三第十三條因「區域」內活動而得到的收益；\n(c) 企業部按照附件四第十條轉來的資金；\n(d) 依據第一百七十四條借入的款項；和\n(e) 成員或其他實體所提供的自願捐款；\n(f) 按照第一百五十一條第十款向補償基金繳付的款項，基金的來源由經濟規劃委員會提出建議。"},{"num":172,"title":"管理局的年度預算","part":"第十一部份  「區域」","section":"第四節  管理局","content":"秘書長應編制管理局年度概算，向理事會提出。理事會應審議年度概算，並連同其對概算的任何建議向大會提出。大會應按照第一百六十條第二款(h) 項審議並核准年度概算。"},{"num":173,"title":"管理局的開支","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、在管理局未能從其他來源得到足夠資金以應付其行政開支以前，第一百七十一條(a) 項所指的會費應繳入特別帳戶，以支付管理局的行政開支。\n二、管理局的資金應首先支付管理局的行政開支。除了第一百七十一條\n(a) 項所指分攤會費外，支付行政開支後所餘資金，除其他外，可\n：\n(a)按照第一百四十條和第一百六十條第二款(g)項加以分配；\n(b)按照第一百七十條第四款用以向企業部提供資金；\n(c)按照第一百五十一條第十款和第一百六十條第二款( l)項用以補償發展中國家。"},{"num":174,"title":"管理局的借款權","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、管理局應有借款的權力。\n二、大會應在依據第一百六十條第二款(f) 項所制定的財務條例中規定對此項權力的限制。\n三、理事會應行使管理局的借款權。\n四、締約國對管理局的債務應不負責任。"},{"num":175,"title":"年度審計","part":"第十一部份  「區域」","section":"第四節  管理局","content":"管理局的記錄、帳簿和帳目，包括其年度財務報表，應每年交由大會指派的一位獨立審計員審核。"},{"num":176,"title":"法律地位","part":"第十一部份  「區域」","section":"第四節  管理局","content":"管理局應具有國際法律人格以及為執行其職務和實現其宗旨所必要的法律行為能力。"},{"num":177,"title":"特權和豁免","part":"第十一部份  「區域」","section":"第四節  管理局","content":"為使其能夠執行職務，管理局應在每一締約國的領土內享有本分節所規定的特權和豁免。同企業部有關的特權和豁免為附件四第十三條內所規定者。"},{"num":178,"title":"法律程序的豁免","part":"第十一部份  「區域」","section":"第四節  管理局","content":"管理局及其財產和資產，應享有對法律程序的豁免，但管理局在特定事件中明白放棄這種豁免時，不在此限。"},{"num":179,"title":"對搜查和任何其他形式扣押的豁免","part":"第十一部份  「區域」","section":"第四節  管理局","content":"管理局的財產和資產，不論位於何處和為何人持有，應免受搜查、徵用、沒收、公用徵收或以行政或立法行動進行的任何其他形式的扣押。"},{"num":180,"title":"限制、管制、控制和暫時凍結的免除","part":"第十一部份  「區域」","section":"第四節  管理局","content":"管理局的財產和資產應免除任何性質的限制、管制、控制和暫時凍結。"},{"num":181,"title":"管理局的檔案和公務通訊","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、管理局的檔案不論位于何處，應屬不可侵犯。\n二、專有的資料、工業秘密或類似的情報和人事卷宗不應置於可供公眾查閱的檔案中。\n三、關於管理局的公務通訊，每一締約國應給予管理局不低於給予其他國際組織的待遇。"},{"num":182,"title":"若干與管理局有關人員的特權和豁免","part":"第十一部份  「區域」","section":"第四節  管理局","content":"締約國代表出席大會、理事會、或大會或理事會所屬機關的會議時，以\n及管理局的秘書長和工作人員，在每一締約國領土內：\n(a) 應就他們執行職務的行為，享有對法律程序的豁免，但在適當情形下，他們所代表的國家或管理局在特定事件中明白放棄這種豁免時，不在此限；\n(b) 如果他們不是締約國國民，應比照該國應給予其他締約國職級相當的代表、官員和僱員的待遇，享有在移民限制、外僑登記規定和國民服役義務方面的同樣免除、外匯管制方面的同樣便利和旅行便利方面的同樣待遇。"},{"num":183,"title":"稅捐的免除","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、在其公務活動範圍內，管理局及其資產、財產和收入，以及本公約許可的管理局的業務和交易，應免除一切直接稅捐，對其因公務用途而進口或出口的貨物也應免除一切關稅。管理局不應要求免除僅因提供服務而收取的費用的稅款。\n二、為管理局的公務活動需要，由管理局或以管理局的名義採購價值巨大的貨物或服務時，以及當這種貨物或服務的價款包括稅捐或關稅在內時，各締約國應在可行範圍內採取適當措施，准許免除這種稅捐或關稅或設法將其退還。在本條規定的免除下進口或採購的貨物，除非根據與該締約國協議的條件，不應在給予免除的締約國領土內出售或作其他處理。\n三、各締約國對於管理局付給非該國公民、國民或管轄下人員的管理局秘書長和工作人員以及為管理局執行任務的專家的薪給和酬金或其他形式的費用，不應課稅。"},{"num":184,"title":"表決權的暫停行使","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一個締約國拖欠對管理局應繳的費用，如果拖欠數額等於或超過該國前兩整年應繳費用的總額，該國應無表決權。但大會如果確定該成員國由於本國無法控制的情況而不能繳費，可准許該國參加表決。"},{"num":185,"title":"成員權利和特權的暫時行使","part":"第十一部份  「區域」","section":"第四節  管理局","content":"一、締約國如一再嚴重違反本部份的規定，大會可根據理事會的建議暫停該國行使成員的權利和特權。\n二、在海底爭端分庭認定一個締約國一再嚴重違反本部份規定以前，不得根據第一款採取任何行動。"},{"num":186,"title":"國際海洋法法庭海底爭端分庭","part":"第十一部份  「區域」","section":"第五節  爭端的解決和諮詢意見","content":"海底爭端分庭的設立及其行使管轄權的方式均應按照本節、第十五部份和附件六的規定。"},{"num":187,"title":"海底爭端分庭的管轄權","part":"第十一部份  「區域」","section":"第五節  爭端的解決和諮詢意見","content":"海底爭端分庭根據本部份及其有關的附件，對以下各類有關「區域」內\n活動的爭端應有管轄權：\n(a) 締約國之間關於本部份及其有關附件的解釋或適用的爭端；\n(b) 締約國與管理局之間關於下列事項的爭端：( 1)管理局或締約國的行為或不行為據指控違反本部份或其有關附件或按其制定的規則、規章或程序；或( 2)管理局的行為據指控逾越其管轄權或濫用權力；\n(c) 第一百五十三條第二款(b) 項內所指的，作為合同當事各方的締約國、管理局或企業部、國營企業以及自然人或法人之間關於下列事項的爭端：\n(1)對有關合同或工作計劃的解釋或適用；或\n(2)合同當事一方在「區域」內活動方面針對另一方或直接影響其合法利益的行為或不行為；\n(d) 管理局同按照第一百五十三條第二款(b) 項由國家擔保且已妥為履行附件三第四條第六款和第十三條第二款所指條件的未來承包者之間關於訂立合同的拒絕，或談判合同時發生的法律問題的爭端；\n(e) 管理局同締約國、國營企業或按照第一百五十三條第二款(b) 項由締約國擔保的自然人或法人間關於指控管理局應依附件三第二十二條的規定負擔賠償責任的爭端；\n(f) 本公約具備規定由分庭管轄的任何爭端。"},{"num":188,"title":"爭端提交國際海洋法法庭特別分庭或海底爭端分庭專案分庭或提交有拘束力的商業仲裁","part":"第十一部份  「區域」","section":"第五節  爭端的解決和諮詢意見","content":"一、第一百八十七條(a) 項所指各締約國間的爭端可：\n(a)應爭端各方的請求，提交按照附件六第十五和第十七條成立的國際海洋法法庭特別分庭；或\n(b)應爭端任何一方的請求，提交按照附件六第三十六條成立的海底爭端分庭專案分庭。\n二、\n(a)有關第一百八十七條(c) 項(l) 項目內所指合同的解釋或適用的爭端，經爭端任何一方請求，應提交有拘束力的商業仲裁，除非爭端各方另有協議。爭端所提交的商業仲裁法庭對決定本公約的任何解釋問題不具有管轄權。如果爭端也涉及關於「區域」內活動的第十一部份及有關附件的解釋問題，則應將該問題提交海底爭端分庭裁定；\n(b)在此種仲裁開始時或進行過程中，如果仲裁法庭經爭端任何一方請求，或根據自己決定，斷定其裁決須取決於海底爭端分庭的裁定，則仲裁法庭應將此種問題提交海底爭端分庭裁定。然後，仲裁法庭應依照海底爭端分庭的裁定作出裁決；\n(c)在合同沒有規定此種爭端所應適用的仲裁程序的情形下，除非爭端各方另有協議。仲裁應按照聯合國國際貿易法委員會的仲裁規則，或管理局的規則、規章和程序中所規定的其他這種仲裁規則進行。"},{"num":189,"title":"在管理局所作決定方面管轄權的限制","part":"第十一部份  「區域」","section":"第五節  爭端的解決和諮詢意見","content":"海底爭端分庭對管理局按照本部分規定行使斟酌決定權應無管轄權；在任何情形下，均不應以其斟酌決定權代替管理局的斟酌決定權。在不妨害第一百九十一條的情形下，海底爭端分庭依據第一百八十七條行使其管轄權時，不應對管理局的任何規則、規章和程序是否符合本公約的問題表示意見，也不應宣佈任何此種規則、規章和程序為無效。分庭在這方面的管轄權應限於就管理局的任何規則、規章和程序適用于個別案件將同爭端各方的合同上義務或其在本公約下的義務相牴觸的主張，就逾越管轄或濫用權力的主張，以及就一方來履行其合同上義務或其在本公約下的義務而應給予有關另一方損害賠償或其他補救的要求，作出決定。"},{"num":190,"title":"擔保締約國的參加程序和出庭","part":"第十一部份  「區域」","section":"第五節  爭端的解決和諮詢意見","content":"一、如自然人或法人為第一百八十七條所指爭端的一方，應將此事通知其擔保國，該國應有權以提出書面或口頭陳述的方式參加司法程序。\n二、如果一個締約國擔保的自然人或法人在第一百八十七條(c) 項所指的爭端中對另一締約國提出訴訟，被告國可請擔保該人的國家代表該人出庭。如果不能出庭，被告國可安排屬其國籍的法人代表該國出庭。"},{"num":191,"title":"諮詢意見","part":"第十一部份  「區域」","section":"第五節  爭端的解決和諮詢意見","content":"海底爭端分庭經大會或理事會請求，應對它們活動範圍內發生的法律問題提出諮詢意見。這種諮詢意見應作為緊急事項提出。"},{"num":192,"title":"一般義務","part":"第十二部份  海洋環境的保護和保全","section":"第一節  一般規定","content":"各國有保護和保全海洋環境的義務。"},{"num":193,"title":"各國開發其自然環境的主權權利","part":"第十二部份  海洋環境的保護和保全","section":"第一節  一般規定","content":"各國有依據其環境政策和按照其保護和保全海洋環境的職責開發其自然資源的主權權利。"},{"num":194,"title":"防止減少和控制海洋環境污染的措施","part":"第十二部份  海洋環境的保護和保全","section":"第一節  一般規定","content":"一、各國應在適當情形下個別或聯合地採取一切符合本公約的必要措施，防止、減少和控制任何來源的海洋環境污染，為此目的，按照其能力使用其所掌握的最切實可行的方法，並應在這方面盡力協調它們的政策。\n二、各國應採取一切必要措施，確保在其管轄或控制下的活動的進行不致使其他國家及其環境遭受污染的損害，並確保在其管轄或控制範圍內的事件或活動所造成的污染不致擴大到其按照本公約行使主權權利的區域之外。\n三、依據本部份採取的措施，應針對海洋環境的一切污染來源。這些措施，除其他外，應包括旨在在最大可能範圍內盡量減少下列污染的措施：\n(a)從陸上來源、從大氣層或通過大氣層或由於傾倒而放出的有毒、有害或有礙健康的物質，特別是持久不變的物質；\n(b)來自船隻的污染，特別是為了防止意外事件和處理緊急情況，保證海上操作安全，防止故意和無意的排放，以及規定船隻的設計、建造、裝備、操作船和人員配備的措施；\n(c)來自用於勘探或開發海床和底土的自然資源的設施和裝置的污染，特別是為了防止意外事件和處理緊急情況，保證海上操作安全，以及規定這些設施或裝置的設計、建造、裝備、操作和人員配備的措施；\n(d)來自在海洋環境內操作的其他設施和裝置的污染，特別是為了防止意外事件和處理緊急情況，保證海上操作安全，以及規定這些設施或裝置的設計、建造、裝備、操作和人員配備的措施。\n四、各國採取措施防止、減少或控制海洋環境的污染時，不應對其他國家依照本公約行使其權利並履行其義務所進行的活動有不當的干擾。\n五、按照本部份採取的措施，應包括為保護和保全稀有或脆弱的生態系統，以及衰竭、受威脅或有滅絕危險的物種和其他形式的海洋生物的生存環境，而有必要的措施。"},{"num":195,"title":"不將損害或危險轉移或將一種污染轉變成另一種污染的義務","part":"第十二部份  海洋環境的保護和保全","section":"第一節  一般規定","content":"各國在採取措施防止、減少和控制海洋環境的污染時採取的行動不應直接或間接將損害或危險從一個區域轉移到另一個區域，或將一種污染轉變成另一種污染。"},{"num":196,"title":"技術的使用或外來的或新的物種的引進","part":"第十二部份  海洋環境的保護和保全","section":"第一節  一般規定","content":"一、各國應採取一切必要措施以防止、減少和控制由於在其管轄或控制下使用技術而造成的海洋環境污染，或由於故意或偶然在海洋環境某一特定部份引進外來的或新的物種致使海洋環境可能發生重大和有害的變化。\n二、本條不影響本公約對防止、減少和控制海洋環境污染的適用。"},{"num":197,"title":"在全球性或區域性的基礎上的合作","part":"第十二部份  海洋環境的保護和保全","section":"第二節  全球性和區域性合作","content":"各國在為保護和保全海洋環境而擬訂和制訂符合本公約的國際規則、標準和建議的辦法及程序時，應在全球性的基礎上或在區域性的基礎上，直接或通過主管國際組織進行合作，同時考慮到區域的特點。"},{"num":198,"title":"即將發生的損害或實際損害的通知","part":"第十二部份  海洋環境的保護和保全","section":"第二節  全球性和區域性合作","content":"當一國得知海洋環境有即將遭受污染損害的迫切危險或已經遭受污染損害的情況時，應立即通知其認為可能受這種損害影響的其他國家以公及各主管國際組織。"},{"num":199,"title":"對污染的應急計劃","part":"第十二部份  海洋環境的保護和保全","section":"第二節  全球性和區域性合作","content":"在第一百九十八條所指的情形下，受影響區域的各國，應按照其能力，與各主管國際組織盡可能進行合作，以消除污染的影響並防止或盡量減少損害。為此目的，各國應共同發展和促進各種應急計劃，以應付海洋環境的污染事故。"},{"num":200,"title":"研究、研究方案及情報和資料的交換","part":"第十二部份  海洋環境的保護和保全","section":"第二節  全球性和區域性合作","content":"各國應直接或通過主管國際組織進行合作，以促進研究、實施科學研究方案、並鼓勵交換所取得的關於海洋環境污染的情報和資料。各國應盡力積極參加區域性和全球性方案，以取得有關鑒定污染的性質和範圍、面臨污染的情況以及其通過的途徑、危險和補救辦法的知識。"},{"num":201,"title":"規章的科學標準","part":"第十二部份  海洋環境的保護和保全","section":"第二節  全球性和區域性合作","content":"一、各國應參照依據第二佰條取得的情報和資料，直接或通過主管國際組織進行合作，訂立適當的科學準則，以便擬訂和制訂防止、減少和控制海洋環境污染的規則、標準和建議的辦法及程序。"},{"num":202,"title":"對發展中國家的科學和技術援助","part":"第十二部份  海洋環境的保護和保全","section":"第三節  技術援助","content":"各國應直接或通過主管國際組織：\n(a) 促進對發展中國家的科學、教育、技術和其他方面援助的方案，以保護和保全海洋環境，並防止、減少和控制海洋污染。這種援助，除其他外，應包括：\n(1)訓練其科學和技術人員；\n(2)便利其參加有關的國際方案；\n(3)向其提供必要的裝備和便利；\n(4)提高其製造這種裝備的能力；\n(5)就研究、監測、教育和其他方案提供意見並發展設施。\n(b) 提供適當的援助，特別是對發展中國家，以盡量減少可能海洋環境造成嚴重污染的重大事故的影響。\n(c) 提供關於編制環境評價的適當援助，特別是對發展中國家。"},{"num":203,"title":"對發展中國家的優惠待遇","part":"第十二部份  海洋環境的保護和保全","section":"第三節  技術援助","content":"為了防止、減少和控制海洋環境污染或盡量減少其影響的目的，發展中\n國家應在下列事項上取得各國組織的優惠待遇：\n(a) 有關款項和技術援助的分配；和\n(b) 對各該組織專門服務的利用。"},{"num":204,"title":"對污染危險或影響的監測","part":"第十二部份  海洋環境的保護和保全","section":"第四節  監測和環境評價","content":"一、各國應在符合其他國家權利的情形下，在實際可行範圍內，盡力直接或通過和主管國際組織，用公認的科學方法觀測、測算、估計和分析海洋環境污染的危險或影響。\n二、各國特別應不斷監視其所准許或從事的任何活動的影響，以便確定這些活動是否可能污染海洋環境。"},{"num":205,"title":"報告的發表","part":"第十二部份  海洋環境的保護和保全","section":"第四節  監測和環境評價","content":"各國應發表依據第二百零四條所取得的結果的報告，或每隔相當期間向主管國際組織提出這種報告，各該組織應將上述報告提供所有國家。"},{"num":206,"title":"對各種活動的可能影響的評價","part":"第十二部份  海洋環境的保護和保全","section":"第四節  監測和環境評價","content":"各國如有合理根據認為在其管轄或控制下的計劃中的活動可能對海洋環境造成重大污染或重大和有害的變化，應在實際可行範圍內，就這種活動對海洋環境的可能影響作出評價，並應依照第二百零五條規定的方式提送這些評價結果的報告。"},{"num":207,"title":"陸地來源的污染","part":"第十二部份  海洋環境的保護和保全","section":"第五節  防止、減少和控制海洋環境污染的國際規則和國內立法","content":"一、各國應制定法律和規章，以防止、減少和控制陸地來源，包括河流、河口灣、管道和排水口結構對海洋環境的污染，同時考慮到國際上議定的規則、標準和建議的辦法及程序。\n二、各國應採取其他可能必要的措施，以防止、減少和控制這種污染。\n三、各國應盡力在適當的區域一級協調其在這方面的政策。\n四、各國特別應通過主管國際組織或外交會議採取行動，盡力制訂全球性和區域性規則、標準和建議的辦法及程序，以防止、減少和控制這種污染，同時考慮到區域的特點，發展中國家的經濟能力及其經濟發展的需要。這種規則、標準和建議的辦法及程序應根據需要隨時重新審查。\n五、第一、第二和第四款提及的法律、規章、措施、規則、標準和建議的辦法及程序，應包括旨在在最大可能範圍內盡量減少有毒、有害或有礙健康的物質，特別是持久不變的物質，排放到海洋環境的各種規定。"},{"num":208,"title":"國家管轄的海底活動造成的污染","part":"第十二部份  海洋環境的保護和保全","section":"第五節  防止、減少和控制海洋環境污染的國際規則和國內立法","content":"一、沿海國應制定法律和規章，以防止、減少和控制來自受其管轄的海底活動或與此種活動有關的對海洋環境的污染以及來自依據第六十和第八十條在其管轄下的人工島嶼、設施和結構對海洋環境的污染。\n二、各國應採取其他可能必要的措施，以防止、減少和控制這種污染。\n三、這種法律、規章和措施的效力應不低於國際規則、標準和建議的辦法及程序。\n四、各國應盡力在適當的區域一級協調其在這方面的政策。\n五、各國特別應通過主管國際組織或外交會議採取行動，制訂全球性和區域性規章、標準和建議的辦法及程序，以防止、減少和控制第一款所指的海洋環境污染。這種規則、標準和建議的辦法及程序應根據需要隨時重新審查。"},{"num":209,"title":"來自「區域」內活動的污染","part":"第十二部份  海洋環境的保護和保全","section":"第五節  防止、減少和控制海洋環境污染的國際規則和國內立法","content":"一、為了防止、減少和控制「區域」內活動對海洋環境的污染，應按照第十一部份制定國際規則、規章和程序。這種規則、規章和程序應根據需要隨時重審查。\n二、在本節有關規定的限制下，各國應制定法律和規章，以防止、減少和控制由懸掛其旗幟或在其國內登記或在其權力下經營的船隻、設施、結構和其他裝置所進行的「區域」內活動造成對海洋環境的污染。這種法律和規章的要求的效力應不低於第一款所指的國際規則、規章和程序。"},{"num":210,"title":"傾倒造成的污染","part":"第十二部份  海洋環境的保護和保全","section":"第五節  防止、減少和控制海洋環境污染的國際規則和國內立法","content":"一、各國應制定法律和規章，以防止、減少和控制傾倒對海洋環境的污染。\n二、各國應採取其他可能必要的措施，以防止、減少和控制這種污染。\n三、這種法律、規章和措施應確保非經各國主管當局准許，不進行傾倒。\n四、各國特別應通過主管國際組織或外交會議採取行動，盡力制訂全球性和區域性規則、標準和建議的辦法及程序，以防止、減少和控制這種污染。這種規則、標準和建議的辦法及程序應根據需要隨時重新審查。\n五、非經沿海國事前明示核准，不應在領海和專屬經濟區內或在大陸架上進行傾倒，沿海國經與由於地理處境可能受傾倒不利影響的其他國家適當審議此事後，有權准許、規定和控制這種傾倒。\n六、國內法律、規章和措施在防止、減少和控制這種污染方面的效力應不低於全球性規則和標準。"},{"num":211,"title":"來自船隻的污染","part":"第十二部份  海洋環境的保護和保全","section":"第五節  防止、減少和控制海洋環境污染的國際規則和國內立法","content":"一、各國應通過主管國際組織或一般外交會議採取行動，制訂國際規則和標準，以防止、減少和控制船隻對海洋環境的污染，並於適當情形下，以同樣方式促進對劃定航線制度的採用。以期盡量減少可能對海洋環境，包括對海岸造成污染和對沿海國的有關利益可能造成污染損害的意外事件的威脅。這種規則和標準應根據需要隨時以同樣方式重新審查。\n二、各國應制定法律和規章，以防止、減少和控制懸掛其旗幟或在其國內登記的船隻對海洋環境的污染。這種法律和規章至少應具有與通過主管國際組織或一般外交會議制訂的一般接受的國際規則和標準相同的效力。\n三、各國如制訂關於防止、減少和控制海洋環境污染的特別規定作為外國船隻進入其港口或內水或在其岸外設施停靠的條件，應將這種規定妥為公佈，並通知主管國際組織。如兩個或兩個以上的沿海國制訂相同的規定，以求協調政策，在通知時應說明那些國家參加這種合作安排。每個國家應規定懸掛其旗幟或在其國內登記的船隻的船長在參加這種合作安排的國家的領海內航行時，經該國要求應向其提送通知是否正駛往參加這種合作安排的同一區域的國家，如係駛往這種國家，應說明是否遵守該國關於進入港口的規定。本條不妨害船隻繼續行使其無害通過權，也不妨害第二十五條第二款的適用。\n四、沿海國在其領海內行使主權，可制定法律和規章，以防止、減少和控制外國船隻，包括行使無害通過權的船隻對海洋的污染。按照第二部份第三節的規定，這種法律和規章不應阻礙外國船隻的無害通過。\n五、沿海國為第六節所規定的執行的目的，可對其專屬經濟區制定法律和規章，以防止、減少和控制來自船隻的污染。這種法律和規章應符合通過主管國際組織或一般外交會議制訂的一般接受的國際規則和標準，並使其有效。\n六、\n(a)如果第一款所指的國際規則和標準不足以適應特殊情況，又如果沿海國有合理根據認為其專屬經濟區某一明確劃定的特定區域，因與其海洋學和生態條件有關的公認技術理由，以及該區域的利用或其資源的保護及其在航運上的特殊性質，要求採取防止來自船隻的污染的特別強制性措施，該沿海國通過主管國際組織與任何其他有關國家進行適當協商後，可就該區域向該組織送發通知後，提出所依據的科學和技術證據，以及關於必要的回收設施的情報。該組織收到這種通知，應在十二個月內確定該區域的情況與上述要求是否相符。如果該組織確定是符合的，該沿海國即可對該區域制定防止、減少和控制來自船隻的污染的法律和規章，實施通過主管國際組織使其適用於各特別區域的國際規則和標準國航行辦法。在向該組織送發通知滿十五個月後，這些法律和規章才可適用於外國船隻；\n(b) 沿海國應公佈任何這種明確劃定的特定區域的界限；\n(c) 如果沿海國有意為同一區域制定其他法律和規章，以防止、減少和控制來自船隻的污染，它們應於提出上述通知時，同時將這一意向通知該組織。這種增訂的法律和規章可涉及排放和航行辦法，但不應要求外國船隻遵守一般接受的國際規則和標準以外的設計、建造、人員配備或裝備標準；這種法律和規章應在向該組織送發通知十五個月後適用於外國船隻，但須在送發通知後十二個月內該組織表示同意。\n七、本條所指的國際規則和標準，除其他外，應包括遇有引起排放或排放可能的海難等事故時，立即通知其海岸或有關利益可能受到影響的沿海國的義務。"},{"num":212,"title":"來自大氣層或通過大氣層的污染","part":"第十二部份  海洋環境的保護和保全","section":"第五節  防止、減少和控制海洋環境污染的國際規則和國內立法","content":"一、各國為防止、減少和控制來自大氣層或通過大氣層的海洋環境污染，應制定適用於在其主權下的上空和懸掛其旗幟的船隻或在其國內登記的船隻或飛機的法律和規章，同時考慮到國際上議定的規則、標準和建議的辦法及程序，以及航空的安全。\n二、各國應採取其他可能必要的措施，以防止、減少和控制這種污染。\n三、各國特別應通過主管國際組織或外交會議採取行動，盡力制訂全球性和區域性規則、標準和建議的辦法及程序，以防止、減少和控制這種污染。"},{"num":213,"title":"","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"（關於陸地來源的污染的執行）各國應執行其按照第二百零七條制定的法律和規章，並應制定法律和規章和採取其他必要措施，以實施通過主管國際組織或外交會議為防止、減少和控制陸地來源對海洋環境的污染而制訂的可適用的國際規則和標準。"},{"num":214,"title":"關於來自海底活動的污染的執行","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"各國為防止、減少和控制來自受其管轄的海底活動或與此種活動有關的對海洋環境的污染以及來自依據第六十和第八十條在其管轄下的人工島嶼、設施和結構對海洋環境的污染，應執行其按照第二百零八條制定的法律和規章，並應制定必要的法律和規章和採取其他必要措施，以實施通過主管國際組織或外交會議制訂的可適用的國際規則和標準。"},{"num":215,"title":"關於來自「區域」內活動的污染的執行","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"為了防止、減少和控制「區域」內活動對海洋環境的污染而按照第十一部候份訂的國際規則、規章和程序，其執行應受該部份支配。"},{"num":216,"title":"關於傾倒造成污染的執行","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"一、為了防止、減少和控制傾倒對海洋環境的污染而按照本公約制定的法律和規章，以及通過主管國際組織或外交會議制訂的可適用的國際規則和標準，應依下列規定執行：\n(a)對於在沿海國領海或其專屬經濟區內或在其大陸架上的傾倒，應由該沿海國執行；\n(b)對於懸掛旗籍國旗幟的船隻或在其國內登記的船隻和飛機，應由該旗籍國執行；\n(c)對於任何國家領土內或在其岸外設施裝載廢料或其他物質的行為，應由該國執行。\n二、本條不應使任何國家承擔提起司法程序的義務，如果另一國已按照本條提起這種程序。"},{"num":217,"title":"船旗國的執行","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"一、各國應確保懸掛其旗幟或在其國內登記的船隻，遵守為防止、減少和控制來自船隻的海洋環境污染而通過主管國際組織或一般外交會議制訂的可適用的國際規則和標準以及各該國按照本公約制定的法律和規章，並應為此制定法律和規章和採取其他必要措施，以實施這種規則、標準、法律和規章。船旗國應作出規定使這種規則、標準、法律和規章得到有效執行，不論違反行為在何處發生。\n二、各國特別應採取適當措施，以確保懸掛其旗幟或在其國內登記的船隻，在能遵守第一款所指的國際規則和標準的規定，包括關於船隻的設計、建造、裝備和人員配備的規定以前，禁止其出海航行。\n三、各國應確保懸掛其旗幟或在其國內登記的船隻在船上持有第一款所指的國際規則和標
