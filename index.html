準所規定並依據該規則和標準頒發的各種證書。各國應確保懸掛其旗幟的船隻受到定期檢查，以證實這些證書與船隻的實際情況相符。其他國家應接受這些證書，作為船隻情況的證據，並應將這些證書視為與其本國所發的證書具有相同效力，除非有明顯根據認為船隻的情況與證書所載各節有重大不符。\n四、如果船隻違反通過主管國際組織或一般外交會議制訂的規則和標準，船旗國在不妨害第二百一十八、第二百二十和第二百二十八條的情形下，應設法立即進行調查，並在適當情形下應對被指控的違反行為提起司法程序，不論違反行為在何處發生也不論這種違反行為所造成的污染在何處發生或發現。\n五、船旗國調查違反行為時，可向提供合作能有助於澄清案件情況的任何其他國家請求協助。各國應盡力滿足船旗國的適當請求。\n六、各國經任何國家的書面請求，應對懸掛其旗幟的船隻被指控所犯的任何違反行為進行調查。船旗國如認為有充分證據可對被指控的違反行為提起司法程序，應毫不遲延地按照其法律提起這種程序。\n七、船旗國應將所採取行動及其結果迅速通知請求國和主管國際組織。所有國家應能得到這種情報。\n八、各國的法律和規章對懸掛其旗幟的船隻所規定的處罰應足夠嚴厲，以防阻違反行為在任何地方發生。"},{"num":218,"title":"港口國的執行","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"一、當船隻自願位於一國港口或岸外設施時，該國可對該船違反通過主管國際組織或一般外交會議制訂的可適用的國際規則和標準在該國內水、領海或專屬經濟區外的任何排放進行調查，並可在有充分證據的情形下，提起司法程序。\n二、對於在另一國內水、領海或專屬經濟區內發生的違章排放行為，除非經該國、船旗國或受違章排放行為損害或威脅的國家請求，或者違反行為已對或可能對提起司法程序的國家的內水、領海或專屬經濟區造成污染，不應依據第一款提起司法程序。\n三、當船隻自願位於一國港口或岸外設施時，該國應在實際可行範圍內滿足任何國家因認為第一款所指的違章排放行為已在其內水、領海或專屬經濟區內發生，對於內水、領海或專屬經濟區已造成損害或有損害的威脅而提出的進行調查的請求，並且應在實際可行範圍內，滿足船旗國對這一違反行為所提出的進行調查請求，不論違反行為在何處發生。\n四、港口國依據本條規定進行的調查的紀錄，如經請求，應轉交船旗國或沿海國。在第七節限制下，如果違反行為發生在沿海國的內水、領海或專屬經濟區內，港口國根據這種調查提起的任何司法程序，經該沿海國請求可暫停進行。案件的證據和記錄，連同繳交港口國當局的任何保證書或其他財政擔保，應在這種情形下轉交給該沿海國。轉交後，在港口國即不應繼續進行司法程序。"},{"num":219,"title":"關於船隻適航條件的避免污染措施","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"在第七節限制下，各國如經請求或出於自己主動，已查明在其港口或岸外設施的船隻違反關於船隻適航條件的可適用的國際規則和標準從而有損害海洋環境的威脅，應在實際可行範圍內採取行政措施以阻止該船航行。這種國家可准許該船僅駛往最近的適當修船廠，並應於違反行為的原因消除後，准許該船立即繼續航行。"},{"num":220,"title":"沿海國的執行","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"一、當船隻自願位於一國港口或岸外設施時，該國對在其領海或專屬經濟區內發生的任何違反關於防止、減少和控制船隻造成的污染的該國按照本公約制定的法律和規章或可適用的國際規則和標準的行為，可在第七節限制下，提起司法程序。\n二、如有明顯根據認為在一國領海內航行的船隻，在通過領海時，違反關於防止、減少和控制來自船隻的污染的該國按照本公約制定的法律和規章或可適用的國際規則和標準，該國在不妨害第二部份第三節有關規定的適用的情形下，可就違反行為對該船進行實際檢查，並可在有充分證據時，在第七節限制下按照該國法律提起司法程序，包括對該船的拘留在內。\n三、如有明顯根據認為在一國專屬經濟區或領海內航行的船隻，在專屬經濟區違反關於防止、減少和控制來自船隻的污染的可適用的國際規則和標準或符合這種國際規則和標準並使其有效的該國的法律和規章，該國可要求該船提供關於該船的識別標誌、登記港口、上次停泊和下次停泊的港口，以及其他必要的有關情報，以確定是否已有違反行為發生。\n四、各國應制定法律和規章，並採取其他措施，以使懸掛其旗幟的船隻遵從依據第三款提供情報的要求。\n五、如有明顯根據認為在一國專屬經濟區或領海內航行的船隻，在專屬經濟區內犯有第三款所指的違反行為而導致大量排放，對海洋環境造成重大污染或有造成重大污染的威脅，該國在該船拒不提供情報，或所提供的情報與明顯的實際情況顯然不符，並且依案件情況確有進行檢查的理由時，可就有關違反行為的事項對該船進行實際檢查。\n六、如有明顯客觀證據證明在一國專屬經濟區或領海內航行的船隻，在專屬經濟區內犯有第三款所指的違反行為而導致排放，對沿海國的海岸或有關利益，或對其領海或專屬經濟區內的任何資源，造成重大損害或有造成重大損害的威脅，該國在有充分證據時，可在第七節限制下，按照該國法律提起司法程序，包括對該船的拘留在內。\n七、雖有第六款的規定，無論何時如已通過主管國際組織或另外協議制訂了適當的程序，從而已經確保關於保證書或其他適當財政擔保的規定得到遵守，沿海國如受這種程序的拘束，應即准許該船繼續航行。\n八、第三、第四、第五、第六和第七款的規定也應適用於依據第二百一十一條第六款制定的國內法律和規章。"},{"num":221,"title":"避免海難引起污染的措施","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"一、本部份的任何規定不應妨害各國為保護其海岸或有關利益，包括捕魚，免受海難或與海難有關的行動所引起，並能合理預期造成重大有害後果的污染或污染威脅，而依據國際法，不論是根據習慣還是條約，在其領海範圍以外，採取和執行與實際的或可能發生的損害相稱的措施的權利。\n二、為本條的目的，「海難」是指船隻碰撞、擱淺或其他航行事故，或船上或船外所發生對船隻或船貨造成重大損害或重大損害的迫切威脅的其他事故。"},{"num":222,"title":"對來自大氣層或通過大氣層的污染的執行","part":"第十二部份  海洋環境的保護和保全","section":"第六節  執行","content":"各國應對在其主權下的上空或懸掛其旗幟的船隻或在其國內登記的船隻和飛機，執行其按照第二百一十二條第一款和本公約其他規定制定的法律和規章，並應依照關於空中航行安全的一切有關國際規則和標準，制定法律和規章並採取其他必要措施，以實施通過主管國際組織或外交會議為防止、減少和控制來自大氣層或通過大氣層的海洋環境污染而制訂的可適用的國際規則和標準。"},{"num":223,"title":"便利司法程序的措施","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"在依據本部份提起的司法程序中，各國應採取措施，便利對證人的聽詢以及接受另一國當局或主管國際組織提交的證據，並應便利主管國際組織、船旗國或受任何違反行為引起污染影響的任何國家的官方代表參與這種程序。參與這種程序的官方代表應享有國內法律和規章或國際法規定的權利與義務。"},{"num":224,"title":"執行權力的行使","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"本部份規定的對外國船隻的執行權力，只有官員或軍艦、軍用飛機或其他有清楚標誌可以識別為政府服務並經授權的船舶或飛機才能行使。"},{"num":225,"title":"行使執行權力時避免不良後果的義務","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"在根據本公約對外國船隻行使執行權力時，各國不應危害航行的安全或造成對船隻的任何危險，或將船隻帶至不安全的港口或停泊地，或使海洋環境面臨不合理的危險。"},{"num":226,"title":"調查外國船隻","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"一、\n(a)各國羈留外國船隻不得超過第二百一十六、第二百一十八和第二百二十條規定的為調查目的所必需的時間。任何對外國船隻的實際檢查應只限於查閱該船按照一般接受的國際規則和標準所須持有的證書、記錄或其他文件或其所持有的任何類似文件；對船隻的進一步的實際檢查，只有在經過這樣的查閱後以及在經過這樣的查閱後以及在下列情況下，才可進行：\n(1) 有明顯根據認為該船的情況或其裝備與這些文件所載各節有重大不符；\n(2) 這類文件的內容不足以證實或證明涉嫌的違反行為；或\n(3) 該船未持有有效的證件和記錄。\n(b)如果調查結果顯示有違反關於保護和保全海洋環境的可適用的法律和規章或國際規則和標準的行為，則應於完成提供保證書或其他適當財政擔保等合理程序後迅速予以釋放。\n(c)在不妨害有關船隻適航性的可適用的國際規則和標準的情形下，無論何時如船隻的釋放可能對海洋環境引起不合理的損害威脅，可拒絕釋放或以駛往最近的適當修船廠為條件予釋放。在拒絕釋放或對釋放附加條件的情形下，必須迅速通知船隻的船旗國，該國可按照第十五部份尋求該船的釋放。\n二、各國應合作制定程序，以避免在海上對船隻作不必要的實際檢查。"},{"num":227,"title":"對外國船隻的無歧視","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"各國根據本部份行使權利和履行其義務時，不應在形式上或事實上對任何其他國家的船隻有所歧視。"},{"num":228,"title":"提起司法程序的暫停和限制","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"一、對於外國船隻在提起司法程序的國家的領海外所犯任何違反關於防止、減少和控制來自船隻的污染的可適用的法律和規章或國際規則和標準的行為訴請加以處罰的司法程序，於船旗國在這種程序最初提起之日起六個月內就同樣控告提出加以處罰的司法程序時，應即暫停進行，除非這種程序涉及沿海國遭受重大損害的案件或有關船旗國一再不顧其對本國船隻的違反行為有效地執行可適用的國際規則和標準的義務。船旗國無論何時如按照本條要求暫停進行司法程序，應於適當期間內將案件全部卷宗和程序記錄提供早先提起程序的國家。船旗國提起的司法程序結束時，暫停的司法程序應予終止。在這種程序中應收的費用經繳納後，沿海國應發還與暫停的司法程序有關的任何保證書或其他財政擔保。\n二、從違反行為發生之日起滿三年後，對外國船隻不應再提起加以處罰的司法程序，又如另一國家已在第一款所載規定的限制下提起司法程序，任何國家均不得再提起這種程序。\n三、本條的規定不妨害船旗國按照本國法律採取任何措施，包括提起加以處罰的司法程序的權利，不論別國是否已先提起這種程序。"},{"num":229,"title":"民事訴訟程序的提起","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"本公約的任何規定不影響因要求賠償海洋環境污染造成的損失或損害而提起民事訴訟程序。"},{"num":230,"title":"罰款和對被告的公認權利的尊重","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"一、對外國船隻在領海以外所犯違反關於防止、減少和控制海洋環境污染的國內法律和規章或可適用的國際規則和標準的行為，僅可處以罰款。\n二、對外國船隻在領海內所犯違反關於防止、減少和控制海洋環境污染的國內法律和規章或可適用的國際規則和標準的行為，僅可處以罰款，但在領海內故意和嚴重地造成污染的行為除外。\n三、對於外國船隻所犯這種違反行為進行可能對其加以處罰的司法程序時，應尊重被告的公認權利。"},{"num":231,"title":"對船旗國和其他有關國家的通知","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"各國應將依據第六節對外國船隻所採取的任何措施迅速通知船旗國和任何其他有關國家，並將有關這種措施的一切正式報告提交船旗國。但對領海內的違反行為，沿海國的上述義務僅適用於司法程序中所採取的措施。依據第六節對外國船隻採取的任何這種措施，應立即通知船旗國的外交代表或領事官員，可能時並應通知其海事當局。"},{"num":232,"title":"各國因執行措施而產生的賠償責任","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"各國依照第六節所採取的措施如屬非法或根據可得到的情報超出合理的要求。應對這種措施所引起的並可以歸因於各該國的損害或損失負責。\n各國應對這種損害或損失規定向其法院申訴的辦法。"},{"num":233,"title":"對用於國際航行的海峽的保障","part":"第十二部份  海洋環境的保護和保全","section":"第七節  保障辦法","content":"第五、第六和第七節的任何規定不影響用於國際航行的海峽的法律制度。但如第十節所指以外的外國船舶違反了第四十二條第一款(a) 和 (b)項所指的法律和規章，對海峽的海洋環境造成重大損害或有造成重大損害的威脅，海峽沿岸國可採取適當執行措施，在採取這種措施時，應比照尊重本節的規定。"},{"num":234,"title":"冰封區域","part":"第十二部份  海洋環境的保護和保全","section":"第八節  冰封區域","content":"沿海國有權制定和執行非歧視性的法律和規章，以防止、減少和控制船隻在專屬經濟區範圍內冰封區域對海洋的污染，這種區域內的特別嚴寒氣候和一年中大部分時候冰封的情形對航行造成障礙或特別危險，而且海洋環境污染可能對生態平衡造成重大的損害或無可挽救的擾亂。這種法律和規章應適當顧及航行和以現有最可靠的科學證據為基礎對海洋環境的保護和保全。"},{"num":235,"title":"責任","part":"第十二部份  海洋環境的保護和保全","section":"第九節  責任","content":"一、各國有責任履行其關於保護和保全海洋環境的國際義務，各國應按照國際法承擔責任。\n二、各國對於在其管轄下的自然人或法人污染海洋環境所造成的損害，應確保按照其法律制度，可以提起申訴以獲得迅速和適當的補償或其他救濟。\n三、為了對污染海洋環境所造成的一切損害保證迅速而適當地給予補償的目的，各國應進行合作，以便就估量和補償損害的責任以及解決有關的爭端，實施現行國際法和進一步發展國際法，並在適當情形下，擬訂諸如加強保險或補償基金等關於給付適當補償的標準和程序。"},{"num":236,"title":"主權豁免","part":"第十二部份  海洋環境的保護和保全","section":"第十節  主權豁免","content":"本公約關於保護和保全海洋環境的規定，不適用於任何軍艦、海軍輔助船、為國家所擁有或經營並在當時只供政府非商業性服務之用的其他船隻或飛機。但每一國家應採取不妨害該國所擁有或經營的這種船隻或飛機的操作或操作能力的適當措施，以確保在合理可行範圍內這種船隻或飛機的活動方式符合本公約。"},{"num":237,"title":"關於保護和保全海洋環境的其他公約所規定的義務","part":"第十二部份  海洋環境的保護和保全","section":"第十一節  關於保護和保全海洋環境的其他公約所規定的          義務","content":"一、本部份的規定不影響各國根據先前締結的關於保護和保全海洋環境的特別公約和協定所承擔的特定義務，也不影響為了推行本公約所載的一般原則而可能締結的協定。\n二、各國根據特別公約所承擔的關於保護和保全海洋環境的特定義務，應依符合本公約一般原則和目標的方式履行。"},{"num":238,"title":"進行海洋科學研究的權利","part":"第十三部份  海洋科學研究","section":"第一節  一般規定","content":"所有國家，不論其地理位置如何，以及各主管國際組織，在本公約所規定的其他國家的權利和義務的限制下，均有權進行海洋科學研究。"},{"num":239,"title":"海洋科學研究的促進","part":"第十三部份  海洋科學研究","section":"第一節  一般規定","content":"各國和主管國際組織應按照本公約，促進和便利海洋科學研究的發展和進行。"},{"num":240,"title":"進行海洋科學研究的一般原則","part":"第十三部份  海洋科學研究","section":"第一節  一般規定","content":"進行海洋科學研究時應適用下列原則：\n(a) 海洋科學研究應專為和平目的而進行；\n(b) 海洋科學研究應以符合本公約的適當科學方法和工具進行；\n(c) 海洋科學研究不應對符合本公約的海洋其他正當用途有不當干擾，而這種研究在上述用途過程中應適當地受到尊重；\n(d) 海洋科學研究的進行應遵守依照本公約制定的一切有關規章，包括關於保護和保全海洋環境的規章。"},{"num":241,"title":"不承認海洋科學研究活動為任何權利主張的法律根據","part":"第十三部份  海洋科學研究","section":"第一節  一般規定","content":"海洋科學研究活動不應構成對海洋環境任何部份或其資源的任何權利主張的法律根據。"},{"num":242,"title":"國際合作的促進","part":"第十三部份  海洋科學研究","section":"第二節  國際合作","content":"一、各國和各主管國際組織應按照尊重主權和管轄權的原則，並在互利的基礎上，促進為和平目的進行海洋科學研究的國際合作。\n二、因此，在不影響本公約所規定的權利和義務的情形下，一國在適用本部份時，在適當情形下，應向其他國家提供合理的機會，使其從該國取得或在該國合作下取得為防止和控制對人身健康和安全以及對海洋環境的損害所必要的情報。"},{"num":243,"title":"有利條件的創造","part":"第十三部份  海洋科學研究","section":"第二節  國際合作","content":"各國和各主管國際組織應進行合作，通過雙邊和多邊協定的締結，創造有利條件，以進行海洋環境中的海洋科學研究，並將科學工作者在研究海洋環境中發生的各種現象和變化過程的本質以及兩者之間的相互關係方面的努力結合起來。"},{"num":244,"title":"情報和知識的公佈和傳播","part":"第十三部份  海洋科學研究","section":"第二節  國際合作","content":"一、各國和各主管國際組織應按照本公約，通過適當途徑以公佈和傳播的方式，提供關於擬議的主要方案及其目標的情報以及海洋科學研究所得的知識。\n二、為此目的，各國應各別地並與其他國家和各主管國際組織合作，積極促進科學資料和情報的流通以及海洋科學研究所得知識的轉讓，特別是向發展中國家的流通和轉讓，並通過除其他外對發展中國家技術和科學人員提供適當教育和訓練方案，加強發展中國家自主進行海洋科學研究的能力。"},{"num":245,"title":"領海內的海洋科學研究","part":"第十三部份  海洋科學研究","section":"第三節  海洋科學研究的進行和促進","content":"沿海國在行使其主權時，有規定、准許和進行其領海內的海洋科學研究的專屬權利。領海內的海洋科學研究，應經沿海國明示同意並在沿海國規定的條件下，才可進行。"},{"num":246,"title":"專屬經濟區內和大陸架上的海洋科學研究","part":"第十三部份  海洋科學研究","section":"第三節  海洋科學研究的進行和促進","content":"一、沿海國在行使其管轄權時，有權按照本公約的有關條款，規定、准許和進行在其專屬經濟區內或大陸架上的海洋科學研究。\n二、在專屬經濟區內和大陸架上進行海洋科學研究，應經沿海國同意。\n三、在正常情形下，沿海國應對其他國家或各主管國際組織按照本公約專為和平目的和為了增進關於海洋環境的科學知識以謀全人類利益，而在其專屬經濟區內或大陸架上進行的海洋科學研究計劃，給予同意。為此目的，沿海國應制定規則和程序，確保不致不合理地推進或拒絕給予同意。\n四、為適用第三款的目的，盡管沿海國和研究國之間沒有外交關係，它們之間仍可存在正常情況。\n五、但沿海國可斟酌決定，拒不同意另一國家或主管國際組織在該沿海國專屬經濟區內或大陸架上進行海洋科學研究計劃，如果該計劃：\n(a)與生物或非生物自然資源的勘探和開發有直接關係；\n(b)涉及大陸架的鈷探、炸藥的使用或將有害物質引入海洋環境；\n(c)涉及第六十和第八十條所指的人工島嶼、設施和結構的建造、操作或使用；\n(d)含有依據第二百四十八條提出的關於該計劃的性質和目標的不正確情報，或如進行研究的國家或主管國際組織由於先前進行研究計劃而對沿海國負有尚未履行的義務。\n六、雖有第五款的規定，如果沿海國已在任何時候公開指定從測算領海寬度的基線量起二百海里以外的某些特定區域為已在進行或將在合理期間內進行開發或詳探作業的重點區域，則沿海國對於在這些特定區域之外的大陸架上按照本部份規定進行的海洋科學研究計劃，即不得行使該款(a) 項規定的斟酌決定權而拒不同意。沿海國對於這類區域的指定及其任何更改，應提出合理的通知，但無須提供其中作業的詳情。\n七、第六款的規定不影響第七十七條所規定的沿海國對大陸架的權利。\n八、本條所指的海洋科學研究活動，不應對沿海國行使本公約所規定的主權權利和管轄權所進行的活動有不當的干擾。"},{"num":247,"title":"國際組織進行或主持的海洋科學研究計劃","part":"第十三部份  海洋科學研究","section":"第三節  海洋科學研究的進行和促進","content":"沿海國作為一個國際組織的成員或同該組織訂有雙邊協定，而在該沿海國專屬經濟區內或大陸架上該組織有意直接或在其主持下進行一項海洋科學研究計劃，如果該沿海國在該組織決定進行計劃時已核准詳細計劃，或願意參加該計劃，並在該組織將計劃通知該沿海國後四個月內沒有表示任何反對意見，則應視為已准許依照同意的說明書進行該計劃。"},{"num":248,"title":"向沿海國提供資料的義務","part":"第十三部份  海洋科學研究","section":"第三節  海洋科學研究的進行和促進","content":"各國和各主管國際組織有意在一個沿海國的專屬經濟區內或大陸架上進\n行海洋科學研究，應在海洋科學研究計劃預定開始日期至少六個月前，\n向該國提供關於下列各項的詳細說明：\n(a) 計劃的性質和目標；\n(b) 使用的方法和工具，包括船隻的船名、噸位、類型和級別，以及科學裝備的說明；\n(c) 進行計劃的精確地理、區域及科學裝備的說明；\n(d) 研究船最初到達和最後離開的預定日期，或裝備的部署和拆除的預定日期，視情況而定；\n(e) 主持機構的名稱，其主持人和計劃負責人的姓名；和\n(f) 認為沿海國應能參加或有代表參與計劃的程度。"},{"num":249,"title":"遵守某些條件的義務","part":"第十三部份  海洋科學研究","section":"第三節  海洋科學研究的進行和促進","content":"一、各國和各主管國際組織在沿海國的專屬經濟區內或大陸架上進行海洋科學研究時，應遵守下列條件：\n(a)如沿海國願意，確保其有權參加或有代表參與海洋科學研究計劃，特別是於實際可行時在研究船和其他船隻上或在科學研究設施上進行，但對沿海國的科學工作者無須支付任何報酬，沿海國亦無分擔計劃費用的義務；\n(b)經沿海國要求，在實際可行範圍內盡快向沿海國提供初步報告，並於研究完成後提供所得的最後成果和結論；\n(c)經沿海國要求，負責供其利用從海洋科學研究計劃所取得的一切資料和樣品，並同樣向其提供可以複製的資料和可以分開而不致有損其科學價值的樣品；\n(d)如經要求，向沿海國提供對此種資料、樣品及研究成果的評價，或協助沿海國加以評價或解釋；\n(e)確保在第二款限制下，於實際可行的情況下，盡快通過適當的國內或國際途徑，使研究成果在國際上可以取得；\n(f)將研究方案的任何重大改變立即通知沿海國；\n(g)除非另有協議，研究完成後立即拆除科學研究設施或裝備。\n二、本條不妨害沿海國的法律和規章為依據第二百四十六條第五款行使斟酌決定權給予同意或拒不同意而規定的條件，包括要求預先同意使計劃中對勘探和開發自然資源有直接關係的研究成果在國際上可以取得。"},{"num":250,"title":"關於海洋科學研究計劃的通知","part":"第十三部份  海洋科學研究","section":"第三節  海洋科學研究的進行和促進","content":"關於海洋科學研究計劃的通知，除另有協議外，應通過適當的官方途徑發出。"},{"num":251,"title":"一般準則和方針","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"各國應通過主管國際組織設法促進一般準則和方針的制定，以協助各國確定海洋科學研究的性質和影響。"},{"num":252,"title":"默示同意","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"各國或各主管國際組織可於依據第二百四十八條的規定向沿海國提供必\n要的情報之日起六個月後，開始進行海洋科學研究計劃，除非沿海國在\n收到含有此項情報的通知後四個月內通知進行研究的國家或組織：\n(a) 該國已根據第二百四十六條的規定拒絕同意；\n(b) 該國或主管國際組織提出的關於計劃的性質和目標的情報與明顯事實不符；\n(c) 該國要求有關第二百四十八和第二百四十九條規定的條件和情報的補充情報；或\n(d) 關於該國或該組織以前進行的海洋科學研究計劃，在第二百四十九條規定的條件方面，還有尚未履行的義務。"},{"num":253,"title":"海洋科學研究活動的暫停或停止","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"一、沿海國應有權要求暫停在其專屬經濟區內或大陸架上正在進行的任何海洋科學研究活動，如果：\n(a)研究活動的進行不按照根據第二百四十八條的規定提出的，且經沿海國作為同意的基礎的情報；或\n(b)進行研究活動的國家或主管國際組織未遵守第二百四十九條關於沿海國對海洋科學研究計劃的權利的規定。\n二、任何不遵守第二百四十八條規定的情形，如果等於將研究計劃或研究活動作重大改動，沿海國應有權要求停止任何海洋科學研究活動。\n三、如果第一款所設想的任何情況在合理期間內仍未得到糾正，沿海國也可要求停止海洋科學研究活動。\n四、沿海國發出其命令暫停或停止海洋科學研究活動的決定的通知後，獲准進行這種活動的國家或主管國際組織應即終止這一通知所指示的活動。\n五、一旦進行研究的國家或主管國際組織遵行第二百四十八條和第二百四十九條所要求的條件，沿海國應即撤銷根據第一款發出的暫停命令，海洋科學研究活動也應獲准繼續進行。"},{"num":254,"title":"鄰近的內陸國和地理不利國的權利","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"一、已向沿海國提出一項計劃，準備進行第二百四十六條第三款所指的海洋科學研究的國家和主管國際組織，應聽提議的研究計劃通知鄰近的內陸國和地理不利國，並應將此事通知沿海國。\n二、在有關的沿海國按照第二百四十六條和本公約的其他有關規定對該提議的海洋科學研究計劃給予同意後，進行這一計劃的國家和主管國際組織，經鄰近的內陸國和地理不利國請求，適當時應向他們提供第二百四十八條和第二百四十九條第一款(f) 項所列的有關情報。\n三、以上所指的鄰近內陸國和地理不利國，如提出請求，應獲得機會按照有關的沿海國和進行此項海洋科學研究的國家和主管國際組織依本公約的規定而議定的適用於提議的海洋科學研究計劃的條件，通過由其任命的並且不為該沿海國反對的合格專家在實際可行時參加該計劃。\n四、第一款所指的國家和主管國際組織，經上述內陸國和地理不利國的請求，應向它們提供第二百四十九條第一款(d) 項規定的有關情報和協助，但須受第二百四十九條第二款的限制。"},{"num":255,"title":"便利海洋科學研究和協助研究船的措施","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"各國應盡力制定合理的規則、規章和程序，促進和便利在其領海以外按照本公約進行的海洋科學研究，並於適當時在其法律和規章規定的限制下，便利遵守本部份有關規定的海洋科學研究船進入其港口，並促進對這些船隻的協助。"},{"num":256,"title":"「區域」內的海洋科學研究","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"所有國家，不論其地理位置如何，和各主管國際組織均有權依第十一部份的規定在「區域」內進行海洋科學研究。"},{"num":257,"title":"在專屬經濟區以外的水體內的海洋科學研究","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"所有國家，不論其地理任置如何，和各主管國際組織均有權依本公約在專屬經濟區範圍以外的水體內進行海洋科學研究。"},{"num":258,"title":"部署和使用","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"在海洋環境的任何區域內部署和使用任何種類的科學研究設施或裝備，應遵守本公約為在任何這種區域內進行海洋科學研究所規定的同樣條件。"},{"num":259,"title":"法律地位","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"本節所指的設施或裝備不具有島嶼的地位。這些設施或裝備沒有自己的領海，其  存在也不影響領海、專屬經濟區或大陸架的界限的劃定。"},{"num":260,"title":"安全地帶","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"在科學研究設施的周圍可按照本公約有關規定設立不超過五百公尺的合理寬度的安全地帶。所有國家應確保其本國船隻尊重這些安全地帶。"},{"num":261,"title":"對國際航路的不干擾","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"任何種類的科學研究設施或裝備的部署和使用不應對已確定的國際航路構成障礙。"},{"num":262,"title":"識別標誌和警告信號","part":"第十三部份  海洋科學研究","section":"第四節  準則","content":"本節所指的設施或裝備應具有表明其登記的國家或所屬的國際組織的識別標誌，並應具有國際上議定的適當警告信號，以確保海上安全和空中航行安全，同時考慮到主管國際組織所制定的規則和標準。"},{"num":263,"title":"責任","part":"第十三部份  海洋科學研究","section":"第五節  責任","content":"一、各國和主管國際組織應負責確保其自己從事或為其從事的海洋科學研究均按照本公約進行。\n二、各國和各主管國際組織對其他國家、其自然人或法人或主管國際組織進行的海洋科學研究所採取的措施如果違反本公約，應承擔責任，並對這種措施所造成的損害提供補償。\n三、各國和各主管國際組織對其自己從事或為其從事的海洋科學研究產生海洋環境污染所造成的損害，應依據第二百三十五條承擔責任。"},{"num":264,"title":"爭端的解決","part":"第十三部份  海洋科學研究","section":"第六節  爭端的解決和臨時措施","content":"本公約關於海洋科學研究的規定在解釋或適用上的爭端，應按照第十五部份第二和第三節解決。"},{"num":265,"title":"臨時措施","part":"第十三部份  海洋科學研究","section":"第六節  爭端的解決和臨時措施","content":"在按照第十五部份第二和第三節解決一項爭端前，獲准進行海洋科學研究計劃的國家或主管國際組織，未經有關沿海國明示同意，不應准許開始或繼續進行研究活動。"},{"num":266,"title":"海洋技術發展和轉讓的促進","part":"第十四部份  海洋技術的發展和轉讓","section":"第一節  一般規定","content":"一、各國應直接或通過主管國際組織，按照其能力進行合作，積極促進在公平合理的條款和條件上發展和轉讓海洋科學和海洋技術。\n二、各國應對在海洋科學和技術能力方面可能需要並要求技術援助的國家，特別是發展中國家，包括內陸國和地理不利國，促進其在海洋資源的勘探、開發、養護和管理，海洋環境的保護和保全，海洋科學研究以及符合本公約的海洋環境內其他活動等方面海洋科學和技術能力的發展，以加速發展中國家的社會和經濟發展。\n三、各國應盡力促進有利的經濟和法律條件，以便在公平的基礎上為所有有關各方的利益轉讓海洋技術。"},{"num":267,"title":"合法利益的保護","part":"第十四部份  海洋技術的發展和轉讓","section":"第一節  一般規定","content":"各國在依據第二百六十六條促進合作時，應適當顧及一切合法利益，除其他外，包括海洋技術的持有者、供應者和接受者的權利和義務。"},{"num":268,"title":"基本目標","part":"第十四部份  海洋技術的發展和轉讓","section":"第一節  一般規定","content":"各國應直接或通過主管國際組織促進：\n(a) 海洋技術知識的取得、評價和傳播，並便利這種情報和資料的取得；\n(b) 適當的海洋技術的發展；\n(c) 必要的技術方面基本建設的發展，以便利海洋技術的轉讓；\n(d) 通過訓練和教育發展中國家和地區的國民，特別是其中最不發達國家和地區的國民的方式，以發展人力資源；\n(e) 所有各級的國際合作，特別是區域、分區域和雙邊的國際合作。"},{"num":269,"title":"實現基本目標的措施","part":"第十四部份  海洋技術的發展和轉讓","section":"第一節  一般規定","content":"為了實現第二百六十八條所指的各項目標，各國應直接或通過主管國際\n組織，除其他外，盡力：\n(a) 制訂技術合作方案，以便把一切種類的海洋技術有效地轉讓給在海洋技術方面可能需要並要求技術援助的國家，特別是發展中內陸國和地理不利國，以及未能建立或發展其自己在海洋科學和海洋資源勘探和開發方面的技術能力或發展這種技術的基本建設的其他發展中國家；\n(b) 促進在公平合理的條件下，訂立協定、合同和其他類似安排的有利條件；\n(c) 舉行關於科學和技術問題，特別是關於轉讓海洋技術的政策和方法的會議、討論會和座談會；\n(d) 促進科學工作者、技術和其他專家的交換；\n(e) 推行各種計劃，並促進聯合企業和其他形式的雙邊和多邊合作。"},{"num":270,"title":"國際合作的方式和方法","part":"第十四部份  海洋技術的發展和轉讓","section":"第二節  國際合作","content":"發展和轉讓海洋技術的國際合作，應在可行和適當的情形下，通過現有的雙邊、區域或多邊的方案進行，並應通過擴大的和新的方案進行，以便利海洋科學研究，海洋技術轉讓，特別是在新領域內，以及為海洋研究和發展在國際上籌供適當的資金。"},{"num":271,"title":"方針、準則和標準","part":"第十四部份  海洋技術的發展和轉讓","section":"第二節  國際合作","content":"各國應直接或通過主管國際組織，在雙邊基礎上或在國際組織或其他機構的範圍內，並在特別考慮到發展中國家的利益和需要的情形下，促進制訂海洋技術轉讓方面的一般接受的方針、準則和標準。"},{"num":272,"title":"國際方案的協調","part":"第十四部份  海洋技術的發展和轉讓","section":"第二節  國際合作","content":"在海洋技術轉讓方面，各國應盡力確保主管國際組織協調其活動，包括任何區域性和全球性方案，同時考慮到發展中國家特別是內陸國和地理不利國的利益和需要。"},{"num":273,"title":"與各國際組織和管理局的合作","part":"第十四部份  海洋技術的發展和轉讓","section":"第二節  國際合作","content":"各國應與各主管國際組織和管理局積極合作，鼓勵並便利向發展中國家及其國民和企業部轉讓關於「區域」內活動的技術和海洋技術。"},{"num":274,"title":"管理局的目標","part":"第十四部份  海洋技術的發展和轉讓","section":"第二節  國際合作","content":"管理局在的一切合法利益，其中除其他外包括技術持有者、供應者和接\n受者的權利和義務的限制下，在「區域」內活動方面應確保：\n(a) 在公平地區分配原則的基礎上，接受不論為沿海國、內陸國或地理不利國的發展中國家的國民，以便訓練其為管理局工作所需的管理、研究和技術人員；\n(b) 使所有國家，特別是在這一方面可能需要並要求技術援助的發展中國家，能得到有關的裝備、機械、裝置和作業程序的技術文件；\n(c) 由管理局制訂適當的規定，以便利在海洋技術方面可能需要並要求技術援助的國家，特別是發展中國家，取得這種援助，並便利其國民取得必要的技能和專門知識，包括專業訓練；\n(d) 通過本公約所規定的任何財政安排，協助在這一方面可能需要並要求技術援助的國家，特別是發展中國家，取得必要的裝備、作業程序、工廠和其他技術知識。"},{"num":275,"title":"國家中心的設立","part":"第十四部份  海洋技術的發展和轉讓","section":"第三節  國家和區域性海洋科學和技術中心","content":"一、各國應直接或通過主管國際組織和管理局促進設立國家海洋科學和技術研究中心，特別是在發展中沿海國設立，並加強現有的國家中心，以鼓勵和推進發展中沿海國進行海洋科學研究，並提高這些國家為了它們的經濟利益而利用和保全其海洋資源的國家能力。\n二、各國應通過各主管國際組織和管理局給予適當的支持，便利設立和加強此種國家中心，以便向可能需要並要求此種援助的國家提供先進的訓練設施和必要的裝備、技能和專門知識以及技術專家。"},{"num":276,"title":"區域性中心的設立","part":"第十四部份  海洋技術的發展和轉讓","section":"第三節  國家和區域性海洋科學和技術中心","content":"一、各國與各主管國際組織、管理局和國家海洋科學和技術研究機構協調下，應促進設立區域性海洋科學和技術研究中心，特別是在發展中國家設立，以鼓勵和推進發展中國家進行海洋科學研究，並促進海洋技術的轉讓。\n二、一個區域內的所有國家都應與其中各區域性中心合作，以便確保更有效地達成目標。"},{"num":277,"title":"區域性中心的職務","part":"第十四部份  海洋技術的發展和轉讓","section":"第三節  國家和區域性海洋科學和技術中心","content":"這種區域性中心的職務，除其他外，應包括：\n(a) 對海洋科學和技術研究的各方面，特別是對海洋生物學，包括生物資源的養護和管理、海洋學、水文學、工程學、海底地質勘探、採礦和海水淡化技術的各級訓練和教育方案；\n(b) 管理方面的研究；\n(c) 有關保護和保全海洋環境以及防止、減少和控制污染的研究方案；\n(d) 區域性會議、討論會和座談會的組織；\n(e) 海洋科學和技術的資料和情報的取得和處理；\n(f) 海洋科學和技術研究成果由易於取得的出版物迅速傳播；\n(g) 有關海洋技術轉讓的國家政策的公布，和對這種政策的有系統的比較研究；\n(h) 關於技術的銷售以及有關專利權的合同和其他安排的情報的彙編和整理；\n(i) 與區域內其他國家的技術合作。"},{"num":278,"title":"國際組織間的合作","part":"第十四部份  海洋技術的發展和轉讓","section":"第四節  國際組織問的合作","content":"本部份和第十三部份所指的主管國際組織應採取一切適當措施，以便直接或在彼此密切合作中，確保本部份規定的它們的職務和責任得到有效的履行。"},{"num":279,"title":"用和平方法解決爭端的義務","part":"第十五部份  爭端的解決","section":"第一節  一般規定","content":"各締約國應按照「聯合國憲章」第二條第三項以和平方法解決它們之間有關本公約的解釋或適用的任何爭端，並應為此目的以「憲章」第三十三條第一項所指的方法求得解決。"},{"num":280,"title":"用爭端各方選擇的任何和平方法解決爭端","part":"第十五部份  爭端的解決","section":"第一節  一般規定","content":"本公約的任何規定均不損害任何締約國於任何時候協議用自行選擇的任何和平方法解決它們之間有關本公約的解釋或適用的爭端的權利。"},{"num":281,"title":"爭端各方在爭端未得到解決時所適用的程序","part":"第十五部份  爭端的解決","section":"第一節  一般規定","content":"一、作為有關本公約的解釋或適用的爭端各方的締約各國，如已協議用自行選擇的和平方法來謀求解決爭端，則只有在訴諸這種方法而仍未得到解決以及爭端各方間的協議並不排除任何其他程序的情形下，才適用本部份所規定的程序。\n二、爭端各方如已就時限也達成協議，則只有在該時限局屆滿時才適用第一款。"},{"num":282,"title":"一般性、區域性或雙邊協定的義務","part":"第十五部份  爭端的解決","section":"第一節  一般規定","content":"作為有關本公約的解釋或適用的爭端各方的締約各國如已通過一般性、區域性或雙邊協定或以其他方式協議，經爭端任何一方請求，應將這種爭端提交導致有拘束力裁判的程序，該程序應代替本部份規定的程序而適用，除非爭端各方另有協議。"},{"num":283,"title":"交換意見的義務","part":"第十五部份  爭端的解決","section":"第一節  一般規定","content":"一、如果締約國之間對本公約的解釋或適用發生爭端，爭端各方應迅速就以談判或其他和平方法解決爭端一事交換意見。\n二、如果解決這種爭端的程序已經終止，而爭端仍未得到解決，或如已達成解決辦法，而情況要求就解決辦法的實施方式進行協商時，爭端各方也應迅速著手交換意見。"},{"num":284,"title":"調解","part":"第十五部份  爭端的解決","section":"第一節  一般規定","content":"一、作為有關本公約的解釋或適用的爭端一方的締約國，可邀請他方按照附件五第一節規定的程序或另一種調解程序，將爭端提交調解。\n二、如爭端他方接受邀請，而且爭端各方已就適用的調解程序達成協議，任何一方可將爭端提交該程序。\n三、如爭端他方未接受邀請，或爭端各方未就程序達成協議，調解應視為終止。\n四、除非爭端各方另有協議，爭端提交調解後，調解僅可按照協議的調解程序終止。"},{"num":285,"title":"本節對依據第十一部份提交的爭端的適用","part":"第十五部份  爭端的解決","section":"第一節  一般規定","content":"本節適用於依據第十一部份第五節應按照本部份規定的程序解決的任何爭端。締約國以外的實體如為這種爭端的一方，本節比照適用。"},{"num":286,"title":"本節規定的程序的適用","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"在第三節限制下，有關本公約的解釋或適用的任何爭端，如已訴諸第一節而仍未得到解決，經爭端任何一方請求，應提交根據本節具有管轄權的法院或法庭。"},{"num":287,"title":"程序的選擇","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"一、一國在簽署、批准或加入本公約時，或在其後任何時間，應有自由用書面聲明的方式選擇下列一個或一個以上方法，以解決有關本公約的解釋或適用的爭端：\n(a)按照附件六設立的國際海洋法法庭；\n(b)國際法院；\n(c)按照附件七組成的仲裁法庭；\n(d)按照附件八組成的處理其中所列的一類或一類以上爭端的特別仲裁法庭。\n二、根據第一款作出的聲明，不應影響締約國在第十一部份第五節規定的範圍內和以該節規定的方式，接受國際海洋法法庭海底爭端分庭管轄的義務，該聲明亦不受締約國的這種義務的影響。\n三、締約國如為有效聲明所未包括的爭端的一方，應視為已接受附件七所規定的仲裁。\n四、如果爭端各方已接受同一程序以解決這項爭端，除各方另有協議外，爭端僅可提交該程序。\n五、如果爭端各方未接受同一程序以解決這項爭端，除各方另有協議外，爭端僅可提交附件七所規定的仲裁。\n六、根據第一款作出的聲明，應繼續有效，至撤銷聲明的通知交存於聯合國秘書長後滿三個月為止。\n七、新的聲明、撤銷聲明的通知或聲明的滿期，對於根據本條具有管轄權的法院或法庭進行中的程序並無任何影響，除非爭端各方另有協議。\n八、本條所指的聲明和通知應交存於聯合國秘書長，秘書長應將其副本分送各締約國。"},{"num":288,"title":"管轄權","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"一、第二百八十七載條所指的法院或法庭，對於按照本部份向其提出的有關本公約的解釋或適用的任何爭端，應具有管轄權。\n二、第二百八十七條所指的法院或法庭，對於按照與本公約的目的有關的國際協定向其提出的有關該協定的解釋或適用的任何爭端，也應具有管轄權。\n三、按照附件六設立的國際海洋法法庭海底爭端分庭和第十一部份第五節所指的任何其他分庭或仲裁法庭，對按照該節向其提出的任何事項，應具有管轄權。\n四、對於法院或法庭是否具有管轄權如果發生爭端，這一問題應由該法院或法庭以裁定解決。"},{"num":289,"title":"專家","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"對於涉及科學和技術問題的任何爭端，根據本節行使管轄權的法院或法庭，可在爭端一方請求下或自己主動，並同爭端各方協商，最好從按照附件八第二條編制的有關名單中，推選至少兩名科學或技術專家列席法院或法庭，但無表決權。"},{"num":290,"title":"臨時措施","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"一、如果爭端已經正式提交法院或法庭，而該法院或法庭依據初步證明認為其根據本部份或第十一部份第五節具有管轄權，該法院或法庭可在最後裁判前，規定其根據情況認為適當的任何臨時措施，以保全爭端各方的各自權利或防止對海洋環境的嚴重損害。\n二、臨時措施所根據的情況一旦改變或不復存在，即可修改或撤銷。\n三、臨時措施僅在爭端一方提出請求並使爭端各方有陳述意見的機會後，才可根據本條予以規定、修改或撤銷。\n四、法院或法庭應將臨時措施的規定、修改或撤銷迅速通知爭端各方及其認為適當的其他締約國。\n五、在爭端根據本節正向其提交的仲裁法庭組成以前，經爭端各方協議的任何法院或法庭、如在請求規定臨時措施之日起兩週內不能達成這種協議，則為國際海洋法法庭，或在關於「區域」內活動時的海底爭端分庭，如果根據初步證明認為將予組成的法庭組成的法庭具有管轄權，而且認為情況緊急有此必要，可按照本條規定、修改或撤銷臨時措施。受理爭端的法庭一旦組成，即可依照第一至第四款行事，對這種臨時措施予以修改、撤銷或確認。\n六、爭端各方應迅遵從根據本條所規定的任何臨時措施。"},{"num":291,"title":"使用程序的機會","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"一、本部份規定的所有解決爭端程序應對各締約國開放。\n二、本部份規定的解決爭端程序應僅依本公約具體規定對締約國以外的實體開放。"},{"num":292,"title":"船隻和船員的迅速釋放","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"一、如果締約國當局扣留了一艘懸掛另一締約國旗幟的船隻，而且據指控，扣留國在合理的保證書或其他財政擔保經提供後，仍然沒有遵從本公約的規定，將該船隻或其船員迅速釋放，釋放問題可向爭端各方協議的任何法院或法庭提出，如從扣留時起十日內不能達成這種協議，則除爭端各方另有協議外，可向扣留國根據第二百八十七條接受的法院或法庭，或向國際海法法庭提出。\n二、這種釋放的申請，僅可由船旗國或以該國名義提出。\n三、法院或法庭應不遲延地處理關於釋放的申請，並且應僅處理釋放問題，而不影響在主管的國內法庭對該船隻、其船主或船員的任何案件的是非曲直。扣留國當局應仍有權隨時釋放該船隻或其船員。\n四、在法院或法庭裁定的保證書或其他財政擔保經提供後，扣留國當局應迅速遵從法院或法庭關於釋放船隻或其船員的裁定。"},{"num":293,"title":"適用的法律","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"一、根據本節具有管轄權的法院或法庭應適用本公約和其他與本公約不相牴觸的國際法規則。\n二、如經當事各方同意，第一款並不妨害根據本節具有管轄權的法院或法庭按照公允和善良的原則對一項案件作出裁判的權力。"},{"num":294,"title":"初步程序","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"一、第二百八十七條所規定的法院或法庭，就第二百九十七條所指爭端向其提出的申請，應經一方請求決定，或可自己主動決定，該項權利主張是否構成濫用法律程序，或者根據初步證明是否有理由。法院或法庭如決定項主張構成濫用法律程序或者根據初步證明並無理由，即不應對該案採取任何進一步行動。\n二、法院或法庭收到這種申請，應立即將這項申請通知爭端他方，並應指定爭端他方可請求按照第一款作出一項決定的合理期限。\n三、本條的任何規定不影響爭端各方按照適用的程序規則提出初步反對的權利。"},{"num":295,"title":"用盡當地補救辦法","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"締約國間有關本公約的解釋或適用的任何爭端，僅在依照國際法的要求用盡當地補救辦法後，才可提交本節規定的程序。"},{"num":296,"title":"裁判的確定性和拘束力","part":"第十五部份  爭端的解決","section":"第二節  導致有拘束力裁判的強制程序","content":"一、根據本節具有管轄權的法院或法庭對爭端所作的任何裁判應有確定性，爭諯所有各方均應遵從。\n二、這種裁判僅在爭端各方間和對該特定爭端具有拘束力。"},{"num":297,"title":"適用第二節的限制","part":"第十五部份  爭端的解決","section":"第三節  適用第二節的限制和例外","content":"一、關於因沿海國行使本公約規定的主權權利或管轄權而發生的對本公約的解釋或適用的爭端，還有下列情形，應遵守第二節所規定的程序：\n(a)據指控，沿海國在第五十八條規定的關於航行、飛越或鋪設海底電纜和管道的自由和權利，或關於海洋的其他國際合法用途方面，有違反本公約的規定的行為；\n(b)據指控，一國在行使上述自由、權利或用途時，有違反本公約或沿海國按照本公約和其他與本公約不相牴觸的國際法規則制定的法律或規章的行為；或\n(c)據指控，沿海國有違反適用於該沿海國、並由本公約所制訂或通過主管國際組織或外交會議按照本公約制定的關於保護和保全海洋環境的特定國際規則和標準的行為。\n二、\n(a)本公約關於海洋科學研究的規定在解釋或適用上的爭端，應按照第二節解決，但對下列情形所引起的任何爭端，沿海國並無義務同意將其提交這種解決程序：\n(1) 沿海洋國按照第二百四十六條行使權利或斟酌決定權；或\n(2) 沿海國按照第二百五十三條決定命令暫停或停止一項研究計劃。\n(b)因進行研究國家指控沿海國對某一特定計劃行使第二百四十六和第二百五十三條所規定權利的方式不符合本公約而引起的爭端，經任何一方請求，應按照附件五第二節提交調解程序，但調解委員會對沿海國行使斟酌決定權指定第二百四十六條第六款所指特定區域，或按照第二百四十六條第五款行使斟酌決定權拒不同意，不應提出疑問。\n三、\n(a)對本公約關於漁業的規定在解釋或適用上的爭端，應按照第二節解決，但沿海國並無義務同意將任何有關其對專屬經濟區內生物資源的主權權利或此項權利的行使的爭端，包括關於其對決定可捕量、其捕撈能力、分配剩餘量給其他國家、其關於養護和管理這種資源的法律和規章中所制訂的條款和條件的斟酌決定權的爭端，提交這種解決程序。\n(b)據指控有下列情事時，如已訴諸第一節而仍未得到解決，經爭端任何一方請求，應將爭端提交附件五第二節所規定的調解程序：\n(1) 一個沿海國明顯地沒有履行其義務，通過適當的養護和管理措施，以確保專屬經濟區內生物資源的維持不致受到嚴重危害；\n(2) 一個沿海國，經另一國請求，對該另一國有意捕撈的種群，專斷地拒絕決定可捕量及沿海國捕撈生物資源的能力；或\n(3) 一個沿海國專斷地拒絕根據第六十二、第六十九和第七十號條以及該沿海國所制訂的符合本公約的條款和條件，將其已宣佈存在的剩餘量的全部或一部份分配給任何國家。\n(c)在任何情形下，調解委員會不得以其斟酌決定權代替沿海國的斟酌決定權。\n(d)調解委員會的報告應送交有關的國際組織。\n(e)各締約國在依據第六十九和七十條談判協定時，除另有協議外，應列入一個條款，規定各締約國為了盡量減少對協定的解釋或適用發生爭議的可能性所應採取的措施，並規定如果仍然發生爭議，各締約國應採取何種步驟。"},{"num":298,"title":"適用第二節的任擇性例外","part":"第十五部份  爭端的解決","section":"第三節  適用第二節的限制和例外","content":"一、一國在簽署、批准或加入本公約時，或在其後任何時間，在不妨害根據第一節所產生的義務的情形下，可以書面聲明對於下列各類爭端的一類或一類以上，不接受第二節規定的一種或一種以上的程序：\n(a)\n(1) 關於劃定海洋邊界的第十五、第七十四和第八十三條在解釋或適用上的爭端，或涉及歷史性海灣或所有權的爭端，但如這種爭端發生於本公約生效之後，經爭端各方談判仍未能在合理期間內達成協議，則作此聲明的國家，經爭端任何一方請求，應同意將該事項提交附件五第二節所規定的調解；此外，任何爭端如果必然涉及同時審議與大陸或島嶼陸地領土的主權或其他權利稅有關的任何尚未解決的爭端，則不應提交這一程序；\n(2) 在調解委員會提出其中說明所根據的理由的報告後，爭端各方應根據各報告以談判達成協議；如果談判未能達成協議，經彼此同意，爭端各方應將問題提交第二節所規定的程序之一，除非爭端各方另有協議；\n(3) 本項不適用於爭端各方已以一項安排確定解決的任何海洋邊界爭端，也不適用於按照對爭端各方有拘束力的雙邊或多邊協定加以解決的任何爭端；\n(b)關於軍事活動，包括從事非商業服務的政府船隻和飛機的軍事活動的爭端，以及根據第二百九十七條第二和第三款不屬法院或法庭管轄的關於行使主權權利或管轄權的法律執行活動的爭端；\n(c)正由聯合安全理事會執行「聯合國憲章」所賦予的職務的爭端，但安全理事會決定將該事項從其議程刪除或要求爭端各方用本公約規定的方法解決該爭端者除外。\n二、根據第一款作出聲明的締約國，可隨時撤回聲明，或同意將該聲明所排除的爭端提交本公約規定的任何程序。\n三、根據第一款作出聲明的締約國，應無權對另一締約國，將屬於被除外的一類爭端的任何爭端，未經該另一締約國同意，提交本公約的任何程序。\n四、如締約國之一已根據第一款(a) 項作出聲明，任何其他締約國可對作出聲明締約國，將屬於被除外一類的任何爭端提交這種聲明內指明的程序。\n五、新的聲明，或聲明的撤回，對按照本條在法院或法庭進行中的程序並  無任何影響，除非爭端各方另有協議。\n六、根據本條作出的聲明和撤回聲明的通知，應交存於聯合國秘書長，秘書長應將其副本分送各締約國。"},{"num":299,"title":"爭端各方議定程序的權利","part":"第十五部份  爭端的解決","section":"第三節  適用第二節的限制和例外","content":"一、根據第二百九十七條或以一項按照第二百九十八條發表的聲明予以除外，不依第二節所規定的解決爭端程序處理的爭端，只有經爭端各方協議，才可提交這種程序。\n二、本節的任何規定不妨害爭端各方為解決這種爭端或達成和睦解決而協議某種其他程序的權利。"},{"num":300,"title":"誠意和濫用權利","part":"第十六部份  一般規定","section":"第三節  適用第二節的限制和例外","content":"締約國應誠意履行根據本公約承擔的義務並應以不致構成濫用權利的方式，行使本公約所承認的權利、管轄權和自由。"},{"num":301,"title":"海洋的和平使用","part":"第十六部份  一般規定","section":"第三節  適用第二節的限制和例外","content":"締約國在根據本公約行使其權利和履行其義務時，應不對任何國家的領土完整或政治獨立進行任何武力威脅或使用武力，或以任何其他與「聯合國憲章」所載國際法原則不符的方式進行武力威脅或使用武力。"},{"num":302,"title":"洩露資料","part":"第十六部份  一般規定","section":"第三節  適用第二節的限制和例外","content":"在不妨害締約國訴諸本公約規定的解決爭端程序的權利的情形下，本公約的任何規定不應視為要求一個締約國於履行其本公約規定的義務時提供如經洩露即違反該國基本安全利益的情報。"},{"num":303,"title":"在海洋發現的考古和歷史文物","part":"第十六部份  一般規定","section":"第三節  適用第二節的限制和例外","content":"一、各國有義務保護在海洋發現的考古和歷史性文物，並應為此目的進行合作。\n二、為了控制這種文物的販運，沿海國可在適用第三十三條時推定，未經沿海國許可將這些文物移出該條所指海域的海床，將造成在其領土或領海內對該條所指法律和規章的違犯。\n三、本條的任何規定不影響可辦識的物主的權利、打撈法或其他海事法規則，也不影響關於文化交流的法律和慣例。\n四、本條不妨害關於保護考古和歷史性文物的其他國際協定和國際法規則。"},{"num":304,"title":"損害賠償責任","part":"第十六部份  一般規定","section":"第三節  適用第二節的限制和例外","content":"本公約關於損害賠償責任的條款不妨礙現行規則的適用和國際法上其他有關賠償責任的規則的發展。"},{"num":305,"title":"簽字","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、本公約應開放給下列各方簽字\n(a)所有國家；\n(b)納米比亞，由聯合國納米比亞理事會代表；\n(c)在一項經聯合國按照其大會第一五一四（ＸＶ）號決議監督並核准的自決行動中選擇了自治地位，並對本公約所規定的事項具有權限，其中包括就該等事項締結條約的權限的一切自治聯繫國；\n(d)按照其各自的聯繫文書的規定，對本公約所規定的事項具有權限，其中包括就該等事項締結條約的權限的一切自治聯繫國；\n(e)凡享有經聯合國所承認的充分內部自治，但尚未按照大會第一五一四（ＸＶ）號決議取得完全獨立的一切領土，這種領土須對本公約所規定的事項具有權限，其中包括就該等事項締結條約的權限；\n(f)國際組織，按照附件九。\n二、本公司應持續開放簽字，至一九八四年十二月九日止在牙買加外交部簽字，此外，從一九八三年七月一日起至一九八四年十二月九日止，在紐約聯合國總部簽字。"},{"num":306,"title":"批准和正式確認","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"本公約須經各國和第三百零五條第一款(b) 、(c) 、(d)和(e)項所指的其他實體批准，並經該條第一款(f) 項所指的實體按照附件九予以正式確認。批准書和正式確認書應交存於聯合國秘書長。"},{"num":307,"title":"加入","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"本公約應持續開放給各國和第三百零五條所指的其他實體加入。第三百零五條第一款(f) 項所指的實體應按照附件九加入。加入書應交存於聯合國秘書長。"},{"num":308,"title":"生效","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、本公約應自第六十份批准書或加入書交存之日後十二個月生效。\n二、對於在第六十份批准書或加入書交存以後批准或加入本公約的每一國家，在第一款限制下，本公約應在該國將批准書或加入書交存後第三十天起生效。\n三、管理局大會應在本公約生效之日開會，並應選舉管理局的理事會。如果第一百六十一條的規定不能嚴格適用，則第一屆理事會應以符合該條目的的方式組成。\n四、籌備委員會草擬的規則、規章和程序，應在管理局按照第十一部份予以正式通過以前暫時適用。\n五、管理局及各機關應按照關於預備性投資的第三次聯合國海洋法會議決議二以及籌備委員會依據該決議作出的各項決定行事。"},{"num":309,"title":"保留和例外","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"除非本公約其他條款明示許可，對本公約不得作出保留或例外。"},{"num":310,"title":"聲明和說明","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"第三百零九條不排除一國在簽署、批准或加入本公約時，作出不論如何措辭或用何種名稱的聲明或說明，目的在於除其他外使該國國內法律和規章同本公約規定取得協調，但須這種聲明或說明無意排除或修改本公約規定適用於該締約國的法律效力。"},{"num":311,"title":"同其他公約和國際協定的關係","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、在各締約國間，本公約應優於一九五八年四月二十九日日內瓦海洋法公約。\n二、本公約應不改變各締約國根據與本公約相符的其他條約而產生的權利和義務，但以不影響其他締約國根據本公約享有其權利或履行其義務為限。\n三、本公約兩個或兩個以上締約國可訂立僅在各該國相互關係上適用的、修改或暫停適用本公約的規定的協定，但須這種協定不涉及本公約中某項規定，如對該規定予以減損就與公約的目的及宗旨的有效執行不相符合，而且這種協定不應影響本公約所載各項基本原則的適用，同時這種協定的規定不影響其他締約國根據本公約享有其權利和履行其義務。\n四、有意訂立第三款所指任何協定的締約國，應通過本公約的保管者將其訂立協定的意思及該協定所規定對本公約的修改或暫停適用通知其他締約國。\n五、本條不影響本公約其他條款明示許可或保持的其他國際協定。\n六、締約國同意第一百三十六條所載關於人類共同繼承財產的基本原則不應有任何修正，並同意它們不應參加任何減損該原則的協定。"},{"num":312,"title":"修正","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、自本公約生效之日起十年期間屆滿後，締約國可給聯合國秘書長書面通知，對本公約提出不涉及「區域」內活動的具體修正案，並要求召開會議審議這種提出的修正案。秘書長應將這種通知分送所有締約國。如果在分送通知之日起十二個月以內，有不少於半數的締約國作出答覆贊成這一要求，秘書長應召開會議。\n二、適用於修正會議的作出決定的程序應與適用於第三次聯合國海洋法會議的相同，除非會議另有決定。會議應作出各種努力就任何修正案以協商一致方式達成協議，且除非為謀求協商一致已用盡一切努力不應就其進行表決。"},{"num":313,"title":"以簡化程序進行修正","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、締約國可給聯合國秘書長書面通知，提議將本公約的修正案不經召開會議，以本條規定的簡化程序予以通過，但關於「區域」內活動的修正案除外。秘書長應將通知分送所有締約國。\n二、如果在從分送通知之日起十二個月內，一個締約國反對提出的修正案或反對以簡化程序通過修正案的提案，該提案應視為未通過。秘書長應立即相應地通知所有締約國。\n三、如果從分送通知之日起十二個月後，沒有任何締約國反對提出的修正案或反對以簡化程序將其通過的提案，提出的修正案應視為已通過。秘書長應通知所有締約國提出的修正案已獲通過。"},{"num":314,"title":"對本公約專門同「區域」內活動有關的規定的修正案","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、締約國可給管理局秘書長書面通知，對本公約專門同「區域」內活動有關的規定，其中包括附件六第四節，提出某項修正案。秘書長應將這種通知分送所有締約國。提出的修正案經理事會核准後，應由大會核准。各締約國代表應有全權審議並核准提出的修正案。提出的修正案經理事會和大會核准後，應視為已獲通過。\n二、理事會和大會在根據第一款核准任何修正案以前，應確保該修正案在按照第一百五十五條召開審查會議以前不妨害勘探和開發「區域」內資源的制度。"},{"num":315,"title":"修正案的簽字、批准、加入和有效文本","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、本公約的修正案一旦通過，應自通過之日起十二個月內在紐約聯合國總部對各締約國開放簽字，除非修正案本身另有決定。\n二、第三百零六、第三百零七和第三百二十條適用於本公約的所有修正案。"},{"num":316,"title":"修正案的生效","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、除第五款所指修正案外，本公約的修正案，應在三分之二締約國或六十個締約國（以較大的數目為準）交存批准書或加入書後第三十天對批准或加入的締約國生效。這種修正案不應影響其他締約國根據本公約享有其權利或履行其義務。\n二、一項修正案可規定需要有比本條所規定者更多的批准書或加入書才能生效。\n三、對於在規定數目的批准書或加入書交存後批准或加入第一款所指修正案的締約國，修正案應在其批准書或加入書交存後第三十天生效。\n四、在修正案按照第一款生效後成為本公約締約國的國家，應在該國不表示其他意思的情形下：\n(a)視為如此修正後的本公約的締約國，並\n(b)在其對不受修正案拘束的任何締約國的關係上，視為未修正的本公約的締約國。\n五、專門關於「區域」內活動的任何修正案和附件六的任何修正案，應在四分之三締約國交存批准書或加入書一年後對所有締約國生效。\n六、在修正案按照第五款生效後成為本公約締約國的國家，應視為如此修正本公約的締約國。"},{"num":317,"title":"退出","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、締約國可給聯合國秘書長書面通知退出本公約，並可說明其理由。未說明理由應不影響退出的效力。退出應自接到通知之日後一年生效，除非通知中指明一個較後的日期。\n二、一國不應以退出為理由而解除該國為本公約締約國時所承擔的財政和合同義務，退出也不應影響本公約對該國停止生效前因本公約的執行而產生的該國的任何權利、義務或法律地位。\n三、退出決不影響任何締約國按照國際法而無須基於本公約即應擔負的履行本公約所載任何義務的責任。"},{"num":318,"title":"附件的地位","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"各附件為本公約的組成部份，除另有明文規定外，凡提到本公約或其一個部份也就包括提到與其有關的附件。"},{"num":319,"title":"保管者","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"一、聯合國秘書長應為本公約及其修正案的保管者。\n二、秘書長除了作為保管者的職責以外應：\n(a)將因本公約產生的一般性問題向所有締約國其修正案國、管理局和主管國際組織提出報告；\n(b)將批准、正式確認和加入本公約及其修正案和退出本公約的情況通知管理局；\n(c)按照第三百一十一條第四款將各項協定通知締約國；\n(d)向締約國分送按照本公約通過的修正案，以供批准或加入；\n(e)按照本公約召開必要的締約國會議。\n三、\n(a)秘書長應向第一百五十六條所指的觀察員遞送：\n(1) 第二款(a) 項所指的一切報告；\n(2) 第二款(b) 和(c) 項所指的通知；和\n(3) 第二款(d) 項所指的修正案案文，供其參考。\n(b)秘書長應邀請這種觀察員以觀察員身份參加第二款(e) 項所指的締約國會議。"},{"num":320,"title":"有效文本","part":"第十七部份  最後條款","section":"第三節  適用第二節的限制和例外","content":"本公約原本應在第三百零五條第二款限制下交存於聯合國秘書長，其阿拉伯、中文、英文、法文、俄文和西班牙文文本具有同等效力。\n為此，下列全權代表，經正式授權，在本公約上簽字，以資證明。一九八二年十二月十日訂於蒙特哥灣。"}] },
  vclt: { key:"vclt", short:"條約法公約", full:"維也納條約法公約", eyebrow:"VCLT · 1969", total: 85, minNum:1, maxNum:85, parts: 8, unitLabel:"部份", articles: [{"num":1,"title":"本公約之範圍","part":"第一編　　導言","section":"","content":"本公約適用於國家間之條約。"},{"num":2,"title":"用語","part":"第一編　　導言","section":"","content":"一、就適用本公約而言：\n（甲）稱\"條約\"者，謂國家間所締結而以國際法為準之國際書面協定，不論其載於一項單獨文書或兩項以上相互有關之文書內，亦不論其特定名稱為何；\n（乙）稱\"批准\"、\"接受\"、\"贊同\"及\"加入\"者，各依本義指一國據以在國際上確定其同意承受條約拘束之國際行為；\n（丙）稱\"全權證書\"者，謂一國主管當局所頒發，指派一人或數人代表該國談判、議定或認證條約約文，表示該國同意承受條約拘束，或完成有關條約之任何其他行為之文件；\n（丁）稱\"保留\"者，謂一國於簽署、批准、接受、贊同或加入條約時所作之片面聲明，不論措辭或名稱為何，其目的在摒除或更改條約中若干規定對該國適用時之法律效果；\n（戊）稱\"談判國\"者，謂參與草擬及議定條約約文之國家；\n（己）稱\"締約國\"者，謂不問條約已未生效，同意承受條約拘束之國家；\n（庚）稱\"當事國\"者，謂同意承受條約拘束及條約對其有效之國家；\n（辛）稱\"第三國\"者，謂非條約當事國之國家；\n（壬）稱\"國際組織\"者，謂政府間之組織。\n二、第一項關於本公約內各項用語之規定不妨礙此等用語在任何國家國內法上之使用或所具有之意義。"},{"num":3,"title":"不屬本公約範圍之國際協定","part":"第一編　　導言","section":"","content":"1. 本公約不適用於國家與其他國際法主體間所締結之國際協定或此種其他國際法主體間之國際協定或非書面國際協定，此一事實並不影響：\n2. （甲）此類協定之法律效力；\n3. （乙）本公約所載任何規則之依照國際法而毋須基於本公約原應適用於此類協定者，對於此類協定之適用；\n4. （丙）本公約之適用於國家間以亦有其他國際法主體為其當事者之國際協定為根據之彼此關係。"},{"num":4,"title":"本公約不溯既往","part":"第一編　　導言","section":"","content":"以不妨礙本公約所載任何規則之依國際法而毋須基於本公約原應適用於條約者之適用為限，本公約僅對各國於本公約對各該國生效後所締結之條約適用之。"},{"num":5,"title":"組成國際組織之條約及在1國際組織內議定之條約","part":"第一編　　導言","section":"","content":"本公約適用於為一國際組織組織約章之任何條約及在一國際組織內議定之任何條約，但對該組織任何有關規則並無妨礙。"},{"num":6,"title":"國家締結條約之能力","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"每一國家皆有締結條約之能力。"},{"num":7,"title":"全權證書","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"一、任一人員如有下列情形之一，視為代表一國議定或認證條約約文或表示該國承受條約拘束之同意：\n（甲）出具適當之全權證書；或\n（乙）由於有關國家之慣例或由於其他情況可見此等國家之意思係認為該人員為此事代表該國而可免除全權證書。\n二、下列人員由於所任職務毋須出具全權證書，視為代表其國家：\n（甲）國家元首、政府首長及外交部長，為實施關於締結條約之一切行為；\n（乙）使館館長，為議定派遣國與駐在國間條約約文；\n（丙）國家派往國際會議或派駐國際組織或該國際組織一機關之代表，為議定在該會議、組織或機關內議定之條約約文。"},{"num":8,"title":"未經授權所實施行為之事後確認","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"關於締結條約之行為係依第七條不能視為經授權為此事代表一國之人員所實施者，非經該國事後確認，不發生法律效果。"},{"num":9,"title":"約文之議定","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"一、除依第二項之規定外，議定條約約文應以所有參加草擬約文國家之同意為之。\n二、國際會議議定條約之約文應以出席及參加表決國家三分二多數之表決為之，但此等國家以同樣多數決定適用另一規則者不在此限。"},{"num":10,"title":"約文之認證","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"1. 條約約文依下列方法確定為作準定本：\n2. （甲）依約文所載或經參加草擬約文國家協議之程序；或\n3. （乙）倘無此項程序，由此等國家代表在條約約文上，或在載有約文之會議蕆事文件上簽署，作待核准之簽署或草簽。"},{"num":11,"title":"表示同意承受條約拘束之方式","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"一國承受條約拘束之同意得以簽署、交換構成條約之文書、批准、接受、贊同或加入、或任何其他同意之方式表示之。"},{"num":12,"title":"以簽署表示承受條約拘束之同意","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"一、遇有下列情形之一，一國承受條約拘束之同意以該國代表之簽署表示之：\n（甲）條約規定簽署有此效果；\n（乙）另經確定談判國協議簽署有此效果；或\n（丙）該國使簽署有此效果之意思可見諸其代表所奉之全權證書或已於談判時有此表示。\n二、就適用第一項而言：\n（甲）倘經確定談判國有此協議，約文之草簽構成條約之簽署；\n（乙）代表對條約作待核准之簽署，倘經其本國確認，即構成條約之正式簽署。"},{"num":13,"title":"以交換構成條約之文書表示承受條約拘束之同意","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"1. 遇有下列情形之一，國家同意承受由彼此間交換之文書構成之條約拘束，以此種交換表示之：\n2. （甲）文書規定此種交換有此效果；或\n3. （乙）另經確定此等國家協議文書之交換有此效果。"},{"num":14,"title":"以批准、接受或贊同表示承受條約拘束之同意","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"一、遇有下列情形之一，一國承受條約拘束之同意，以批准表示之：\n（甲）條約規定以批准方式表示同意；\n（乙）另經確定談判國協議需要批准；\n（丙）該國代表已對條約作須經批准之簽署；或\n（丁）該國對條約作須經批准之簽署之意思可見諸其代表所奉之全權證書，或已於談判時有此表示。\n二、一國承受條約拘束之同意以接受或贊同方式表示者，其條件與適用於批准者同。"},{"num":15,"title":"以加入表示承受條約拘束之同意","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"1. 遇有下列情形之一，一國承受條約拘束之同意以加入表示之：\n2. （甲）條約規定該國得以加入方式表示此種同意；\n3. （乙）另經確定談判國協議該國得以加入方式表示此種同意；\n4. （丙）全體當事國嗣後協議該國得以加入方式表示此種同意。"},{"num":16,"title":"批准書、接受書、贊同書或加入書之交換或交存","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"1. 除條約另有規定外，批准書、接受書、贊同書或加入書依下列方式確定一國承受條約拘束之同意：\n2. （甲）由締約國互相交換；\n3. （乙）將文書交存保管機關；或\n4. （丙）如經協議，通知締約國或保管機關。"},{"num":17,"title":"同意承受條約一部分之拘束及不同規定之選擇","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"一、以不妨礙第十九條至第二十三條為限，一國同意承受條約一部分之拘束，僅於條約許可或其他締約國同意時有效。\n二、一國同意承受許可選擇不同規定之條約之拘束，僅於指明其所同意之規定時有效。"},{"num":18,"title":"不得在條約生效前妨礙其目的及宗旨之義務","part":"第二編　　條約之締結及生效","section":"第一節　　條約之締結","content":"1. 一國負有義務不得採取任何足以妨礙條約目的及宗旨之行動：\n2. （甲）如該國已簽署條約或已交換構成條約之文書而須經批准、接受或贊同，但尚未明白表示不欲成為條約當事國之意思；或\n3. （乙）如該國業已表示同意承受條約之拘束，而條約尚未生效，且條約之生效不稽延過久。"},{"num":19,"title":"提具保留","part":"第二編　　條約之締結及生效","section":"第二節　　保留","content":"1. 一國得於簽署、批准、接受、贊同或加入條約時，提具保留，但有下列情形之一者不在此限：\n2. （甲）該項保留為條約所禁止者；\n3. （乙）條約僅准許特定之保留而有關之保留不在其內者；或\n4. （丙）凡不屬（甲）及（乙）兩款所稱之情形，該項保留與條約目的及宗旨不合者。"},{"num":20,"title":"接受及反對保留","part":"第二編　　條約之締結及生效","section":"第二節　　保留","content":"一、凡為條約明示准許之保留，無須其他締約國事後予以接受，但條約規定須如此辦理者，不在此限。\n二、倘自談判國之有限數目及條約之目的與宗旨，可見在全體當事國間適用全部條約為每一當事國同意承受條約拘束之必要條件時，保留須經全體當事國接受。\n三、倘條約為國際組織之組織約章，除條約另有規定外，保留須經該組織主管機關接受。\n四、凡不屬以上各項所稱之情形，除條約另有規定外：\n（甲）保留經另一締約國接受，就該另一締約國而言，保留國即成為條約之當事國，但須條約對各該國均已生效；\n（乙）保留經另一締約國反對，則條約在反對國與保留國間並不因此而不生效力，但反對國確切表示相反之意思者不在此限；\n（丙）表示一國同意承受條約拘束而附以保留之行為，一俟至少有另一締約國接受保留，即發生效力。\n五、就適用第二項與第四項而言，除條約另有規定外，倘一國在接獲關於保留之通知後十二個月期間屆滿時或至其表示同意承受條約拘束之日為止，兩者中以較後之日期為準，迄未對保留提出反對，此項保留即視為業經該國接受。"},{"num":21,"title":"保留及對保留提出之反對之法律效果","part":"第二編　　條約之締結及生效","section":"第二節　　保留","content":"一、依照第十九條、第二十條及第二十三條對另一當事國成立之保留：\n（甲）對保留國而言，其與該另一當事國之關係上照保留之範圍修改保留所關涉之條約規定；及\n（乙）對該另一當事國而言，其與保留國之關係上照同一範圍修改此等規定。\n二、此項保留在條約其他當事國相互間不修改條約之規定。\n三、倘反對保留之國家未反對條約在其本國與保留國間生效，此項保留所關涉之規定在保留之範圍內於該兩國間不適用之。"},{"num":22,"title":"撤回保留及撤回對保留提出之反對","part":"第二編　　條約之締結及生效","section":"第二節　　保留","content":"一、除條約另有規定外，保留得隨時撤回，無須經業已接受保留之國家同意。\n二、除條約另有規定外，對保留提出之反對得隨時撤回。\n三、除條約另有規定或另經協議外：\n（甲）保留之撤回，在對另一締約國之關係上，自該國收到撤回保留之通知之時起方始發生效力；\n（乙）對保留提出之反對之撤回，自提出保留之國家收到撤回反對之通知時起方始發生效力。"},{"num":23,"title":"關於保留之程序","part":"第二編　　條約之締結及生效","section":"第二節　　保留","content":"一、保留、明示接受保留及反對保留，均必須以書面提具並致送締約國及有權成為條約當事國之其他國家。\n二、保留係在簽署須經批准、接受或贊同之條約時提具者，必須由保留國在表示同意承受條約拘束時正式確認。遇此情形，此項保留應視為在其確認之日提出。\n三、明示接受保留或反對保留係在確認保留前提出者，其本身無須經過確認。\n四、撤回保留或撤回對保留提出之反對，必須以書面為之。"},{"num":24,"title":"生效","part":"第二編　　條約之締結及生效","section":"第三節　　條約之生效及暫時適用","content":"一、條約生效之方式及日期，依條約之規定或依談判國之協議。\n二、倘無此種規定或協議，條約一俟確定所有談判國同意承受條約之拘束，即行生效。\n三、除條約另有規定外，一國承受條約拘束之同意如係於條約生效後之一日期確定，則條約自該日起對該國生效。\n四、條約中為條約約文之認證，國家同意承受條約拘束之確定，條約生效之方式或日期，保留，保管機關之職務以及當然在條約生效前發生之其他事項所訂立之規定，自條約約文議定時起適用之。"},{"num":25,"title":"暫時適用","part":"第二編　　條約之締結及生效","section":"第三節　　條約之生效及暫時適用","content":"一、條約或條約之一部分於條約生效前在下列情形下暫時適用：\n（甲）條約本身如此規定；或\n（乙）談判國以其他方式協議如此辦理。\n二、除條約另有規定或談判國另有協議外，條約或條約一部分對一國之暫時適用，於該國將其不欲成為條約當事國之意思通知已暫時適用條約之其他各國時終止。"},{"num":26,"title":"條約必須遵守","part":"第三編　　條約之遵守、適用及解釋","section":"第一節　　條約之遵守","content":"凡有效之條約對其各當事國有拘束力，必須由各該國善意履行。"},{"num":27,"title":"國內法與條約之遵守","part":"第三編　　條約之遵守、適用及解釋","section":"第一節　　條約之遵守","content":"一當事國不得援引其國內法規定為理由而不履行條約。此項規則不妨礙第四十六條。"},{"num":28,"title":"條約不溯既往","part":"第三編　　條約之遵守、適用及解釋","section":"第二節　　條約之適用","content":"除條約表示不同意思，或另經確定外，關於條約對一當事國生效之日以前所發生之任何行為或事實或已不存在之任何情勢，條約之規定不對該當事國發生拘束力。"},{"num":29,"title":"條約之領土範圍","part":"第三編　　條約之遵守、適用及解釋","section":"第二節　　條約之適用","content":"除條約表示不同意思，或另經確定外，條約對每一當事國之拘束力及於其全部領土。"},{"num":30,"title":"關於同1事項先後所訂條約之適用","part":"第三編　　條約之遵守、適用及解釋","section":"第二節　　條約之適用","content":"一、以不違反聯合國憲章第一百零三條為限，就同一事項先後所訂條約當事國之權利與義務應依下列各項確定之。\n二、遇條約訂明須不違反先訂或後訂條約或不得視為與先訂或後訂條約不合時，該先訂或後訂條約之規定應居優先。\n三、遇先訂條約全體當事國亦為後訂條約當事國但不依第五十九條終止或停止施行先訂條約時，先訂條約僅於其規定與後訂條約規定相合之範圍內適用之。\n四、遇後訂條約之當事國不包括先訂條約之全體當事國時：\n（甲）在同為兩條約之當事國間，適用第三項之同一規則；\n（乙）在為兩條約之當事國與僅為其中一條約之當事國間彼此之權利與義務依兩國均為當事國之條約定之。\n五、第四項不妨礙第四十一條，或依第六十條終止或停止施行條約之任何問題，或一國因締結或適用一條約而其規定與該國依另一條約對另一國之義務不合所生之任何責任問題。"},{"num":31,"title":"解釋之通則","part":"第三編　　條約之遵守、適用及解釋","section":"第三節　　條約之解釋","content":"一、條約應依其用語按其上下文並參照條約之目的及宗旨所具有之通常意義，善意解釋之。\n二、就解釋條約而言，上下文除指連同弁言及附件在內之約文外，並應包括：\n（甲）全體當事國間因締結條約所訂與條約有關之任何協定；\n（乙）一個以上當事國因締結條約所訂並經其他當事國接受為條約有關文書之任何文書。\n三、應與上下文一併考慮者尚有：\n（甲）當事國嗣後所訂關於條約之解釋或其規定之適用之任何協定；\n（乙）嗣後在條約適用方面確定各當事國對條約解釋之協定之任何慣例；\n（丙）適用於當事國間關係之任何有關國際法規則。\n四、 倘經確定當事國有此原意，條約用語應使其具有特殊意義。"},{"num":32,"title":"解釋之補充資料","part":"第三編　　條約之遵守、適用及解釋","section":"第三節　　條約之解釋","content":"1. 為證實由適用第三十一條所得之意義起見，或遇依第三十一條作解釋而：\n2. （甲）意義仍屬不明或難解；或\n3. （乙）所獲結果顯屬荒謬或不合理時，為確定其意義起見，得使用解釋之補充資料，包括條約之準備工作及締約之情況在內。"},{"num":33,"title":"以兩種以上文字認證之條約之解釋","part":"第三編　　條約之遵守、適用及解釋","section":"第三節　　條約之解釋","content":"一、條約約文經以兩種以上文字認證作準者，除依條約之規定或當事國之協議遇意義分歧時應以某種約文為根據外，每種文字之約文應同一作準。\n二、以認證作準文字以外之他種文字作成之條約譯本，僅於條約有此規定或當事國有此協議時，始得視為作準約文。\n三、條約用語推定在各作準約文內意義相同。\n四、除依第一項應以某種約文為根據之情形外，倘比較作準約文後發現意義有差別而非適用第三十一條及第三十二條所能消除時，應採用顧及條約目的及宗旨之最能調和各約文之意義。"},{"num":34,"title":"關於第3國之通則","part":"第三編　　條約之遵守、適用及解釋","section":"第四節　　條約與第三國","content":"條約非經第三國同意，不為該國創設義務或權利。"},{"num":35,"title":"為第3國規定義務之條約","part":"第三編　　條約之遵守、適用及解釋","section":"第四節　　條約與第三國","content":"如條約當事國有意以條約之一項規定作為確立一項義務之方法，且該項義務經一第三國以書面明示接受，則該第三國即因此項規定而負有義務。"},{"num":36,"title":"為第3國規定權利之條約","part":"第三編　　條約之遵守、適用及解釋","section":"第四節　　條約與第三國","content":"一、如條約當事國有意以條約之一項規定對一第三國或其所屬一組國家或所有國家給予一項權利，而該第三國對此表示同意，則該第三國即因此項規定而享有該項權利。該第三國倘無相反之表示，應推定其表示同意，但條約另有規定者不在此限。\n二、依第一項行使權利之國家應遵守條約所規定或依照條約所確定之條件行使該項權利。"},{"num":37,"title":"取消或變更第3國之義務或權利","part":"第三編　　條約之遵守、適用及解釋","section":"第四節　　條約與第三國","content":"一、依照第三十五條使第三國擔負義務時，該項義務必須經條約各當事國與該第三國之同意，方得取消或變更，但經確定其另有協議者不在此限。\n二、依照第三十六條使第三國享有權利時，倘經確定原意為非經該第三國同意不得取消或變更該項權利，當事國不得取消或變更之。"},{"num":38,"title":"條約所載規則由於國際習慣而成為對第3國有拘束力","part":"第三編　　條約之遵守、適用及解釋","section":"第四節　　條約與第三國","content":"第三十四條至第三十七條之規定不妨礙條約所載規則成為對第三國有拘束力之公認國際法習慣規則。"},{"num":39,"title":"關於修正條約之通則","part":"第四編　　條約之修正與修改","section":"","content":"條約得以當事國之協議修正之。除條約可能另有規定者外，此種協議適用第二編所訂之規則。"},{"num":40,"title":"多邊條約之修正","part":"第四編　　條約之修正與修改","section":"","content":"一、除條約另有規定外，多邊條約之修正依下列各項之規定。\n二、在全體當事國間修正多邊條約之任何提議必須通知全體締約國，各該締約國均應有權參加：\n（甲）關於對此種提議採取行動之決定；\n（乙）修正條約之任何協定之談判及締結。\n三、凡有權成為條約當事國之國家亦應有權成為修正後條約之當事國。\n四、修正條約之協定對已為條約當事國而未成為該協定當事國之國家無拘束力；對此種國家適用第三十條第四項（乙）款。\n五、凡於修正條約之協定生效後成為條約當事國之國家，倘無不同意思之表示：\n（甲）應視為修正後條約之當事國；並\n（乙）就其對不受修正條約協定拘束之條約當事國之關係言，應視為未修正條約之當事國。"},{"num":41,"title":"僅在若干當事國間修改多邊條約之協定","part":"第四編　　條約之修正與修改","section":"","content":"一、多邊條約兩個以上當事國得於下列情形下締結協定僅在彼此間修改條約：\n（甲）條約內規定有作此種修改之可能者；或\n（乙）有關之修改非為條約所禁止，且：\n（一）不影響其他當事國享有條約上之權利或履行其義務者；\n（二）不關涉任何如予損抑即與有效實行整個條約之目的及宗旨不合之規定者。\n二、除屬第一項（甲）款範圍之情形條約另有規定者外，有關當事國應將其締結協定之意思及協定對條約所規定之修改，通知其他當事國。"},{"num":42,"title":"條約之效力及繼續有效","part":"第五編　　條約之失效、終止及停止施行","section":"第一節　　總則","content":"一、條約之效力或一國承受條約拘束之同意之效力僅經由本公約之適用始得加以非議。\n二、終止條約，廢止條約，或一當事國退出條約，僅因該條約或本公約規定之適用結果始得為之。同一規則適用於條約之停止施行。"},{"num":43,"title":"無須基於條約之國際法所加義務","part":"第五編　　條約之失效、終止及停止施行","section":"第一節　　總則","content":"條約因本公約或該條約規定適用結果而失效，終止或廢止，由當事國退出，或停止施行之情形，絕不損害任何國家依國際法而毋須基於條約所負履行該條約所載任何義務之責任。"},{"num":44,"title":"條約之規定可否分離","part":"第五編　　條約之失效、終止及停止施行","section":"第一節　　總則","content":"一、除條約另有規定或當事國另有協議外，條約內所規定或因第五十六條所生之當事國廢止、退出或停止施行條約之權利僅得對整個條約行使之。\n二、本公約所承認之條約失效、終止、退出或停止施行條約之理由僅得對整個條約援引之，但下列各項或第六十條所規定之情形不在此限。\n三、倘理由僅與特定條文有關，得於下列情形下僅對各該條文援引之：\n（甲）有關條文在適用上可與條約其餘部分分離；\n（乙）由條約可見或另經確定各該條文之接受並非另一當事國或其他當事國同意承受整個條約拘束之必要根據；及\n（丙）條約其餘部分之繼續實施不致有失公平。\n四、在第四十九條及第五十條所稱情形下，有權援引詐欺或賄賂理由之國家得對整個條約或以不違反第三項為限專對特定條文援引之。\n五、在第五十一條、第五十二條及第五十三條所稱之情形下，條約之規定一概不許分離。"},{"num":45,"title":"喪失援引條約失效、終止、退出或停止施行條約理由之權利","part":"第五編　　條約之失效、終止及停止施行","section":"第一節　　總則","content":"1. 一國於知悉事實後而有下列情形之一者，即不得再援引第四十六條至第五十條或第六十條及第六十二條所規定條約失效、終止、退出或停止施行條約之理由：\n2. （甲）該國業經明白同意條約有效，或仍然生效或繼續施行；或\n3. （乙）根據該國行為必須視為已默認條約之效力或條約之繼續生效或施行。"},{"num":46,"title":"國內法關於締約權限之規定","part":"第五編　　條約之失效、終止及停止施行","section":"第二節　　條約之失效","content":"一、一國不得援引其同意承受條約拘束之表示為違反該國國內法關於締約權限之一項規定之事實以撤銷其同意，但違反之情事顯明且涉及其具有基本重要性之國內法之一項規則者，不在此限。\n二、違反情事倘由對此事依通常慣例並秉善意處理之任何國家客觀視之為顯然可見者，即係顯明違反。"},{"num":47,"title":"關於表示1國同意權力之特定限制","part":"第五編　　條約之失效、終止及停止施行","section":"第二節　　條約之失效","content":"如代表表示一國同意承受某一條約拘束之權力附有特定限制，除非在其表示同意前已將此項限制通知其他談判國，該國不得援引該代表未遵守限制之事實以撤銷其所表示之同意。"},{"num":48,"title":"錯誤","part":"第五編　　條約之失效、終止及停止施行","section":"第二節　　條約之失效","content":"一、一國得援引條約內之錯誤以撤銷其承受條約拘束之同意，但此項錯誤以關涉該國於締結條約時假定為存在且構成其同意承受條約拘束之必要根據之事實或情勢者為限。\n二、如錯誤係由關係國家本身行為所助成，或如當時情況足以使該國知悉有錯誤之可能，第一項不適用之。\n三、僅與條約約文用字有關之錯誤，不影響條約之效力；在此情形下，第七十九條適用之。"},{"num":49,"title":"詐欺","part":"第五編　　條約之失效、終止及停止施行","section":"第二節　　條約之失效","content":"倘一國因另一談判國之詐欺行為而締結條約，該國得援引詐欺為理由撤銷其承受條約拘束之同意。"},{"num":50,"title":"對一國代表之賄賂","part":"第五編　　條約之失效、終止及停止施行","section":"第二節　　條約之失效","content":"倘一國同意承受條約拘束之表示係經另一談判國直接或間接賄賂其代表而取得，該國得援引賄賂為理由撤銷其承受條約拘束之同意。"},{"num":51,"title":"對一國代表之強迫","part":"第五編　　條約之失效、終止及停止施行","section":"第二節　　條約之失效","content":"一國同意承受條約拘束之表示係以行為或威脅對其代表所施之強迫而取得者，應無法律效果。"},{"num":52,"title":"以威脅或使用武力對1國施行強迫","part":"第五編　　條約之失效、終止及停止施行","section":"第二節　　條約之失效","content":"條約係違反聯合國憲章所含國際法原則以威脅或使用武力而獲締結者無效。"},{"num":53,"title":"與一般國際法強制規律（絕對法）牴觸之條約","part":"第五編　　條約之失效、終止及停止施行","section":"第二節　　條約之失效","content":"條約在締結時與一般國際法強制規律牴觸者無效。就適用本公約而言，一般國際法強制規律指國家之國際社會全體接受並公認為不許損抑且僅有以後具有同等性質之一般國際法規律始得更改之規律。"},{"num":54,"title":"依條約規定或經當事國同意而終止或退出條約","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"1. 在下列情形下，得終止條約或一當事國得退出條約：\n2. （甲）依照條約之規定；或\n3. （乙）無論何時經全體當事國於諮商其他各締約國後表示同意。"},{"num":55,"title":"多邊條約當事國減少至條約生效所必需之數目以下","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"除條約另有規定外，多邊條約並不僅因其當事國數目減少至生效所必需之數目以下而終止。"},{"num":56,"title":"廢止或退出並無關於終止、廢止或退出規定之條約","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"一、條約如無關於其終止之規定，亦無關於廢止或退出之規定，不得廢止或退出，除非：\n（甲）經確定當事國原意為容許有廢止或退出之可能；或\n（乙）由條約之性質可認為含有廢止或退出之權利。\n二、當事國應將其依第一項廢止或退出條約之意思至遲於十二個月以前通知之。"},{"num":57,"title":"依條約規定或經當事國同意而停止施行條約","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"1. 在下列情形下，條約得對全體當事國或某一當事國停止施行：\n2. （甲）依照條約之規定，或\n3. （乙）無論何時經全體當事國於諮商其他各締約國後表示同意。"},{"num":58,"title":"多邊條約僅經若干當事國協議而停止施行","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"一、多邊條約兩個以上當事國得暫時並僅於彼此間締結協定停止施行條約之規定，如：\n（甲）條約內規定有此種停止之可能；或\n（乙）有關之停止非為條約所禁止，且：\n（一）不影響其他當事國享有條約上之權利或履行其義務；\n（二）非與條約之目的及宗旨不合。\n二、除屬第一項（甲）款範圍之情形條約另有規定者外，有關當事國應將其締結協定之意思及條約內其所欲停止施行之規定通知其他當事國。"},{"num":59,"title":"條約因締結後訂條約而默示終止或停止施行","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"一、任何條約於其全體當事國就同一事項締結後訂條約，且有下列情形之一時，應視為業已終止：\n（甲）自後訂條約可見或另經確定當事國之意思為此一事項應以該條約為準；或\n（乙）後訂條約與前訂條約之規定不合之程度使兩者不可能同時適用。\n二、倘自後訂條約可見或另經確定當事國有此意思，前訂條約應僅視為停止施行。"},{"num":60,"title":"條約因違約而終止或停止施行","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"一、雙邊條約當事國一方有重大違約情事時，他方有權援引違約為理由終止該條約，或全部或局部停止其施行。\n二、多邊條約當事國之一有重大違約情事時：\n（甲）其他當事國有權以一致協議：\n（一）在各該國與違約國之關係上，或\n（二）在全體當事國之間，\n將條約全部或局部停止施行或終止該條約；\n（乙）特別受違約影響之當事國有權援引違約為理由在其本國與違約國之關係上將條約全部或局部停止施行；\n（丙）如由於條約性質關係，遇一當事國對其規定有重大違反情事，致每一當事國繼續履行條約義務所處之地位因而根本改變，則違約國以外之任何當事國皆有權援引違約為理由將條約對其本國全部或局部停止施行。\n三、就適用本條而言，重大違約係指：\n（甲）廢棄條約，而此種廢棄非本公約所准許者；或\n（乙）違反條約規定，而此項規定為達成條約目的或宗旨所必要者。\n四、以上各項不妨礙條約內適用於違約情事之任何規定。\n五、第一項至第三項不適用於各人道性質之條約內所載關於保護人身之各項規定，尤其關於禁止對受此種條約保護之人採取任何方式之報復之規定。"},{"num":61,"title":"發生意外不可能履行","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"一、倘因實施條約所必不可少之標的物永久消失或毀壞以致不可能履行條約時，當事國得援引不可能履行為理由終止或退出條約。如不可能履行係屬暫時性質，僅得援引為停止施行條約之理由。\n二、倘條約不可能履行係一當事國違反條約義務或違反對條約任何其他當事國所負任何其他國際義務之結果，該當事國不得援引不可能履行為理由終止、退出或停止施行條約。"},{"num":62,"title":"情況之基本改變","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"一、條約締結時存在之情況發生基本改變而非當事國所預料者，不得援引為終止或退出條約之理由，除非：\n（甲）此等情況之存在構成當事國同意承受條約拘束之必要根據；及\n（乙）該項改變之影響將根本變動依條約尚待履行之義務之範圍。\n二、情況之基本改變不得援引為終止或退出條約之理由：\n（甲）倘該條約確定一邊界；或\n（乙）倘情況之基本改變係援引此項理由之當事國違反條約義務或違反對條約任何其他當事國所負任何其他國際義務之結果。\n三、倘根據以上各項，一當事國得援引情況之基本改變為終止或退出條約之理由，該國亦得援引該項改變為停止施行條約之理由。"},{"num":63,"title":"斷絕外交或領事關係","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"條約當事國間斷絕外交或領事關係不影響彼此間由條約確定之法律關係，但外交或領事關係之存在為適用條約所必不可少者不在此限。"},{"num":64,"title":"一般國際法新強制規律（絕對法）之產生","part":"第五編　　條約之失效、終止及停止施行","section":"第三節　　條約之終止及停止施行","content":"遇有新一般國際法強制規律產生時，任何現有條約之與該項規律牴觸者即成為無效而終止。"},{"num":65,"title":"關於條約失效、終止、退出條約或停止施行條約應依循之程序","part":"第五編　　條約之失效、終止及停止施行","section":"第四節　　程序","content":"一、當事國依照本公約之規定援引其承受條約拘束之同意有誤為理由，或援引非難條約效力、終止退出或停止施行條約之理由者，必須將其主張通知其他當事國。此項通知應載明對條約所提議採取之措施及其理由。\n二、在一非遇特別緊急情形不得短於自收到通知時起算三個月之期間屆滿後，倘無當事國表示反對，則發出通知之當事國得依第六十七條規定之方式，實施其所提議之措施。\n三、但如有任何其他當事國表示反對，當事國應藉聯合國憲章第三十三條所指示之方法以謀解決。\n四、上列各項絕不影響當事國在對其有拘束力之任何關於解決爭端之現行規定下所具有之權利或義務。\n五、以不妨礙第四十五條為限，一國未於事前發出第一項所規定之通知之事實並不阻止該國為答覆另一當事國要求其履行條約或指稱其違反條約而發出此種通知。"},{"num":66,"title":"司法解決、公斷及和解之程序","part":"第五編　　條約之失效、終止及停止施行","section":"第四節　　程序","content":"1. 倘在提出反對之日後十二個月內未能依第六十五條第三項獲致解決，應依循下列程序：\n2. （甲）關於第五十三條或第六十四條之適用或解釋之爭端之任一當事國得以請求書將爭端提請國際法院裁決之，但各當事國同意將爭端提交公斷者不在此限；\n3. （乙）關於本公約第五編任一其他條文之適用或解釋之爭端之任一當事國得向聯合國秘書長提出請求，發動本公約附件所定之程序。"},{"num":67,"title":"宣告條約失效、終止、退出或停止施行條約之文書","part":"第五編　　條約之失效、終止及停止施行","section":"第四節　　程序","content":"一、第六十五條第一項規定之通知須以書面為之。\n二、凡依據條約規定或第六十五條第二項或第三項規定宣告條約失效、終止、退出或停止施行條約之行為，應以文書致送其他當事國為之。倘文書未經國家元首、政府首長或外交部長簽署，得要求致送文書國家之代表出具全權證書。"},{"num":68,"title":"撤銷第65條及第67條所規定之通知及文書","part":"第五編　　條約之失效、終止及停止施行","section":"第四節　　程序","content":"第六十五條或第六十七條所規定之通知或文書得在其發生效力以前隨時撤銷之。"},{"num":69,"title":"條約失效之後果","part":"第五編　　條約之失效、終止及停止施行","section":"第五節　　條約失效、終止或停止施行之後果","content":"一、條約依本公約確定失效者無效。條約無效者，其規定無法律效力。\n二、但如已有信賴此種條約而實施之行為，則：\n（甲）每一當事國得要求任何其他當事國在彼此關係上儘可能恢復未實施此項行為前原應存在之狀況；\n（乙）在援引條約失效之理由前以善意實施之行為並不僅因條約失效而成為不合法。\n三、遇第四十九條、第五十條、第五十一條或第五十二條所稱之情形，第二項之規定對應就詐欺、賄賂行為或強迫負責之當事國不適用之。\n四、遇某一國家承受多邊條約拘束之同意成為無效之情形，上列各項規則在該國與條約當事國之關係上適用之。"},{"num":70,"title":"條約終止之後果","part":"第五編　　條約之失效、終止及停止施行","section":"第五節　　條約失效、終止或停止施行之後果","content":"一、除條約另有規定或當事國另有協議外，條約依其規定或依照本公約終止時：\n（甲）解除當事國繼續履行條約之義務；\n（乙）不影響當事國在條約終止前經由實施條約而產生之任何權利、義務或法律情勢。\n二、倘一國廢止或退出多邊條約，自廢止或退出生效之日起，在該國與條約每一其他當事國之關係上適用第一項之規定。"},{"num":71,"title":"條約因與一般國際法強制規律相牴觸而失效之後果","part":"第五編　　條約之失效、終止及停止施行","section":"第五節　　條約失效、終止或停止施行之後果","content":"一、條約依第五十三條無效者，當事國應：\n（甲）儘量消除依據與任何一般國際法強制規律相牴觸之規定所實施行為之後果；及\n（乙）使彼此關係符合一般國際法強制規律。\n二、遇有條約依第六十四條成為無效而終止之情形，條約之終止：\n（甲）解除當事國繼續履行條約之義務；\n（乙）不影響當事國在條約終止前經由實施條約而產生之任何權利、義務或法律情勢；但嗣後此等權利、義務或情勢之保持僅以與一般國際法新強制規律不相牴觸者為限。"},{"num":72,"title":"條約停止施行之後果","part":"第五編　　條約之失效、終止及停止施行","section":"第五節　　條約失效、終止或停止施行之後果","content":"一、除條約另有規定或當事國另有協議外條約依其本身規定或依照本公約停止施行時：\n（甲）解除停止施行條約之當事國於停止施行期間在彼此關係上履行條約之義務；\n（乙）除此以外，並不影響條約所確定當事國間之法律關係。\n二、在停止施行期間當事國應避免足以阻撓條約恢復施行之行為。"},{"num":73,"title":"國家繼承、國家責任及發生敵對行為問題","part":"第六編　　雜項規定","section":"","content":"本公約之規定不妨礙國家繼承或國家所負國際責任或國家間發生敵對行為所引起關於條約之任何問題。"},{"num":74,"title":"外交及領事關係與條約之締結","part":"第六編　　雜項規定","section":"","content":"兩個以上國家之間斷絕外交或領事關係或無此種關係不妨礙此等國家間締結條約。條約之締結本身不影響外交或領事關係方面之情勢。"},{"num":75,"title":"侵略國問題","part":"第六編　　雜項規定","section":"","content":"本公約之規定不妨礙因依照聯合國憲章對侵略國之侵略行為所採措施而可能引起之該國任何條約義務。"},{"num":76,"title":"條約之保管機關","part":"第七編　　保管機關、通知、更正及登記","section":"","content":"一、條約之保管機關得由談判國在條約中或以其他方式指定之。保管機關得為一個以上國家或一國際組織或此種組織之行政首長。\n二、條約保管機關之職務係國際性質，保管機關有秉公執行其職務之義務。條約尚未在若干當事國間生效或一國與保管機關間對該機關職務之行使發生爭議之事實，尤不應影響該項義務。"},{"num":77,"title":"保管機關之職務","part":"第七編　　保管機關、通知、更正及登記","section":"","content":"一、除條約內另有規定或締約國另有協議外，保管機關之職務主要為：\n（甲）保管條約約文之正本及任何送交保管機關之全權證書；\n（乙）備就約文正本之正式副本及條約所規定之條約其他語文本，並將其分送當事國及有權成為條約當事國之國家；\n（丙）接收條約之簽署及接收並保管有關條約之文書、通知及公文；\n（丁）審查條約之簽署及有關條約之任何文書、通知或公文是否妥善，如有必要並將此事提請關係國家注意；\n（戊）將有關條約之行為、通知及公文轉告條約當事國及有權成為條約當事國之國家；\n（己）於條約生效所需數目之簽署或批准書、接受書、贊同書或加入書已收到或交存時，轉告有權成為條約當事國之國家；\n（庚）向聯合國秘書處登記條約；\n（辛）擔任本公約其他規定所訂明之職務。\n二、倘一國與保管機關間對該機關職務之執行發生爭議時，保管機關應將此問題提請簽署國及締約國注意，或於適當情形下提請關係國際組織之主管機關注意。"},{"num":78,"title":"通知及公文","part":"第七編　　保管機關、通知、更正及登記","section":"","content":"1. 除條約或本公約另有規定外，任何國家依本公約所提送之通知或公文，應：\n2. （甲）如無保管機關，直接送至該件所欲知照之國家，或如有保管機關，則送至該機關；\n3. （乙）僅於受文國家收到時，或如有保管機關，經該機關收到時，方視為業經發文國家提送；\n4. （丙）倘係送至保管機關，僅於其所欲知照之國家經保管機關依照第七十七條第一項（戊）款轉告後，方視為業經該國收到。"},{"num":79,"title":"條約約文或正式副本錯誤之更正","part":"第七編　　保管機關、通知、更正及登記","section":"","content":"一、條約約文經認證後，倘簽署國及締約國僉認約文有錯誤時，除各該國決定其他更正方法外，此項錯誤應依下列方式更正之：\n（甲）在約文上作適當之更正，並由正式授權代表在更正處草簽；\n（乙）製成或互換一項或數項文書，載明協議應作之更正；或\n（丙）按照原有約文所經之同樣程序，製成條約全文之更正本。\n二、條約如設有保管機關，該機關應將此項錯誤及更正此項錯誤之提議通知各簽署國及締約國，並應訂明得對提議之更正提出反對之適當期限。如在期限屆滿時：\n（甲）尚無反對提出，則保管機關應即在約文上作此更正加以草簽，並製成關於訂正約文之紀事錄，將該紀事錄一份遞送各當事國及有權成為條約當事國之國家；\n（乙）已有反對提出，則保管機關應將此項反對遞送各簽署國及締約國。\n三、遇認證約文有兩種以上之語文，而其中有不一致之處，經簽署國及締約國協議應予更正時，第一項及第二項之規則亦適用之。\n四、除簽署國及締約國另有決定外，更正約文應自始替代有誤約文。\n五、已登記條約約文之更正應通知聯合國秘書處。\n六、遇條約之正式副本上發現錯誤時，保管機關應製成一項紀事錄載明所作之訂正，並將該紀事錄一份遞送各簽署國及締約國。"},{"num":80,"title":"條約之登記及公佈","part":"第七編　　保管機關、通知、更正及登記","section":"","content":"一、條約應於生效後送請聯合國秘書處登記或存案及紀錄，並公佈之。\n二、保管機關之指定，即為授權該機關實施前項所稱之行為。"},{"num":81,"title":"簽署","part":"第八編　　最後規定","section":"","content":"本公約應聽由聯合國或任何專門機關或國際原子能總署之全體會員國或國際法院規約當事國、及經聯合國大會邀請成為本公約當事國之任何其他國家簽署，其辦法如下：至一九六九年十一月三十日止，在奧地利共和國聯邦外交部簽署，其後至一九七○年四月三十日止，在紐約聯合國會所簽署。"},{"num":82,"title":"批准","part":"第八編　　最後規定","section":"","content":"本公約須經批准。批准書應送請聯合國秘書長存放。"},{"num":83,"title":"加入","part":"第八編　　最後規定","section":"","content":"本公約應聽由屬於第八十一條所稱各類之一之國家加入。加入書應送請聯合國秘書長存放。"},{"num":84,"title":"發生效力","part":"第八編　　最後規定","section":"","content":"一、本公約應於第三十五件批准書或加入書存放之日後第三十日起發生效力。\n二、對於在第三十五件批准書或加入書存放後批准或加入本公約之國家，本公約應於各該國存放批准書或加入書後第三十日起發生效力。"},{"num":85,"title":"作準文本","part":"第八編　　最後規定","section":"","content":"本公約之原本應送請聯合國秘書長存放，其中文、英文、法文、俄文及西班牙文各本同一作準。\n為此，下列全權代表各秉本國政府正式授予簽字之權，謹簽字於本公約，以昭信守。\n公曆一千九百六十九年五月二十三日訂於維也納。"}] },
  charter: { key:"charter", short:"聯合國憲章", full:"聯合國憲章", eyebrow:"UN CHARTER · 1945", total: 111, minNum:1, maxNum:111, parts: 19, unitLabel:"章", articles: [{"num":1,"title":"","part":"第一章：宗旨及原則","section":"","content":"聯合國之宗旨為：\n一、維持國際和平及安全；並為此目的：採取有效集體辦法，以防止且消除對於和平之威脅，制止侵略行為或其他和平之破壞；並以和平方法且依正義及國際法之原則，調整或解決足以破壞和平之國際爭端或情勢。\n二、發展國際間以尊重人民平等權利及自決原則為根據之友好關係，並採取其他適當辦法，以增強普遍和平。\n三、促成國際合作，以解決國際間屬於經濟、社會、文化及人類福利性質之國際問題，且不分種族、性別、語言或宗教，增進並激勵對於全體人類之人權及基本自由之尊重。\n四、構成一協調各國行動之中心，以達成上述共同目的。"},{"num":2,"title":"","part":"第一章：宗旨及原則","section":"","content":"為求實現第一條所述各宗旨起見，本組織及其會員國應遵行下列原則：\n一、本組織係基於各會員國主權平等之原則。\n二、各會員國應一秉善意，履行其依本憲章所擔負之義務，以保證全體會員國由加入本組織而發生之權益。\n三、各會員國應以和平方法解決其國際爭端，俾免危及國際和平、安全及正義。\n四、各會員國在其國際關係上不得使用威脅或武力，或以與聯合國宗旨不符之任何其他方法，侵害任何會員國或國家之領土完整或政治獨立。\n五、各會員國對於聯合國依本憲章規定而採取之行動，應盡力予以協助，聯合國對於任何國家正在採取防止或執行行動時，各會員國對該國不得給予協助。\n六、本組織在維持國際和平及安全之必要範圍內，應保證非聯合國會員國遵行上述原則。\n七、本憲章不得認為授權聯合國干涉在本質上屬於任何國家國內管轄之事件，且並不要求會員國將該項事件依本憲章提請解決；但此項原則不妨礙第七章內執行辦法之適用。"},{"num":3,"title":"","part":"第二章：會員","section":"","content":"凡曾經參加金山聯合國國際組織會議或前此曾簽字於一九四二年一月一日聯合國宣言之國家，簽訂本憲章，且依憲章第一百一十條規定而予以批准者，均為聯合國之創始會員國。"},{"num":4,"title":"","part":"第二章：會員","section":"","content":"一、凡其他愛好和平之國家，接受本憲章所載之義務，經本組織認為確能並願意履行該項義務者，得為聯合國會員國。\n二、准許上述國家為聯合國會員國，將由大會經安全理事會之推薦以決議行之。"},{"num":5,"title":"","part":"第二章：會員","section":"","content":"聯合國會員國，業經安全理事會對其採取防止或執行行動者，大會經安全理事會之建議，得停止其會員權利及特權之行使。此項權利及特權之行使，得由安全理事會恢復之。"},{"num":6,"title":"","part":"第二章：會員","section":"","content":"聯合國之會員國中，有屢次違犯本憲章所載之原則者，大會經安全理事會之建議，得將其由本組織除名。"},{"num":7,"title":"","part":"第三章：機關","section":"","content":"一、茲設聯合國之主要機關如下：大會、安全理事會、經濟及社會理事會、託管理事會、國際法院、及秘書處。\n二、聯合國得依本憲章設立認為必需之輔助機關。"},{"num":8,"title":"","part":"第三章：機關","section":"","content":"聯合國對於男女均得在其主要及輔助機關在平等條件之下，充任任何職務，不得加以限制。"},{"num":9,"title":"","part":"第四章：大會","section":"組織","content":"一、大會由聯合國所有會員國組織之。\n二、每一會員國在大會之代表，不得超過五人。"},{"num":10,"title":"","part":"第四章：大會","section":"職權","content":"大會得討論本憲章範圍內之任何問題或事項，或關於本憲章所規定任何機關之職權；並除第十二條所規定外，得向聯合國會員國或安全理事會或兼向兩者，提出對各該問題或事項之建議。"},{"num":11,"title":"","part":"第四章：大會","section":"職權","content":"一、大會得考慮關於維持國際和平及安全之合作之普通原則，包括軍縮及軍備管制之原則；並得向會員國或安全理事會或兼向兩者提出對於該項原則之建議。\n二、大會得討論聯合國任何會員國或安全理事會或非聯合國會員國依第三十五條第二項之規定向大會所提關於維持國際和平及安全之任何問題；除第十二條所規定外，並得向會員國或安全理事會或兼向兩者提出對於各該項問題之建議。凡對於需要行動之各該項問題，應由大會於討論前或討論後提交安全理事會。\n三、大會對於足以危及國際和平與安全之情勢，得提請安全理事會注意。\n四、本條所載之大會權力並不限制第十條之概括範圍。"},{"num":12,"title":"","part":"第四章：大會","section":"職權","content":"一、當安全理事會對於任何爭端或情勢，正在執行本憲章所授予該會之職務時，大會非經安全理事會請求，對於該項爭端或情勢，不得提出任何建議。\n二、秘書長經安全理事會之同意，應於大會每次會議時，將安全理事會正在處理中關於維持國際和平及安全之任何事件，通知大會；於安全理事會停止處理該項事件時，亦應立即通知大會，或在大會閉會期內通知聯合國會員國。"},{"num":13,"title":"","part":"第四章：大會","section":"職權","content":"一、大會應發動研究，並作成建議：\n(子) 以促進政治上之國際合作，並提倡國際法之逐漸發展與編纂。\n(丑) 以促進經濟、社會、文化、教育及衛生各部門之國際合作，且不分種族、性別、語言或宗教，助成全體人類之人權及基本自由之實現。\n二、大會關於本條第一項(丑)款所列事項之其他責任及職權，於第九章及第十章中規定之。"},{"num":14,"title":"","part":"第四章：大會","section":"職權","content":"大會對於其所認為足以妨害國際間公共福利或友好關係之任何情勢，不論其起原如何，包括由違反本憲章所載聯合國之宗旨及原則而起之情勢，得建議和平調整辦法，但以不違背第十二條之規定為限。"},{"num":15,"title":"","part":"第四章：大會","section":"職權","content":"一、大會應收受並審查安全理事會所送之常年及特別報告；該項報告應載有安全理事會對於維持國際和平及安全所已決定或施行之辦法之陳述。\n二、大會應收受並審查聯合國其他機關所送之報告。"},{"num":16,"title":"","part":"第四章：大會","section":"職權","content":"大會應執行第十二章及第十三章所授予關於國際託管制度之職務，包括關於非戰略防區託管協定之核準。"},{"num":17,"title":"","part":"第四章：大會","section":"職權","content":"一、大會應稽核本組織之預算。\n二、本組織之經費應由各會員國依照大會分配限額擔負之。\n三、大會應稽核經與第五十七條所指各種專門機關訂定之任何財政及預算辦法，並應審查該項專門機關之行政預算，以便向關係機關提出建議。"},{"num":18,"title":"","part":"第四章：大會","section":"投票","content":"一、大會之每一會員國，應有一個投票權。\n二、大會對於重要問題之決議應以到會及投票之會員國三分之二多數決定之。此項問題應包括：關於維持國際和平及安全之建議，安全理事會非常任理事國之選舉，經濟及社會理事會理事國之選舉，依第八十六條第一項(寅)款所規定託管理事會理事國之選舉，對於新會員國加入聯合國之准許，會員國權利及特權之停止，會員國之除名，關於施行託管制度之問題，以及預算問題。\n三、關於其他問題之決議，包括另有何種事項應以三分之二多數決定之問題，應以到會及投票之會員國過半數決定之。"},{"num":19,"title":"","part":"第四章：大會","section":"投票","content":"凡拖欠本組織財政款項之會員國，其拖欠數目如等於或超過前兩年所應繳納之數目時，即喪失其在大會投票權。大會如認拖欠原因，確由於該會員國無法控制之情形者，得准許該會員國投票。"},{"num":20,"title":"","part":"第四章：大會","section":"程序","content":"大會每年應舉行常會，並於必要時，舉行特別會議。特別會議應由秘書長經安全理事會或聯合國會員國過半數之請求召集之。"},{"num":21,"title":"","part":"第四章：大會","section":"程序","content":"大會應自行制定其議事規則。大會應選舉每次會議之主席。"},{"num":22,"title":"","part":"第四章：大會","section":"程序","content":"大會得設立其認為於行使職務所必需之輔助大會。"},{"num":23,"title":"","part":"第五章：安全理事會","section":"組織","content":"一、安全理事會以聯合國十五會員國組織之。中華民國、法蘭西、蘇維埃社會主義共和國聯邦、大不列顛及北愛爾蘭聯合王國及美利堅合眾國應為安全理事會常任理事國。大會應選舉聯合國其他十會員國為安全理事會非常任理事國，選舉時首宜充分斟酌聯合國各會員國於維持國際和平與安全及本組織其餘各宗旨上之貢獻，並宜充分斟酌地域上之公勻分配。\n二、安全理事會非常任理事國任期定為二年。安全理事會理事國自十一國增至十五國後第一次選舉非常任理事國時，所增四國中兩國之任期應為一年。任滿之理事國不得即行連選。\n三、安全理事會每一理事國應有代表一人。"},{"num":24,"title":"","part":"第五章：安全理事會","section":"職權","content":"一、為保證聯合國行動迅速有效起見，各會員國將維持國際和平及安全之主要責任，授予安全理事會，並同意安全理事會於履行此項責任下之職務時，即係代表各會員國。\n二、安全理事會於履行此項職務時，應遵照聯合國之宗旨及原則。為履行此項職務而授予安全理事會之特定權力，於本憲章第六章、第七章、第八章及第十二章內規定之。\n三、安全理事會應將常年報告、並於必要時將特別報告，提送大會審查。"},{"num":25,"title":"","part":"第五章：安全理事會","section":"職權","content":"聯合國會員國同意依憲章之規定接受並履行安全理事會之決議。"},{"num":26,"title":"","part":"第五章：安全理事會","section":"職權","content":"為促進國際和平及安全之建立及維持，以儘量減少世界人力及經濟資源之消耗于軍備起見，安全理事會借第四十七條所指之軍事參謀團之協助，應負責擬具方案，提交聯合國會員國，以建立軍備管制制度。"},{"num":27,"title":"","part":"第五章：安全理事會","section":"投票","content":"一、安全理事會每一理事國應有一個投票權。\n二、安全理事會關於程序事項之決議，應以九理事國之可決票表決之。\n三、安全理事會對於其他一切事項之決議，應以九理事國之可決票包括全體常任理事國之同意票表決之；但對於第六章及第五十二條第三項內各事項之決議，爭端當事國不得投票。"},{"num":28,"title":"","part":"第五章：安全理事會","section":"程序","content":"一、安全理事會之組織，應以使其能繼續不斷行使職務為要件。為此目的，安全理事會之各理事國應有常駐本組織會所之代表。\n二、安全理事會應舉行定期會議，每一理事國認為合宜時得派政府大員或其他特別指定之代表出席。\n三、在本組織會所以外，安全理事會得在認為最能便利其工作之其他地點舉行會議。"},{"num":29,"title":"","part":"第五章：安全理事會","section":"程序","content":"安全理事會得設立其認為於行使職務所必需之輔助機關。"},{"num":30,"title":"","part":"第五章：安全理事會","section":"程序","content":"安全理事會應自行制定其議事規則，包括其推選主席之方法。"},{"num":31,"title":"","part":"第五章：安全理事會","section":"程序","content":"在安全理事會提出之任何問題，經其認為對於非安全理事會理事國之聯合國任何會員國之利益有特別關係時，該會員國得參加討論，但無投票權。"},{"num":32,"title":"","part":"第五章：安全理事會","section":"程序","content":"聯合國會員國而非為安全理事會之理事國，或非聯合國會員國之國家，如於安全理事會考慮中之爭端為當事國者，應被邀參加關於該項爭端之討論，但無投票權。安全理事會應規定其所認為公平之條件，以便非聯合國會員國之國家參加。"},{"num":33,"title":"","part":"第六章：爭端之和平解決","section":"","content":"一、任何爭端之當事國，於爭端之繼續存在足以危及國際和平與安全之維持時，應儘先以談判、調查、調停、和解、公斷、司法解決、區域機關或區域辦法之利用，或各該國自行選擇之其他和平方法，求得解決。\n二、安全理事會認為必要時，應促請各當事國以此項方法，解決其爭端。"},{"num":34,"title":"","part":"第六章：爭端之和平解決","section":"","content":"安全理事會得調查任何爭端或可能引起國際磨擦或惹起爭端之任何情勢，以斷定該項爭端或情勢之繼續存在是否足以危及國際和平與安全之維持。"},{"num":35,"title":"","part":"第六章：爭端之和平解決","section":"","content":"一、聯合國任何會員國得將屬於第三十四條所指之性質之任何爭端或情勢，提請安全理事會或大會注意。\n二、非聯合國會員國之國家如為任何爭端之當事國時，經預先宣告就該爭端而言接受本憲章所規定和平解決之義務後，得將該項爭端，提請大會或安全理事會注意。\n三、大會關於按照本條所提請注意事項之進行步驟，應遵守第十一條及第十二條之規定。"},{"num":36,"title":"","part":"第六章：爭端之和平解決","section":"","content":"一、屬於第三十三條所指之性質之爭端或相似之情勢，安全理事會在任何階段，得建議適當程序或調整方法。\n二、安全理事會對於當事國為解決爭端業經採取之任何程序，理應予以考慮。\n三、安全理事會按照本條作成建議時，同時理應注意凡具有法律性質之爭端，在原則上，理應由當事國依國際法院規約之規定提交國際法院。"},{"num":37,"title":"","part":"第六章：爭端之和平解決","section":"","content":"一、屬於第三十三條所指之性質之爭端，當事國如未能依該條所示方法解決時，應將該項爭端提交安全理事會。\n二、安全理事會如認為該項爭端之繼續存在，在事實上足以危及國際和平與安全之維持時，應決定是否當依第三十六條採取行動或建議其所認為適當之解決條件。"},{"num":38,"title":"","part":"第六章：爭端之和平解決","section":"","content":"安全理事會如經所有爭端當事國之請求，得向各當事國作成建議，以求爭端之和平解決，但以不妨礙第三十三條至第三十七條之規定為限。"},{"num":39,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"安全理事會應斷定任何和平之威脅、和平之破壞或侵略行為之是否存在，並應作成建議或抉擇依第四十一條及第四十二條規定之辦法，以維持或恢復國際和平及安全。"},{"num":40,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"為防止情勢之惡化，安全理事會在依第三十九條規定作成建議或決定辦法以前，得促請關係當事國遵行安全理事會所認為必要或合宜之臨時辦法。此項臨時辦法並不妨礙關係當事國之權利、要求或立場。安全理事會對於不遵行此項臨時辦法之情形，應予適當注意。"},{"num":41,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"安全理事會得決定所應採武力以外之辦法，以實施其決議，並得促請聯合國會員國執行此項辦法。此項辦法得包括經濟關係、鐵路、海運、航空、郵、電、無線電及其他交通工具之區域性或全部停止，以及外交關係之斷絕。"},{"num":42,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"安全理事會如認第四十一條所規定之辦法為不足或已經證明為不足時，得采取必要之空海陸軍行動，以維持或恢復國際和平及安全。此項行動得包括聯合國會員國之空海陸軍示威、封鎖及其他軍事舉動。"},{"num":43,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"一、聯合國各會員國為求對於維持國際和平及安全有所貢獻起見，擔任於安全理事會發令時，並依特別協定，供給為維持國際和平及安全所必需之軍隊、協助及便利，包括過境權。\n二、此項特別協定應規定軍隊之數目及種類，其準備程度及一般駐紮地點，以及所供便利及協助之性質。\n三、此項特別協定應以安全理事會之主動，儘速議訂。此項協定應由安全理事會與會員國或由安全理事會與若干會員國之集團締結之，並由簽字國各依其憲法程序批准之。"},{"num":44,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"安全理事會決定使用武力時，於要求非安全理事會會員國依第四十三條供給軍隊以履行其義務之前，如經該會員國請求，應請其遣派代表，參加安全理事會關於使用其軍事部隊之決議。"},{"num":45,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"為使聯合國能採取緊急軍事辦法起見，會員國應將其本國空軍部隊為國際共同執行行動隨時供給調遣。此項部隊之實力與準備之程度，及其共同行動之計劃，應由安全理事會以軍事參謀團之協助，在第四十三條所指之特別協定範圍內決定之。"},{"num":46,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"武力使用之計劃應由安全理事會以軍事參謀團之協助決定之。"},{"num":47,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"一、茲設立軍事參謀團，以便對於安全理事會維持國際和平及安全之軍事需要問題，對於受該會所支配軍隊之使用及統率問題，對於軍備之管制及可能之軍縮問題，向該會貢獻意見並予以協助。\n二、軍事參謀團應由安全理事會各常任理事國之參謀總長或其代表組織之。聯合國任何會員國在該團未有常任代表者，如於該團責任之履行在效率上必需該國參加其工作時，應由該團邀請參加。\n三、軍事參謀團在安全理事會權力之下，對於受該會所支配之任何軍隊，負戰略上之指揮責任；關於該項軍隊之統率問題，應待以後處理。\n四、軍事參謀團，經安全理事會之授權，並與區域內有關機關商議後、得設立區域分團。"},{"num":48,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"一、執行安全理事會為維持國際和平及安全之決議所必要之行動，應由聯合國全體會員國或由若干會員國擔任之，一依安全理事會之決定。\n二、此項決議應由聯合國會員國以其直接行動及經其加入為會員之有關國際機關之行動履行之。"},{"num":49,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"聯合國會員國應通力合作，彼此協助，以執行安全理事會所決定之辦法。"},{"num":50,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"安全理事會對於任何國家採取防止或執行辦法時，其他國家，不論其是否為聯合國會員國，遇有因此項辦法之執行而引起之特殊經濟問題者，應有權與安全理事會會商解決此項問題。"},{"num":51,"title":"","part":"第七章：對於和平之威脅、和平之破壞及侵略行為之應付辦法","section":"","content":"聯合國任何會員國受武力攻擊時，在安全理事會採取必要辦法，以維持國際和平及安全以前，本憲章不得認為禁止行使單獨或集體自衛之自然權利。會員國因行使此項自衛權而採取之辦法，應立向安全理事會報告，此項辦法於任何方面不得影響該會按照本憲章隨時採取其所認為必要行動之權責，以維持或恢復國際和平及安全。"},{"num":52,"title":"","part":"第八章：區域辦法","section":"","content":"一、本憲章不得認為排除區域辦法或區域機關、用以應付關於維持國際和平及安全而宜於區域行動之事件者；但以此項辦法或機關及其工作與聯合國之宗旨及原則符合者為限。\n二、締結此項辦法或設立此項機關之聯合國會員國，將地方爭端提交安全理事會以前，應依該項區域辦法，或由該項區域機關，力求和平解決。\n三、安全理事會對於依區域辦法或由區域機關而求地方爭端之和平解決，不論其係由關係國主動，或由安全理事會提交者，應鼓勵其發展。\n四、本條絕不妨礙第三十四條及第三十五條之適用。"},{"num":53,"title":"","part":"第八章：區域辦法","section":"","content":"一、安全理事會對於職權內之執行行動，在適當情形下，應利用此項區域辦法或區域機關。如無安全理事會之授權，不得依區域辦法或由區域機關採取任何執行行動；但關於依第一百零七條之規定對付本條第二項所指之任何敵國之步驟，或在區域辦法內所取防備此等國家再施其侵略政策之步驟，截至本組織經各關係政府之請求，對於此等國家之再次侵略，能擔負防止責任時為止，不在此限。\n二、本條第一項所稱敵國係指第二次世界大戰中為本憲章任何簽字國之敵國而言。"},{"num":54,"title":"","part":"第八章：區域辦法","section":"","content":"關於為維持國際和平及安全起見，依區域辦法或由區域機關所已採取或正在考慮之行動，不論何時應向安全理事會充分報告之。"},{"num":55,"title":"","part":"第九章：國際經濟及社會","section":"","content":"為造成國際間以尊重人民平等權利及自決原則為根據之和平友好關係所必要之安定及福利條件起見，聯合國應促進：\n(子) 較高之生活程度，全民就業，及經濟與社會進展。\n(丑) 國際間經濟、社會、衛生及有關問題之解決；國際間文化及教育合作。\n(寅) 全體人類之人權及基本自由之普遍尊重與遵守，不分種族、性別、語言或宗教。"},{"num":56,"title":"","part":"第九章：國際經濟及社會","section":"","content":"各會員國擔允採取共同及個別行動與本組織合作，以達成第五十五條所載之宗旨。"},{"num":57,"title":"","part":"第九章：國際經濟及社會","section":"","content":"一、由各國政府間協定所成立之各種專門機關，依其組織約章之規定，於經濟、社會、文化、教育、衛生及其他有關部門負有廣大國際責任者，應依第六十三條之規定使與聯合國發生關係。\n二、上述與聯合國發生關係之各專門機關，以下簡稱專門機關。"},{"num":58,"title":"","part":"第九章：國際經濟及社會","section":"","content":"本組織應作成建議，以調整各專門機關之政策及工作。"},{"num":59,"title":"","part":"第九章：國際經濟及社會","section":"","content":"本組織應於適當情形下，發動各關係國間之談判，以創設為達成第五十五條規定宗旨所必要之新專門機關。"},{"num":60,"title":"","part":"第九章：國際經濟及社會","section":"","content":"履行本章所載本組織職務之責任，屬於大會及大會權力下之經濟及社會理事會。為此目的，該理事會應有第十章所載之權力。"},{"num":61,"title":"","part":"第十章：經濟及社會理事會","section":"組織","content":"一、經濟及社會理事會由大會選舉聯合國五十四會員國組織之。\n二、除第三項所規定外，經濟及社會理事會每年選舉理事十八國，任期三年。任滿之理事國得即行連選。\n三、經濟及社會理事會理事國自二十七國增至五十四國後第一次選舉時，除選舉理事九國接替任期在該年年終屆滿之理事國外，應另增選理事二十七國。增選之理事二十七國中，九國任期一年，另九國任期二年，一依大會所定辦法。\n四、經濟及社會理事會之每一理事國應有代表一人。"},{"num":62,"title":"","part":"第十章：經濟及社會理事會","section":"職權","content":"一、經濟及社會理事會得作成或發動關於國際經濟、社會、文化、教育、衛生及其他有關事項之研究及報告；並得向大會、聯合國會員國及關係專門機關提出關於此種事項之建議案。\n二、本理事會為增進全體人類之人權及基本自由之尊重及維護起見，得作成建議案。\n三、本理事會得擬具關於其職權範圍內事項之協約草案，提交大會。\n四、本理事會得依聯合國所定之規則召集本理事會職務範圍以內事項之國際會議。"},{"num":63,"title":"","part":"第十章：經濟及社會理事會","section":"職權","content":"一、經濟及社會理事會得與第五十七條所指之任何專門機關訂立協定，訂明關係專門機關與聯合國發生關係之條件。該項協定須經大會之核準。\n二、本理事會，為調整各種專門機關之工作，得與此種機關會商並得向其提出建議，並得向大會及聯合國會員國建議。"},{"num":64,"title":"","part":"第十章：經濟及社會理事會","section":"職權","content":"一、經濟及社會理事會得取適當步驟，以取得專門機關之經常報告。本理事會得與聯合國會員國及專門機關，商定辦法俾就實施本理事會之建議及大會對於本理事會職權範圍內事項之建議所採之步驟，取得報告。\n二、本理事會得將對於此項報告之意見提送大會。"},{"num":65,"title":"","part":"第十章：經濟及社會理事會","section":"職權","content":"經濟及社會理事會得向安全理事會供給情報，並因安全理事會之邀請，予以協助。"},{"num":66,"title":"","part":"第十章：經濟及社會理事會","section":"職權","content":"一、經濟及社會理事會應履行其職權範圍內關於執行大會建議之職務。\n二、經大會之許可，本理事會得應聯合國會員國或專門機關之請求，供其服務。\n三、本理事會應履行本憲章他章所特定之其他職務，以及大會所授予之職務。"},{"num":67,"title":"","part":"第十章：經濟及社會理事會","section":"投票","content":"一、經濟及社會理事會每一理事國應有一個投票權。\n二、本理事會之決議，應以到會及投票之理事國過半數表決之。"},{"num":68,"title":"","part":"第十章：經濟及社會理事會","section":"程序","content":"經濟及社會理事會應設立經濟與社會部門及以提倡人權為目的之各種委員會，並得設立於行使職務所必需之其他委員會。"},{"num":69,"title":"","part":"第十章：經濟及社會理事會","section":"程序","content":"經濟及社會理事會應請聯合國會員國參加討論本理事會對於該國有特別關係之任何事件，但無投票權。"},{"num":70,"title":"","part":"第十章：經濟及社會理事會","section":"程序","content":"經濟及社會理事會得商定辦法使專門機關之代表無投票權而參加本理事會及本理事會所設各委員會之討論，或使本理事會之代表參加此項專門機關之討論。"},{"num":71,"title":"","part":"第十章：經濟及社會理事會","section":"程序","content":"經濟及社會理事會得采取適當辦法，俾與各種非政府組織會商有關於本理事會職權範圍內之事件。此項辦法得與國際組織商定之，並於適當情形下，經與關係聯合國會員國會商後，得與該國國內組織商定之。"},{"num":72,"title":"","part":"第十章：經濟及社會理事會","section":"程序","content":"一、經濟及社會理事會應自行制定其議事規則，包括其推選主席之方法。\n二、經濟及社會理事會應依其規則舉行必要之會議。此項規則應包括因理事國過半數之請求而召集會議之條款。"},{"num":73,"title":"","part":"第十一章：關於非自治領土之宣言","section":"","content":"聯合國各會員國，於其所負有或承擔管理責任之領土，其人民尚未臻自治之充分程度者，承認以領土居民之福利為至上之原則，並接受在本憲章所建立之國際和平及安全制度下，以充分增進領土居民福利之義務為神聖之信託，且為此目的：\n(子) 於充分尊重關係人民之文化下，保證其政治、經濟、社會及教育之進展，予以公平待遇，且保障其不受虐待。\n(丑) 按各領土及其人民特殊之環境、及其進化之階段，發展自治；對各該人民之政治願望，予以適當之注意；並助其自由政治制度之逐漸發展。\n(寅) 促進國際和平及安全。\n(卯) 提倡建設計劃，以求進步；獎勵研究；各國彼此合作，並於適當之時間及場合與專門國際團體合作，以求本條所載社會、經濟及科學目的之實現。\n(辰) 在不違背安全及憲法之限制下，按時將關於各會員國分別負責管理領土內之經濟、社會及教育情形之統計及具有專門性質之情報，遞送秘書長，以供參考。本憲章第十二章及第十三章所規定之領土，不在此限。"},{"num":74,"title":"","part":"第十一章：關於非自治領土之宣言","section":"","content":"聯合國各會員國公同承諾對於本章規定之領土，一如對於本國區域，其政策必須以善鄰之道奉為圭臬；並於社會、經濟及商業上，對世界各國之利益及幸福，予以充分之注意。"},{"num":75,"title":"","part":"第十二章：國際託管制度","section":"","content":"聯合國在其權力下，應設立國際託管制度，以管理並監督憑此後個別協定而置於該制度下之領土。此項領土以下簡稱託管領土。"},{"num":76,"title":"","part":"第十二章：國際託管制度","section":"","content":"按據本憲章第一條所載聯合國之宗旨，託管制度之基本目的應為：\n(子) 促進國際和平及安全。\n(丑) 增進託管領土居民之政治、經濟、社會及教育之進展；並以適合各領土及其人民之特殊情形及關係人民自由表示之願望為原則，且按照各託管協定之條款，增進其趨向自治或獨立之逐漸發展。\n(寅) 不分種族、性別、語言或宗教，提倡全體人類之人權及基本自由之尊重，並激發世界人民互相維繫之意識。\n(卯) 於社會、經濟及商業事件上，保證聯合國全體會員國及其國民之平等待遇，及各該國民於司法裁判上之平等待遇，但以不妨礙上述目的之達成，且不違背第八十條之規定為限。"},{"num":77,"title":"","part":"第十二章：國際託管制度","section":"","content":"一、託管制度適用於依託管協定所置於該制度下之下列各種類之領土：\n(子) 現在委任統治下之領土。\n(丑) 因第二次世界大戰結果或將自敵國割離之領土。\n(寅) 負管理責任之國家自願置於該制度下之領土。\n二、關於上列種類中之何種領土將置於託管制度之下，及其條件，為此後協定所當規定之事項。"},{"num":78,"title":"","part":"第十二章：國際託管制度","section":"","content":"凡領土已成為聯合國之會員國者，不適用託管制度；聯合國會員國間之關係，應基於尊重主權平等之原則。"},{"num":79,"title":"","part":"第十二章：國際託管制度","section":"","content":"置於託管制度下之每一領土之託管條款，及其更改或修正，應由直接關係各國、包括聯合國之會員國而為委任統治地之受託國者，予以議定，其核準應依第八十三條及第八十五條之規定。"},{"num":80,"title":"","part":"第十二章：國際託管制度","section":"","content":"一、除依第七十七條、第七十九條及第八十一條所訂置各領土於託管制度下之個別託管協定另有議定外，並在該項協定未經締結以前，本章任何規定絕對不得解釋為以任何方式變更任何國家或人民之權利、或聯合國會員國個別簽訂之現有國際約章之條款。\n二、本條第一項不得解釋為對於依第七十七條之規定而訂置委任統治地或其他領土於託管制度下之協定，授以延展商訂之理由。"},{"num":81,"title":"","part":"第十二章：國際託管制度","section":"","content":"凡託管協定均應載有管理領土之條款，並指定管理託管領土之當局。該項當局，以下簡稱管理當局，得為一個或數個國家，或為聯合國本身。"},{"num":82,"title":"","part":"第十二章：國際託管制度","section":"","content":"於任何託管協定內，得指定一個或數個戰略防區，包括該項協定下之託管領土之一部或全部，但該項協定並不妨礙依第四十三條而訂立之任何特別協定。"},{"num":83,"title":"","part":"第十二章：國際託管制度","section":"","content":"一、聯合國關於戰略防區之各項職務，包括此項託管協定條款之核準、及其更改或修正，應由安全理事會行使之。\n二、第七十六條所規定之基本目的，適用於每一戰略防區之人民。\n三、安全理事會以不違背託管協定之規定且不妨礙安全之考慮為限，應利用託管理事會之協助，以履行聯合國託管制度下關於戰略防區內之政治、經濟、社會及教育事件之職務。"},{"num":84,"title":"","part":"第十二章：國際託管制度","section":"","content":"管理當局有保證託管領土對於維持國際和平及安全盡其本分之義務。該當局為此目的得利用託管領土之志願軍、便利及協助，以履行該當局對於安全理事會所負關於此點之義務，並以實行地方自衛，且在託管領土內維持法律與秩序。"},{"num":85,"title":"","part":"第十二章：國際託管制度","section":"","content":"一、聯合國關於一切非戰略防區託管協定之職務，包括此項託管協定條款之核準及其更改或修正，應由大會行使之。\n二、託管理事會於大會權力下，應協助大會履行上述之職務。"},{"num":86,"title":"","part":"第十三章：託管理事會","section":"組織","content":"一、託管理事會應由下列聯合國會員國組織之：\n(子) 管理託管領土之會員國。\n(丑) 第二十三條所列名之國家而現非管理託管領土者。\n(寅) 大會選舉必要數額之其他會員國，任期三年，俾使託管理事會理事國之總數，於聯合國會員國中之管理託管領土者及不管理者之間，得以平均分配。\n二、託管理事會之每一理事國應指定一特別合格之人員，以代表之。"},{"num":87,"title":"","part":"第十三章：託管理事會","section":"職權","content":"大會及在其權力下之託管理事會於履行職務時得：\n(子) 審查管理當局所送之報告。\n(丑) 會同管理當局接受並審查請願書。\n(寅) 與管理當局商定時間，按期視察各託管領土。\n(卯) 依託管協定之條款，採取上述其他行動。"},{"num":88,"title":"","part":"第十三章：託管理事會","section":"職權","content":"託管理事會應擬定關於各託管領土居民之政治、經濟、社會及教育進展之問題單；就大會職權範圍內，各託管領土之管理當局應根據該項問題單向大會提出常年報告。"},{"num":89,"title":"","part":"第十三章：託管理事會","section":"投票","content":"一、託管理事會之每一理事國應有一個投票權。\n二、託管理事會之決議應以到會及投票之理事國過半數表決之。"},{"num":90,"title":"","part":"第十三章：託管理事會","section":"程序","content":"一、託管理事會應自行制定其議事規則，包括其推選主席之方法。\n二、託管理事會應依其所定規則，舉行必要之會議。此項規則應包括關於經該會理事國過半數之請求而召集會議之規定。"},{"num":91,"title":"","part":"第十三章：託管理事會","section":"程序","content":"託管理事會於適當時，應利用經濟及社會理事會之協助，並對於各關係事項，利用專門機關之協助。"},{"num":92,"title":"","part":"第十四章：國際法院","section":"","content":"國際法院為聯合國之主要司法機關，應依所附規約執行其職務。該項規約係以國際常設法院之規約為根據並為本憲章之構成部分。"},{"num":93,"title":"","part":"第十四章：國際法院","section":"","content":"一、聯合國各會員國為國際法院規約之當然當事國\n二、非聯合國會員國之國家得為國際法院規約當事國之條件，應由大會經安全理事會之建議就各別情形決定之。"},{"num":94,"title":"","part":"第十四章：國際法院","section":"","content":"一、聯合國每一會員國為任何案件之當事國者，承諾遵行國際法院之判決。\n二、遇有一造不履行依法院判決應負之義務時，他造得向於安全理事會申訴。安全理事會如認為必要時，得作成建議或決定應採辦法，以執行判決。"},{"num":95,"title":"","part":"第十四章：國際法院","section":"","content":"本憲章不得認為禁止聯合國會員國依據現有或以後締結之協定，將其爭端託付其他法院解決。"},{"num":96,"title":"","part":"第十四章：國際法院","section":"","content":"一、大會或安全理事會對於任何法律問題得請國際法院發表諮詢意見。\n二、聯合國其他機關及各種專門機關，對於其工作範圍內之任何法律問題，得隨時以大會之授權，請求國際法院發表諮詢意見。"},{"num":97,"title":"","part":"第十五章：秘書處","section":"","content":"秘書處置秘書長一人及本組織所需之辦事人員若干人。秘書長應由大會經安全理事會之推薦委派之。秘書長為本組織之行政首長。"},{"num":98,"title":"","part":"第十五章：秘書處","section":"","content":"秘書長在大會、安全理事會、經濟及社會理事會、及託管理事會之一切會議，應以秘書長資格行使職務，並應執行各該機關所託付之其他職務。秘書長應向大會提送關於本組織工作之常年報告。"},{"num":99,"title":"","part":"第十五章：秘書處","section":"","content":"秘書長得將其所認為可能威脅國際和平及安全之任何事件，提請安全理事會注意。"},{"num":100,"title":"","part":"第十五章：秘書處","section":"","content":"一、秘書長及辦事人員於執行職務時，不得請求或接受本組織以外任何政府或其他當局之訓示，並應避免足以妨礙其國際官員地位之行動。秘書長及辦事人員專對本組織負責。\n二、聯合國各會員國承諾尊重秘書長及辦事人員責任之專屬國際性，決不設法影響其責任之履行。"},{"num":101,"title":"","part":"第十五章：秘書處","section":"","content":"一、辦事人員由秘書長依大會所定章程委派之。\n二、適當之辦事人員應長期分配於經濟及社會理事會、託管理事會，並於必要時，分配於聯合國其他之機關。此項辦事人員構成秘書處之一部。\n三、辦事人員之僱用及其服務條件之決定，應以求達效率、才幹及忠誠之最高標準為首要考慮。徵聘辦事人員時，於可能範圍內，應充分注意地域上之普及。"},{"num":102,"title":"","part":"第十六章：雜項條款","section":"","content":"一、本憲章發生效力後，聯合國任何會員國所締結之一切條約及國際協定應儘速在秘書處登記，並由秘書處公佈之。\n二、當事國對於未經依本條第一項規定登記之條約或國際協定，不得向聯合國任何機關援引之。"},{"num":103,"title":"","part":"第十六章：雜項條款","section":"","content":"聯合國會員國在本憲章下之義務與其依任何其他國際協定所負之義務有衝突時，其在本憲章下之義務應居優先。"},{"num":104,"title":"","part":"第十六章：雜項條款","section":"","content":"本組織於每一會員國之領土內，應享受於執行其職務及達成其宗旨所必需之法律行為能力。"},{"num":105,"title":"","part":"第十六章：雜項條款","section":"","content":"一、本組織於每一會員國之領土內，應享受於達成其宗旨所必需之特權及豁免。\n二、聯合國會員國之代表及本組織之職員，亦應同樣享受於其獨立行使關於本組織之職務所必需之特權及豁免。\n三、為明定本條第一項及第二項之施行細則起見，大會得作成建議，或為此目的向聯合國會員國提議協約。"},{"num":106,"title":"","part":"第十七章：過渡安全辦法","section":"","content":"在第四十三條所稱之特別協定尚未生效，因而安全理事會認為尚不得開始履行第四十二條所規定之責任前，一九四三年十月三十日在莫斯科簽訂四國宣言之當事國及法蘭西應依該宣言第五項之規定，互相洽商，並於必要時，與聯合國其他會員國洽商，以代表本組織採取為維持國際和平及安全宗旨所必要之聯合行動。"},{"num":107,"title":"","part":"第十七章：過渡安全辦法","section":"","content":"本憲章並不取消或禁止負行動責任之政府對於在第二次世界大戰中本憲章任何簽字國之敵國因該次戰爭而採取或受權執行之行動。"},{"num":108,"title":"","part":"第十八章：修正","section":"","content":"本憲章之修正案經大會會員國三分之二表決並由聯合國會員國三分之二、包括安全理事會全體常任理事國，各依其憲法程序批准後，對於聯合國所有會員國發生效力。"},{"num":109,"title":"","part":"第十八章：修正","section":"","content":"一、聯合國會員國，為檢討本憲章，得以大會會員國三分之二表決，經安全理事會任何九理事國之表決，確定日期及地點舉行全體會議。聯合國每一會員國在全體會議中應有一個投票權。\n二、全體會議以三分之二表決所建議對於憲章之任何更改，應經聯合國會員國三分之二、包括安全理事會全體常任理事國，各依其憲法程序批准後，發生效力。\n三、如於本憲章生效後大會第十屆年會前，此項全體會議尚未舉行時，應將召集全體會議之提議列入大會該屆年會之議事日程；如得大會會員國過半數及安全理事會任何七理事國之表決，此項會議應即舉行。"},{"num":110,"title":"","part":"第十九章：批准及簽字","section":"","content":"一、本憲章應由簽字國各依其憲法程序批准之。\n二、批准書應交存美利堅合眾國政府。該國政府應於每一批准書交存時通知各簽字國，如本組織秘書長業經委派時，並應通知秘書長。\n三、一俟美利堅合眾國政府通知已有中華民國、法蘭西、蘇維埃社會主義共和國聯邦、大不列顛及北愛爾蘭聯合王國、與美利堅合眾國、以及其他簽字國之過半數將批准書交存時，本憲章即發生效力。美利堅合眾國政府應擬就此項交存批准之議定書並將副本分送所有簽字國。\n四、本憲章簽字國於憲章發生效力後批准者，應自其各將批准書交存之日起為聯合國之創始會員國。"},{"num":111,"title":"","part":"第十九章：批准及簽字","section":"","content":"本憲章應留存美利堅合眾國政府之檔庫，其中、法、俄、英、及西文各本同一作準。該國政府應將正式副本分送其他簽字國政府。\n為此聯合國各會員國政府之代表謹簽字於本憲章，以昭信守。\n公曆一千九百四十五年六月二十六日簽訂於金山市。"}] },
  artstate: { key:"artstate", short:"國家責任條款", full:"國家對國際不法行為的責任條款", eyebrow:"ARSIWA · 2001", total: 59, minNum:1, maxNum:59, parts: 4, unitLabel:"部分", articles: [{"num":1,"title":"一國對其國際不法行為的責任","part":"第一部分一國的國際不法行為","section":"第一章一般原則","content":"一國的每一國際不法行為引起該國的國際責任。"},{"num":2,"title":"一國國際不法行為的要素","part":"第一部分一國的國際不法行為","section":"第一章一般原則","content":"一國國際不法行為在下列情況下發生：\n（a）由作為或不作為構成的行為依國際法歸於該國；並且\n（b）該行為構成對該國國際義務的違背。"},{"num":3,"title":"把一國的行為定性為國際不法行為","part":"第一部分一國的國際不法行為","section":"第一章一般原則","content":"在把一國的行為定性為國際不法行為時須遵守國際法。這種定性不因國內法把同一行為定性為合法行為而受到影響。"},{"num":4,"title":"一國的機關的行為","part":"第一部分一國的國際不法行為","section":"第二章把行為歸於一國","content":"1．任何國家機關，不論行使立法、行政、司法職能，還是任何其他職能，不論在國家組織中具有何種地位，也不論作為該國中央政府機關或一領土單位機關而具有何種特性，其行為應視為國際法所指的國家行為。\n2．機關包括依該國國內法具有此種地位的任何個人或實體。"},{"num":5,"title":"行使政府權力要素的個人或實體的行為","part":"第一部分一國的國際不法行為","section":"第二章把行為歸於一國","content":"雖非第4條所指的國家機關但經該國法律授權而行使政府權力要素的個人或實體，其行為應視為國際法所指的國家行為，但以該個人或實體在特定情況下以此種資格行事者為限。"},{"num":6,"title":"由另一國交由一國支配的機關的行為","part":"第一部分一國的國際不法行為","section":"第二章把行為歸於一國","content":"由另一國交由一國支配的機關，若為行使支配該機關的國家權力要素而行事，其行為依國際法應視為支配該機關的國家的行為。"},{"num":7,"title":"逾越許可權或違背指示","part":"第一部分一國的國際不法行為","section":"第二章把行為歸於一國","content":"國家機關或經授權行使政府權力要素的個人或實體，若以此種資格行事，即使逾越許可權或違背指示。其行為仍應視為國際法所指的國家行為。"},{"num":8,"title":"受到國家指揮或控制的行為","part":"第一部分一國的國際不法行為","section":"第二章把行為歸於一國","content":"如果一人或一群人實際上是在按照國家的指示或在其指揮或控制下行事，其行為應視為國際法所指的一國的行為。"},{"num":9,"title":"正式當局不存在或缺席時實施的行為","part":"第一部分一國的國際不法行為","section":"第二章把行為歸於一國","content":"如果一人或一群人在正式當局不存在或缺席和在需要行使上述權力要素的情況下實際上正在行使政府權力要素，其行為應視為國際法所指的一國的行為。"},{"num":10,"title":"叛亂運動或其他運動的行為","part":"第一部分一國的國際不法行為","section":"第二章把行為歸於一國","content":"1．成為一國新政府的叛亂運動的行為應視為國際法所指的該國的行為。\n2．在一個先已存在的國家的一部分領土或其管理下的某一領土內組成一個新的國家的叛亂運動或其他運動的行為，依國際法應視為該新國家的行為。\n3．本條不妨礙把不論以何種方式涉及有關運動的、按照第4條至第9條的規定應視為該國行為的任何行為歸於該國。"},{"num":11,"title":"經一國確認並當作其本身行為的行為","part":"第一部分一國的國際不法行為","section":"第二章把行為歸於一國","content":"按照前述各條款不歸於一國的行為，在並且只在該國承認和當作其本身行為的行為的情況下。依國際法應視為該國的行為。"},{"num":12,"title":"違背國際義務行為的發生","part":"第一部分一國的國際不法行為","section":"第三章違背國際義務","content":"一國的行為如不符合國際義務對它的要求，即為違背國際義務，而不論該義務的起源或特性為何。"},{"num":13,"title":"對一國為有效的國際義務","part":"第一部分一國的國際不法行為","section":"第三章違背國際義務","content":"一國的行為不構成對一國際義務的違背，除非該行為是在該義務對該國有約束力的時期發生。"},{"num":14,"title":"違背義務行為在時間上的延續","part":"第一部分一國的國際不法行為","section":"第三章違背國際義務","content":"1．沒有持續性的一國行為違背國際義務時，該行為發生的時刻即為違背義務行為發生的時刻，即使其影響繼續存在。\n2．有持續性的一國行為違背國際義務時，該行為延續的時間為該行為持續、並且一直不遵守該國際義務的整個期間。\n3．一國違背要求它防止某一特定事件之國際義務的行為開始於該事件發生的時刻。該行為延續的時間為該事件持續、並且一直不遵守該義務的整個期間。"},{"num":15,"title":"一複合行為違背義務","part":"第一部分一國的國際不法行為","section":"第三章違背國際義務","content":"1．一國透過被一併定義為不法行為的一系列作為和不作為違背國際義務的情事，發生於一作為和不作為發生的時刻，該作為和不作為連同其他的作為和不作為看待，足以構成不法行為。\n2．在上述情況下，該違背義務行為持續的時間為一系列作為和不作為中的的第一個開始發生到此類行為再次發生並且一直不遵守該國國際義務的整個期間。"},{"num":16,"title":"援助或協助實施一國際不法行為","part":"第一部分一國的國際不法行為","section":"第四章一國對另一國行為的責任","content":"援助或協助另一國實施其國際不法行為的國家應該對此種行為負國際責任，如果：\n（a）該國在知道該國際不法行為的情況下這樣做，而且\n（b）該行為若由該國實施會構成國際不法行為。"},{"num":17,"title":"指揮或控制一國際不法行為的實施","part":"第一部分一國的國際不法行為","section":"第四章一國對另一國行為的責任","content":"指揮或控制另一國實施其國際不法行為的國家應該對該行為負國際責任，如果：\n（a）該國在知道該國際不法行為的情況下這樣做；而且\n（b）該行為若由該國實施會構成國際不法行為。"},{"num":18,"title":"脅迫另一國","part":"第一部分一國的國際不法行為","section":"第四章一國對另一國行為的責任","content":"脅迫另一國實施一行為的國家應該對該行為負國際責任，如果：\n（a）在沒有脅迫的情況下。該行為仍會是被脅迫國的國際不法行為；而且\n（b）脅迫國在知道該脅迫行為的情況下這樣做。"},{"num":19,"title":"本章的效力","part":"第一部分一國的國際不法行為","section":"第四章一國對另一國行為的責任","content":"本章不妨礙實施有關行為的國家或任何其他國家根據這些條款的其他規定應該承擔的國際責任。"},{"num":20,"title":"同意","part":"第一部分一國的國際不法行為","section":"第五章解除行為不法性的情況","content":"一國以有效方式表示同意另一國實施某項特定行為時，該特定行為的不法性在與該國家的關係上即告解除。但以該行為不逾越該項同意的範圍為限。"},{"num":21,"title":"自衛","part":"第一部分一國的國際不法行為","section":"第五章解除行為不法性的情況","content":"一國的行為如構成按照〈聯合國憲章〉採取的合法自衛措施，該行為的不法性即告解除。"},{"num":22,"title":"對一國際不法行為採取的反措施","part":"第一部分一國的國際不法行為","section":"第五章解除行為不法性的情況","content":"一國不遵守其對另一國國際義務的行為，在並且只在該行為構成按照第三部分第二章針對該另一國採取的一項反措施的情況下。其不法性才可解除。"},{"num":23,"title":"不可抗力","part":"第一部分一國的國際不法行為","section":"第五章解除行為不法性的情況","content":"1．一國不遵守其對另一國國際義務的行為如起因於不可抗力，即有不可抗拒的力量或該國無力控制、無法預料的事件發生。以至該國在這種情況下實際上不可能履行義務，該行為的不法性即告解除。\n2．在下列情況下第1款不適用：\n（a）不可抗力的情況是由援引此種情況的國家的行為單獨導致或與其他因素一併導致；或\n（b）該國已承擔發生這種情況的風險。"},{"num":24,"title":"危難","part":"第一部分一國的國際不法行為","section":"第五章解除行為不法性的情況","content":"1．就一國不遵守該國國際義務的行為而言，如有關行為人在遭遇危難的情況下為了挽救其生命或受其監護的其他人的生命，除此行為之外，別無其他合理方法，該行為的不法性即告解除。\n2．在下列情況下第1款不適用：\n（a）危難情況是由援引此種情況的國家的行為單獨導致或與其他因素一併導致；或\n（b）有關行為可能造成類似的或更大的災難。"},{"num":25,"title":"危急情況","part":"第一部分一國的國際不法行為","section":"第五章解除行為不法性的情況","content":"1．一國不得援引危急情況作為理由解除不遵守該國某項國際義務的行為的不法性，除非：\n（a）該行為是該國保護基本利益，對抗某項嚴重迫切危險的唯一辦法；而且\n（b）該行為並不嚴重損害作為所負義務物件的一國或數國或整個國際社會的基本利益。\n2．一國不得在以下情況下援引危急情況作為解除其行為不法性的理由：\n（a）有關國際義務排除援引危急情況的可能性；或\n（b）該國促成了該危急情況。"},{"num":26,"title":"對強制性規範的遵守","part":"第一部分一國的國際不法行為","section":"第五章解除行為不法性的情況","content":"違反一般國際法某一強制性規範所產生的義務的一國，不得以本章中的任何規定作為解除其任何行為之不法性的理由。"},{"num":27,"title":"援引解除行為不法性的情況的後果","part":"第一部分一國的國際不法行為","section":"第五章解除行為不法性的情況","content":"根據本章援引解除行為不法性的情況不妨礙：\n（a）在並且只在解除行為不法性的情況不再存在時遵守該項義務；\n（b）對該行為所造成的任何物質損失的賠償問題。"},{"num":28,"title":"國際不法行為的法律後果","part":"第二部分一國國際責任的內容","section":"第一章一般原則","content":"一國依照第一部分的規定對一國國際不法行為的國際責任，產生本部分所列的法律後果。"},{"num":29,"title":"繼續履行的責任","part":"第二部分一國國際責任的內容","section":"第一章一般原則","content":"本部分所規定的一國際不法行為的法律後果不影響責任國繼續履行所違背義務的責任。"},{"num":30,"title":"停止和不重複","part":"第二部分一國國際責任的內容","section":"第一章一般原則","content":"國際不法行為的責任國有義務：\n（a）在從事一項持續性的不法行為時，停止該行為；\n（b）在必要情況下，提供不重複該行為的適當承諾和保證。"},{"num":31,"title":"賠償","part":"第二部分一國國際責任的內容","section":"第一章一般原則","content":"1．責任國有義務對國際不法行為所造成的損害提供充分賠償；\n2．損害包括一國國際不法行為造成的任何損害，無論是物質損害還是精神損害。"},{"num":32,"title":"與國內法無關","part":"第二部分一國國際責任的內容","section":"第一章一般原則","content":"責任國不得以其國內法的規定作為不能按照本部分的規定遵守其義務的理由。"},{"num":33,"title":"本部分所列國際義務的範圍","part":"第二部分一國國際責任的內容","section":"第一章一般原則","content":"1．本部分規定的責任國義務可能是對另一國、若干國家或對整個國際社會承擔的義務，具體取決於該國際義務的特性和內容及違反義務的情況。\n2．本部分不妨礙任何人或國家以外的實體由於一國的國際責任可能直接取得的任何權利。"},{"num":34,"title":"賠償方式","part":"第二部分一國國際責任的內容","section":"第二章賠償損害","content":"對國際不法行為造成的損害充分賠償，應按照本章的規定，單獨或合併地採取恢復原狀、補償和抵償的方式。"},{"num":35,"title":"恢復原狀","part":"第二部分一國國際責任的內容","section":"第二章賠償損害","content":"在並且只在下列情況下，一國際不法行為的責任國有義務恢復原狀，即恢復到實施不法行為以前所存在的狀況：\n（a）恢復原狀並非實際上辦不到的；\n（b）從恢復原狀而不要求補償所得到的利益不致與所引起的負擔完全不成比例。"},{"num":36,"title":"補償","part":"第二部分一國國際責任的內容","section":"第二章賠償損害","content":"1．一國際不法行為的責任國有義務補償該行為造成的任何損害，如果這種損害沒有以恢復原狀的方式得到賠償；\n2．這種補償應該彌補在經濟上可以評估的任何損害，包括可以確定的利潤損失。"},{"num":37,"title":"抵償","part":"第二部分一國國際責任的內容","section":"第二章賠償損害","content":"1．一國際不法行為的責任國有義務抵償該行為造成的損失，如果這種損失不能以恢復原狀或補償的方式得到賠償；\n2．抵償可採取承認不法行為、表示遺憾、正式道歉，或另一種合適的方式。\n3．抵償不應與損失不成比例，而且不得采取羞辱責任國的方式。"},{"num":38,"title":"利息","part":"第二部分一國國際責任的內容","section":"第二章賠償損害","content":"1．為確保充分賠償，必要時，應支付根據本章所應支付的任何本金金額的利息。應為取得這一結果規定利率和計算方法。\n2．利息應從支付本金金額之日起算，至履行了支付義務之日為止。"},{"num":39,"title":"促成損害","part":"第二部分一國國際責任的內容","section":"第二章賠償損害","content":"在確定賠償時，應考慮到提出索賠的受害國或任何人或實體由於故意或疏忽以作為或不作為促成損害的情況。"},{"num":40,"title":"本章的適用","part":"第二部分一國國際責任的內容","section":"第三章嚴重違背依一般國際法強制性規範承擔的義務","content":"1．本章適用於一國嚴重違背依一般國際法強制性規範承擔的義務所產生的國際責任。\n2．如果這種違約情況是由於責任國嚴重或系統性違約所引起的，則為嚴重違約行為。"},{"num":41,"title":"嚴重違背依本章承擔的一項義務的特定後果","part":"第二部分一國國際責任的內容","section":"第三章嚴重違背依一般國際法強制性規範承擔的義務","content":"1．各國應進行合作，透過合法手段制止第40條含義範圍內的任何嚴重違背義務行為。\n2．任何國家均不得承認第40條含義範圍內的嚴重違背義務行為所造成的情況為合法，也不得協助或援助保持該狀況。\n3．本條不妨礙本部分所指的其他後果和本章適用的違背義務行為可能依國際法引起的進一步的此類後果。"},{"num":42,"title":"一受害國援引責任","part":"第三部分一國國際責任的履行","section":"第一章一國責任的援引","content":"一國有權在下列情況下作為受害國援引另一國的責任：\n（a）被違背的義務是個別地對它承擔的義務；\n（b）被違背的義務是對包括該國在內的一國家集團或對整個國際社會承擔的義務；而\n（一）對此義務的違背特別影響該國；或\n（二）徹底改變了由於該項義務被違背而受到影響的所有其他國家對進一步履行該項義務的立場。"},{"num":43,"title":"一受害國通知其要求","part":"第三部分一國國際責任的履行","section":"第一章一國責任的援引","content":"1．援引另一國責任的受害國應將其要求通知該國。\n2．受害國可具體指明：\n（a）從事一項持續性不法行為的責任國應如何停止該行為；\n（b）應根據第二部分的規定採取哪種賠償形式。"},{"num":44,"title":"可否提出要求","part":"第三部分一國國際責任的履行","section":"第一章一國責任的援引","content":"在下列情況下不得援引另一國的責任：\n（a）不是按照涉及國籍的任何可適用的規則提出要求；\n（b）該項要求適用用盡當地補救辦法規則，卻未用盡可利用的有效當地補救辦法。"},{"num":45,"title":"援引責任權利的喪失","part":"第三部分一國國際責任的履行","section":"第一章一國責任的援引","content":"在下列情況下不得援引另一國的責任：\n（a）受害國已以有效方式放棄要求；或\n（b）受害國基於其行為應被視為已以有效方式默許其要求失效。"},{"num":46
