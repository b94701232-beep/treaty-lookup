,"title":"數個受害國","part":"第三部分一國國際責任的履行","section":"第一章一國責任的援引","content":"在數個國家由於同一國際不法行為而受害的情況下，每一受害國可分別援引實施了該國際不法行為的國家的責任。"},{"num":47,"title":"數個責任國","part":"第三部分一國國際責任的履行","section":"第一章一國責任的援引","content":"1．在數個國家應為同一國際不法行為負責任的情況下，可對每一國家援引涉及該行為的責任：\n2．第1款：\n（a）不允許任何受害國取回多於所受損失的補償；\n（b）不妨礙對其他責任國的任何追索權利。"},{"num":48,"title":"受害國以外的國家援引責任","part":"第三部分一國國際責任的履行","section":"第一章一國責任的援引","content":"1．受害國以外的任何國家有權按照第2款在下列情況下對另一國援引責任：\n（a）被違背的義務是對包括該國在內的一國家集團承擔的、為保護該集團的集體利益而確立的義務；或\n（b）被違背的義務是對整個國際社會承擔的義務。\n2．有權按照第1款援引責任的任何國家可要求責任國：\n（a）按照第30條的規定，停止國際不法行為，並提供不重複的承諾和保證；和\n（b）按照前幾條中的規定履行向受害國或被違背之義務的受益人提供賠償的義務。\n3．受害國根據第43條、第44條和第45條援引責任的必要條件，適用於有權根據第1款對另一國援引責任的國家援引責任的情況。"},{"num":49,"title":"反措施的目的和限制","part":"第三部分一國國際責任的履行","section":"第二章反措施","content":"1．一受害國只在為促使一國際不法行為的責任國依第二部分履行其義務時，才可對該國採取反措施。\n2．反措施限於暫不履行對責任國採取措施的一國的國際義務。\n3．反措施應儘可能容許恢復履行有關義務。"},{"num":50,"title":"不受反措施影響的義務","part":"第三部分一國國際責任的履行","section":"第二章反措施","content":"1．反措施不得影響下列義務：\n（a）（聯合國憲章〉中規定的不得實行武力威脅或使用武力的義務；\n（b）保護基本人權的義務；\n（c）禁止報復的人道主義性質的義務；\n（d）依一般國際法強制性規範承擔的其他義務。\n2．採取反措施的國家仍應履行其下列義務：\n（a）實行它與責任國之間任何可適用的現行解決爭端程序；\n（b）尊重外交或領事人員、館舍、檔案和檔案之不可侵犯性。"},{"num":51,"title":"相稱","part":"第三部分一國國際責任的履行","section":"第二章反措施","content":"反措施必須和所遭受的損害相稱，並應考慮到國際不法行為的嚴重程度和有關權利。"},{"num":52,"title":"與採取反措施有關的條件","part":"第三部分一國國際責任的履行","section":"第二章反措施","content":"1．一受害國在採取反措施以前應：\n（a）根據第43條要求責任國按照第二部分的規定履行其義務；\n（b）將採取反措施的任何決定通知責任國並提議與該國進行談判。\n2．雖有第1款（b）項的規定，受害國可採取必要的緊急反措施以維護其權利。\n3．在下列情況下不得采取反措施，如已採取，務必停止，不得無理拖延：\n（a）國際不法行為已經停止，並且\n（b）已將爭端提交有權作出對當事國具有約束力之決定的法院或法庭。\n4．若責任國不秉誠履行解決爭端程序，第3款即不適用。"},{"num":53,"title":"終止反措施","part":"第三部分一國國際責任的履行","section":"第二章反措施","content":"一旦責任國按照第二部分履行其與國際不法行為有關的義務，即應儘快終止反措施。"},{"num":54,"title":"受害國以外的國家採取的反措施","part":"第三部分一國國際責任的履行","section":"第二章反措施","content":"本章不妨礙依第48條第1款有權援引另一國責任的任何國家，對該另一國採取合法措施以確保停止該違背義務行為和使受害國和被違背之該義務的受益人得到賠償。"},{"num":55,"title":"特別法","part":"第四部分一般規定","section":"","content":"在並且只在一國際不法行為的存在條件或一國國際責任的內容或履行應由國際法特別規則規定的情況下，不得適用本條款。"},{"num":56,"title":"本條款中沒有明文規定的國家責任問題","part":"第四部分一般規定","section":"","content":"在本條款中沒有明文規定的情況下，關於一國對一國際不法行為的責任問題，仍應遵守可適用的國際法規則。"},{"num":57,"title":"國際組織的責任","part":"第四部分一般規定","section":"","content":"本條款不影響一國際組織依國際法承擔的，或任何國家對一國際組織的行為責任的任何問題。"},{"num":58,"title":"個人的責任","part":"第四部分一般規定","section":"","content":"本條款不影響以國家名義行事的任何人在國際法中的個人責任問題。"},{"num":59,"title":"《聯合國憲章》","part":"第四部分一般規定","section":"","content":"本條款不妨礙《聯合國憲章》的規定。"}] },
  icj: { key:"icj", short:"國際法院規約", full:"國際法院規約", eyebrow:"ICJ STATUTE · 1945", total: 69, minNum:2, maxNum:70, parts: 5, unitLabel:"章", articles: [{"num":2,"title":"","part":"第一章  法院之組織","section":"","content":"法院以獨立法官若干人組織之。此項法官應不論國籍，就品格高尚並在各本國具有最高司法職位之任命資格或公認為國際法之法學家中選舉之。"},{"num":3,"title":"","part":"第一章  法院之組織","section":"","content":"法院以法官十五人組織之，其中不得有二人為同一國家之國民。\n就充任法院法官而言，一人而可視為一個國家以上之國民者，應認為屬於其通常行使公民及政治權利之國家或會員國之國民。"},{"num":4,"title":"","part":"第一章  法院之組織","section":"","content":"法院法官應由大會及安全理事會依下列規定就常設公斷法院各國團體所提出之名單內選舉之。\n在常設公斷法院並無代表之聯合國會員國，其候選人名單應由各該國政府專為此事而委派之團體提出；此項各國團體之委派，準用一九０七年海牙和平解決國際紛爭條約第四十四條規定委派常設公斷法院公斷員之條件。凡非聯合國會員國而已接受法院規約之國家，其參加選舉法院法官時，參加條件，如無特別協定，應由大會經安全理事會之提議規定之。"},{"num":5,"title":"","part":"第一章  法院之組織","section":"","content":"聯合國秘書長至遲應於選舉日期三個月前，用書面邀請屬於本規約當事國之常設公斷法院公斷員，及依第四條第二項所委派之各國團體。於一定期間內分別由各國團體提出能接受法官職務之人員。\n每一團體所提人數不得超過四人，其中屬其本國國籍者不得超過二人。\n在任何情形下，每一團體所提候選人之人數不得超過應佔席數之一倍。"},{"num":6,"title":"","part":"第一章  法院之組織","section":"","content":"各國團體在提出上項人員以前，宜諮詢本國最高法院、大學法學院、法律學校、專研法律之國家研究院、及國際研究院在各國所設之各分院。"},{"num":7,"title":"","part":"第一章  法院之組織","section":"","content":"秘書長應依字母次序，編就上項所提人員之名單。除第十二條第二項規定外，僅此項人員有被選權。\n秘書長應將前項名單提交大會及安全理事會。"},{"num":8,"title":"","part":"第一章  法院之組織","section":"","content":"大會及安全理事會各應獨立舉行法院法官之選舉。"},{"num":9,"title":"","part":"第一章  法院之組織","section":"","content":"每次選舉時，選舉人不獨應注意被選人必須各具必要資格，並應注意務使法官全體確能代表世界各大文化及各主要法系。"},{"num":10,"title":"","part":"第一章  法院之組織","section":"","content":"候選人在大會及在安全理事會得絕對多數票者應認為當選。\n安全理事會之投票，或為法官之選舉或為第十二條所稱聯席會議人員之指派，應不論安全理事會常任理事國及非常任理事國之區別。\n如同一國家之國民得大會及安全理事會之絕對多數票者不止一人時，其年事最高者應認為當選。"},{"num":11,"title":"","part":"第一章  法院之組織","section":"","content":"第一次選舉會後，如有一席或一席以上尚待補選時，應舉行第二次選舉會，並於必要時舉行第三次選舉會。"},{"num":12,"title":"","part":"第一章  法院之組織","section":"","content":"第三次選舉會後，如仍有一席或一席以上尚待補選時，大會或安全理事會得隨時聲請組織聯席會議，其人數為六人，由大會及安全理事會各派三人。此項聯席會議就每一懸缺以絕對多數票選定一人提交大會及安全理事會分別請其接受。\n具有必要資格人員，即未列入第七條所指之候選人名單，如經聯席會議全體同意，亦得列入該會議名單。\n如聯席會議確認選舉不能有結果時，應由已選出之法官，在安全理事會所定之期間內，就曾在大會或安全理事會得有選舉票之候選人中，選定若干人補足缺額。\n法官投票數相等時，年事最高之法官應投決定票。"},{"num":13,"title":"","part":"第一章  法院之組織","section":"","content":"法官任期九年，並得連選，但第一次選舉選出之法官中，五人任期應為三年，另五人為六年。\n上述初期法官，任期孰為三年孰為六年，應於第一次選舉完畢後立由秘書長以抽籤方法決定之。\n法官在其後任接替前，應繼續行使其職務，雖經接替，仍應結束其已開始辦理之案件。\n法官辭職時應將辭職書致送法院院長轉知秘書長。轉知後，該法官之一席即行出缺。"},{"num":14,"title":"","part":"第一章  法院之組織","section":"","content":"凡遇出缺，應照第一次選舉時所定之辦法補選之，但秘書長應於法官出缺後一個月內，發出第五條規定之邀請書，並由安全理事會指定選舉日期。"},{"num":15,"title":"","part":"第一章  法院之組織","section":"","content":"法官被選以接替任期未滿之法官者，應任職至其前任法官任期屆滿時為止。"},{"num":16,"title":"","part":"第一章  法院之組織","section":"","content":"法官不得行使任何政治或行政職務，或執行任何其他職業性質之任務。\n關於此點，如有疑義，應由法院裁決之。"},{"num":17,"title":"","part":"第一章  法院之組織","section":"","content":"法官對於任何案件，不得充任代理人、律師或輔佐人。法官曾以當事國一造之代理人、律師或輔佐人、或以國內法院或國際法院或調查委員會委員、或以其他資格參加任何案件者，不得參與該案件之裁決。\n關於此點，如有疑義，應由法院決定之。"},{"num":18,"title":"","part":"第一章  法院之組織","section":"","content":"法官除由其餘法官一致認為不復適合必要條件外，不得免職。\n法官之免職，應由書記官長正式通知秘書長。\n此項通知一經送達秘書長，該法官之一席即行出缺。"},{"num":19,"title":"","part":"第一章  法院之組織","section":"","content":"法官於執行法院職務時，應享受外交特權及豁免。"},{"num":20,"title":"","part":"第一章  法院之組織","section":"","content":"法官於就職前應在公開法庭鄭重宣言本人必當秉公竭誠行使職權。"},{"num":21,"title":"","part":"第一章  法院之組織","section":"","content":"法院應選舉院長及副院長，其任期各三年，並得連選。法院應委派書記官長，並得酌派其他必要之職員。"},{"num":22,"title":"","part":"第一章  法院之組織","section":"","content":"法院設在海牙，但法院如認為合宜時，得在他處開庭及行使職務。\n院長及書記官長應駐於法院所在地。"},{"num":23,"title":"","part":"第一章  法院之組織","section":"","content":"法院除司法假期外，應常住辦公，司法假期之日期及期間由法院定之。\n法官得有定時假期，其日期及期間，由法院斟酌海牙與各法官住所之距離定之。\n法官除在假期或因疾病或其他重大原由，不克視事，經向院長作適當之解釋外，應常住備由法院分配工作。"},{"num":24,"title":"","part":"第一章  法院之組織","section":"","content":"法官如因特別原由認為於某案之裁判不應參與時，應通知院長。\n院長如認某法官因特別原由不應參與某案時，應以此通知該法官。\n遇有此種情形，法官與院長意見不同時，應由法院決定之。"},{"num":25,"title":"","part":"第一章  法院之組織","section":"","content":"除本規約另有規定外，法院應由全體法官開庭。\n法院規則得按情形並以輪流方法，規定准許法官一人或數人免予出席，但準備出席之法官人數不得因此減至少於十一人。\n法官九人即足構成法院之法定人數。"},{"num":26,"title":"","part":"第一章  法院之組織","section":"","content":"法院得隨時設立一個或數個分庭，並得決定由法官三人或三人以上組織之。此項分庭處理特種案件，例如勞工案件及關於過境與交通案件。\n法院為處理某特定案件，得隨時設立分庭，組織此項分庭法官之人數，應由法院得當事國之同意定之。\n案件經當事國之請求應由本條規定之分庭審理裁判之。"},{"num":27,"title":"","part":"第一章  法院之組織","section":"","content":"第二十六條及第二十九條規定之任何分庭所為之裁判，應視為法院之裁判。"},{"num":28,"title":"","part":"第一章  法院之組織","section":"","content":"第二十六條及第二十九條規定之分庭，經當事國之同意，得在海牙以外地方開庭及行使職務。"},{"num":29,"title":"","part":"第一章  法院之組織","section":"","content":"法院為迅速處理事務，應於每年以法官五人組織一分庭。該分庭經當事國之請求，得用簡易程序，審理及裁判案件。法院並應選定法官二人，以備接替不能出庭之法官。"},{"num":30,"title":"","part":"第一章  法院之組織","section":"","content":"法院應訂立規則，以執行其職務，尤應訂定關於程序之規則。\n法院規則得規定關係襄審官之出席法院或任何分庭，但無表決權。"},{"num":31,"title":"","part":"第一章  法院之組織","section":"","content":"屬於訴訟當事國國籍之法官，於法院受理該訴訟案件時，保有其參與之權。\n法院受理案件，如法官中有屬於一造當事國之國籍者，任何他造當事國得選派一人為法官，參與該案。此項人員尤以就第四條及第五條規定所提之候選人中選充為宜。法院受理案件，如當事國均無本國國籍法官時，各當事國均得依本條第二項之規定選派法官一人。\n本條之規定之於第二十六條及第二十九條之情形適用之。在此種情形下，院長應請分庭法官一人，或於必要時二人，讓與屬於關係當事國國籍之法官，如無各當事國國籍之法官或各該法官不能出席時，應讓與各當事國特別選派之法官。\n如數當事國具有同樣利害關係時，在上列各規定適用範圍內，祇應作為一當事國。關於此點，如有疑義，由法院裁決之。\n依本條第二項、第三項、及第四項規定所選派之法官，應適合本規約第二條、第十七條第二項、第二十條、及第二十四條規定之條件。各該法官參與案件之裁判時，與其同事立於完全平等之地位。"},{"num":32,"title":"","part":"第一章  法院之組織","section":"","content":"法院法官應領年俸。\n院長每年應領特別津貼。\n副院長於代行院長職務時，應按日領特別津貼。\n依第三十一條規定所選派之法官而非法院之法官者，於執行職務時，應按日領酬金。\n上列俸給津貼及酬金由聯合國大會定之，在任期內，不得減少。\n書記官長之俸給，經法院之提議由大會定之。\n法官及書記官支給退休金及補領旅費之條件由大會訂立章程規定之。\n上列俸給津貼及酬金，應免除一切稅捐。"},{"num":33,"title":"","part":"第一章  法院之組織","section":"","content":"法院經費由聯合國擔負，其擔負方法由大會定之。"},{"num":34,"title":"","part":"第二章  法院之管轄","section":"","content":"在法院得為訴訟當事國者，限於國家。\n法院得依其規則，請求公共國際團體供給關於正在審理案件之情報。該項團體自動供給之情報，法院應接受之。\n法院於一案件遇有公共國際團體之組織約章或依該項約章所締結之國際協約，發生解釋問題時，書記官長應通知有關公共國際團體並向其遞送所有書面程序之文件副件。"},{"num":35,"title":"","part":"第二章  法院之管轄","section":"","content":"法院受理本規約各當事國之訴訟。\n法院受理其他各國訴訟之條件，除現行條約另有特別規定外，由安全理事會定之，但無論如何，此項條件不得使當事國在法院處於不平等地位。\n非聯合國會員國為案件之當事國時，其應擔負法院費用之數目由法院定之，如該國業已分擔法院經費之一部，本項規定不適用之。"},{"num":36,"title":"","part":"第二章  法院之管轄","section":"","content":"法院之管轄包括各當事國提交之一切案件，及聯合國憲章或現行條約及\n協約中所特定之一切事件。\n本規約各當事國得隨時聲明關於具有下列性質之一切法律爭端，對於接\n受同樣義務之任何其他國家，承認法院之管轄為當然而具有強制性，不\n須另訂特別協定：\n一、條約之解釋。\n二、國際法之任何問題。\n三、任何事實之存在，如經確定即屬違反國際義務者。\n四、因違反國際義務而應予賠償之性質及其範圍。\n上述聲明，得無條件為之，或以數個或特定之國家間彼此拘束為條件，\n或以一定之期間為條件。\n此項聲明，應交存聯合國秘書長並由其將副本分送本規約各當事國及法\n院書記官長。\n曾依常設國際法院規約第三十六條所為之聲明而現仍有效者，就本規約\n當事國間而言，在該項聲明期間尚未屆滿前並依其條款，應認為對於國\n際法院強制管轄之接受。關於法院有無管轄權之爭端，由法院裁決之。"},{"num":37,"title":"","part":"第二章  法院之管轄","section":"","content":"現行條約或協約或規定某項事件應提交國際聯合會所設之任何裁判機關或常設國際法院者，在本規約當事國間，該項事件應提交國際法院。"},{"num":38,"title":"","part":"第二章  法院之管轄","section":"","content":"法院對於陳訴各項爭端，應依國際法裁判之，裁判時應適用：\n一、不論普通或特別國際協約，確立訴訟當事國明白承認之規條者。\n二、國際習慣，作為通例之證明而經接受為法律者。\n三、一般法律原則為文明各國所承認者。\n四、在第五十九條規定之下，司法判例及各國權威最高之公法學家學說，作為確定法律原則之補助資料者。\n前項規定不妨礙法院經當事國同意本\"公允及善良\"原則裁判案件之權\n。"},{"num":39,"title":"","part":"第三章  程序","section":"","content":"法院正式文字為英法兩文。如各當事國同意用法文辦理案件，其判決應以法文為之。如各當事國同意用英文辦理案件，其判決應以英文為之。\n如未經同意應用何種文字，每一當事國於陳述中得擇用英法兩文之一，而法院之判詞應用英法兩文。法院並應同時確定以何者為準。\n法院經任何當事國之請求，應准該當事國用英法文以外之文字。"},{"num":40,"title":"","part":"第三章  程序","section":"","content":"向法院提出訴訟案件，應按其情形將所訂特別協定通告書記官長或以請求書送達書記官長。不論用何項方法，均應敘明爭端事由及各當事國。\n書記官長應立將請求書通知有關各方。\n書記官長並應經由秘書長通知聯合國會員國及有權在法院出庭其他之國家。"},{"num":41,"title":"","part":"第三章  程序","section":"","content":"法院如認情形有必要時，有權指示當事國應行遵守以保全彼此權利之臨時辦法。\n在終局判決前，應將此項指示辦法立即通知各當事國及安全理事會。"},{"num":42,"title":"","part":"第三章  程序","section":"","content":"各當事國應由代理人代表之。\n各當事國得派律師或輔佐人在法院予以協助。\n各當事國之代理人、律師及輔佐人應享受關於獨立行使其職務所必要之特權及豁免。"},{"num":43,"title":"","part":"第三章  程序","section":"","content":"訴訟程序應分書面與口述兩部份。\n書面程序係指以訴狀、辯訴狀、及必要時之答辯狀連同可資佐證之各種文件及公文書、送達法院及各當事國。此項送達應由書記官長依法院所定次序及期限為之。\n當事國一造所提出之一切文件應將證明無訛之抄本一份送達他造。\n口述程序係指法院審訊證人、鑑定人、代理人、律師及輔佐人。"},{"num":44,"title":"","part":"第三章  程序","section":"","content":"法院遇有對於代理人、律師及輔佐人以外之人送達通知書、而須在某國領土內行之者，應逕向該政府接洽。\n為就地搜集證據而須採取步驟時，適用前項規定。"},{"num":45,"title":"","part":"第三章  程序","section":"","content":"法院之審訊應由院長指揮，院長不克出席時，由副院長指揮；院長副院長均不克出席時，由出席法官中之資深者主持。"},{"num":46,"title":"","part":"第三章  程序","section":"","content":"法院之審訊應公開行之，但法院另有決定或各當事國要求拒絕公眾旁聽時，不在此限。"},{"num":47,"title":"","part":"第三章  程序","section":"","content":"每次審訊應作成記錄，由書記官長及院長簽名。\n前項記錄為唯一可據之記錄。"},{"num":48,"title":"","part":"第三章  程序","section":"","content":"法院為進行辦理案件應頒發命令；對於當事國每造，應決定其必須終結辯論之方式及時間；對於證據之搜集，應為一切之措施。"},{"num":49,"title":"","part":"第三章  程序","section":"","content":"法院在開始審訊前，亦得令代理人提出任何文件，或提供任何解釋。如經拒絕應予正式記載。"},{"num":50,"title":"","part":"第三章  程序","section":"","content":"法院得隨時選擇任何個人、團體、局所、委員會、或其他組織，委以調查或鑑定之責。"},{"num":51,"title":"","part":"第三章  程序","section":"","content":"審訊時得依第三十條所指法院在其程序規則中所定之條件，向證人偶及定人提出任何切要有關之詰問。"},{"num":52,"title":"","part":"第三章  程序","section":"","content":"法院於所定期限內收到各項證明及證據後，得拒絕接受當事國一造欲提出之其他口頭或書面證據，但經他造同意者，不在此限。"},{"num":53,"title":"","part":"第三章  程序","section":"","content":"當事國一造不到法院或不辯護其主張時，他造得請求法院對自己主張為有利之裁判。\n法院於允准前項請求前，應查明不特依第三十六條及第三十七條法院對本案有管轄權，且請求人之主張在事實及法律上均有根據。"},{"num":54,"title":"","part":"第三章  程序","section":"","content":"代理人律師及輔佐人在法院指揮下陳述其主張已完畢時，院長應宣告辯論終結。\n法官應退席討論判決。\n法官之評議應秘密為之，並永守秘密。"},{"num":55,"title":"","part":"第三章  程序","section":"","content":"一切問題應由出席法官之過半數決定之。\n如投票數相等時，院長或代法院長職務之法官應投決定票。"},{"num":56,"title":"","part":"第三章  程序","section":"","content":"判詞應敘明理由。\n判詞應載明參與裁判之法官姓名。"},{"num":57,"title":"","part":"第三章  程序","section":"","content":"判詞如全部或一部份不能代表法官一致之意見時，任何法官得另行宣告其個別意見。"},{"num":58,"title":"","part":"第三章  程序","section":"","content":"判詞應由院長及書記官長簽名，在法庭內公開宣讀，並應先期通知各代理人。"},{"num":59,"title":"","part":"第三章  程序","section":"","content":"法院之裁判除對於當事國及本案外，無拘束力。"},{"num":60,"title":"","part":"第三章  程序","section":"","content":"法院之判決係屬確定，不得上訴。判詞之意義或範圍發生爭端時，經任何當事國之請求後，法院應予解釋。"},{"num":61,"title":"","part":"第三章  程序","section":"","content":"聲請法院覆核判決，應根據發現具有決定性之事實，而此項事實在判決宣告時為法院之聲請覆核之當事國所不知者，但以非因過失而不知者為限。\n覆核程序之開始應由法院以下裁決，載明新事實之存在，承認此項新事實具有使本案應予覆核之性質，並宣告覆核之聲請因此可予接受。\n法院於接受覆核訴訟前得令先行覆行判決之內容。\n聲請覆核至遲應於新事實發現後六個月內為之。\n聲請覆核自判決日起逾十年後不得為之。"},{"num":62,"title":"","part":"第三章  程序","section":"","content":"某一國家如認為某案件之判決可影響屬於該國具有法律性質之利益時，得向法院聲請參加。\n此項聲請應由法院裁決之。"},{"num":63,"title":"","part":"第三章  程序","section":"","content":"凡協約發生解釋問題，而訴訟當事國以外尚有其他國家為該協約之簽字國者，應立由書記官長通知各該國家。受前項通知之國家有參加程序之權；但如該國行使此項權利時，判決中之解釋對該國具有同樣拘束力。"},{"num":64,"title":"","part":"第三章  程序","section":"","content":"除法院另有裁定外，訴訟費用由各造當事國自行擔負。"},{"num":65,"title":"","part":"第四章  諮詢意見","section":"","content":"法院對於任何法律問題如經任何團體由聯合國憲章授權而請求或依照聯合國憲章而請求時，得發表諮詢意見。凡向法院請求諮詢意見之問題，應以聲請書送交法院。此項聲請書對於諮詢意見之問題，應有確切之敘述，並應附送足以釋明該問題之一切文件。"},{"num":66,"title":"","part":"第四章  諮詢意見","section":"","content":"書記官長應立將諮詢意見之聲請，通知凡有權在法院出庭之國家。\n書記官長並應以特別且直接之方法通知法院（或在法院不開庭時，院長）所認為對於諮詢問題能供給情報之有權在法院出庭之任何國家，或能供給情報之國際團體，聲明法院於院長所定之期限內準備接受關於該問題之書面陳述，或準備於本案公開審訊時聽取口頭陳述。\n有權在法院出庭之任何國家如未接到本條第二項所指之特別通知時，該國家得表示願以書面或口頭陳述之意思，而由法院裁決之。\n凡已經提出書面或口頭陳述或兩項陳述之國家及團體，對於其他國家或團體所提之陳述，准其依法院（或在法院不開庭時，院長）所定關於每案之方式，範圍及期限，予以評論。書記官長應於適當時間內將此項書面陳述通知已經提出此類陳述之國家及團體。"},{"num":67,"title":"","part":"第四章  諮詢意見","section":"","content":"法院應將其諮詢意見當庭公開宣告並先期通知秘書長、聯合國會員國、及有直接關係之其他國家及國際團體之代表。"},{"num":68,"title":"","part":"第四章  諮詢意見","section":"","content":"法院執行關於諮詢意見之職務時，並應參照本規約關於訴訟案件各條款之規定，但以法院認為該項條款可以適用之範圍為限。"},{"num":69,"title":"","part":"第五章  修正","section":"","content":"本規約之修正準用聯合國憲章所規定關於修正憲章之程序，但大會經安全理事會之建議得制定關於本規約當事國而非聯合國會員國參加該項程序之任何規定。"},{"num":70,"title":"","part":"第五章  修正","section":"","content":"法院認為必要時得以書面向秘書長提出對於本規約之修正案，由聯合國依照第六十九條之規定，加以討論。"}] },
  diplomatic: { key:"diplomatic", short:"外交關係公約", full:"維也納外交關係公約", eyebrow:"VCDR · 1961", total: 53, minNum:1, maxNum:53, parts: 1, unitLabel:"", articles: [{"num":1,"title":"","part":"維也納外交關係公約","section":"","content":"就適用本公約而言，下列名稱之意義，應依下列規定：\n（a）稱\"使館館長\"者，謂派遣國責成擔任此項職位之人；\n（b）稱\"使館人員\"者，謂使館館長及使館職員；\n（c）稱\"使館職員\"者，謂使館外交職員、行政及技術職員，及事務職員；\n（d）稱\"外交職員\"者，謂具有外交官級位之使館職員；\n（e）稱\"外交代表\"者，謂使館館長或使館外交職員；\n（f）稱\"行政及技術職員\"者，謂承辦使館行政及技術事務之使館職員；\n（g）稱\"事務職員\"者，謂為使館僕役之使館職員；\n（h）稱\"私人僕役\"者，謂充使館人員傭僕而非為派遣國僱用之人；\n（i）稱\"使館館舍\"者，謂供使館使用及供使館館長寓邸之用之建築物或建築物之各部分，以及其所附屬之土地，至所有權誰屬，則在所不問。"},{"num":2,"title":"","part":"維也納外交關係公約","section":"","content":"國與國間外交關係及常設使館之建立，以協議為之。"},{"num":3,"title":"","part":"維也納外交關係公約","section":"","content":"一、除其他事項外，使館之職務如下：\n(a)在接受國中代表派遣國；\n(b)於國際法許可之限度內，在接受國中保護派遣國及其國民之利益；\n(c)與接受國政府辦理交涉；\n(d)以一切合法手段調查接受國之狀況及發展情形，向派遣國政府具報；\n(e)促進派遣國與接受國間之友好關係，及發展兩國間之經濟、文化與科學關係。\n二、本公約任何規定不得解釋為禁止使館執行領事職務。"},{"num":4,"title":"","part":"維也納外交關係公約","section":"","content":"一、派遣國對於擬派駐接受國之使館館長人選務須查明其確已獲得接受國之同意。\n二、接受國無須向派遣國說明不予同意之理由。"},{"num":5,"title":"","part":"維也納外交關係公約","section":"","content":"一、派遣國向有關接受國妥為通知後，得酌派任一使館館長或外交職員兼駐一個以上國家，但任何接受國明示反對者，不在此限。\n二、派遣國委派使館館長兼駐另一國或數國者，得在該館長不常川駐節之國內，設立以臨時代辦為館長之使館。\n三、使館館長或使館任何外交職員得兼任派遣國駐國際組織之代表。"},{"num":6,"title":"","part":"維也納外交關係公約","section":"","content":"兩個以上國家得合派同一人為駐另一國之使館館長，但接受國表示反對者不在此限。"},{"num":7,"title":"","part":"維也納外交關係公約","section":"","content":"除第五條、第八條、第九條及第十一條另有規定外，派遣國得自由委派使館職員。關於陸、海、空軍武官，接受國得要求先行提名，徵求該國同意。"},{"num":8,"title":"","part":"維也納外交關係公約","section":"","content":"一、使館外交職員原則上應屬派遣國國籍。\n二、委派屬接受國國籍之人為使館外交職員，非經接受國同意，不得為之；此項同意得隨時撤銷之。\n三、接受國對於第三國國民之亦非為派遣國國民者，得保留同樣之權利。"},{"num":9,"title":"","part":"維也納外交關係公約","section":"","content":"一、接受國得隨時不具解釋通知派遣國宣告使館館長或使館任何外交職員為不受歡迎人員或使館任何其他職員為不能接受。遇此情形，派遣國應斟酌情況召回該員或終止其在使館中之職務。任何人員得於其到達接受國國境前，被宣告為不受歡迎或不能接受。\n二、如派遣國拒絕或不在相當期間內履行其依本條第一項規定所負義務，接受國得拒絕承認該員為使館人員。"},{"num":10,"title":"","part":"維也納外交關係公約","section":"","content":"一、下列事項應通知接受國外交部或另經商定之其他部：\n(a)使館人員之委派，其到達及最後離境或其在使館中職務之終止；\n(b)使館人員家屬到達及最後離境；遇有任何人成為或不復為使館人員家屬時，亦宜酌量通知；\n(c)本項(a)款所稱人員僱用之私人僕役到達及最後離境；遇有私人僕役不復受此等人員僱用時，亦宜酌量通知；\n(d)僱用居留接受國之人為使館人員或為得享特權與豁免之私人僕役時，其僱用與解僱。\n二、到達及最後離境，於可能範圍內，亦應事先通知。"},{"num":11,"title":"","part":"維也納外交關係公約","section":"","content":"一、關於使館之構成人數如另無協議，接受國得酌量本國環境與情況及特定使館之需要，要求使館構成人數不超過該國認為合理及正常之限度。\n二、接受國亦得在同樣範圍內並在無差別待遇之基礎上，拒絕接受某一類之官員。"},{"num":12,"title":"","part":"維也納外交關係公約","section":"","content":"派遣國非經接受國事先明示同意，不得在使館本身所在地以外之地點設立辦事處，作為使館之一部分。"},{"num":13,"title":"","part":"維也納外交關係公約","section":"","content":"一、使館館長依照接受應予劃一適用之通行慣例。在呈遞國書後或在向接受國外交部或另經商定之其他部通知到達並將所奉國書正式副本送交後，即視為已在接受國內開始執行職務。\n二、呈遞國書或遞送國書正式副本之次第依使館館長到達之日期及時間先後定之。"},{"num":14,"title":"","part":"維也納外交關係公約","section":"","content":"一、使館館長分為如下三級：\n(a)向國家元首派遣之大使或教廷大使，及其他同等級位之使館館長；\n(b)向國家元首派遣之使節、公使及教廷公使；\n(c)向外交部長派遣之代辦。\n二、除關於優先地位及禮儀之事項外，各使館館長不應因其所屬等級而有任何差別。"},{"num":15,"title":"","part":"維也納外交關係公約","section":"","content":"使館館長所屬之等級應由關係國家商定之。"},{"num":16,"title":"","part":"維也納外交關係公約","section":"","content":"一、使館館長在其各別等級中之優先地位應按照其依第十三條規定開始執行職務之日期及時間先後定之。\n二、使館館長之國書如有變更而對其所屬等級並無更動時，其優先地位不受影響。\n三、本條規定不妨礙接受國所採行關於教廷代表優先地位之任何辦法。"},{"num":17,"title":"","part":"維也納外交關係公約","section":"","content":"使館外交職員之優先順序應由使館館長通知外交部或另經商定之其他部。"},{"num":18,"title":"","part":"維也納外交關係公約","section":"","content":"各國接待使館館長，對於同一等級之館長應適用劃一程序。"},{"num":19,"title":"","part":"維也納外交關係公約","section":"","content":"一、使館館長缺位或不能執行職務時，應由臨時代辦暫代使館館長。臨時代辦姓名應由使館館長通知接受國外交部或另經商定之其他部；如館長不能通知時，則由派遣國外交部通知之。\n二、使館如在接受國內並無外交職員時，派遣國得於徵得接受國同意後，指派行政或技術職員一人，主持使館日常行政事務。"},{"num":20,"title":"","part":"維也納外交關係公約","section":"","content":"使館及其館長有權在使館館舍，及在使館館長寓邸與交通工具上使用派遣國之國旗或國徽。"},{"num":21,"title":"","part":"維也納外交關係公約","section":"","content":"一、接受國應便利派遣國依照接受國法律在其境內置備派遣國使館所需之館舍，或協助派遣國以其他方法獲得房舍。\n二、接受國遇必要時，並應協助使館為其人員獲得適當之房舍。"},{"num":22,"title":"","part":"維也納外交關係公約","section":"","content":"一、使館館捨不得侵犯。接受國官吏非經使館館長許可，不得進入使館館舍。\n二、接受國負有特殊責任，採取一切適當步驟保護使館館舍免受侵入或損害，並防止一切擾亂使館安寧或有損使館尊嚴之情事。\n三、使館館舍及設備，以及館舍內其他財產與使館交通工具免受搜查、徵用、扣押或強制執行。"},{"num":23,"title":"","part":"維也納外交關係公約","section":"","content":"一、派遣國及使館館長對於使館所有或租賃之館舍，概免繳納國家、區域或地方性捐稅，但其為對供給特定服務應納之費者不在此列。\n二、本條所稱之免稅，對於與派遣國或使館館長訂立承辦契約者依接受國法律應納之捐稅不適用之。"},{"num":24,"title":"","part":"維也納外交關係公約","section":"","content":"使館檔案及文件無論何時，亦不論位於何處，均屬不得侵犯。"},{"num":25,"title":"","part":"維也納外交關係公約","section":"","content":"接受國應給予使館執行職務之充分便利。"},{"num":26,"title":"","part":"維也納外交關係公約","section":"","content":"除接受國為國家安全設定禁止或限制進入區域另訂法律規章外，接受國應確保所有使館人員在其境內行動及旅行之自由。"},{"num":27,"title":"","part":"維也納外交關係公約","section":"","content":"一、接受國應允許使館為一切公務目的自由通訊，並予保護。使館與派遣國政府及無論何處之該國其他使館及領事館通訊時，得採用一切適當方法，包括外交信差及明密碼電信在內。但使館非經接受國同意，不得裝置並使用無線電發報機。\n二、使館之來往公文不得侵犯。來往公文指有關使館及其職務之一切來往文件。\n三、外交郵袋不得予以開拆或扣留。\n四、構成外交郵袋之包裹須附有可資識別之外部標記，以裝載外交文件或公務用品為限。\n五、外交信差應持有官方文件，載明其身分及構成郵袋之包裹件數；其於執行職務時，應受接受國保護。外交信差享有人身不得侵犯權，不受任何方式之逮捕或拘禁。\n六、派遣國或使館得派特別外交信差。遇此情形，本條第五項之規定亦應適用，但特別信差將其所負責攜帶之外交郵袋送交收件人後，即不復享有該項所稱之豁免。\n七、外交郵袋得托交預定在准許入境地點降落之商營飛機機長轉遞。機長應持有官方文件載明構成郵袋之郵包件數，但機長不得視為外交信差。使館得派館員一人徑向飛機機長自由取得外交郵袋。"},{"num":28,"title":"","part":"維也納外交關係公約","section":"","content":"使館辦理公務所收之規費及手續費免徵一切捐稅。"},{"num":29,"title":"","part":"維也納外交關係公約","section":"","content":"外交代表人身不得侵犯。外交代表不受任何方式之逮捕或拘禁。接受國對外交代表應特示尊重，並應採取一切適當步驟以防止其人身、自由或尊嚴受有任何侵犯。"},{"num":30,"title":"","part":"維也納外交關係公約","section":"","content":"一、外交代表之私人寓所一如使館館舍應享有同樣之不得侵犯權及保護。\n二、外交代表之文書及信件同樣享有不得侵犯權；其財產除第三十一條第三項另有規定外，亦同。"},{"num":31,"title":"","part":"維也納外交關係公約","section":"","content":"一、外交代表對接受國之刑事管轄享有豁免。除下列案件外，外交代表對接受國之民事及行政管轄亦享有豁免：\n(a)關於接受國境內私有不動產之物權訴訟，但其代表派遣國為使館用途置有之不動產不在此列；\n(b)關於外交代表以私人身分並不代表派遣國而為遺囑執行人、遺產管理人、繼承人或受遺贈人之繼承事件之訴訟；\n(c)關於外交代表於接受國內在公務範圍以外所從事之專業或商務活動之訴訟。\n二、外交代表無以證人身分作證之義務。\n三、對外交代表不得為執行之處分，但關於本條第一項(a)、(b)、(c)各款所列之案件，而執行處分複無損於其人身或寓所之不得侵犯權者，不在此限。\n四、外交代表不因其對接受國管轄所享之豁免而免除其受派遣國之管轄。"},{"num":32,"title":"","part":"維也納外交關係公約","section":"","content":"一、外交代表及依第三十七條享有豁免之人對管轄之豁免得由派遣國拋棄之。\n二、豁免之拋棄，概須明示。\n三、外交代表或依第三十七條享有管轄之豁免之人如主動提起訴訟即不得對與主訴直接相關之反訴主張管轄之豁免。\n四、在民事或行政訴訟程序上管轄豁免之拋棄，不得視為對判決執行之豁免亦默示拋棄，後項拋棄須分別為之。"},{"num":33,"title":"","part":"維也納外交關係公約","section":"","content":"一、除本條第三項另有規定外，外交代表就其對派遣國所為之服務而言，應免適用接受國施行之社會保險辦法。\n二、專受外交代表僱用之私人僕役亦應享有本條第一項所規定之豁免，但以符合下列條件為限：\n(a)非接受國國民且不在該國永久居留者；\n(b)受有派遣國或第三國之社會保險辦法保護者。\n三、外交代表如其所僱人員不得享受本條第二項所規定之豁免，應履行接受國社會保險辦法對雇主所規定之義務。\n四、本條第一項及第二項所規定之豁免不妨礙對於接受國社會保險制度之自願參加，但以接受國許可參加為限。\n五、本條規定不影響前此所訂關於社會保險之雙邊或多邊協定，亦不禁止此類協定之於將來議訂。"},{"num":34,"title":"","part":"維也納外交關係公約","section":"","content":"外交代表免納一切對人或對物課徵之國家、區域、或地方性捐稅，但下列各項，不在此列：\n(a)通常計入商品或勞務價格內之間接稅；\n(b)對於接受國境內私有不動產課徵之捐稅，但其代表派遣國為使館用途而置有之不動產，不在此列；\n(c)接受國課徵之遺產稅、遺產取得稅或繼承稅，但以不抵觸第三十九條第四項之規定為限；\n(d)對於自接受國內獲致之私人所得課徵之捐稅，以及對於在接受國內商務事業上所為投資課徵之資本稅；\n(e)為供給特定服務所收費用；\n(f)關於不動產之登記費、法院手續費或記錄費、抵押稅及印花稅；但第二十三條另有規定者，不在此列。"},{"num":35,"title":"","part":"維也納外交關係公約","section":"","content":"接受國對外交代表應免除一切個人勞務及所有各種公共服務，並應免除關於徵用、軍事募捐及屯宿等之軍事義務。"},{"num":36,"title":"","part":"維也納外交關係公約","section":"","content":"一、接受國應依本國製定之法律規章，准許下列物品入境，並免除一切關稅及貯存、運送及類似服務費用以外之一切其他課徵：\n(a)使館公務用品；\n(b)外交代表或與其構成同一戶口之家屬之私人用品，包括供其定居之用之物品在內。\n二、外交代表私人行李免受查驗，但有重大理由推定其中裝有不在本條第一項所稱免稅之列之物品，或接受國法律禁止進出口或有檢疫條例加以管制之物品者，不在此限。遇此情形，查驗須有外交代表或其授權代理人在場，方得為之。"},{"num":37,"title":"","part":"維也納外交關係公約","section":"","content":"一、外交代表之與其構成同一戶口之家屬，如非接受國國民，應享有第二十九條至三十六條所規定之特權與豁免。\n二、使館行政與技術職員暨與其構成同一戶口之家屬，如非接受國國民且不在該國永久居留者，均享有第二十九條至第三十五條所規定之特權與豁免，但第三十一條第一項所規定對接受國民事及行政管轄之豁免不適用於執行職務範圍以外之行為。關於最初定居時所輸入之物品，此等人員亦享有第三十六條第一項所規定之特權。\n三、使館事務職員如非接受國國民且不在該國永久居留者，就其執行公務之行為享有豁免，其受僱所得酬報免納捐稅，並享有第三十三條所載之豁免。\n四、使館人員之私人僕役如非接受國國民且不在該國永久居留者，其受僱所得酬報免納捐稅。在其他方面，此等人員僅得在接受國許可範圍內享有特權與豁免。但接受國對此等人員所施之管轄應妥為行使，以免對使館職務之執行有不當之妨礙。"},{"num":38,"title":"","part":"維也納外交關係公約","section":"","content":"一、除接受國特許享受其他特權及豁免外，外交代表為接受國國民或在該國永久居留者，僅就其執行職務之公務行為，享有管轄之豁免及不得侵犯權。\n二、其他使館館員及私人僕役為接受國國民或在該國永久居留者僅得在接受國許可之範圍內享有特權與豁免。但接受國對此等人員所施之管轄應妥為行使，以免對使館職務之執行有不當之妨礙。"},{"num":39,"title":"","part":"維也納外交關係公約","section":"","content":"一、凡享有外交特權與豁免之人，自其進入接受國國境前往就任之時起享有此項特權與豁免，其已在該國境內者，自其委派通知外交部或另經商定之其他部之時開始享有。\n二、享有特權與豁免人員之職務如已終止，此項特權與豁免通常於該員離境之時或聽任其離境之合理期間終了之時停止，縱有武裝衝突情事，亦應繼續有效至該時為止。但關於其以使館人員資格執行職務之行為，豁免應始終有效。\n三、遇使館人員死亡，其家屬應繼續享有應享之特權與豁免，至聽任其離境之合理期間終了之時為止。\n四、遇非為接受國國民且不在該國永久居留之使館人員或與其構成同一戶口之家屬死亡，接受國應許可亡故者之動產移送出國，但任何財產如係在接受國內取得而在當事人死亡時禁止出口者，不在此列。動產之在接受國純係因亡故者為使館人員或其家屬而在接受國境內所致者，應不課徵遺產稅、遺產取得稅及繼承稅。"},{"num":40,"title":"","part":"維也納外交關係公約","section":"","content":"一、遇外交代表前往就任或返任或返回本國，道經第三國國境或在該國境內，而該國曾發給所需之護照簽證時，第三國應給予不得侵犯權及確保其過境或返回所必需之其他豁免。享有外交特權或豁免之家屬與外交代表同行時，或單獨旅行前往會聚或返回本國時，本項規定同樣適用。\n二、遇有類似本條第一項所述之情形，第三國不得阻礙使館之行政與技術或事務職員及其家屬經過該國國境。\n三、第三國對於過境之來往公文及其他公務通訊，包括明密碼電信在內，應一如接受國給予同樣之自由及保護。第三國於已發給所需護照簽證之外交信差及外交郵袋過境時，應比照接受國所負之義務，給予同樣之不得侵犯權及保護。\n四、第三國依本條第一項、第二項及第三項規定所負之義務，對於各該項內分別述及之人員與公務通訊及外交郵袋之因不可抗力而在第三國境內者，亦適用之。"},{"num":41,"title":"","part":"維也納外交關係公約","section":"","content":"一、在不妨礙外交特權與豁免之情形下，凡享有此項特權與豁免之人員，均負有尊重接受國法律規章之義務。此等人員並負有不干涉該國內政之義務。\n二、使館承派遣國之命與接受國洽商公務，概應徑與或經由接受國外交部或另經商定之其他部辦理。\n三、使館館捨不得充作與本公約或一般國際法之其他規則、或派遣國與接受國間有效之特別協定所規定之使館職務不相符合之用途。"},{"num":42,"title":"","part":"維也納外交關係公約","section":"","content":"外交代表不應在接受國內為私人利益從事任何專業或商業活動。"},{"num":43,"title":"","part":"維也納外交關係公約","section":"","content":"除其他情形外，外交代表之職務遇有下列情事之一即告終了：\n(a)派遣國通知接受國謂外交代表職務業已終了；\n(b)接受國通知派遣國謂依第九條第二項之規定該國拒絕承認該外交代表為使館人員。"},{"num":44,"title":"","part":"維也納外交關係公約","section":"","content":"接受國對於非為接受國國民之享有特權與豁免人員，以及此等人員之家屬，不論其國籍為何，務須給予便利使能儘早離境，縱有武裝衝突情事，亦應如此辦理。遇必要時，接受國尤須供給其本人及財產所需之交通運輸工具。"},{"num":45,"title":"","part":"維也納外交關係公約","section":"","content":"遇兩國斷絕外交關係，或遇使館長期或暫時撤退時：\n(a)接受國務應尊重並保護使館館舍以及使館財產與檔案，縱有武裝衝突情事，亦應如此辦理；\n(b)派遣國得將使館館舍以及使館財產與檔案委託接受國認可之第三國保管；\n(c)派遣國得委託接受國認可之第三國代為保護派遣國及其國民之利益。"},{"num":46,"title":"","part":"維也納外交關係公約","section":"","content":"派遣國經接受國事先同意，得應未在接受國內派有代表之第三國之請求，負責暫時保護該第三國及其國民之利益。"},{"num":47,"title":"","part":"維也納外交關係公約","section":"","content":"一、接受國適用本公約規定時，對各國不得差別待遇。\n二、但下列情形不以差別待遇論：\n(a)接受國因派遣國對接受國使館適用本公約任一規定有所限制，對同一規定之適用亦予限制；\n(b)各國依慣例或協定，彼此給予較本公約所規定者更為有利之待遇。"},{"num":48,"title":"","part":"維也納外交關係公約","section":"","content":"本公約應聽由聯合國或任何專門機關之全體會員國、或國際法院規約當事國、及經聯合國大會邀請成為本公約當事一方之任何其他國家簽署，其辦法如下：至1961年10月31日止在奧地利聯邦外交部簽署，其後至1962年3月31日止在紐約聯合國會所簽署。"},{"num":49,"title":"","part":"維也納外交關係公約","section":"","content":"本公約須經批准。批准文件應送交聯合國秘書長存放。"},{"num":50,"title":"","part":"維也納外交關係公約","section":"","content":"本公約應聽由屬於第四十八條所稱四類之一之國家加入。加入文件應送交聯合國秘書長存放。"},{"num":51,"title":"","part":"維也納外交關係公約","section":"","content":"一、本公約應於第二十二件批准或加入文件送交聯合國秘書長存放之日後第三十日起發生效力。\n二、對於在第二十二件批准或加入文件存放後批准或加入本公約之國家，本公約應於各該國存放批准或加入文件後第三十日起發生效力。"},{"num":52,"title":"","part":"維也納外交關係公約","section":"","content":"聯合國秘書長應將下列事項通知所有屬於第四十八條所稱四類之一之國家：\n(a)依第四十八條、第四十九條及第五十條對本公約所為之簽署及送存之批准或加入文件；\n(b)依第五十一條本公約發生效力之日期。"},{"num":53,"title":"","part":"維也納外交關係公約","section":"","content":"本公約之原本應交聯合國秘書長存放，其中文、英文、法文、俄文及西班牙文各本同一作準；秘書長應將各文正式副本分送所有屬於第四十八條所稱四類之一之國家。\n為此，下列全權代表，各秉本國政府正式授予簽字之權，謹簽字於本公約，以昭信守。\n公曆1961年4月18日訂於維也納。"}] },
  roc_const: { key:"roc_const", short:"中華民國憲法", full:"中華民國憲法", eyebrow:"ROC CONST. · 1947", total: 175, minNum:1, maxNum:175, parts: 20, unitLabel:"章節", articles: [{"num":1,"title":"國體","part":"第一章 總 綱","section":"","content":"﹝1﹞中華民國基於三民主義，為民有民治民享之民主共和國。"},{"num":2,"title":"主權在民","part":"第一章 總 綱","section":"","content":"﹝1﹞中華民國之主權屬於國民全體。"},{"num":3,"title":"國民","part":"第一章 總 綱","section":"","content":"﹝1﹞具有中華民國國籍者為中華民國國民。"},{"num":4,"title":"國土　※增修§1~不適用","part":"第一章 總 綱","section":"","content":"﹝1﹞中華民國領土，依其固有之疆域，非經國民大會之決議，不得變更之。"},{"num":5,"title":"民族平等","part":"第一章 總 綱","section":"","content":"﹝1﹞中華民國各民族一律平等。"},{"num":6,"title":"國旗","part":"第一章 總 綱","section":"","content":"﹝1﹞中華民國國旗定為紅地，左上角青天白日。"},{"num":7,"title":"平等權","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等。"},{"num":8,"title":"人身自由","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民身體之自由應予保障。除現行犯之逮捕由法律另定外，非經司法或警察機關依法定程序，不得逮捕拘禁。非由法院依法定程序，不得審問處罰。非依法定程序之逮捕、拘禁、審問、處罰，得拒絕之。\n﹝2﹞人民因犯罪嫌疑被逮捕拘禁時，其逮捕拘禁機關應將逮捕拘禁原因，以書面告知本人及其本人指定之親友，並至遲於二十四小時內移送該管法院審問。本人或他人亦得聲請該管法院，於二十四小時內向逮捕之機關提審。\n﹝3﹞法院對於前項聲請，不得拒絕，並不得先令逮捕拘禁之機關查覆。逮捕拘禁之機關，對於法院之提審，不得拒絕或遲延。\n﹝4﹞人民遭受任何機關非法逮捕拘禁時，其本人或他人得向法院聲請追究，法院不得拒絕，並應於二十四小時內向逮捕拘禁之機關追究，依法處理。"},{"num":9,"title":"人民不受軍審原則","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民除現役軍人外，不受軍事審判。"},{"num":10,"title":"居住遷徙自由","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有居住及遷徙之自由。"},{"num":11,"title":"表現自由","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有言論、講學、著作及出版之自由。"},{"num":12,"title":"秘密通訊自由","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有秘密通訊之自由。"},{"num":13,"title":"信教自由","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有信仰宗教之自由。"},{"num":14,"title":"集會結社自由","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有集會及結社之自由。"},{"num":15,"title":"生存權、工作權及財產權","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民之生存權、工作權及財產權，應予保障。"},{"num":16,"title":"請願權、訴願權及訴訟權","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有請願、訴願及訴訟之權。"},{"num":17,"title":"參政權","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有選舉、罷免、創制及複決之權。"},{"num":18,"title":"應考試服公職權","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有應考試服公職之權。"},{"num":19,"title":"納稅義務","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有依法律納稅之義務。"},{"num":20,"title":"兵役義務","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有依法律服兵役之義務。"},{"num":21,"title":"受教育之權義","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞人民有受國民教育之權利與義務。"},{"num":22,"title":"基本人權保障","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞凡人民之其他自由及權利，不妨害社會秩序、公共利益者，均受憲法之保障。"},{"num":23,"title":"基本人權之限制","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞以上各條列舉之自由權利，除為防止妨礙他人自由、避免緊急危難、維持社會秩序或增進公共利益所必要者外，不得以法律限制之。"},{"num":24,"title":"公務員責任及國家賠償責任","part":"第二章 人民之權利義務","section":"","content":"﹝1﹞凡公務員違法侵害人民之自由或權利者，除依法律受懲戒外，應負刑事及民事責任。被害人民就其所受損害，並得依法律向國家請求賠償。"},{"num":25,"title":"國民大會之地位　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會依本憲法之規定，代表全國國民行使政權。"},{"num":26,"title":"國大代表之名額　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會以左列代表組織之：\n一、每縣市及其同等區域各選出代表一人，但其人口逾五十萬人者，每增加五十萬人，增選代表一人。縣市同等區域以法律定之。\n二、蒙古選出代表，每盟四人，每特別旗一人。\n三、西藏選出代表，其名額以法律定之。\n四、各民族在邊疆地區選出代表，其名額以法律定之。\n五、僑居國外之國民選出代表，其名額以法律定之。\n六、職業團體選出代表，其名額以法律定之。\n七、婦女團體選出代表，其名額以法律定之。"},{"num":27,"title":"國民大會之職權　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會之職權如左：\n一、選舉總統、副總統。\n二、罷免總統、副總統。\n三、修改憲法。\n四、複決立法院所提之憲法修正案。\n﹝2﹞關於創制、複決兩權，除前項第三、第四兩款規定外，俟全國有半數之縣、市曾經行使創制、複決兩項政權時，由國民大會制定辦法並行使之。"},{"num":28,"title":"國大代表任期、資格之限制　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會代表每六年改選一次。\n﹝2﹞每屆國民大會代表之任期，至次屆國民大會開會之日為止。\n﹝3﹞現任官吏不得於其任所所在地之選舉區當選為國民大會代表。"},{"num":29,"title":"國大常會之召集　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會於每屆總統任滿前九十日集會，由總統召集之。"},{"num":30,"title":"國大臨時會之召集　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會遇有左列情形之一時，召集臨時會：\n一、依本憲法第四十九條之規定，應補選總統、副總統時。\n二、依監察院之決議，對於總統、副總統提出彈劾案時。\n三、依立法院之決議，提出憲法修正案時。\n四、國民大會代表五分之二以上請求召集時。\n﹝2﹞國民大會臨時會，如依前項第一款或第二款應召集時，由立法院院長通告集會。依第三款或第四款應召集時，由總統召集之。"},{"num":31,"title":"國民大會之開會地點　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會之開會地點在中央政府所在地。"},{"num":32,"title":"言論免責權　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會代表在會議時所為之言論及表決，對會外不負責任。"},{"num":33,"title":"不逮捕特權　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會代表，除現行犯外，在會期中，非經國民大會許可，不得逮捕或拘禁。"},{"num":34,"title":"組織、選舉、罷免及行使職權程序之法律　※增修§1~停止適用","part":"第三章 國民大會","section":"","content":"﹝1﹞國民大會之組織，國民大會代表之選舉罷免，及國民大會行使職權之程序，以法律定之。"},{"num":35,"title":"總統地位","part":"第四章 總 統","section":"","content":"﹝1﹞總統為國家元首，對外代表中華民國。"},{"num":36,"title":"總統統帥權","part":"第四章 總 統","section":"","content":"﹝1﹞總統統率全國陸海空軍。"},{"num":37,"title":"總統公布法令權　※增修§2~不適用","part":"第四章 總 統","section":"","content":"﹝1﹞總統依法公布法律，發布命令，須經行政院院長之副署，或行政院院長及有關部會首長之副署。"},{"num":38,"title":"總統締約宣戰媾和權","part":"第四章 總 統","section":"","content":"﹝1﹞總統依本憲法之規定，行使締結條約及宣戰、媾和之權。"},{"num":39,"title":"總統宣布戒嚴權","part":"第四章 總 統","section":"","content":"﹝1﹞總統依法宣布戒嚴，但須經立法院之通過或追認。立法院認為必要時，得決議移請總統解嚴。"},{"num":40,"title":"總統赦免權","part":"第四章 總 統","section":"","content":"﹝1﹞總統依法行使大赦、特赦、減刑及復權之權。"},{"num":41,"title":"總統任免官員權","part":"第四章 總 統","section":"","content":"﹝1﹞總統依法任免文武官員。"},{"num":42,"title":"總統授與榮典權","part":"第四章 總 統","section":"","content":"﹝1﹞總統依法授與榮典。"},{"num":43,"title":"總統發布緊急命令權　※增修§2~不適用","part":"第四章 總 統","section":"","content":"﹝1﹞國家遇有天然災害、癘疫，或國家財政經濟上有重大變故，須為急速處分時，總統於立法院休會期間，得經行政院會議之決議，依緊急命令法，發布緊急命令，為必要之處置。但須於發布命令後一個月內提交立法院追認。如立法院不同意時，該緊急命令立即失效。"},{"num":44,"title":"權限爭議處理權","part":"第四章 總 統","section":"","content":"﹝1﹞總統對於院與院間之爭執，除本憲法有規定者外，得召集有關各院院長會商解決之。"},{"num":45,"title":"被選舉資格","part":"第四章 總 統","section":"","content":"﹝1﹞中華民國國民年滿四十歲者，得被選為總統、副總統。"},{"num":46,"title":"選舉方法","part":"第四章 總 統","section":"","content":"﹝1﹞總統、副總統之選舉，以法律定之。"},{"num":47,"title":"總統副總統任期　※增修§2~不適用","part":"第四章 總 統","section":"","content":"﹝1﹞總統、副總統之任期為六年，連選得連任一次。"},{"num":48,"title":"總統就職宣誓","part":"第四章 總 統","section":"","content":"﹝1﹞總統應於就職時宣誓，誓詞如左：「余謹以至誠，向全國人民宣誓，余必遵守憲法，盡忠職務，增進人民福利，保衛國家，無負國民付託。如違誓言，願受國家嚴厲之制裁。謹誓」"},{"num":49,"title":"繼任及代行總統職權　※增修§2~不適用","part":"第四章 總 統","section":"","content":"﹝1﹞總統缺位時，由副總統繼任，至總統任期屆滿為止。總統、副總統均缺位時，由行政院院長代行其職權，並依本憲法第三十條之規定，召集國民大會臨時會，補選總統、副總統，其任期以補足原任總統未滿之任期為止。總統因故不能視事時，由副總統代行其職權。總統、副總統均不能視事時，由行政院院長代行其職權。"},{"num":50,"title":"代行總統職權","part":"第四章 總 統","section":"","content":"﹝1﹞總統於任滿之日解職，如屆期次任總統尚未選出，或選出後總統、副總統均未就職時，由行政院院長代行總統職權。"},{"num":51,"title":"行政院長代行職權之期限","part":"第四章 總 統","section":"","content":"﹝1﹞行政院院長代行總統職權時，其期限不得逾三個月。"},{"num":52,"title":"刑事豁免權","part":"第四章 總 統","section":"","content":"﹝1﹞總統除犯內亂或外患罪外，非經罷免或解職，不受刑事上之訴究。"},{"num":53,"title":"最高行政","part":"第五章 行 政","section":"","content":"﹝1﹞行政院為國家最高行政機關。"},{"num":54,"title":"行政院組織","part":"第五章 行 政","section":"","content":"﹝1﹞行政院設院長、副院長各一人，各部會首長若干人，及不管部會之政務委員若干人。"},{"num":55,"title":"行政院院長之任命及代理　※增修§3~停止適用","part":"第五章 行 政","section":"","content":"﹝1﹞行政院院長由總統提名，經立法院同意任命之。\n﹝2﹞立法院休會期間，行政院院長辭職或出缺時，由行政院副院長代理其職務，但總統須於四十日內咨請立法院召集會議，提出行政院院長人選，徵求同意。行政院院長職務，在總統所提行政院院長人選未經立法院同意前，由行政院副院長暫行代理。"},{"num":56,"title":"副院長、部會首長及政務委員之任命","part":"第五章 行 政","section":"","content":"﹝1﹞行政院副院長、各部會首長及不管部會之政務委員，由行政院院長提請總統任命之。"},{"num":57,"title":"行政院對立法院負責　※增修§3~停止適用","part":"第五章 行 政","section":"","content":"﹝1﹞行政院依左列規定，對立法院負責：\n一、行政院有向立法院提出施政方針及施政報告之責。立法委員在開會時，有向行政院院長及行政院各部會首長質詢之權。\n二、立法院對於行政院之重要政策不贊同時，得以決議移請行政院變更之。行政院對於立法院之決議，得經總統之核可，移請立法院覆議。覆議時，如經出席立法委員三分之二維持原決議，行政院院長應即接受該決議或辭職。\n三、行政院對於立法院決議之法律案、預算案、條約案，如認為有窒礙難行時，得經總統之核可，於該決議案送達行政院十日內，移請立法院覆議。覆議時，如經出席立法委員三分之二維持原案，行政院院長應即接受該決議或辭職。"},{"num":58,"title":"行政院會議","part":"第五章 行 政","section":"","content":"﹝1﹞行政院設行政院會議，由行政院院長、副院長、各部會首長及不管部會之政務委員組織之，以院長為主席。\n﹝2﹞行政院院長、各部會首長，須將應行提出於立法院之法律案、預算案、戒嚴案、大赦案、宣戰案、媾和案、條約案及其他重要事項，或涉及各部會共同關係之事項，提出於行政院會議議決之。"},{"num":59,"title":"預算案之提出","part":"第五章 行 政","section":"","content":"﹝1﹞行政院於會計年度開始三個月前，應將下年度預算案提出於立法院。"},{"num":60,"title":"決算之提出","part":"第五章 行 政","section":"","content":"﹝1﹞行政院於會計年度結束後四個月內，應提出決算於監察院。"},{"num":61,"title":"行政院組織法之制定","part":"第五章 行 政","section":"","content":"﹝1﹞行政院之組織，以法律定之。"},{"num":62,"title":"最高立法機關","part":"第六章 立 法","section":"","content":"﹝1﹞立法院為國家最高立法機關，由人民選舉之立法委員組織之，代表人民行使立法權。"},{"num":63,"title":"立法院之職權","part":"第六章 立 法","section":"","content":"﹝1﹞立法院有議決法律案、預算案、戒嚴案、大赦案、宣戰案、媾和案、條約案及國家其他重要事項之權。"},{"num":64,"title":"立法委員選舉　※增修§4~不受限制","part":"第六章 立 法","section":"","content":"﹝1﹞立法院立法委員，依左列規定選出之：\n一、各省、各直轄市選出者，其人口在三百萬以下者五人，其人口超過三百萬者，每滿一百萬人增選一人。\n二、蒙古各盟旗選出者。\n三、西藏選出者。\n四、各民族在邊疆地區選出者。\n五、僑居國外之國民選出者。\n六、職業團體選出者。\n﹝2﹞立法委員之選舉及前項第二款至第六款立法委員名額之分配，以法律定之。婦女在第一項各款之名額，以法律定之。"},{"num":65,"title":"立法委員之任期　※增修§4~不受限制","part":"第六章 立 法","section":"","content":"﹝1﹞立法委員之任期為三年，連選得連任，其選舉於每屆任滿前三個月內完成之。"},{"num":66,"title":"正副院長之選舉","part":"第六章 立 法","section":"","content":"﹝1﹞立法院設院長、副院長各一人，由立法委員互選之。"},{"num":67,"title":"委員會之設置","part":"第六章 立 法","section":"","content":"﹝1﹞立法院得設各種委員會。\n﹝2﹞各種委員會得邀請政府人員及社會上有關係人員到會備詢。"},{"num":68,"title":"常會","part":"第六章 立 法","section":"","content":"﹝1﹞立法院會期，每年兩次，自行集會，第一次自二月至五月底，第二次自九月至十二月底，必要時得延長之。"},{"num":69,"title":"臨時會","part":"第六章 立 法","section":"","content":"﹝1﹞立法院遇有左列情事之一時，得開臨時會：\n一、總統之咨請。\n二、立法委員四分之一以上之請求。"},{"num":70,"title":"增加支出預算提議之限制","part":"第六章 立 法","section":"","content":"﹝1﹞立法院對於行政院所提預算案，不得為增加支出之提議。"},{"num":71,"title":"關係院首長列席","part":"第六章 立 法","section":"","content":"﹝1﹞立法院開會時，關係院院長及各部會首長得列席陳述意見。"},{"num":72,"title":"公布法律","part":"第六章 立 法","section":"","content":"﹝1﹞立法院法律案通過後，移送總統及行政院，總統應於收到後十日內公布之，但總統得依照本憲法第五十七條之規定辦理。"},{"num":73,"title":"言論免責權","part":"第六章 立 法","section":"","content":"﹝1﹞立法委員在院內所為之言論及表決，對院外不負責任。"},{"num":74,"title":"不逮捕特權　※增修§4~停止適用","part":"第六章 立 法","section":"","content":"﹝1﹞立法委員，除現行犯外，非經立法院許可，不得逮捕或拘禁。"},{"num":75,"title":"立委兼任官吏之禁止","part":"第六章 立 法","section":"","content":"﹝1﹞立法委員不得兼任官吏。"},{"num":76,"title":"立法院組織法之制定","part":"第六章 立 法","section":"","content":"﹝1﹞立法院之組織，以法律定之。"},{"num":77,"title":"司法院之地位及職權","part":"第七章 司法","section":"","content":"﹝1﹞司法院為國家最高司法機關，掌理民事、刑事、行政訴訟之審判及公務員之懲戒。"},{"num":78,"title":"司法院之法律解釋權","part":"第七章 司法","section":"","content":"﹝1﹞司法院解釋憲法，並有統一解釋法律及命令之權。"},{"num":79,"title":"正副院長及大法官之任命　※增修§5~不適用","part":"第七章 司法","section":"","content":"﹝1﹞司法院設院長、副院長各一人，由總統提名，經監察院同意任命之。\n﹝2﹞司法院設大法官若干人，掌理本憲法第七十八條規定事項，由總統提名，經監察院同意任命之。"},{"num":80,"title":"法官依法獨立審判","part":"第七章 司法","section":"","content":"﹝1﹞法官須超出黨派以外，依據法律獨立審判，不受任何干涉。"},{"num":81,"title":"法官之保障　※增修§5~不適用","part":"第七章 司法","section":"","content":"﹝1﹞法官為終身職，非受刑事或懲戒處分，或禁治產之宣告，不得免職。非依法律，不得停職、轉任或減俸。"},{"num":82,"title":"法院組織法之制定","part":"第七章 司法","section":"","content":"﹝1﹞司法院及各級法院之組織，以法律定之。"},{"num":83,"title":"考試院之地位及職權　※增修§6~不適用","part":"第八章 考 試","section":"","content":"﹝1﹞考試院為國家最高考試機關，掌理考試、任用、銓敘、考績、級俸、陞遷、保障、褒獎、撫卹、退休、養老等事項。"},{"num":84,"title":"正副院長及考試委員之任命　※增修§6~不適用","part":"第八章 考 試","section":"","content":"﹝1﹞考試院設院長、副院長各一人，考試委員若干人，由總統提名，經監察院同意任命之。"},{"num":85,"title":"公務員之考選　※增修§6~停止適用","part":"第八章 考 試","section":"","content":"﹝1﹞公務人員之選拔，應實行公開競爭之考試制度，並應按省區分別規定名額，分區舉行考試。非經考試及格者，不得任用。"},{"num":86,"title":"應受考銓之資格","part":"第八章 考 試","section":"","content":"﹝1﹞左列資格，應經考試院依法考選銓定之：\n一、公務人員任用資格。\n二、專門職業及技術人員執業資格。"},{"num":87,"title":"法律案之提出","part":"第八章 考 試","section":"","content":"﹝1﹞考試院關於所掌事項，得向立法院提出法律案。"},{"num":88,"title":"依法獨立行使職權","part":"第八章 考 試","section":"","content":"﹝1﹞考試委員須超出黨派以外，依據法律獨立行使職權。"},{"num":89,"title":"考試院組織法之制定","part":"第八章 考 試","section":"","content":"﹝1﹞考試院之組織，以法律定之。"},{"num":90,"title":"監察院之地位及職權　※增修§4、增修§7~不適用","part":"第九章 監 察","section":"","content":"﹝1﹞監察院為國家最高監察機關，行使同意、彈劾、糾舉及審計權。"},{"num":91,"title":"監委之選舉　※增修§7~停止適用","part":"第九章 監 察","section":"","content":"﹝1﹞監察院設監察委員，由各省市議會、蒙古西藏地方議會及華僑團體選舉之。其名額分配，依左列之規定：\n一、每省五人。\n二、每直轄市二人。\n三、蒙古各盟旗共八人。\n四、西藏八人。\n五、僑居國外之國民八人。"},{"num":92,"title":"正副院長之選舉　※增修§7~停止適用","part":"第九章 監 察","section":"","content":"﹝1﹞監察院設院長、副院長各一人，由監察委員互選之。"},{"num":93,"title":"監察委員之任期　※增修§7~停止適用","part":"第九章 監 察","section":"","content":"﹝1﹞監察委員之任期為六年，連選得連任。"},{"num":94,"title":"同意權之行使","part":"第九章 監 察","section":"","content":"﹝1﹞監察院依本憲法行使同意權時，由出席委員過半數之議決行之。"},{"num":95,"title":"調查權之行使","part":"第九章 監 察","section":"","content":"﹝1﹞監察院為行使監察權，得向行政院及其各部會調閱其所發布之命令及各種有關文件。"},{"num":96,"title":"委員會之設置","part":"第九章 監 察","section":"","content":"﹝1﹞監察院得按行政院及其各部會之工作，分設若干委員會，調查一切設施，注意其是否違法或失職。"},{"num":97,"title":"糾正權、糾舉權、及彈劾權之行使","part":"第九章 監 察","section":"","content":"﹝1﹞監察院經各該委員會之審查及決議，得提出糾正案，移送行政院及其有關部會，促其注意改善。\n﹝2﹞監察院對於中央及地方公務人員，認為有失職或違法情事，得提出糾舉案或彈劾案，如涉及刑事，應移送法院辦理。"},{"num":98,"title":"彈劾案之提出　※增修§7~不受限制","part":"第九章 監 察","section":"","content":"﹝1﹞監察院對於中央及地方公務人員之彈劾案，須經監察委員一人以上之提議，九人以上之審查及決定，始得提出。"},{"num":99,"title":"司法考試人員之彈劾","part":"第九章 監 察","section":"","content":"﹝1﹞監察院對於司法院或考試院人員失職或違法之彈劾，適用本憲法第九十五條、第九十七條及第九十八條之規定。"},{"num":100,"title":"總統、副總統之彈劾　※增修§4~不適用","part":"第九章 監 察","section":"","content":"﹝1﹞監察院對於總統、副總統之彈劾案，須有全體監察委員四分之一以上之提議，全體監察委員過半數之審查及決議，向國民大會提出之。"},{"num":101,"title":"言論免責權　※憲法增修§7~停止適用","part":"第九章 監 察","section":"","content":"﹝1﹞監察委員在院內所為之言論及表決，對院外不負責任。"},{"num":102,"title":"不逮捕特權　※憲法增修§7~停止適用","part":"第九章 監 察","section":"","content":"﹝1﹞監察委員，除現行犯外，非經監察院許可，不得逮捕或拘禁。"},{"num":103,"title":"監委兼職之禁止","part":"第九章 監 察","section":"","content":"﹝1﹞監察委員不得兼任其他公職或執行業務。"},{"num":104,"title":"審計長之任命","part":"第九章 監 察","section":"","content":"﹝1﹞監察院設審計長，由總統提名，經立法院同意任命之。"},{"num":105,"title":"決算之審核及報告","part":"第九章 監 察","section":"","content":"﹝1﹞審計長應於行政院提出決算後三個月內，依法完成其審核，並提出審核報告於立法院。"},{"num":106,"title":"監察院組織法之制定","part":"第九章 監 察","section":"","content":"﹝1﹞監察院之組織，以法律定之。"},{"num":107,"title":"中央立法並執行事項","part":"第十章 中央與地方之權限","section":"","content":"﹝1﹞左列事項，由中央立法並執行之：\n一、外交。\n二、國防與國防軍事。\n三、國籍法及刑事、民事、商事之法律。\n四、司法制度。\n五、航空、國道、國有鐵路、航政、郵政及電政。\n六、中央財政與國稅。\n七、國稅與省稅、縣稅之劃分。\n八、國營經濟事業。\n九、幣制及國家銀行。\n十、度量衡。\n十一、國際貿易政策。\n十二、涉外之財政經濟事項。\n十三、其他依本憲法所定關於中央之事項。"},{"num":108,"title":"中央立法事項　※增修§9~第一項第一款不受限制","part":"第十章 中央與地方之權限","section":"","content":"﹝1﹞左列事項，由中央立法並執行之，或交由省縣執行之：\n一、省縣自治通則。\n二、行政區劃。\n三、森林、工礦及商業。\n四、教育制度。\n五、銀行及交易所制度。\n六、航業及海洋漁業。\n七、公用事業。\n八、合作事業。\n九、二省以上之水陸交通運輸。\n十、二省以上之水利、河道及農牧事業。\n十一、中央及地方官吏之銓敘、任用、糾察及保障。\n十二、土地法。\n十三、勞動法及其他社會立法。\n十四、公用徵收。\n十五、全國戶口調查及統計。\n十六、移民及墾殖。\n十七、警察制度。\n十八、公共衛生。\n十九、振濟、撫卹及失業救濟。\n二十、有關文化之古籍、古物及古蹟之保存。\n﹝2﹞前項各款，省於不牴觸國家法律內，得制定單行法規。"},{"num":109,"title":"省立法事項　※增修§9~不受限制","part":"第十章 中央與地方之權限","section":"","content":"﹝1﹞左列事項，由省立法並執行之，或交由縣執行之：\n一、省教育、衛生、實業及交通。\n二、省財產之經營及處分。\n三、省市政。\n四、省公營事業。\n五、省合作事業。\n六、省農林、水利、漁牧及工程。\n七、省財政及省稅。\n八、省債。\n九、省銀行。\n十、省警政之實施。\n十一、省慈善及公益事項。\n十二、其他依國家法律賦予之事項。\n﹝2﹞前項各款，有涉及二省以上者，除法律別有規定外，得由有關各省共同辦理。\n﹝3﹞各省辦理第一項各款事務，其經費不足時，經立法院議決，由國庫補助之。"},{"num":110,"title":"縣立法並執行事項","part":"第十章 中央與地方之權限","section":"","content":"﹝1﹞左列事項，由縣立法並執行之：\n一、縣教育、衛生、實業及交通。\n二、縣財產之經營及處分。\n三、縣公營事業。\n四、縣合作事業。\n五、縣農林、水利、漁牧及工程。\n六、縣財政及縣稅。\n七、縣債。\n八、縣銀行。\n九、縣警衛之實施。\n十、縣慈善及公益事項。\n十一、其他依國家法律及省自治法賦予之事項。\n﹝2﹞前項各款，有涉及二縣以上者，除法律別有規定外，得由有關各縣共同辦理。"},{"num":111,"title":"中央與地方權限分配","part":"第十章 中央與地方之權限","section":"","content":"﹝1﹞除第一百零七條、第一百零八條、第一百零九條及第一百十條列舉事項外，如有未列舉事項發生時，其事務有全國一致之性質者屬於中央，有全省一致之性質者屬於省，有一縣之性質者屬於縣。遇有爭議時，由立法院解決之。"},{"num":112,"title":"省民代表大會之組織與權限　※增修§9~不受限制","part":"第十一章 地方制度 第一節 省","section":"","content":"﹝1﹞省得召集省民代表大會，依據省縣自治通則，制定省自治法，但不得與憲法牴觸。\n﹝2﹞省民代表大會之組織及選舉，以法律定之。"},{"num":113,"title":"省自治法與立法權　※增修§9~不受限制","part":"第十一章 地方制度 第一節 省","section":"","content":"﹝1﹞省自治法應包含左列各款：\n一、省設省議會，省議會議員由省民選舉之。\n二、省設省政府，置省長一人。省長由省民選舉之。\n三、省與縣之關係。\n﹝2﹞屬於省之立法權，由省議會行之。"},{"num":114,"title":"省自治法之司法審查　※增修§9~不受限制","part":"第十一章 地方制度 第一節 省","section":"","content":"﹝1﹞省自治法制定後，須即送司法院。司法院如認為有違憲之處，應將違憲條文宣布無效。"},{"num":115,"title":"自治法施行中障礙之解決　※增修§9~不受限制","part":"第十一章 地方制度 第一節 省","section":"","content":"﹝1﹞省自治法施行中，如因其中某條發生重大障礙，經司法院召集有關方面陳述意見後，由行政院院長、立法院院長、司法院院長、考試院院長與監察院院長組織委員會，以司法院院長為主席，提出方案解決之。"},{"num":116,"title":"省法規與國家法律之關係","part":"第十一章 地方制度 第一節 省","section":"","content":"﹝1﹞省法規與國家法律牴觸者無效。"},{"num":117,"title":"省法規牴觸法律之解釋","part":"第十一章 地方制度 第一節 省","section":"","content":"﹝1﹞省法規與國家法律有無牴觸發生疑義時，由司法院解釋之。"},{"num":118,"title":"直轄市之自治","part":"第十一章 地方制度 第一節 省","section":"","content":"﹝1﹞直轄市之自治，以法律定之。"},{"num":119,"title":"蒙古盟旗之自治","part":"第十一章 地方制度 第一節 省","section":"","content":"﹝1﹞蒙古各盟旗地方自治制度，以法律定之。"},{"num":120,"title":"西藏自治之保障","part":"第十一章 地方制度 第一節 省","section":"","content":"﹝1﹞西藏自治制度，應予以保障。"},{"num":121,"title":"縣自治","part":"第十一章 地方制度 第二節 縣","section":"","content":"﹝1﹞縣實行縣自治。"},{"num":122,"title":"縣民代大會與縣自治法之制定","part":"第十一章 地方制度 第二節 縣","section":"","content":"﹝1﹞縣得召集縣民代表大會，依據省縣自治通則，制定縣自治法，但不得與憲法及省自治法牴觸。"},{"num":123,"title":"縣民參政權","part":"第十一章 地方制度 第二節 縣","section":"","content":"﹝1﹞縣民關於縣自治事項，依法律行使創制、複決之權，對於縣長及其他縣自治人員，依法律行使選舉、罷免之權。"},{"num":124,"title":"縣議會組成及職權","part":"第十一章 地方制度 第二節 縣","section":"","content":"﹝1﹞縣設縣議會，縣議會議員由縣民選舉之。\n﹝2﹞屬於縣之立法權，由縣議會行之。"},{"num":125,"title":"縣規章與法律或省法規之關係","part":"第十一章 地方制度 第二節 縣","section":"","content":"﹝1﹞縣單行規章，與國家法律或省法規牴觸者無效。"},{"num":126,"title":"縣長之選舉","part":"第十一章 地方制度 第二節 縣","section":"","content":"﹝1﹞縣設縣政府，置縣長一人。縣長由縣民選舉之。"},{"num":127,"title":"縣長之職權","part":"第十一章 地方制度 第二節 縣","section":"","content":"﹝1﹞縣長辦理縣自治，並執行中央及省委辦事項。"},{"num":128,"title":"市自治","part":"第十一章 地方制度 第二節 縣","section":"","content":"﹝1﹞市準用縣之規定。"},{"num":129,"title":"選舉之方法","part":"第十二章 選舉、罷免、創制、複決","section":"","content":"﹝1﹞本憲法所規定之各種選舉，除本憲法別有規定外，以普通、平等、直接及無記名投票之方法行之。"},{"num":130,"title":"選舉及被選舉年齡","part":"第十二章 選舉、罷免、創制、複決","section":"","content":"﹝1﹞中華民國國民年滿二十歲者，有依法選舉之權，除本憲法及法律別有規定者外，年滿二十三歲者，有依法被選舉之權。"},{"num":131,"title":"競選公開原則","part":"第十二章 選舉、罷免、創制、複決","section":"","content":"﹝1﹞本憲法所規定各種選舉之候選人，一律公開競選。"},{"num":132,"title":"選舉公正之維護","part":"第十二章 選舉、罷免、創制、複決","section":"","content":"﹝1﹞選舉應嚴禁威脅利誘。選舉訴訟，由法院審判之。"},{"num":133,"title":"罷免權","part":"第十二章 選舉、罷免、創制、複決","section":"","content":"﹝1﹞被選舉人得由原選舉區依法罷免之。"},{"num":134,"title":"婦女名額保障","part":"第十二章 選舉、罷免、創制、複決","section":"","content":"﹝1﹞各種選舉，應規定婦女當選名額，其辦法以法律定之。"},{"num":135,"title":"內地生活習慣特殊國代之選舉　※增修§1~停止適用","part":"第十二章 選舉、罷免、創制、複決","section":"","content":"﹝1﹞內地生活習慣特殊之國民代表名額及選舉，其辦法以法律定之。"},{"num":136,"title":"創制複決權之行使","part":"第十二章 選舉、罷免、創制、複決","section":"","content":"﹝1﹞創制、複決兩權之行使，以法律定之。"},{"num":137,"title":"國防目的及組織","part":"第十三章 基本國策 第一節 國 防","section":"","content":"﹝1﹞中華民國之國防，以保衛國家安全，維護世界和平為目的。\n﹝2﹞國防之組織，以法律定之。"},{"num":138,"title":"軍隊國家化~軍人超然","part":"第十三章 基本國策 第一節 國 防","section":"","content":"﹝1﹞全國陸海空軍，須超出個人、地域及黨派關係以外，效忠國家，愛護人民。"},{"num":139,"title":"軍隊國家化~軍人不干政","part":"第十三章 基本國策 第一節 國 防","section":"","content":"﹝1﹞任何黨派及個人不得以武裝力量為政爭之工具。"},{"num":140,"title":"軍人兼任文官文禁止","part":"第十三章 基本國策 第一節 國 防","section":"","content":"﹝1﹞現役軍人不得兼任文官。"},{"num":141,"title":"外交宗旨","part":"第十三章 基本國策 第二節 外 交","section":"","content":"﹝1﹞中華民國之外交，應本獨立自主之精神，平等互惠之原則，敦睦邦交，尊重條約及聯合國憲章，以保護僑民權益，促進國際合作，提倡國際正義，確保世界和平。"},{"num":142,"title":"國民經濟基本原則","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞國民經濟應以民生主義為基本原則，實施平均地權，節制資本，以謀國計民生之均足。"},{"num":143,"title":"土地政策","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞中華民國領土內之土地屬於國民全體。人民依法取得之土地所有權，應受法律之保障與限制。私有土地應照價納稅，政府並得照價收買。\n﹝2﹞附著於土地之礦，及經濟上可供公眾利用之天然力，屬於國家所有，不因人民取得土地所有權而受影響。\n﹝3﹞土地價值非因施以勞力資本而增加者，應由國家徵收土地增值稅，歸人民共享之。\n﹝4﹞國家對於土地之分配與整理，應以扶植自耕農及自行使用土地人為原則，並規定其適當經營之面積。"},{"num":144,"title":"獨佔性企業公營原則","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞公用事業及其他有獨佔性之企業，以公營為原則，其經法律許可者，得由國民經營之。"},{"num":145,"title":"私人資本之節制與扶助","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞國家對於私人財富及私營事業，認為有妨害國計民生之平衡發展者，應以法律限制之。\n﹝2﹞合作事業應受國家之獎勵與扶助。\n﹝3﹞國民生產事業及對外貿易，應受國家之獎勵、指導及保護。"},{"num":146,"title":"發展農業","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞國家應運用科學技術，以興修水利，增進地力，改善農業環境，規劃土地利用，開發農業資源，促成農業之工業化。"},{"num":147,"title":"地方經濟之平衡發展","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞中央為謀省與省間之經濟平衡發展，對於貧瘠之省，應酌予補助。\n﹝2﹞省為謀縣與縣間之經濟平衡發展，對於貧瘠之縣，應酌予補助。"},{"num":148,"title":"貨暢其流","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞中華民國領域內，一切貨物應許自由流通。"},{"num":149,"title":"金融機構之管理","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞金融機構，應依法受國家之管理。"},{"num":150,"title":"普設平民金融機","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞國家應普設平民金融機構，以救濟失業。"},{"num":151,"title":"發展僑民經濟事業","part":"第十三章 基本國策 第三節 國民經濟","section":"","content":"﹝1﹞國家對於僑居國外之國民，應扶助並保護其經濟事業之發展。"},{"num":152,"title":"人盡其才","part":"第十三章 基本國策 第四節 社會安全","section":"","content":"﹝1﹞人民具有工作能力者，國家應予以適當之工作機會。"},{"num":153,"title":"勞工及農民之保護","part":"第十三章 基本國策 第四節 社會安全","section":"","content":"﹝1﹞國家為改良勞工及農民之生活，增進其生產技能，應制定保護勞工及農民之法律，實施保護勞工及農民之政策。\n﹝2﹞婦女兒童從事勞動者，應按其年齡及身體狀態，予以特別之保護。"},{"num":154,"title":"勞資關係","part":"第十三章 基本國策 第四節 社會安全","section":"","content":"﹝1﹞勞資雙方應本協調合作原則，發展生產事業。勞資糾紛之調解與仲裁，以法律定之。"},{"num":155,"title":"社會保險與救助之實施","part":"第十三章 基本國策 第四節 社會安全","section":"","content":"﹝1﹞國家為謀社會福利，應實施社會保險制度。人民之老弱殘廢，無力生活，及受非常災害者，國家應予以適當之扶助與救濟。"},{"num":156,"title":"婦幼福利政策之實施","part":"第十三章 基本國策 第四節 社會安全","section":"","content":"﹝1﹞國家為奠定民族生存發展之基礎，應保護母性，並實施婦女兒童福利政策。"},{"num":157,"title":"衛生保健事業之推行","part":"第十三章 基本國策 第四節 社會安全","section":"","content":"﹝1﹞國家為增進民族健康，應普遍推行衛生保健事業及公醫制度。"},{"num":158,"title":"教育文化之目標","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞教育文化，應發展國民之民族精神、自治精神、國民道德、健全體格、科學及生活智能。"},{"num":159,"title":"教育機會平等原則","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞國民受教育之機會，一律平等。"},{"num":160,"title":"基本教育及補習教育","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞六歲至十二歲之學齡兒童，一律受基本教育，免納學費。其貧苦者，由政府供給書籍。\n﹝2﹞已逾學齡未受基本教育之國民，一律受補習教育，免納學費，其書籍亦由政府供給。"},{"num":161,"title":"獎學金之設置","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞各級政府應廣設獎學金名額，以扶助學行俱優無力升學之學生。"},{"num":162,"title":"教育文化機關之監督","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞全國公私立之教育文化機關，依法律受國家之監督。"},{"num":163,"title":"教育文化事業之推動","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞國家應注重各地區教育之均衡發展，並推行社會教育，以提高一般國民之文化水準，邊遠及貧瘠地區之教育文化經費，由國庫補助之。其重要之教育文化事業，得由中央辦理或補助之。"},{"num":164,"title":"教育文化經費之比例與專款之保障　※增修§10~不受限制","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞教育、科學、文化之經費，在中央不得少於其預算總額百分之十五，在省不得少於其預算總額百分之二十五，在市縣不得少於其預算總額百分之三十五。其依法設置之教育文化基金及產業，應予以保障。"},{"num":165,"title":"教育文化工作者之保障","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞國家應保障教育、科學、藝術工作者之生活，並依國民經濟之進展，隨時提高其待遇。"},{"num":166,"title":"科學發明與創造之保障、古蹟、古物之保護","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞國家應獎勵科學之發明與創造，並保護有關歷史、文化、藝術之古蹟、古物。"},{"num":167,"title":"教育文化事業之獎助","part":"第十三章 基本國策 第五節 教育文化","section":"","content":"﹝1﹞國家對於左列事業或個人，予以獎勵或補助：\n一、國內私人經營之教育事業成績優良者。\n二、僑居國外國民之教育事業成績優良者。\n三、於學術或技術有發明者。\n四、從事教育久於其職而成績優良者。"},{"num":168,"title":"邊疆民族地位之保障","part":"第十三章 基本國策 第六節 邊疆地區","section":"","content":"﹝1﹞國家對於邊疆地區各民族之地位，應予以合法之保障，並於其地方自治事業，特別予以扶植。"},{"num":169,"title":"邊疆事業之扶助","part":"第十三章 基本國策 第六節 邊疆地區","section":"","content":"﹝1﹞國家對於邊疆地區各民族之教育、文化、交通、水利、衛生及其他經濟、社會事業，應積極舉辦，並扶助其發展，對於土地使用，應依其氣候、土壤性質，及人民生活習慣之所宜，予以保障及發展。"},{"num":170,"title":"法律之意義","part":"第十四章 憲法之施行及修改","section":"","content":"﹝1﹞本憲法所稱之法律，謂經立法院通過，總統公布之法律。"},{"num":171,"title":"法律之位階性1","part":"第十四章 憲法之施行及修改","section":"","content":"﹝1﹞法律與憲法牴觸者無效。\n﹝2﹞法律與憲法有無牴觸發生疑義時，由司法院解釋之。"},{"num":172,"title":"法律之位階性2","part":"第十四章 憲法之施行及修改","section":"","content":"﹝1﹞命令與憲法或法律牴觸者無效。"},{"num":173,"title":"憲法之解釋","part":"第十四章 憲法之施行及修改","section":"","content":"﹝1﹞憲法之解釋，由司法院為之。"},{"num":174,"title":"修憲程序　※增修§1、增修§12~不適用","part":"第十四章 憲法之施行及修改","section":"","content":"﹝1﹞憲法之修改，應依左列程序之一為之：\n一、由國民大會代表總額五分之一之提議，三分之二之出席，及出席代表四分之三之決議，得修改之。\n二、由立法院立法委員四分之一之提議，四分之三之出席，及出席委員四分之三之決議，擬定憲法修正案，提請國民大會複決。此項憲法修正案，應於國民大會開會前半年公告之。"},{"num":175,"title":"憲法實施程序與施行程序之制定","part":"第十四章 憲法之施行及修改","section":"","content":"﹝1﹞本憲法規定事項，有另定實施程序之必要者，以法律定之。\n﹝2﹞本憲法施行之準備程序，由制定憲法之國民大會議定之。"}] },
  roc_amend: { key:"roc_amend", short:"憲法增修條文", full:"中華民國憲法增修條文", eyebrow:"ROC AMEND.", total: 12, minNum:1, maxNum:12, parts: 1, unitLabel:"", articles: [{"num":1,"title":"","part":"中華民國憲法增修條文","section":"","content":"1. 中華民國自由地區選舉人於立法院提出憲法修正案、領土變更案，經公告半年，應於三個月內投票複決，不適用憲法第四條、第一百七十四條之規定。\n2. 憲法第二十五條至第三十四條及第一百三十五條之規定，停止適用。"},{"num":2,"title":"","part":"中華民國憲法增修條文","section":"","content":"1. 總統、副總統由中華民國自由地區全體人民直接選舉之，自中華民國八十五年第九任總統、副總統選舉實施。總統、副總統候選人應聯名登記，在選票上同列一組圈選，以得票最多之一組為當選。在國外之中華民國自由地區人民返國行使選舉權，以法律定之。\n2. 總統發布行政院院長與依憲法經立法院同意任命人員之任免命令及解散立法院之命令，無須行政院院長之副署，不適用憲法第三十七條之規定。\n3. 總統為避免國家或人民遭遇緊急危難或應付財政經濟上重大變故，得經行政院會議之決議發布緊急命令，為必要之處置，不受憲法第四十三條之限制。但須於發布命令後十日內提交立法院追認，如立法院不同意時，該緊急命令立即失效。\n4. 總統為決定國家安全有關大政方針，得設國家安全會議及所屬國家安全局，其組織以法律定之。\n5. 總統於立法院通過對行政院院長之不信任案後十日內，經諮詢立法院院長後，得宣告解散立法院。但總統於戒嚴或緊急命令生效期間，不得解散立法院。立法院解散後，應於六十日內舉行立法委員選舉，並於選舉結果確認後十日內自行集會，其任期重新起算。\n6. 總統、副總統之任期為四年，連選得連任一次，不適用憲法第四十七條之規定。\n7. 副總統缺位時，總統應於三個月內提名候選人，由立法院補選，繼任至原任期屆滿為止。\n8. 總統、副總統均缺位時，由行政院院長代行其職權，並依本條第一項規定補選總統、副總統，繼任至原任期屆滿為止，不適用憲法第四十九條之有關規定。\n9. 總統、副總統之罷免案，須經全體立法委員四分之一之提議，全體立法委員三分之二之同意後提出，並經中華民國自由地區選舉人總額過半數之投票，有效票過半數同意罷免時，即為通過。\n10. 立法院提出總統、副總統彈劾案，聲請司法院大法官審理，經憲法法庭判決成立時，被彈劾人應即解職。"},{"num":3,"title":"","part":"中華民國憲法增修條文","section":"","content":"行政院院長由總統任命之。行政院院長辭職或出缺時，在總統未任命行政院院長前，由行政院副院長暫行代理。憲法第五十五條之規定，停止適用。\n行政院依左列規定，對立法院負責，憲法第五十七條之規定，停止適用：\n一、行政院有向立法院提出施政方針及施政報告之責。立法委員在開會時，有向行政院院長及行政院各部會首長質詢之權。\n二、行政院對於立法院決議之法律案、預算案、條約案，如認為有窒礙難行時，得經總統之核可，於該決議案送達行政院十日內，移請立法院覆議。立法院對於行政院移請覆議案，應於送達十五日內作成決議。\n如為休會期間，立法院應於七日內自行集會，並於開議十五日內作成決議。覆議案逾期未議決者，原決議失效。覆議時，如經全體立法委員二分之一以上決議維持原案，行政院院長應即接受該決議。\n三、立法院得經全體立法委員三分之一以上連署，對行政院院長提出不信任案。不信任案提出七十二小時後，應於四十八小時內以記名投票表決之。如經全體立法委員二分之一以上贊成，行政院院長應於十日內提出辭職，並得同時呈請總統解散立法院；不信任案如未獲通過，一年內不得對同一行政院院長再提不信任案。\n國家機關之職權、設立程序及總員額，得以法律為準則性之規定。\n各機關之組織、編制及員額，應依前項法律，基於政策或業務需要決定之。"},{"num":4,"title":"","part":"中華民國憲法增修條文","section":"","content":"立法院立法委員自第七屆起一百一十三人，任期四年，連選得連任，於每屆任滿前三個月內，依左列規定選出之，不受憲法第六十四條及第六十五條之限制：\n一、自由地區直轄市、縣市七十三人。每縣市至少一人。\n二、自由地區平地原住民及山地原住民各三人。\n三、全國不分區及僑居國外國民共三十四人。\n前項第一款依各直轄市、縣市人口比例分配，並按應選名額劃分同額選舉區選出之。第三款依政黨名單投票選舉之，由獲得百分之五以上政黨選舉票之政黨依得票比率選出之，各政黨當選名單中，婦女不得低於二分之一。\n立法院於每年集會時，得聽取總統國情報告。\n立法院經總統解散後，在新選出之立法委員就職前，視同休會。\n中華民國領土，依其固有疆域，非經全體立法委員四分之一之提議，全體立法委員四分之三之出席，及出席委員四分之三之決議，提出領土變更案，並於公告半年後，經中華民國自由地區選舉人投票複決，有效同意票過選舉人總額之半數，不得變更之。\n總統於立法院解散後發布緊急命令，立法院應於三日內自行集會，並於開議七日內追認之。但於新任立法委員選舉投票日後發布者，應由新任立法委員於就職後追認之。如立法院不同意時，該緊急命令立即失效。\n立法院對於總統、副總統之彈劾案，須經全體立法委員二分之一以上之提議，全體立法委員三分之二以上之決議，聲請司法院大法官審理，不適用憲法第九十條、第一百條及增修條文第七條第一項有關規定。\n立法委員除現行犯外，在會期中，非經立法院許可，不得逮捕或拘禁。憲法第七十四條之規定，停止適用。"},{"num":5,"title":"","part":"中華民國憲法增修條文","section":"","content":"1. 司法院設大法官十五人，並以其中一人為院長、一人為副院長，由總統提名，經立法院同意任命之，自中華民國九十二年起實施，不適用憲法第七十九條之規定。司法院大法官除法官轉任者外，不適用憲法第八十一條及有關法官終身職待遇之規定。\n2. 司法院大法官任期八年，不分屆次，個別計算，並不得連任。但並為院長、副院長之大法官，不受任期之保障。\n3. 中華民國九十二年總統提名之大法官，其中八位大法官，含院長、副院長，任期四年，其餘大法官任期為八年，不適用前項任期之規定。\n4. 司法院大法官，除依憲法第七十八條之規定外，並組成憲法法庭審理總統、副總統之彈劾及政黨違憲之解散事項。\n5. 政黨之目的或其行為，危害中華民國之存在或自由民主之憲政秩序者為違憲。\n6. 司法院所提出之年度司法概算，行政院不得刪減，但得加註意見，編入中央政府總預算案，送立法院審議。"},{"num":6,"title":"","part":"中華民國憲法增修條文","section":"","content":"考試院為國家最高考試機關，掌理左列事項，不適用憲法第八十三條之規定：\n一、考試。\n二、公務人員之銓敘、保障、撫卹、退休。\n三、公務人員任免、考績、級俸、陞遷、褒獎之法制事項。\n考試院設院長、副院長各一人，考試委員若干人，由總統提名，經立法院同意任命之，不適用憲法第八十四條之規定。\n憲法第八十五條有關按省區分別規定名額，分區舉行考試之規定，停止適用。"},{"num":7,"title":"","part":"中華民國憲法增修條文","section":"","content":"1. 監察院為國家最高監察機關，行使彈劾、糾舉及審計權，不適用憲法第九十條及第九十四條有關同意權之規定。\n2. 監察院設監察委員二十九人，並以其中一人為院長、一人為副院長，任期六年，由總統提名，經立法院同意任命之。憲法第九十一條至第九十三條之規定停止適用。\n3. 監察院對於中央、地方公務人員及司法院、考試院人員之彈劾案，須經監察委員二人以上之提議，九人以上之審查及決定，始得提出，不受憲法第九十八條之限制。\n4. 監察院對於監察院人員失職或違法之彈劾，適用憲法第九十五條、第九十七條第二項及前項之規定。\n5. 監察委員須超出黨派以外，依據法律獨立行使職權。\n6. 憲法第一百零一條及第一百零二條之規定，停止適用。"},{"num":8,"title":"","part":"中華民國憲法增修條文","section":"","content":"立法委員之報酬或待遇，應以法律定之。除年度通案調整者外，單獨增加報酬或待遇之規定，應自次屆起實施。"},{"num":9,"title":"","part":"中華民國憲法增修條文","section":"","content":"省、縣地方制度，應包括左列各款，以法律定之，不受憲法第一百零八條第一項第一款、第一百零九條、第一百十二條至第一百十五條及第一百二十二條之限制：\n一、省設省政府，置委員九人，其中一人為主席，均由行政院院長提請總統任命之。\n二、省設省諮議會，置省諮議會議員若干人，由行政院院長提請總統任命之。\n三、縣設縣議會，縣議會議員由縣民選舉之。\n四、屬於縣之立法權，由縣議會行之。\n五、縣設縣政府，置縣長一人，由縣民選舉之。\n六、中央與省、縣之關係。\n七、省承行政院之命，監督縣自治事項。\n台灣省政府之功能、業務與組織之調整，得以法律為特別之規定。"},{"num":10,"title":"","part":"中華民國憲法增修條文","section":"","content":"1. 國家應獎勵科學技術發展及投資，促進產業升級，推動農漁業現代化，重視水資源之開發利用，加強國際經濟合作。\n2. 經濟及科學技術發展，應與環境及生態保護兼籌並顧。\n3. 國家對於人民興辦之中小型經濟事業，應扶助並保護其生存與發展。\n4. 國家對於公營金融機構之管理，應本企業化經營之原則；其管理、人事、預算、決算及審計，得以法律為特別之規定。\n5. 國家應推行全民健康保險，並促進現代和傳統醫藥之研究發展。\n6. 國家應維護婦女之人格尊嚴，保障婦女之人身安全，消除性別歧視，促進兩性地位之實質平等。\n7. 國家對於身心障礙者之保險與就醫、無障礙環境之建構、教育訓練與就業輔導及生活維護與救助，應予保障，並扶助其自立與發展。\n8. 國家應重視社會救助、福利服務、國民就業、社會保險及醫療保健等社會福利工作，對於社會救助和國民就業等救濟性支出應優先編列。\n9. 國家應尊重軍人對社會之貢獻，並對其退役後之就學、就業、就醫、就養予以保障。\n10. 教育、科學、文化之經費，尤其國民教育之經費應優先編列，不受憲法第一百六十四條規定之限制。\n11. 國家肯定多元文化，並積極維護發展原住民族語言及文化。\n12. 國家應依民族意願，保障原住民族之地位及政治參與，並對其教育文化、交通水利、衛生醫療、經濟土地及社會福利事業予以保障扶助並促其發展，其辦法另以法律定之。對於澎湖、金門及馬祖地區人民亦同。\n13. 國家對於僑居國外國民之政治參與，應予保障。"},{"num":11,"title":"","part":"中華民國憲法增修條文","section":"","content":"自由地區與大陸地區間人民權利義務關係及其他事務之處理，得以法律為特別之規定。"},{"num":12,"title":"","part":"中華民國憲法增修條文","section":"","content":"憲法之修改，須經立法院立法委員四分之一之提議，四分之三之出席，及出席委員四分之三之決議，提出憲法修正案，並於公告半年後，經中華民國自由地區選舉人投票複決，有效同意票過選舉人總額之半數，即通過之，不適用憲法第一百七十四條之規定。"}] }
};

  const switcher = document.getElementById('switcher');

  function cleanLabel(s){ return (s||'').replace(/\s+/g,' ').trim(); }

  function renderSwitcher(){

    Object.keys(TREATIES).forEach(key => {
      const t = TREATIES[key];

      btn.className = 'switch-btn' + (key === activeKey ? ' active' : '');
      btn.textContent = t.short;
      btn.addEventListener('click', () => { if(activeKey !== key){ switchTreaty(key); } });
      switcher.appendChild(btn);
    });
  }

  function renderHeader(){
    const t = TREATIES[activeKey];
    eyebrow.textContent = t.eyebrow;
    fullTitle.textContent = t.full;
    subLine.innerHTML = '輸入條號，直接前往對應條文<br>共 ' + t.total + ' 條' + (t.parts > 1 ? '・' + t.parts + ' ' + t.unitLabel : '');
    rangeNote.textContent = 'RANGE ' + String(t.minNum).padStart(3,'0') + '–' + String(t.maxNum).padStart(3,'0');
    browseTitle.textContent = t.parts > 1 ? ('依' + t.unitLabel + '瀏覽') : '全部條文';
  }

  function renderResultFor(n){
    const byNum = getByNum(activeKey);
    const maxNum = TREATIES[activeKey].maxNum;
    const minNum = TREATIES[activeKey].minNum;
    const a = byNum[n];
    if(!a){
      errMsg.textContent = '查無第 ' + n + ' 條，請輸入 ' + minNum + '–' + maxNum + ' 之間的數字';
      inputBox.classList.add('err');
      result.classList.remove('show');
      return;
    }
    errMsg.textContent = '';
    inputBox.classList.remove('err');
    crumb.innerHTML = '<span>' + cleanLabel(a.part) + '</span>' +
      (a.section ? '<span class="sep">›</span><span>' + cleanLabel(a.section) + '</span>' : '');
    rNum.textContent = '第 ' + a.num + ' 條';
    rTitle.textContent = a.title || '';
    rContent.textContent = a.content;
    result.classList.add('show');

    if(a.num > minNum && byNum[a.num-1]){
      prevBtn.style.visibility='visible';
      prevNum.textContent = '第 ' + (a.num-1) + ' 條';
    } else { prevBtn.style.visibility='hidden'; }
    if(a.num < maxNum && byNum[a.num+1]){
      nextBtn.style.visibility='visible';
      nextNum.textContent = '第 ' + (a.num+1) + ' 條';
    } else { nextBtn.style.visibility='hidden'; }

    prevBtn.onclick = () => { if(a.num>minNum){ numInput.value = a.num-1; renderResultFor(a.num-1); scrollToResult(); } };
    nextBtn.onclick = () => { if(a.num<maxNum){ numInput.value = a.num+1; renderResultFor(a.num+1); scrollToResult(); } };

    numInput.value = a.num;
  }

  function scrollToResult(){ result.scrollIntoView({behavior:'smooth', block:'start'}); }

  function submit(){
    const v = numInput.value.trim();
    const n = parseInt(v, 10);
    if(!v || isNaN(n)){
      errMsg.textContent = '請輸入條號數字';
      inputBox.classList.add('err');
      return;
    }
    renderResultFor(n);
    scrollToResult();
  }

  goBtn.addEventListener('click', submit);
  numInput.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
  numInput.addEventListener('input', () => { errMsg.textContent=''; inputBox.classList.remove('err'); });

  function renderBrowse(){
    partsList.innerHTML = '';
    const arts = TREATIES[activeKey].articles;
    const partsMap = [];
    const seen = {};
    arts.forEach(a => {
      const p = a.part.trim();
      if(!(p in seen)){ seen[p] = partsMap.length; partsMap.push({ part:p, arts:[] }); }
      partsMap[seen[p]].arts.push(a);
    });

    partsMap.forEach(pm => {
      const item = document.createElement('div');
      item.className = 'part-item';
      const first = pm.arts[0].num, last = pm.arts[pm.arts.length-1].num;
      const btn = document.createElement('button');
      btn.className = 'part-btn';
      btn.innerHTML = '<span>' + cleanLabel(pm.part) + '</span>' +
        '<span class="rng">' + first + (last!==first ? '–'+last : '') + '<span class="chev"> ▸</span></span>';
      btn.addEventListener('click', () => item.classList.toggle('open'));
      item.appendChild(btn);

      const grid = document.createElement('div');
      grid.className = 'art-grid';
      pm.arts.forEach(a => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = a.num + (a.title ? '・' + (a.title.length>8? a.title.slice(0,8)+'…': a.title) : '');
        chip.title = a.title;
        chip.addEventListener('click', () => {
          numInput.value = a.num;
          renderResultFor(a.num);
          scrollToResult();
        });
        grid.appendChild(chip);
      });
      item.appendChild(grid);
      partsList.appendChild(item);
    });
  }

  function switchTreaty(key, initialArt){
    activeKey = key;
    renderSwitcher();
    renderHeader();
    renderBrowse();
    numInput.value = '';
    errMsg.textContent = '';
    inputBox.classList.remove('err');
    result.classList.remove('show');
    if(initialArt){
      numInput.value = initialArt;
      renderResultFor(initialArt);
    }
  }

  // init
  renderSwitcher();
  renderHeader();
  renderBrowse();

  // deep link support: ?treaty=vclt&art=19
  const params = new URLSearchParams(window.location.search);
  const initialTreaty = params.get('treaty');
  const initialArt = params.get('art');
  if(initialTreaty && TREATIES[initialTreaty]){
    switchTreaty(initialTreaty, initialArt ? parseInt(initialArt,10) : null);
  } else if(initialArt){
    numInput.value = initialArt;
    renderResultFor(parseInt(initialArt,10));
  }
})();
</script>
</body>
</html>
